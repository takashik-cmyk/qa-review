になりかねません。合理的配慮の考え方に照らして判断します（G6-001・G6-008）。 結果を本人に返す 改善することと、その時期を伝えます。 対応できないことは、理由と代わりにできることをセットで伝えます（G6-007）。 評価を次に活かす 厳しい評価は、配慮や職場の運用を見直すきっかけになります。面談の記録に残し、次の面談で改善されたかを確認します。", "id": "G6-066"}, "G6-003": {"conclusion": "配慮事項をまとめた書面（G5-023）をもとに、本人の同意を得た範囲で引き継ぎます。可能なら前任・新任の上司と本人の三者で面談し、その場で書面の内容を確認・更新します。", "general": [["新しい上司は背景を知らない", ["上司の異動・本人の異動どちらでも起きます。配慮の内容だけでなく「なぜその配慮をしているか」の経緯も伝えます。"]], ["共有範囲は本人が決める", ["障害や健康の情報は慎重な扱いが必要です。新しい上司にどこまで伝えてよいかを、あらためて本人に確認します。"]], ["三者面談で引き継ぐ", ["同じ場で確認すると、言った言わないや誤解を防げます。", "新しい上司から本人に「何か変えてほしいことはあるか」を聞く機会にもなります。"]], ["書面を更新し、しばらくして見直す", ["引き継ぎのために別の書類を作る必要はありません。G5-023の書面に、これまでの経緯、共有を望まない事項、次の見直し時期を書き足します。", "業務や環境が変われば必要な配慮も変わるため、異動後しばらくして配慮が機能しているか確認します。"]]], "sources": [], "q": "配慮内容を新しく配属される上司にどう引き継げばよいですか？", "cat": "情報共有と引き継ぎ", "st": 3, "kw": "異動時に配慮内容の情報を新しい部署にどう引き継げばよいか。 本人の異動時に、配慮内容の引き継ぎ漏れを防ぐための仕組みはあるか。 配慮内容をチームメンバーの入れ替わりのたびにどう再共有すればよいか。 配慮を実施する担当者が休職・退職した場合、引き継ぎはどう行うべきか。 複数拠点がある会社で、拠点をまたぐ異動時の配慮引き継ぎはどう管理すべきか。 配慮の引き継ぎがうまくいかず現場で混乱が生じた場合、どう立て直すべきか。", "body": "新しい上司は背景を知らない 上司の異動・本人の異動どちらでも起きます。配慮の内容だけでなく「なぜその配慮をしているか」の経緯も伝えます。 共有範囲は本人が決める 障害や健康の情報は慎重な扱いが必要です。新しい上司にどこまで伝えてよいかを、あらためて本人に確認します。 三者面談で引き継ぐ 同じ場で確認すると、言った言わないや誤解を防げます。 新しい上司から本人に「何か変えてほしいことはあるか」を聞く機会にもなります。 書面を更新し、しばらくして見直す 引き継ぎのために別の書類を作る必要はありません。G5-023の書面に、これまでの経緯、共有を望まない事項、次の見直し時期を書き足します。 業務や環境が変われば必要な配慮も変わるため、異動後しばらくして配慮が機能しているか確認します。", "id": "G6-003"}, "G6-044": {"conclusion": "可能です。配慮の内容だけを共有するのは有効な方法です。ただ、それだけでは周囲が理由をつかめず、適切に関われない場合もあります。周囲が本人を理解したうえで配慮する方がうまくいく場合は、本人と話し合い、同意を得て障害名も含めて伝えることを考えます。", "general": [["配慮の内容だけを伝える", ["「〇〇さんは口頭より文字での指示の方が確実なので、チャットでも送ってください」のように、周囲にしてほしいことを具体的に伝えます。", "障害名を出さなくても、多くの配慮はこれで実行できます。"]], ["障害名も伝えた方がよい場合", ["周囲が理由を知らないために誤解が生じている、本人の特性を理解した関わり方が必要、などの場合です。", "伝えるかどうか、どこまで伝えるかは、本人と話し合い、同意を得て決めます。"]], ["本人が「誰にも知られたくない」と希望する場合", ["上司だけが知っていれば実行できる配慮（業務の割り振り、指示の出し方など）は、周囲に伝えずに行えます。", "周囲の協力が必要な配慮は、何も伝えないと実行が難しいことを本人に説明し、障害名を伏せた伝え方を一緒に考えます。"]], ["伝える内容と範囲を記録する", ["誰に、何を伝えたかを記録しておきます（G6-049）。"]]], "sources": [], "q": "障害の診断名までは開示せず、配慮内容だけを周囲に伝えることは可能ですか？", "cat": "情報共有と引き継ぎ", "st": 3, "kw": "本人が「誰にも知られたくない」と希望する場合、配慮の実施と両立できるか。 職場における個人情報の取扱いが気になります 障害者本人の情報を、どこまで一般社員に開示してよいか", "body": "配慮の内容だけを伝える 「〇〇さんは口頭より文字での指示の方が確実なので、チャットでも送ってください」のように、周囲にしてほしいことを具体的に伝えます。 障害名を出さなくても、多くの配慮はこれで実行できます。 障害名も伝えた方がよい場合 周囲が理由を知らないために誤解が生じている、本人の特性を理解した関わり方が必要、などの場合です。 伝えるかどうか、どこまで伝えるかは、本人と話し合い、同意を得て決めます。 本人が「誰にも知られたくない」と希望する場合 上司だけが知っていれば実行できる配慮（業務の割り振り、指示の出し方など）は、周囲に伝えずに行えます。 周囲の協力が必要な配慮は、何も伝えないと実行が難しいことを本人に説明し、障害名を伏せた伝え方を一緒に考えます。 伝える内容と範囲を記録する 誰に、何を伝えたかを記録しておきます（G6-049）。", "id": "G6-044"}, "G6-045": {"conclusion": "閲覧できるのは、原則として直属の上司と人事です。一緒に仕事をする同僚などに広げる場合も、業務上必要な範囲にとどめます。アクセスの記録（ログ）を残し、誰が見られるのかを本人に説明して確認しておきます。こうした取り扱いは会社の方針として定め、周囲には、知り得た情報を他言しないよう伝えておきます。", "general": [["閲覧できる人を絞る", ["原則は直属の上司と人事。", "同僚など、ほかの人に共有する場合は、業務上必要な内容だけを、本人の同意を得て伝えます（G6-044）。"]], ["アクセス記録を残す", ["誰が、いつ閲覧したかを記録できるようにします。不適切な閲覧の抑止にもなります。"]], ["本人に説明して確認する", ["何を記録し、誰が見られるのかを本人に説明し、確認を取ります。"]], ["会社の方針として定める", ["障害や健康に関する情報は、特に慎重な扱いが必要な個人情報です。厚生労働省の指針でも、心身の状態に関する情報の取り扱いを社内規程で定めることが求められています。", "取り扱いのルールを決めて、関係者に伝えておきます。"]], ["記録する内容は必要な範囲で", ["配慮の内容、その理由（業務上の困りごと）、合意日、見直し時期など、業務に必要な事実を中心に書きます。", "診断名や私生活の詳細は、必要がなければ書きません。定着面談の記録も同じ考え方で、共有するのは上司と人事までを基本にします。"]], ["周囲への注意", ["共有を受けた同僚などには、その情報を他言しないよう伝えておきます。"]]], "sources": ["厚生労働省「労働者の心身の状態に関する情報の適正な取扱いのために事業者が講ずべき措置に関する指針」"], "q": "配慮内容を人事システムに記録する際、閲覧権限をどう設計すればよいですか？", "cat": "情報共有と引き継ぎ", "st": 3, "kw": "定着面談の内容をどこまで記録し、誰と共有すべきか。 配慮内容を文書化する際、どこまで詳細に書くべきか（プライバシーとのバランス）。", "body": "閲覧できる人を絞る 原則は直属の上司と人事。 同僚など、ほかの人に共有する場合は、業務上必要な内容だけを、本人の同意を得て伝えます（G6-044）。 アクセス記録を残す 誰が、いつ閲覧したかを記録できるようにします。不適切な閲覧の抑止にもなります。 本人に説明して確認する 何を記録し、誰が見られるのかを本人に説明し、確認を取ります。 会社の方針として定める 障害や健康に関する情報は、特に慎重な扱いが必要な個人情報です。厚生労働省の指針でも、心身の状態に関する情報の取り扱いを社内規程で定めることが求められています。 取り扱いのルールを決めて、関係者に伝えておきます。 記録する内容は必要な範囲で 配慮の内容、その理由（業務上の困りごと）、合意日、見直し時期など、業務に必要な事実を中心に書きます。 診断名や私生活の詳細は、必要がなければ書きません。定着面談の記録も同じ考え方で、共有するのは上司と人事までを基本にします。 周囲への注意 共有を受けた同僚などには、その情報を他言しないよう伝えておきます。", "id": "G6-045"}, "G6-047": {"conclusion": "本人の同意は必ず取ります。社外に伝えることは、本人にとって社内以上にハードルが高いものです。まず、本当に伝える必要があるのかを考えます。取引先や顧客に知っておいてもらう方がお互いスムーズに仕事ができる場合に、本人と相談して同意を得たうえで伝えます。伝える文言も、本人と合意しておきます。", "general": [["伝える必要性を考える", ["障害名を伝えなくても、「メールでのやり取りを中心にさせてください」など、配慮の内容だけで足りることも多くあります。"]], ["本人と相談して同意を得る", ["誰に、何を、何のために伝えるかを本人に説明し、同意を得ます。", "社外の相手は社内のように情報の扱いを管理できないことも、あわせて伝えます。"]], ["伝える文言を本人と決める", ["実際に伝える言葉や文面を、事前に本人と確認して合意しておきます。"]], ["クレーム対応のとき", ["障害特性を、ミスの言い訳として先方に説明することは避けます。", "先方には、会社としての対応と再発防止策を伝えます。障害に触れる必要がある場合も、本人の同意を得て、必要な範囲にとどめます。"]]], "sources": [], "q": "取引先や顧客に対応上必要な範囲で障害情報を伝える必要がある場合、本人の同意はどう取ればよいですか？", "cat": "情報共有と引き継ぎ", "st": 3, "kw": "顧客からのクレーム対応時に、本人の障害特性を先方にどこまで説明してよいか。 障がい者を採用する場合、配属先は客先業務のため、取引先の理解が得られるか心配です。何か対応策はありますか。", "body": "伝える必要性を考える 障害名を伝えなくても、「メールでのやり取りを中心にさせてください」など、配慮の内容だけで足りることも多くあります。 本人と相談して同意を得る 誰に、何を、何のために伝えるかを本人に説明し、同意を得ます。 社外の相手は社内のように情報の扱いを管理できないことも、あわせて伝えます。 伝える文言を本人と決める 実際に伝える言葉や文面を、事前に本人と確認して合意しておきます。 クレーム対応のとき 障害特性を、ミスの言い訳として先方に説明することは避けます。 先方には、会社としての対応と再発防止策を伝えます。障害に触れる必要がある場合も、本人の同意を得て、必要な範囲にとどめます。", "id": "G6-047"}, "G6-049": {"conclusion": "きちんと話をしたつもりでも、本人の想定と違う範囲に伝わることはあります。まず、誰に、どんな内容が伝わったのかというずれを具体的にし、本人の気持ちも確認します。事前に文書で確認していれば、それをもとに確かめます。文書と実際の共有が違っていたなら、会社として謝罪し、今後の改善を約束します。文書があいまいだった場合も、行き違いがあったことをお互いに認めたうえで、次の一歩に進みます。", "general": [["ずれを具体的にする", ["誰に、どんな内容が、どのように伝わったのかを確認します。", "本人が何を嫌だと感じたのか、その気持ちも聞きます。"]], ["文書と照らし合わせる", ["事前に開示範囲を文書で確認していれば、それをもとに、どこにずれがあったのかを確かめます。", "文書と実際の共有が違っていた場合は、会社として謝罪し、今後どう改善するかを伝えます。"]], ["文書があいまいだった場合", ["どちらかの責任を追及するより、行き違いがあったことをお互いに認め、改めて開示範囲を決め直します。"]], ["再発を防ぐ", ["開示範囲は「誰に・何を・どこまで」を具体的に書いて、本人と合意します（G6-044・G6-045）。", "異動や担当者の交代、配慮の見直しのタイミングで、開示範囲も本人と確認し直します（G6-027）。"]]], "sources": [], "q": "配慮内容の開示範囲について、本人と会社の認識にずれがあった場合どう調整すればよいですか？", "cat": "情報共有と引き継ぎ", "st": 3, "kw": "情報開示の範囲を本人と定期的に確認し直す仕組みをどう作ればよいか。", "body": "ずれを具体的にする 誰に、どんな内容が、どのように伝わったのかを確認します。 本人が何を嫌だと感じたのか、その気持ちも聞きます。 文書と照らし合わせる 事前に開示範囲を文書で確認していれば、それをもとに、どこにずれがあったのかを確かめます。 文書と実際の共有が違っていた場合は、会社として謝罪し、今後どう改善するかを伝えます。 文書があいまいだった場合 どちらかの責任を追及するより、行き違いがあったことをお互いに認め、改めて開示範囲を決め直します。 再発を防ぐ 開示範囲は「誰に・何を・どこまで」を具体的に書いて、本人と合意します（G6-044・G6-045）。 異動や担当者の交代、配慮の見直しのタイミングで、開示範囲も本人と確認し直します（G6-027）。", "id": "G6-049"}, "G6-099": {"conclusion": "一般的な配慮は、音声読み上げで情報を音として伝えること、文字を拡大すること、見やすい表示（アクセシビリティ（誰でも使いやすくすること））に整えることです。資料は紙ではなく電子データで渡すと、拡大や読み上げがしやすくなります。社内のホームページやシステムも、アクセシビリティを確認したうえで整えます。あわせて、社内の移動や通勤の動線を本人と一緒に確認しておきます。", "general": [["主な特性", ["視覚障害には、まったく見えない「全盲」と、見えにくい「弱視（ロービジョン）」がある。弱視には、視力が低い、見える範囲が狭い（視野が欠ける）、まぶしさに弱い、色の区別がしにくい、などさまざまな状態がある", "文字や図など、目で見る情報を読み取ることや、慣れない場所の移動に困難がある", "画面の読み上げソフトや拡大ソフトを使えば、パソコンを使った事務や電話対応などを担えることが多い", "見え方は一人ひとり大きく違うため、外見だけでは困りごとがわかりにくい"]], ["資料の配慮", ["紙ではなく電子データ（WordやテキストのPDFなど）で渡します。画像として取り込んだPDFは読み上げられないため避けます。", "弱視の人には、文字の拡大、太めのフォント、白黒反転など、本人が見やすい表示を選べるようにします。"]], ["使う機器やソフト", ["画面の文字を読み上げるソフト（スクリーンリーダー）、画面拡大ソフト、拡大読書器、点字ディスプレイなどがあります。", "機器の導入費用には、障害者雇用納付金制度にもとづく助成金が使える場合があります。"]], ["社内システムやホームページのアクセシビリティの主なポイント", ["画像には、内容を説明する代替テキストをつける。", "見出しや表の構造を正しく作る（読み上げソフトが内容の順番を理解できるように）。", "マウスを使わず、キーボードだけで操作できるようにする。", "色だけで情報を区別しない（「赤字の項目」ではなく、記号や文字も添える）。", "文字と背景のコントラストを十分にとり、文字を拡大しても表示が崩れないようにする。", "目安として、日本産業規格のJIS X 8341-3（ウェブアクセシビリティの基準）があります。"]], ["日常のやり取り", ["口頭で説明するときは、「あれ」「ここ」ではなく、具体的な言葉で伝えます。"]], ["移動の動線を本人と確認する", ["社内の移動経路（席、トイレ、会議室、出入口、非常口までの道順）を、本人と一緒に歩いて確認します。", "通路に物を置かない、レイアウトを変えたら必ず本人に伝える、といったルールを職場で共有します。", "通勤経路（駅から職場までの道順、危険な場所）についても、本人と確認しておきます。"]], ["一人ひとりに合わせる", ["全盲か弱視か、どの機器に慣れているかで、合う方法は違います。本人に確認して決めます。"]]], "sources": ["厚生労働省「合理的配慮指針」（別表）", "日本産業規格 JIS X 8341-3"], "q": "視覚障害のある社員への、資料や社内システムの配慮には、どのようなものがありますか？", "cat": "障害の種類ごとの特性と配慮", "st": 0, "kw": "視覚障害のある方の障害特性と、職場での配慮事項を教えてください。", "body": "主な特性 視覚障害には、まったく見えない「全盲」と、見えにくい「弱視（ロービジョン）」がある。弱視には、視力が低い、見える範囲が狭い（視野が欠ける）、まぶしさに弱い、色の区別がしにくい、などさまざまな状態がある 文字や図など、目で見る情報を読み取ることや、慣れない場所の移動に困難がある 画面の読み上げソフトや拡大ソフトを使えば、パソコンを使った事務や電話対応などを担えることが多い 見え方は一人ひとり大きく違うため、外見だけでは困りごとがわかりにくい 資料の配慮 紙ではなく電子データ（WordやテキストのPDFなど）で渡します。画像として取り込んだPDFは読み上げられないため避けます。 弱視の人には、文字の拡大、太めのフォント、白黒反転など、本人が見やすい表示を選べるようにします。 使う機器やソフト 画面の文字を読み上げるソフト（スクリーンリーダー）、画面拡大ソフト、拡大読書器、点字ディスプレイなどがあります。 機器の導入費用には、障害者雇用納付金制度にもとづく助成金が使える場合があります。 社内システムやホームページのアクセシビリティの主なポイント 画像には、内容を説明する代替テキストをつける。 見出しや表の構造を正しく作る（読み上げソフトが内容の順番を理解できるように）。 マウスを使わず、キーボードだけで操作できるようにする。 色だけで情報を区別しない（「赤字の項目」ではなく、記号や文字も添える）。 文字と背景のコントラストを十分にとり、文字を拡大しても表示が崩れないようにする。 目安として、日本産業規格のJIS X 8341-3（ウェブアクセシビリティの基準）があります。 日常のやり取り 口頭で説明するときは、「あれ」「ここ」ではなく、具体的な言葉で伝えます。 移動の動線を本人と確認する 社内の移動経路（席、トイレ、会議室、出入口、非常口までの道順）を、本人と一緒に歩いて確認します。 通路に物を置かない、レイアウトを変えたら必ず本人に伝える、といったルールを職場で共有します。 通勤経路（駅から職場までの道順、危険な場所）についても、本人と確認しておきます。 一人ひとりに合わせる 全盲か弱視か、どの機器に慣れているかで、合う方法は違います。本人に確認して決めます。", "id": "G6-099"}, "G6-028": {"conclusion": "基本は、耳から入る情報を目で見える情報に置き換える「文字による情報保障」です。会議では、チャット、議事録、音声を文字に変える字幕ツールなどを使い、必要に応じて手話通訳や要約筆記をつけます。電話が多い部署では、電話をチャットやメール中心のやり取りに切り替えます。", "general": [["主な特性", ["聴覚障害には、まったく聞こえない「ろう」と、聞こえにくい「難聴」、人生の途中で聞こえなくなった「中途失聴」がある", "コミュニケーションの方法は、手話、筆談、口の動きを読む（口話）、補聴器・人工内耳など、人によって違う", "補聴器があっても、雑音の多い場所や複数の人が同時に話す場面では聞き取りにくい", "外見からはわかりにくく、「聞こえているはず」と思われて情報が伝わらないことがある", "目で確かめる作業や、文字でのやり取りが中心の仕事では、聞こえに左右されずに力を発揮しやすい"]], ["会議での配慮", ["音声認識による字幕ツールや、チャットでの同時記録を使います。", "資料は事前に配り、終了後は議事録を共有します。", "発言者は名乗ってから話す、一人ずつ話す、本人から口元や表情が見える席にする、といった運営の工夫も効果があります。", "重要な会議では、手話通訳や要約筆記をつけることも考えます。"]], ["電話対応の配慮", ["電話の多い業務では、本人の担当をチャットやメールでのやり取り中心に切り替えます。", "社外との電話が必要な場面では、電話リレーサービス（通訳オペレーターが文字や手話と音声を仲介する公共サービス）を使う方法もあります。"]], ["日常のやり取り", ["呼びかけるときは、肩を軽くたたく、視界に入ってから話すなどの工夫をします。", "大事な連絡や変更は、口頭だけでなく必ず文字でも伝えます。"]], ["一人ひとりに合わせる", ["聞こえの程度、手話を使うか、口の動きを読むか、補聴器や人工内耳を使っているかなどで、合う方法は違います。本人に確認して決めます。"]], ["費用の支援", ["手話通訳者などを依頼する費用には、障害者雇用納付金制度にもとづく助成金が使える場合があります。"]]], "sources": ["厚生労働省「合理的配慮指針」（別表：合理的配慮の事例）"], "q": "聴覚障害のある社員への、会議や電話対応の配慮には、どのようなものがありますか？", "cat": "障害の種類ごとの特性と配慮", "st": 0, "kw": "聴覚障害のある方の障害特性と、職場での配慮事項を教えてください。", "body": "主な特性 聴覚障害には、まったく聞こえない「ろう」と、聞こえにくい「難聴」、人生の途中で聞こえなくなった「中途失聴」がある コミュニケーションの方法は、手話、筆談、口の動きを読む（口話）、補聴器・人工内耳など、人によって違う 補聴器があっても、雑音の多い場所や複数の人が同時に話す場面では聞き取りにくい 外見からはわかりにくく、「聞こえているはず」と思われて情報が伝わらないことがある 目で確かめる作業や、文字でのやり取りが中心の仕事では、聞こえに左右されずに力を発揮しやすい 会議での配慮 音声認識による字幕ツールや、チャットでの同時記録を使います。 資料は事前に配り、終了後は議事録を共有します。 発言者は名乗ってから話す、一人ずつ話す、本人から口元や表情が見える席にする、といった運営の工夫も効果があります。 重要な会議では、手話通訳や要約筆記をつけることも考えます。 電話対応の配慮 電話の多い業務では、本人の担当をチャットやメールでのやり取り中心に切り替えます。 社外との電話が必要な場面では、電話リレーサービス（通訳オペレーターが文字や手話と音声を仲介する公共サービス）を使う方法もあります。 日常のやり取り 呼びかけるときは、肩を軽くたたく、視界に入ってから話すなどの工夫をします。 大事な連絡や変更は、口頭だけでなく必ず文字でも伝えます。 一人ひとりに合わせる 聞こえの程度、手話を使うか、口の動きを読むか、補聴器や人工内耳を使っているかなどで、合う方法は違います。本人に確認して決めます。 費用の支援 手話通訳者などを依頼する費用には、障害者雇用納付金制度にもとづく助成金が使える場合があります。", "id": "G6-028"}, "G6-029": {"conclusion": "通勤では、朝のラッシュを避ける時差出勤が代表的な配慮です。ほかに、在宅勤務を認める、通常は認めていない駐車場を確保する、といった方法があります。社内の移動では、段差・エレベーター・トイレなどのバリアフリーの状況と、災害時の避難に支障がないかを確認します。", "general": [["主な特性", ["肢体不自由とは、手足や体幹（胴体）の機能に障害があり、歩く、立つ、物を持つ、細かい作業をする、などの動作に制限がある状態", "原因（脳性まひ、脊髄損傷、関節の病気など）や程度によって、できること・難しいことは大きく異なる", "車いすや杖を使う人もいれば、外見からはわかりにくい人もいる", "移動や姿勢を保つことに体力を使うため、疲れやすいことがある", "机の高さや動線、通勤方法を整えれば、座ってできる事務や設計、検査などの仕事で力を発揮しやすい"]], ["通勤の配慮", ["時差出勤：混雑する時間帯を避けて通勤できるようにします。", "在宅勤務：通勤そのものの負担をなくす方法として、配慮として認めることも考えます（G6-036）。", "駐車場の確保：車で通勤する場合、通常は認めていなくても、職場の近くに駐車スペースを用意します。"]], ["社内の移動の配慮", ["段差、通路の幅、エレベーター、トイレ、ドアの開けやすさなど、本人の移動経路に支障がないかを確認します。", "席は、出入口やトイレに近く、移動しやすい場所にします。", "会議室や打ち合わせ場所も、移動しやすい場所を選びます。"]], ["災害時の避難", ["避難経路と避難方法（エレベーターが止まった場合の対応など）を事前に決め、誰が手助けするかも決めておきます。", "避難訓練に本人も参加し、実際に動けるかを確かめます。"]], ["本人と一緒に確認する", ["車いすを使うか、杖を使うか、疲れやすさはどうかなどで、必要な配慮は変わります。実際の通勤経路や社内を本人と一緒に確認すると確実です。"]], ["費用の支援", ["施設の改修などには、障害者雇用納付金制度にもとづく助成金が使える場合があります（G6-068）。"]]], "sources": ["厚生労働省「合理的配慮指針」（別表：合理的配慮の事例）"], "q": "肢体不自由のある社員の、通勤や移動の配慮には、どのようなものがありますか？", "cat": "障害の種類ごとの特性と配慮", "st": 0, "kw": "肢体不自由のある方の障害特性と、職場での配慮事項を教えてください。", "body": "主な特性 肢体不自由とは、手足や体幹（胴体）の機能に障害があり、歩く、立つ、物を持つ、細かい作業をする、などの動作に制限がある状態 原因（脳性まひ、脊髄損傷、関節の病気など）や程度によって、できること・難しいことは大きく異なる 車いすや杖を使う人もいれば、外見からはわかりにくい人もいる 移動や姿勢を保つことに体力を使うため、疲れやすいことがある 机の高さや動線、通勤方法を整えれば、座ってできる事務や設計、検査などの仕事で力を発揮しやすい 通勤の配慮 時差出勤：混雑する時間帯を避けて通勤できるようにします。 在宅勤務：通勤そのものの負担をなくす方法として、配慮として認めることも考えます（G6-036）。 駐車場の確保：車で通勤する場合、通常は認めていなくても、職場の近くに駐車スペースを用意します。 社内の移動の配慮 段差、通路の幅、エレベーター、トイレ、ドアの開けやすさなど、本人の移動経路に支障がないかを確認します。 席は、出入口やトイレに近く、移動しやすい場所にします。 会議室や打ち合わせ場所も、移動しやすい場所を選びます。 災害時の避難 避難経路と避難方法（エレベーターが止まった場合の対応など）を事前に決め、誰が手助けするかも決めておきます。 避難訓練に本人も参加し、実際に動けるかを確かめます。 本人と一緒に確認する 車いすを使うか、杖を使うか、疲れやすさはどうかなどで、必要な配慮は変わります。実際の通勤経路や社内を本人と一緒に確認すると確実です。 費用の支援 施設の改修などには、障害者雇用納付金制度にもとづく助成金が使える場合があります（G6-068）。", "id": "G6-029"}, "G6-030": {"conclusion": "内部障害のある人は、定期的な通院が必要になることが多くあります。通院のための休暇や時間の調整を、有給休暇や特別休暇など就業規則に沿って設計します。長時間の勤務で体調が悪化しやすい場合は、休憩の場所・頻度・取り方も配慮として考えます。体調が悪化したときの連絡のルールも決めておきます。", "general": [["主な特性", ["内部障害とは、心臓、腎臓、呼吸器、ぼうこう・直腸、小腸、肝臓、免疫機能など、体の内部の機能に障害がある状態", "外見からはわかりにくく、周囲に理解されにくい", "疲れやすい、重い物を持つ・長時間立つのが難しい、温度や湿度の変化に弱い、などの特徴がある", "定期的な通院や、人工透析などの治療が必要な場合がある", "体調管理と通院の配慮があれば、経験や専門性を生かして働ける人が多い"]], ["通院への配慮", ["通院の予定を事前に共有してもらい、業務の調整をしやすくします。", "休暇の扱いは就業規則によります。年次有給休暇（労使協定があれば時間単位の取得も可能）や、会社独自の特別休暇などを使います。", "人工透析のように通院の頻度が高い場合は、勤務日や勤務時間の調整（時差出勤、短時間勤務など）もあわせて考えます。"]], ["休憩への配慮", ["休憩の頻度や長さ、横になれる場所など、本人の体調に合った休み方を決めます。", "重い物を持つ、暑さ寒さの厳しい場所で作業するなど、体に負担のかかる業務を避けることも考えます。"]], ["体調悪化時の連絡ルール", ["体調が悪化したときに、誰に、どう連絡するかを決めておきます。", "緊急時の対応や連絡先は、本人の同意を得て「緊急時シート」にまとめておきます（G10-001・G10-008）。"]], ["外見からわかりにくいことへの配慮", ["内部障害は外見からわかりにくく、休憩や通院が周囲に「特別扱い」と見られることがあります。周囲に伝える内容は、本人の同意を得て決めます（G6-044）。"]]], "sources": ["厚生労働省「合理的配慮指針」（別表：合理的配慮の事例）"], "q": "内部障害（心臓・腎臓等）のある社員への休憩・通院配慮はどう設計すればよいですか？", "cat": "障害の種類ごとの特性と配慮", "st": 0, "kw": "内部障害のある方の障害特性と、職場での配慮事項を教えてください。", "body": "主な特性 内部障害とは、心臓、腎臓、呼吸器、ぼうこう・直腸、小腸、肝臓、免疫機能など、体の内部の機能に障害がある状態 外見からはわかりにくく、周囲に理解されにくい 疲れやすい、重い物を持つ・長時間立つのが難しい、温度や湿度の変化に弱い、などの特徴がある 定期的な通院や、人工透析などの治療が必要な場合がある 体調管理と通院の配慮があれば、経験や専門性を生かして働ける人が多い 通院への配慮 通院の予定を事前に共有してもらい、業務の調整をしやすくします。 休暇の扱いは就業規則によります。年次有給休暇（労使協定があれば時間単位の取得も可能）や、会社独自の特別休暇などを使います。 人工透析のように通院の頻度が高い場合は、勤務日や勤務時間の調整（時差出勤、短時間勤務など）もあわせて考えます。 休憩への配慮 休憩の頻度や長さ、横になれる場所など、本人の体調に合った休み方を決めます。 重い物を持つ、暑さ寒さの厳しい場所で作業するなど、体に負担のかかる業務を避けることも考えます。 体調悪化時の連絡ルール 体調が悪化したときに、誰に、どう連絡するかを決めておきます。 緊急時の対応や連絡先は、本人の同意を得て「緊急時シート」にまとめておきます（G10-001・G10-008）。 外見からわかりにくいことへの配慮 内部障害は外見からわかりにくく、休憩や通院が周囲に「特別扱い」と見られることがあります。周囲に伝える内容は、本人の同意を得て決めます（G6-044）。", "id": "G6-030"}, "G6-101": {"conclusion": "知的障害のある人は、情報を理解すること、自分の気持ちや状況を伝えることに課題がある場合があります。マニュアルや指示書は、理解しやすくすることが一番の工夫です。1つの工程に1つの指示、写真や図と短い文、確認する相手を1人に決める、チェックリストで消し込む、実際にやって見せる、完成見本を示す、といった方法が有効です。", "general": [["主な特性", ["知的障害とは、知的な発達の遅れが発達期（おおむね18歳まで）にあらわれ、日常生活や仕事に支援が必要な状態", "言葉による説明の理解や、抽象的なこと・複雑なことの理解に時間がかかることがある", "想定外のことが起きたときに、どうすればよいかわからず混乱することがある", "手順が決まった作業を、丁寧に、くり返し続けることが得意な人が多い", "能力や得意・不得意には大きな個人差があり、知能指数（IQ）だけで仕事の力を判断しない"]], ["マニュアル・指示書の作り方", ["1つの工程に1つの指示を書き、手順を細かく分けます。", "写真やイラスト、図を中心にし、文章は短く、ふりがなをつけるなど読みやすくします。", "「適当に」「きれいに」などのあいまいな言葉は使わず、「3つずつ」「線にそろえて」のように具体的に書きます。"]], ["確認の仕組み", ["わからないときに確認する相手を1人に決めておきます。複数の人から違う指示が出ると混乱しやすくなります。", "作業が終わったら、チェックリストで1つずつ消し込めるようにします。"]], ["やって見せる、見本を示す", ["説明だけでなく、実際にやって見せ、本人にもやってもらって確認します。", "完成した状態の見本（写真や実物）を示し、ゴールをわかりやすくします。"]], ["本人が伝えやすくする", ["困ったときの合図や、「わかりません」と伝えるカードを用意するなど、本人が助けを求めやすい方法を決めておきます。"]], ["マニュアルは更新する", ["業務の変更や、本人がつまずいた点を反映して、マニュアルを見直します。本人と一緒に作ると、理解しやすいものになります。"]]], "sources": ["厚生労働省「合理的配慮指針」（別表）"], "q": "知的障害のある社員へのマニュアル・指示書の配慮として有効な工夫は何ですか？", "cat": "障害の種類ごとの特性と配慮", "st": 0, "kw": "知的障害のある方の障害特性と、職場での配慮事項を教えてください。", "body": "主な特性 知的障害とは、知的な発達の遅れが発達期（おおむね18歳まで）にあらわれ、日常生活や仕事に支援が必要な状態 言葉による説明の理解や、抽象的なこと・複雑なことの理解に時間がかかることがある 想定外のことが起きたときに、どうすればよいかわからず混乱することがある 手順が決まった作業を、丁寧に、くり返し続けることが得意な人が多い 能力や得意・不得意には大きな個人差があり、知能指数（IQ）だけで仕事の力を判断しない マニュアル・指示書の作り方 1つの工程に1つの指示を書き、手順を細かく分けます。 写真やイラスト、図を中心にし、文章は短く、ふりがなをつけるなど読みやすくします。 「適当に」「きれいに」などのあいまいな言葉は使わず、「3つずつ」「線にそろえて」のように具体的に書きます。 確認の仕組み わからないときに確認する相手を1人に決めておきます。複数の人から違う指示が出ると混乱しやすくなります。 作業が終わったら、チェックリストで1つずつ消し込めるようにします。 やって見せる、見本を示す 説明だけでなく、実際にやって見せ、本人にもやってもらって確認します。 完成した状態の見本（写真や実物）を示し、ゴールをわかりやすくします。 本人が伝えやすくする 困ったときの合図や、「わかりません」と伝えるカードを用意するなど、本人が助けを求めやすい方法を決めておきます。 マニュアルは更新する 業務の変更や、本人がつまずいた点を反映して、マニュアルを見直します。本人と一緒に作ると、理解しやすいものになります。", "id": "G6-101"}, "G6-100": {"conclusion": "精神障害のある人への配慮では、ストレスの負荷が大きな鍵になります。業務量は少しずつ調整し、締め切りには余裕を持たせます。業務の見通しを示すと不安が軽くなります。判断を伴う業務はレベルを調整し、体調の波があったときは声をかけて相談に乗ります。", "general": [["主な特性", ["精神障害は、統合失調症、うつ病・双極性障害（気分障害）、不安障害、適応障害などの病気によって、日常生活や仕事に困難がある状態", "疲れやすい、睡眠のリズムが乱れやすい、体調に波がある、などの特徴があり、勤務が不安定になることがある", "新しいことや人との関わりに強い不安を感じたり、複雑な判断や急な変更が負担になったりすることがある", "外見からはわかりにくく、「やる気の問題」と誤解されやすい", "通院・服薬で症状をコントロールしながら、配慮のもとで安定して働いている人も多い"]], ["業務量を少しずつ調整する", ["最初は少なめから始め、本人の様子を見ながら少しずつ増やします。", "どのくらいの量で負荷が高まるかを本人と確認し、上限の目安を共有しておきます。"]], ["締め切りに余裕を持たせる", ["締め切りが厳しいと、それ自体が不安の原因になります。急ぎの仕事が重ならないよう調整します。"]], ["見通しを示す", ["その日、その週の業務の予定や、今後予定されている仕事を事前に伝えます。", "予定の変更は、できるだけ早めに伝えます。"]], ["判断を伴う業務のレベルを調整する", ["「これで合っているか」と迷いやすい業務は、判断の基準や確認のタイミングを決めておきます。", "最初は判断の少ない定型的な業務から始め、慣れに応じて広げます。"]], ["体調の波に備える", ["体調の変化に気づいたら声をかけ、必要なら業務量を一時的に減らします。", "休んでも業務が回る体制を用意しておくと、本人の安心につながります（G5-005）。"]]], "sources": ["厚生労働省「合理的配慮指針」（別表）"], "q": "精神障害のある社員への業務量・業務内容の配慮として何を考えればよいですか？", "cat": "障害の種類ごとの特性と配慮", "st": 0, "kw": "精神障害のある方の障害特性と、職場での配慮事項を教えてください。", "body": "主な特性 精神障害は、統合失調症、うつ病・双極性障害（気分障害）、不安障害、適応障害などの病気によって、日常生活や仕事に困難がある状態 疲れやすい、睡眠のリズムが乱れやすい、体調に波がある、などの特徴があり、勤務が不安定になることがある 新しいことや人との関わりに強い不安を感じたり、複雑な判断や急な変更が負担になったりすることがある 外見からはわかりにくく、「やる気の問題」と誤解されやすい 通院・服薬で症状をコントロールしながら、配慮のもとで安定して働いている人も多い 業務量を少しずつ調整する 最初は少なめから始め、本人の様子を見ながら少しずつ増やします。 どのくらいの量で負荷が高まるかを本人と確認し、上限の目安を共有しておきます。 締め切りに余裕を持たせる 締め切りが厳しいと、それ自体が不安の原因になります。急ぎの仕事が重ならないよう調整します。 見通しを示す その日、その週の業務の予定や、今後予定されている仕事を事前に伝えます。 予定の変更は、できるだけ早めに伝えます。 判断を伴う業務のレベルを調整する 「これで合っているか」と迷いやすい業務は、判断の基準や確認のタイミングを決めておきます。 最初は判断の少ない定型的な業務から始め、慣れに応じて広げます。 体調の波に備える 体調の変化に気づいたら声をかけ、必要なら業務量を一時的に減らします。 休んでも業務が回る体制を用意しておくと、本人の安心につながります（G5-005）。", "id": "G6-100"}, "G1-072": {"conclusion": "てんかんは、脳の神経細胞が一時的に過剰に興奮することで、発作をくり返す病気です。多くの人は薬で発作をコントロールしながら働いています。職場では、発作時の対応を決めておくことと、服薬や睡眠を妨げない働き方への配慮が中心になります。", "general": [["特性", ["発作の現れ方は人によって大きく異なる（意識を失って倒れる、ぼんやりして反応がなくなる、体の一部がけいれんする、など）", "睡眠不足、疲れ、服薬の飲み忘れなどが発作のきっかけになることがある", "発作がないときは、ほかの社員と同じように働けることが多い"]], ["職場での配慮", ["本人から、発作の様子と、起きたときにしてほしいことを事前に聞いておく（G10-002）", "夜勤や不規則なシフト、長時間労働など、睡眠を乱しやすい働き方を避ける", "高所作業や危険な機械の操作、車の運転などは、発作の状況と主治医の意見をふまえて判断する", "面接で問い合わせがあった場合も、発作の状況と必要な配慮を具体的に聞けばよい"]]], "sources": ["日本てんかん協会"], "q": "てんかんのある方の障害特性と、職場での配慮事項を教えてください。", "cat": "障害の種類ごとの特性と配慮", "st": 0, "kw": "", "body": "特性 発作の現れ方は人によって大きく異なる（意識を失って倒れる、ぼんやりして反応がなくなる、体の一部がけいれんする、など） 睡眠不足、疲れ、服薬の飲み忘れなどが発作のきっかけになることがある 発作がないときは、ほかの社員と同じように働けることが多い 職場での配慮 本人から、発作の様子と、起きたときにしてほしいことを事前に聞いておく（G10-002） 夜勤や不規則なシフト、長時間労働など、睡眠を乱しやすい働き方を避ける 高所作業や危険な機械の操作、車の運転などは、発作の状況と主治医の意見をふまえて判断する 面接で問い合わせがあった場合も、発作の状況と必要な配慮を具体的に聞けばよい", "id": "G1-072"}, "G1-073": {"conclusion": "発達障害には、ASD（自閉スペクトラム症）、ADHD（注意欠如・多動症）、LD（学習障害）などがあります。得意なことと苦手なことの差が大きいのが特徴で、職場では、指示の出し方や仕事の割り振り方、環境を工夫することで力を発揮しやすくなります。", "general": [["主な特性", ["ASD：あいまいな指示や急な変更が苦手、決まった手順の作業や細部への注意が得意なことが多い。音や光などに敏感なことがある", "ADHD：注意がそれやすい、忘れ物や締め切りの管理が苦手、思いついたことにすぐ取りかかれる行動力がある", "LD：読む、書く、計算するなど、特定のことだけが極端に苦手"]], ["仕事の割り振り方", ["本人の得意なこと・苦手なことを聞き、得意な作業を中心に割り振る", "一度に複数の仕事を頼まず、優先順位をはっきり伝える", "手順や締め切りを文字で示し、途中で確認する（G4-047）"]], ["避けたい関わり方", ["「適当に」「なるべく早く」などのあいまいな指示", "大勢の前で強く注意する、人格を否定する言い方", "急な予定変更を何も説明せずに伝える", "本人の特性を「わがまま」「やる気がない」と決めつける"]]], "q": "発達障害のある方の障害特性と、職場での配慮事項を教えてください。", "cat": "障害の種類ごとの特性と配慮", "st": 0, "kw": "発達障害のある社員への仕事の割り振り方に悩んでいます。 ASD・ADHDの特性を持つ社員へのNGワード・NG対応を教えてください。 発達障害のある社員への指示の出し方のポイントは何か", "body": "主な特性 ASD：あいまいな指示や急な変更が苦手、決まった手順の作業や細部への注意が得意なことが多い。音や光などに敏感なことがある ADHD：注意がそれやすい、忘れ物や締め切りの管理が苦手、思いついたことにすぐ取りかかれる行動力がある LD：読む、書く、計算するなど、特定のことだけが極端に苦手 仕事の割り振り方 本人の得意なこと・苦手なことを聞き、得意な作業を中心に割り振る 一度に複数の仕事を頼まず、優先順位をはっきり伝える 手順や締め切りを文字で示し、途中で確認する（G4-047） 避けたい関わり方 「適当に」「なるべく早く」などのあいまいな指示 大勢の前で強く注意する、人格を否定する言い方 急な予定変更を何も説明せずに伝える 本人の特性を「わがまま」「やる気がない」と決めつける", "id": "G1-073"}, "G1-074": {"conclusion": "高次脳機能障害は、病気やけがで脳が傷ついたことにより、記憶、注意、計画を立てて実行すること、感情のコントロールなどに困難が生じる障害です。外見からはわかりにくく、本人も自覚しにくいことがあります。在職中や、中途で障害を負った人を採用する場合は、以前できていたことができなくなっている点に配慮が必要です。", "general": [["主な特性", ["記憶の障害：新しいことを覚えにくい、約束を忘れる", "注意の障害：集中が続かない、二つのことを同時にできない", "遂行機能の障害：段取りを立てて進めることが難しい", "感情や行動の障害：怒りっぽくなる、意欲が出にくい", "疲れやすい"]], ["職場での配慮", ["メモやチェックリスト、スケジュール表を使い、記憶を補う", "一度に一つの作業を、決まった手順で行えるようにする", "静かな環境で作業できるようにし、こまめに休憩をとる", "以前の経歴や本人の自己評価だけで判断せず、実際の作業を見て、できること・難しいことを確かめる", "地域障害者職業センターや、高次脳機能障害の支援拠点機関に相談する"]]], "q": "高次脳機能障害のある方の障害特性と、職場での配慮事項を教えてください。", "cat": "障害の種類ごとの特性と配慮", "st": 0, "kw": "中途で障害を負った方（高次脳機能障害など）を採用する時、どのような配慮や工夫が必要ですか？", "body": "主な特性 記憶の障害：新しいことを覚えにくい、約束を忘れる 注意の障害：集中が続かない、二つのことを同時にできない 遂行機能の障害：段取りを立てて進めることが難しい 感情や行動の障害：怒りっぽくなる、意欲が出にくい 疲れやすい 職場での配慮 メモやチェックリスト、スケジュール表を使い、記憶を補う 一度に一つの作業を、決まった手順で行えるようにする 静かな環境で作業できるようにし、こまめに休憩をとる 以前の経歴や本人の自己評価だけで判断せず、実際の作業を見て、できること・難しいことを確かめる 地域障害者職業センターや、高次脳機能障害の支援拠点機関に相談する", "id": "G1-074"}, "G6-031": {"conclusion": "難病は症状に波があることを前提に、業務の組み立て、休み方、業務を代われる体制をあらかじめ設計しておきます。なお、手帳のない難病のある人は現在は障害者雇用率の算定対象ではありませんが、合理的配慮の対象にはなります。厚生労働省は算定対象に加える方向で考えており、2027年の法改正が見込まれています。", "general": [["主な特性", ["難病とは、原因が十分にわかっておらず、治療法が確立していない、長い療養が必要な病気。国が指定する難病（指定難病）は340以上ある", "症状は病気によって大きく異なり、同じ人でも日によって、また時期によって体調に波があることが多い", "外見からはわかりにくく、疲れやすさや痛み、だるさなどが周囲に伝わりにくい", "定期的な通院や、体調が悪化したときの休みが必要になることがある", "障害者手帳を持っていない人も多いが、手帳がなくても合理的配慮の対象になる"]], ["難病も合理的配慮の対象", ["障害者雇用促進法の「障害者」には、難病などで長期にわたり職業生活に制限を受ける人も含まれます。手帳の有無にかかわらず、配慮の対象です（G6-004）。", "手帳のない難病のある人を雇用率の算定対象に加える方向で、厚生労働省が考えています（2027年の法改正が見込まれていますが、最新の状況は確認が必要です）。"]], ["症状の変動を前提にした業務の組み立て", ["締め切りに余裕を持たせる、体調のよい日に進められる業務を用意しておくなど、波があっても回る仕事の組み立てにします。"]], ["休み方の設計", ["急な通院や体調不良に備え、休暇の取り方（時間単位の休暇など）や、在宅勤務・時差出勤の使い方を事前に決めておきます（G6-030）。"]], ["業務を代われる体制", ["本人が休んでも業務が止まらないよう、手順を共有し、代わりに対応できる人を決めておきます。", "「休んでも大丈夫な体制がある」ことが、本人の安心と安定につながります（G5-005）。"]], ["見直しを前提にする", ["症状や治療の状況は変わるため、配慮の内容は定期的に見直します（G6-027）。"]]], "sources": ["障害者雇用促進法 第2条", "日本経済新聞（2025年10月）「障害者雇用率、手帳ない難病患者らも算定対象に 厚労省検討」"], "q": "難病のある社員への配慮を考える際、症状の変動をどう前提に組み込めばよいですか？", "cat": "障害の種類ごとの特性と配慮", "st": 0, "kw": "難病のある方の障害特性と、職場での配慮事項を教えてください。", "body": "主な特性 難病とは、原因が十分にわかっておらず、治療法が確立していない、長い療養が必要な病気。国が指定する難病（指定難病）は340以上ある 症状は病気によって大きく異なり、同じ人でも日によって、また時期によって体調に波があることが多い 外見からはわかりにくく、疲れやすさや痛み、だるさなどが周囲に伝わりにくい 定期的な通院や、体調が悪化したときの休みが必要になることがある 障害者手帳を持っていない人も多いが、手帳がなくても合理的配慮の対象になる 難病も合理的配慮の対象 障害者雇用促進法の「障害者」には、難病などで長期にわたり職業生活に制限を受ける人も含まれます。手帳の有無にかかわらず、配慮の対象です（G6-004）。 手帳のない難病のある人を雇用率の算定対象に加える方向で、厚生労働省が考えています（2027年の法改正が見込まれていますが、最新の状況は確認が必要です）。 症状の変動を前提にした業務の組み立て 締め切りに余裕を持たせる、体調のよい日に進められる業務を用意しておくなど、波があっても回る仕事の組み立てにします。 休み方の設計 急な通院や体調不良に備え、休暇の取り方（時間単位の休暇など）や、在宅勤務・時差出勤の使い方を事前に決めておきます（G6-030）。 業務を代われる体制 本人が休んでも業務が止まらないよう、手順を共有し、代わりに対応できる人を決めておきます。 「休んでも大丈夫な体制がある」ことが、本人の安心と安定につながります（G5-005）。 見直しを前提にする 症状や治療の状況は変わるため、配慮の内容は定期的に見直します（G6-027）。", "id": "G6-031"}, "G6-033": {"conclusion": "社内の配慮事例を、障害種別や困りごと別に整理して共有するのは有効です。ただし、社内の事例は本人が特定されやすいため、扱いに注意が必要です。一般的な配慮例は、厚生労働省やJEED（高齢・障害・求職者雇用支援機構）が公開している事例集を活用すると、プライバシーの心配なく共有できます。", "general": [["困りごと別に整理する", ["障害名だけで分けると、同じ障害でも人によって必要な配慮が違うことが見えにくくなります。", "「指示が伝わりにくい」「疲れやすい」など、困りごと別に整理すると、ほかのケースにも応用しやすくなります（G6-032）。"]], ["社内事例は本人が特定されないように", ["部署や時期、具体的な業務内容などから、本人が特定されてしまうことがあります。", "社内で共有する場合は、個人が特定できない形に加工し、共有範囲も人事や管理職などに限ります。"]], ["公的な事例集を活用する", ["厚生労働省の「合理的配慮指針」の別表や事例集、JEEDの「障害者雇用事例リファレンスサービス」などに、障害種別ごとの配慮例がまとまっています。", "社内研修や管理職向けの資料には、これらを使うと安心です。"]], ["定期的に更新する", ["新しい事例や見直しの結果を、年に1回など決まったタイミングで反映します。"]]], "sources": ["厚生労働省「合理的配慮指針」（別表）", "高齢・障害・求職者雇用支援機構「障害者雇用事例リファレンスサービス」"], "q": "障害種別ごとの一般的な配慮例を社内でどう共有・蓄積していけばよいですか？", "cat": "障害の種類ごとの特性と配慮", "st": 0, "kw": "合理的配慮の内容を現場で共有しているつもりでも、担当者によって対応に差が出てしまいます。", "body": "困りごと別に整理する 障害名だけで分けると、同じ障害でも人によって必要な配慮が違うことが見えにくくなります。 「指示が伝わりにくい」「疲れやすい」など、困りごと別に整理すると、ほかのケースにも応用しやすくなります（G6-032）。 社内事例は本人が特定されないように 部署や時期、具体的な業務内容などから、本人が特定されてしまうことがあります。 社内で共有する場合は、個人が特定できない形に加工し、共有範囲も人事や管理職などに限ります。 公的な事例集を活用する 厚生労働省の「合理的配慮指針」の別表や事例集、JEEDの「障害者雇用事例リファレンスサービス」などに、障害種別ごとの配慮例がまとまっています。 社内研修や管理職向けの資料には、これらを使うと安心です。 定期的に更新する 新しい事例や見直しの結果を、年に1回など決まったタイミングで反映します。", "id": "G6-033"}, "G1-006": {"conclusion": "手帳の等級などの「重さ」で対応を決めるのではなく、一人ひとりの今の状態と、職場での困りごとに合わせて対応します。同じ等級でも状態は人によって違い、同じ人でも時期によって変わります。", "general": [["考え方", ["手帳の等級は、日常生活での困難さをもとにしたもので、仕事でできることを直接表すものではない", "今の体調、得意・不得意、必要な配慮を、本人と話し合って確認する", "体調の波があることを前提に、配慮の内容を定期的に見直す（G6-027）"]], ["状態に合わせた調整の例", ["勤務時間や業務量を、体調に合わせて少しずつ調整する（G6-100）", "調子を崩すサインと、そのときの対応を本人と決めておく", "主治医や支援機関の意見も参考にする"]]], "q": "精神障害のある社員について、障害の程度（重さ）によって対応をどう変えればよいですか？", "cat": "障害の種類ごとの特性と配慮", "st": 0, "kw": "", "body": "考え方 手帳の等級は、日常生活での困難さをもとにしたもので、仕事でできることを直接表すものではない 今の体調、得意・不得意、必要な配慮を、本人と話し合って確認する 体調の波があることを前提に、配慮の内容を定期的に見直す（G6-027） 状態に合わせた調整の例 勤務時間や業務量を、体調に合わせて少しずつ調整する（G6-100） 調子を崩すサインと、そのときの対応を本人と決めておく 主治医や支援機関の意見も参考にする", "id": "G1-006"}, "G6-034": {"conclusion": "通院への配慮は、多くの障害に共通する典型的な配慮です。時差出勤、時間単位の休暇、フレックスタイム制度などを使い、基本的には認める方向で考えます。そのうえで、業務への影響をできるだけ小さくするため、通院の予定を早めに共有してもらい、繁忙期は通院日を調整できないか本人と相談しておきます。", "general": [["認めることが基本", ["定期的な通院は、体調を安定させて働き続けるために欠かせません。認める方向で、どの制度を使うかを考えます。"]], ["使える制度", ["時差出勤：始業・終業の時刻をずらして通院時間を確保します。", "時間単位の年次有給休暇（労使協定が必要）や、会社独自の通院休暇。", "フレックスタイム制度がある場合は、その活用。", "どの制度を使うかは就業規則に照らして決め、本人と合意します。"]], ["業務への影響を小さくする", ["通院の予定がわかった時点で、早めに上司に共有してもらうルールにします。", "その日の業務を前後にずらす、代わりの人を決めておくなどの調整をします。"]], ["繁忙期の調整", ["繁忙期の時期をあらかじめ本人と共有し、通院日を前後にずらせるかを相談します。", "ただし、医療上必要な通院は優先します。通院そのものを控えるよう求めることはしません。"]], ["記録と見直し", ["合意した内容（頻度、使う制度、連絡のルール）を書面に残し、定期的に見直します（G6-012・G6-027）。"]]], "sources": ["厚生労働省「合理的配慮指針」（別表）"], "q": "通院のために月に数回の時差出勤を認めてほしいという要望に、どう対応すればよいですか？", "cat": "勤務形態の配慮", "st": 3, "kw": "", "body": "認めることが基本 定期的な通院は、体調を安定させて働き続けるために欠かせません。認める方向で、どの制度を使うかを考えます。 使える制度 時差出勤：始業・終業の時刻をずらして通院時間を確保します。 時間単位の年次有給休暇（労使協定が必要）や、会社独自の通院休暇。 フレックスタイム制度がある場合は、その活用。 どの制度を使うかは就業規則に照らして決め、本人と合意します。 業務への影響を小さくする 通院の予定がわかった時点で、早めに上司に共有してもらうルールにします。 その日の業務を前後にずらす、代わりの人を決めておくなどの調整をします。 繁忙期の調整 繁忙期の時期をあらかじめ本人と共有し、通院日を前後にずらせるかを相談します。 ただし、医療上必要な通院は優先します。通院そのものを控えるよう求めることはしません。 記録と見直し 合意した内容（頻度、使う制度、連絡のルール）を書面に残し、定期的に見直します（G6-012・G6-027）。", "id": "G6-034"}, "G6-035": {"conclusion": "基本の判断基準は、体調が安定している期間です。どのくらいの期間が必要かはケースによって違うため、勤怠の実績など客観的な事実をもとに、本人の希望、主治医や産業医の意見を確認して判断します。いきなりフルタイムにせず少しずつ延ばし、難しければ元に戻すことも含めて見直します。", "general": [["判断の材料", ["勤怠の実績：一定期間、遅刻・欠勤・早退がなく安定して勤務できているか。", "業務の状況：今の勤務時間で、業務を安定してこなせているか。", "本人の希望：本人がフルタイムを望んでいるか、不安はないか。", "医師の意見：勤怠の実績をもとに、主治医の意見を聞き、産業医にも判断を求めます。"]], ["感覚ではなく、事実をもとにする", ["「そろそろ大丈夫だろう」という感覚ではなく、勤怠の記録などの客観的な結果を持って、医師の判断を仰ぐプロセスを踏みます。"]], ["少しずつ延ばす", ["たとえば1日30分〜1時間ずつ延ばすなど、段階を踏みます。", "各段階で一定期間様子を見て、次に進むかを本人と確認します。"]], ["戻すことも前提にする", ["延ばしてみて難しければ、元の時間に戻します。戻すことを失敗と捉えないよう、本人にも最初に伝えておきます。"]], ["会社の都合で急がない", ["雇用率の算定や人手不足など、会社側の事情を理由に移行を急がないようにします。"]], ["本人から見ると", ["フルタイムへの希望が、「早く一人前と認められたい」という焦りから出ていることもある", "本人の気持ちを受け止めたうえで、勤怠や体調の事実をもとに、一緒に判断する"]]], "sources": [], "q": "短時間勤務からフルタイムへの移行を考える際、判断基準は何ですか？", "cat": "勤務形態の配慮", "st": 3, "kw": "", "body": "判断の材料 勤怠の実績：一定期間、遅刻・欠勤・早退がなく安定して勤務できているか。 業務の状況：今の勤務時間で、業務を安定してこなせているか。 本人の希望：本人がフルタイムを望んでいるか、不安はないか。 医師の意見：勤怠の実績をもとに、主治医の意見を聞き、産業医にも判断を求めます。 感覚ではなく、事実をもとにする 「そろそろ大丈夫だろう」という感覚ではなく、勤怠の記録などの客観的な結果を持って、医師の判断を仰ぐプロセスを踏みます。 少しずつ延ばす たとえば1日30分〜1時間ずつ延ばすなど、段階を踏みます。 各段階で一定期間様子を見て、次に進むかを本人と確認します。 戻すことも前提にする 延ばしてみて難しければ、元の時間に戻します。戻すことを失敗と捉えないよう、本人にも最初に伝えておきます。 会社の都合で急がない 雇用率の算定や人手不足など、会社側の事情を理由に移行を急がないようにします。 本人から見ると フルタイムへの希望が、「早く一人前と認められたい」という焦りから出ていることもある 本人の気持ちを受け止めたうえで、勤怠や体調の事実をもとに、一緒に判断する", "id": "G6-035"}, "G6-036": {"conclusion": "すでに在宅勤務の制度がある会社は、その評価・労務管理の仕組みをそのまま使います。在宅勤務の経験が少ない会社や、これまで以上に在宅を増やす場合は、これを機に勤怠管理と連絡のルールをきちんと決めます。評価は出社している社員と同じ基準を基本にし、業務の成果で確認します。在宅勤務は孤立しやすいため、定期的に連絡を取る仕組みも用意します。必要に応じて社内規程も見直します。", "general": [["勤怠管理と連絡のルール", ["始業・終業の連絡方法、勤務時間の記録の仕方、中抜けの扱いを決めます。", "体調不良や業務の相談をするときの連絡先と手段を決めます。"]], ["評価は出社している社員と同じ基準で", ["在宅勤務だからといって評価を下げたり、基準を甘くしたりしません。", "何をいつまでに仕上げるかを明確にし、業務の成果で確認します（G6-009）。"]], ["孤立を防ぐ", ["朝夕の短いオンラインミーティングや、週1回の面談など、定期的に話す機会を設けます。", "チャットで気軽に質問できる相手を決めておきます。", "本人の希望を聞いて、定期的に出社する日を設けることも考えます。"]], ["社内規程の見直し", ["在宅勤務の対象者、申請方法、勤務場所、費用の扱いなどを規程に定めます（費用の考え方はG6-073）。", "厚生労働省の「テレワークガイドライン」が参考になります。"]]], "sources": ["厚生労働省「テレワークの適切な導入と実施の推進のためのガイドライン」"], "q": "在宅勤務を配慮として導入する場合、評価や労務管理はどう見直すればよいですか？", "cat": "勤務形態の配慮", "st": 3, "kw": "", "body": "勤怠管理と連絡のルール 始業・終業の連絡方法、勤務時間の記録の仕方、中抜けの扱いを決めます。 体調不良や業務の相談をするときの連絡先と手段を決めます。 評価は出社している社員と同じ基準で 在宅勤務だからといって評価を下げたり、基準を甘くしたりしません。 何をいつまでに仕上げるかを明確にし、業務の成果で確認します（G6-009）。 孤立を防ぐ 朝夕の短いオンラインミーティングや、週1回の面談など、定期的に話す機会を設けます。 チャットで気軽に質問できる相手を決めておきます。 本人の希望を聞いて、定期的に出社する日を設けることも考えます。 社内規程の見直し 在宅勤務の対象者、申請方法、勤務場所、費用の扱いなどを規程に定めます（費用の考え方はG6-073）。 厚生労働省の「テレワークガイドライン」が参考になります。", "id": "G6-036"}, "G6-037": {"conclusion": "本人への配慮と、周囲の負担への対応は、分けて考えます。残業の免除は本人が働き続けるための配慮であり、周囲の負担を理由に見送るものではありません。一方で、周囲の負担が増えるなら、それは職場全体の業務量や人員配置の問題として、別の軸できちんと取り組みます。", "general": [["2つを分けて考える", ["本人への配慮：業務上の支障を取り除くために必要かどうかで判断します（G6-001）。", "周囲の負担：職場全体の雇用管理の問題として、業務量の調整や人員配置で対応します。", "「周囲が大変だから配慮をやめる」「配慮しているから周囲は我慢する」のどちらにもしないことが前提です。"]], ["本人の業務の組み立て", ["定時内に終わる量と締め切りで、業務を割り振ります。", "夕方に急に発生しやすい業務や、残業が前提になりやすい業務は、あらかじめ本人の担当から外しておきます。"]], ["周囲の負担への対応", ["残業がどこに、どれだけ発生しているかを確認し、特定の人に集中しないよう分担を見直します。", "業務そのものの削減や効率化、応援や増員も含めて考えます。"]], ["周囲への説明と負担の確認", ["説明は、本人が同意した範囲で行います（G10-023）。", "周囲の負担感は、定期的に声をかけて確認します（G12-001）。"]], ["負担が大きすぎる場合", ["職場の体制上どうしても難しい場合は、過重な負担にあたるかを会社として判断し、代わりの方法を本人と話し合います（G6-006）。"]], ["周囲への伝え方", ["合理的配慮は会社の義務であり、特別扱いではなく、力を発揮するための調整であることを、周囲にも伝える（G7-003）"]]], "sources": [], "q": "残業を免除する配慮を行う場合、他の社員との業務分担はどう調整すればよいですか？", "cat": "勤務形態の配慮", "st": 3, "kw": "", "body": "2つを分けて考える 本人への配慮：業務上の支障を取り除くために必要かどうかで判断します（G6-001）。 周囲の負担：職場全体の雇用管理の問題として、業務量の調整や人員配置で対応します。 「周囲が大変だから配慮をやめる」「配慮しているから周囲は我慢する」のどちらにもしないことが前提です。 本人の業務の組み立て 定時内に終わる量と締め切りで、業務を割り振ります。 夕方に急に発生しやすい業務や、残業が前提になりやすい業務は、あらかじめ本人の担当から外しておきます。 周囲の負担への対応 残業がどこに、どれだけ発生しているかを確認し、特定の人に集中しないよう分担を見直します。 業務そのものの削減や効率化、応援や増員も含めて考えます。 周囲への説明と負担の確認 説明は、本人が同意した範囲で行います（G10-023）。 周囲の負担感は、定期的に声をかけて確認します（G12-001）。 負担が大きすぎる場合 職場の体制上どうしても難しい場合は、過重な負担にあたるかを会社として判断し、代わりの方法を本人と話し合います（G6-006）。 周囲への伝え方 合理的配慮は会社の義務であり、特別扱いではなく、力を発揮するための調整であることを、周囲にも伝える（G7-003）", "id": "G6-037"}, "G6-038": {"conclusion": "数分程度の小休憩（トイレや気分転換など）は、ほかの社員にも日常的にあるものなので、その範囲であれば認めていく方法があります。30分〜1時間など長い時間になる場合は、休憩時間の延長として扱うか、勤務時間を短くするなどの対応が必要になります。いずれも「何分以内」といった具体的な基準を決め、感覚ではなく基準に照らして運用します。", "general": [["法律上の休憩の基本", ["労働基準法では、勤務時間が6時間を超える場合は45分以上、8時間を超える場合は60分以上の休憩が必要です。", "休憩を分けて取ることや、決まった休憩以外に休憩を加えることもできます。"]], ["短い小休憩の扱い", ["数分程度の小休憩は、勤務時間の中の小休止として扱い、給与を差し引かない運用が一般的です。", "「1回◯分以内、1日◯回程度」のように、目安を本人と決めておきます。"]], ["長い休憩が必要な場合", ["休憩時間を延ばし、その分だけ終業時刻を遅らせる方法があります（拘束時間は長くなります）。", "休憩の延長ではなく、勤務時間そのものを短くする（短時間勤務）方法もあります。この場合は給与の扱いも変わるため、本人に説明します（G6-042）。"]], ["ルールを文書にする", ["個別の配慮として、休憩の回数・時間・取り方・場所を書面で合意します（G6-012）。", "同じような配慮が複数の社員に必要になる場合は、就業規則や社内規程への明記も考えます。"]], ["基準に照らして運用する", ["「長すぎる」と感覚で判断せず、決めた基準と照らして確認します。", "基準が実態に合わなくなったら、本人と話し合って見直します（G6-027）。"]]], "sources": ["労働基準法 第34条"], "q": "休憩時間を通常より多く・長く取る配慮を認める際、就業規則上の整理はどうすればよいですか？", "cat": "勤務形態の配慮", "st": 3, "kw": "", "body": "法律上の休憩の基本 労働基準法では、勤務時間が6時間を超える場合は45分以上、8時間を超える場合は60分以上の休憩が必要です。 休憩を分けて取ることや、決まった休憩以外に休憩を加えることもできます。 短い小休憩の扱い 数分程度の小休憩は、勤務時間の中の小休止として扱い、給与を差し引かない運用が一般的です。 「1回◯分以内、1日◯回程度」のように、目安を本人と決めておきます。 長い休憩が必要な場合 休憩時間を延ばし、その分だけ終業時刻を遅らせる方法があります（拘束時間は長くなります）。 休憩の延長ではなく、勤務時間そのものを短くする（短時間勤務）方法もあります。この場合は給与の扱いも変わるため、本人に説明します（G6-042）。 ルールを文書にする 個別の配慮として、休憩の回数・時間・取り方・場所を書面で合意します（G6-012）。 同じような配慮が複数の社員に必要になる場合は、就業規則や社内規程への明記も考えます。 基準に照らして運用する 「長すぎる」と感覚で判断せず、決めた基準と照らして確認します。 基準が実態に合わなくなったら、本人と話し合って見直します（G6-027）。", "id": "G6-038"}, "G6-039": {"conclusion": "まず前提として、本人は特定の業務を担うことを前提に採用されているため、配置転換の希望が何でも通るわけではありません。そのうえで、今の部署が本人の能力や必要な配慮と明らかにミスマッチである場合は、配置転換も選択肢になります。その場合は、受け入れ先の業務や環境を確認し、本人と両部署で面談して進めます。", "general": [["まず希望の理由を確認する", ["なぜ配置転換を希望するのか、今の部署で何に困っているのかを聞きます。", "今の部署での配慮の見直しで解決できるなら、まずそちらを考えます（G6-001）。"]], ["配置転換を考える場合", ["今の部署の業務が、本人の能力や必要な配慮と明らかに合わない場合は、配置転換も合理的配慮の選択肢になります。", "受け入れ可能な部署があるか、業務内容が本人に合うかは、会社全体で考えます。"]], ["受け入れ先の調整", ["受け入れ先の業務内容、職場環境、上司の受け入れ体制を事前に確認します。", "本人・元の部署・受け入れ先の三者で面談し、必要な配慮と業務内容を共有します。", "配慮の内容は、本人の同意を得た範囲で引き継ぎます（G6-003）。"]], ["異動後のフォロー", ["異動後しばらくは面談の頻度を上げ、新しい環境に合っているかを確認します。"]], ["希望に応じられない場合", ["理由を説明し、今の部署でできる配慮を一緒に考えます（G6-007）。"]]], "sources": [], "q": "配置転換の希望が配慮として出された場合、受け入れ先の調整はどう進めればよいですか？", "cat": "勤務形態の配慮", "st": 3, "kw": "", "body": "まず希望の理由を確認する なぜ配置転換を希望するのか、今の部署で何に困っているのかを聞きます。 今の部署での配慮の見直しで解決できるなら、まずそちらを考えます（G6-001）。 配置転換を考える場合 今の部署の業務が、本人の能力や必要な配慮と明らかに合わない場合は、配置転換も合理的配慮の選択肢になります。 受け入れ可能な部署があるか、業務内容が本人に合うかは、会社全体で考えます。 受け入れ先の調整 受け入れ先の業務内容、職場環境、上司の受け入れ体制を事前に確認します。 本人・元の部署・受け入れ先の三者で面談し、必要な配慮と業務内容を共有します。 配慮の内容は、本人の同意を得た範囲で引き継ぎます（G6-003）。 異動後のフォロー 異動後しばらくは面談の頻度を上げ、新しい環境に合っているかを確認します。 希望に応じられない場合 理由を説明し、今の部署でできる配慮を一緒に考えます（G6-007）。", "id": "G6-039"}, "G6-040": {"conclusion": "まず、出張や外勤がその仕事の本質に関わるかを確認します。顧客先での業務が前提で採用されているなど、本質に関わる場合は、免除は配慮ではなく業務の本質を変えることになるため、認めないことも選択肢です。ただ、それでは本人が働き続けられないこともあるため、オンライン対応などの代わりの手段や、業務内容の見直しを考えます。本質に関わらない場合は、ほかの社員との分担で免除を考えます。", "general": [["業務の本質に関わるかを確認する", ["その仕事に出張や外勤が欠かせないかを、職務内容や採用時の条件から確認します。", "たとえば、電話対応が主な業務のコールセンターで「電話に出ない」という配慮は、業務の本質に反するため対応できません（G6-006）。"]], ["本質に関わる場合", ["免除そのものは認めないことも選択肢です。理由を本人に具体的に説明します。", "そのうえで、出張の回数を減らす、移動の負担を軽くする（移動手段や宿泊の配慮）、オンラインでの対応に置き換える、など代わりの方法を考えます。", "それでも難しい場合は、業務内容や配置の見直しを本人と話し合います（G6-039）。"]], ["本質に関わらない場合", ["出張や外勤をほかの社員に分担し、本人は社内での業務を担う形にします。", "分担によって特定の人に負担が集中しないよう、周囲の業務量も調整します（G6-037）。"]]], "sources": ["厚生労働省「合理的配慮指針」"], "q": "出張や外勤業務の免除を配慮として求められた場合、業務への影響をどう小さくすればよいですか？", "cat": "勤務形態の配慮", "st": 3, "kw": "", "body": "業務の本質に関わるかを確認する その仕事に出張や外勤が欠かせないかを、職務内容や採用時の条件から確認します。 たとえば、電話対応が主な業務のコールセンターで「電話に出ない」という配慮は、業務の本質に反するため対応できません（G6-006）。 本質に関わる場合 免除そのものは認めないことも選択肢です。理由を本人に具体的に説明します。 そのうえで、出張の回数を減らす、移動の負担を軽くする（移動手段や宿泊の配慮）、オンラインでの対応に置き換える、など代わりの方法を考えます。 それでも難しい場合は、業務内容や配置の見直しを本人と話し合います（G6-039）。 本質に関わらない場合 出張や外勤をほかの社員に分担し、本人は社内での業務を担う形にします。 分担によって特定の人に負担が集中しないよう、周囲の業務量も調整します（G6-037）。", "id": "G6-040"}, "G6-041": {"conclusion": "障害の状態が固定的か、変動するかを見据え、本人と話し合って判断します。障害の状態から通勤そのものが難しいなど、状態が固定的な場合は恒久的な配慮になります。不安を和らげるために始めた時差出勤など、状況が変われば通常に戻せる配慮は一時的なものとして扱います。大切なのは、最初に会社の基本ルールと、一時的か恒久的かの前提を本人に伝えておくことです。", "general": [["固定的か、変動するかで考える", ["恒久的になりやすい例：身体障害のために満員電車での通勤そのものが難しい、など障害の状態が変わりにくい場合。", "一時的になりやすい例：入社直後の不安を和らげるために時差出勤や在宅勤務を認めている場合。不安が軽くなった段階で、通常の勤務形態に戻していくことがあります。"]], ["会社の基本ルールを最初に伝える", ["たとえば「出社が基本」という会社のルールがあれば、配慮を始める時点で本人に伝えます。", "「慣れるまでは在宅勤務から始め、少しずつ出社に移る」といった順番も、あわせて伝えておきます。"]], ["前提を伝えないと、後で変えにくくなる", ["一時的なつもりで始めた配慮でも、前提を伝えずに続けると、本人にとって当たり前になり、後から変更するのが難しくなります。", "一時的な配慮は、期間や見直し時期を書面に書いておきます（G6-012・G6-027）。"]], ["見直しは本人と話し合って", ["一時的な配慮を終えるときも、本人の状態を確認し、合意したうえで少しずつ戻します（G6-008）。"]]], "sources": [], "q": "勤務形態の配慮を一時的なものとするか恒久的なものとするか、どう判断すればよいですか？", "cat": "勤務形態の配慮", "st": 3, "kw": "", "body": "固定的か、変動するかで考える 恒久的になりやすい例：身体障害のために満員電車での通勤そのものが難しい、など障害の状態が変わりにくい場合。 一時的になりやすい例：入社直後の不安を和らげるために時差出勤や在宅勤務を認めている場合。不安が軽くなった段階で、通常の勤務形態に戻していくことがあります。 会社の基本ルールを最初に伝える たとえば「出社が基本」という会社のルールがあれば、配慮を始める時点で本人に伝えます。 「慣れるまでは在宅勤務から始め、少しずつ出社に移る」といった順番も、あわせて伝えておきます。 前提を伝えないと、後で変えにくくなる 一時的なつもりで始めた配慮でも、前提を伝えずに続けると、本人にとって当たり前になり、後から変更するのが難しくなります。 一時的な配慮は、期間や見直し時期を書面に書いておきます（G6-012・G6-027）。 見直しは本人と話し合って 一時的な配慮を終えるときも、本人の状態を確認し、合意したうえで少しずつ戻します（G6-008）。", "id": "G6-041"}, "G6-042": {"conclusion": "給与は、労働時間や業務内容に応じて決まっています。勤務時間が短くなればその時間分の給与に、業務内容が変わればその業務に応じた給与になる、という考え方を本人と共有します。給与が下がる変更は本人にとって不利益な変更にあたるため、会社が一方的に決めず、事前に十分説明し、本人の納得と同意を得たうえで、書面で取り交わします。", "general": [["給与の考え方を共有する", ["同じ仕事・同じ時間には同じ給与、という考え方を伝えます。", "例：1日8時間から6時間にする場合、給与は6時間分の働きに応じたものになります。", "業務内容が変わる場合は、その業務（職務）に応じた給与になります。"]], ["一方的に変えない", ["給与が下がる労働条件の変更は、本人の同意が必要です。", "変更の内容、理由、給与への影響（金額の目安）、開始日を具体的に説明し、書面で合意します。"]], ["あわせて説明すること", ["勤務時間が変わると、社会保険の加入条件や手当に影響することがあります。わかる範囲で事前に伝えます。", "一時的な変更の場合は、元の勤務形態に戻したときに給与も戻ることを伝えておきます（G6-041）。"]], ["障害を理由に不当に下げない", ["時間や業務に応じた変更は問題ありませんが、同じ時間・同じ業務なのに障害を理由に給与を下げることは、差別にあたります。"]]], "sources": ["労働契約法 第8条（労働条件の変更）", "厚生労働省「障害者差別禁止指針」"], "q": "配慮としての勤務形態変更が給与に影響する場合、どう説明すればよいですか？", "cat": "勤務形態の配慮", "st": 3, "kw": "", "body": "給与の考え方を共有する 同じ仕事・同じ時間には同じ給与、という考え方を伝えます。 例：1日8時間から6時間にする場合、給与は6時間分の働きに応じたものになります。 業務内容が変わる場合は、その業務（職務）に応じた給与になります。 一方的に変えない 給与が下がる労働条件の変更は、本人の同意が必要です。 変更の内容、理由、給与への影響（金額の目安）、開始日を具体的に説明し、書面で合意します。 あわせて説明すること 勤務時間が変わると、社会保険の加入条件や手当に影響することがあります。わかる範囲で事前に伝えます。 一時的な変更の場合は、元の勤務形態に戻したときに給与も戻ることを伝えておきます（G6-041）。 障害を理由に不当に下げない 時間や業務に応じた変更は問題ありませんが、同じ時間・同じ業務なのに障害を理由に給与を下げることは、差別にあたります。", "id": "G6-042"}, "G6-025": {"conclusion": "配慮内容が決まるまでの期間は、試行期間と位置づけます。本人もどんな配慮が必要かわかっていないことがあるため、本人に確認したうえで「暫定的にこうします」という対応を決め、期限を区切って試します。そのうえで、正式な配慮に移ります。今の対応は暫定的なものだということを、本人と確認しておくことが大切です。", "general": [["暫定の対応を本人と決める", ["本人の困りごとを聞き、すぐにできる範囲で暫定の対応を決めます（例：席の位置を変える、指示を文字でも伝える、休憩を取りやすくする）。"]], ["期限を区切って試す", ["「2週間〜1か月」など試行期間を決め、終わったら振り返って正式な配慮を決めます（G6-096）。"]], ["暫定であることを確認しておく", ["今の対応が暫定的なもので、正式な配慮は振り返りのあとに決めることを、本人と確認し、記録に残します（G6-012）。", "確認しておかないと、暫定の対応がそのまま当たり前になってしまうことがあります（G6-041）。"]], ["設備の配慮が整うまでの間", ["機器の導入や改修に時間がかかる場合は、その間の代わりの方法を用意します（例：改修が終わるまで移動しやすい別の席を使う、機器が届くまで資料を拡大して印刷する）。", "いつ整う予定かも本人に伝えておきます。"]]], "sources": [], "q": "配慮内容が決まるまでの暫定期間、どのような対応をしておけばよいですか？", "cat": "設備・環境の配慮", "st": 3, "kw": "設備面の配慮が完了するまでの暫定対応として、何を用意しておくべきか。", "body": "暫定の対応を本人と決める 本人の困りごとを聞き、すぐにできる範囲で暫定の対応を決めます（例：席の位置を変える、指示を文字でも伝える、休憩を取りやすくする）。 期限を区切って試す 「2週間〜1か月」など試行期間を決め、終わったら振り返って正式な配慮を決めます（G6-096）。 暫定であることを確認しておく 今の対応が暫定的なもので、正式な配慮は振り返りのあとに決めることを、本人と確認し、記録に残します（G6-012）。 確認しておかないと、暫定の対応がそのまま当たり前になってしまうことがあります（G6-041）。 設備の配慮が整うまでの間 機器の導入や改修に時間がかかる場合は、その間の代わりの方法を用意します（例：改修が終わるまで移動しやすい別の席を使う、機器が届くまで資料を拡大して印刷する）。 いつ整う予定かも本人に伝えておきます。", "id": "G6-025"}, "G6-068": {"conclusion": "どこまで会社の負担で行うかは、過重な負担の6つの要素に照らして判断します。費用が大きい場合は、助成金などの公的支援を活用できないかを考えます。改修が難しい場合も、部屋や席を変えるなどの代わりの方法をあわせて考え、過重な負担にならない選択肢を探します。", "general": [["過重な負担の6つの要素で判断する", ["①事業活動への影響、②実現の難しさ（物理的・技術的な制約）、③費用・負担の程度、④企業の規模、⑤財務状況、⑥公的支援の有無、を総合的に考えます（G6-001）。", "「費用がかかる」だけでは、過重な負担とはいえません。"]], ["公的支援（助成金）を活用する", ["障害者雇用納付金制度にもとづく「障害者作業施設設置等助成金」は、障害のある人が働きやすいよう施設や設備を整える費用の一部を助成する制度です。", "支給の条件や金額は、JEED（高齢・障害・求職者雇用支援機構）の案内で最新の内容を確認し、工事の前に申請が必要かも含めて都道府県の窓口に相談します。"]], ["代わりの方法も考える", ["通路の改修が難しい場合は、移動しやすい部屋や、出入口に近い席に変える方法があります。", "高さを調整できる机など、大がかりな工事をせずに対応できる設備から考えます。"]], ["本人と一緒に確認する", ["車いすの大きさや動き方、必要な机の高さや通路の幅は人によって違います。実際に本人と動線を確認してから決めます（G6-029）。"]]], "sources": ["厚生労働省「合理的配慮指針」"], "links": [["JEED 障害者雇用納付金制度に基づく助成金", "https://www.jeed.go.jp/disability/subsidy/index.html"]], "q": "車いす利用者のためのデスクや通路の改修は、どこまで会社の負担で行えばよいですか？", "cat": "設備・環境の配慮", "st": 3, "kw": "", "body": "過重な負担の6つの要素で判断する ①事業活動への影響、②実現の難しさ（物理的・技術的な制約）、③費用・負担の程度、④企業の規模、⑤財務状況、⑥公的支援の有無、を総合的に考えます（G6-001）。 「費用がかかる」だけでは、過重な負担とはいえません。 公的支援（助成金）を活用する 障害者雇用納付金制度にもとづく「障害者作業施設設置等助成金」は、障害のある人が働きやすいよう施設や設備を整える費用の一部を助成する制度です。 支給の条件や金額は、JEED（高齢・障害・求職者雇用支援機構）の案内で最新の内容を確認し、工事の前に申請が必要かも含めて都道府県の窓口に相談します。 代わりの方法も考える 通路の改修が難しい場合は、移動しやすい部屋や、出入口に近い席に変える方法があります。 高さを調整できる机など、大がかりな工事をせずに対応できる設備から考えます。 本人と一緒に確認する 車いすの大きさや動き方、必要な机の高さや通路の幅は人によって違います。実際に本人と動線を確認してから決めます（G6-029）。", "id": "G6-068"}, "G6-069": {"conclusion": "光や音の刺激を減らす工夫が中心です。座席の位置を変える、パーティションで遮る、本人がイヤーマフやノイズキャンセリングのイヤホンを使えるようにする、照明や画面の明るさを調整する、静かな場所を使えるようにする、といった方法があります。", "general": [["音への配慮", ["人の出入りや話し声、機械音の少ない席にします。", "パーティションで周囲の音を遮ります。", "イヤーマフやノイズキャンセリングのイヤホンの使用を認めます。周囲には、仕事中に使っても問題ないことを伝えておきます（本人の同意の範囲で）。"]], ["光への配慮", ["窓際や照明の真下を避けた席にします。", "照明の明るさを調整する、本人の席の照明だけ減らす、などを考えます。", "パソコンの画面の明るさや色を、本人が調整できるようにします。"]], ["静かな場所を使えるようにする", ["集中したいときや、刺激で疲れたときに使える静かな部屋やスペースを用意します（G6-070）。"]], ["本人に確認して決める", ["何に、どの程度敏感なのかは人によって違います。においや温度、服装の素材などに敏感な人もいます。本人に確認して、必要な配慮を決めます。"]]], "sources": ["厚生労働省「合理的配慮指針」（別表）"], "q": "感覚過敏のある社員のために、照明や音の環境を調整する配慮には、どのようなものがありますか？", "cat": "設備・環境の配慮", "st": 3, "kw": "", "body": "音への配慮 人の出入りや話し声、機械音の少ない席にします。 パーティションで周囲の音を遮ります。 イヤーマフやノイズキャンセリングのイヤホンの使用を認めます。周囲には、仕事中に使っても問題ないことを伝えておきます（本人の同意の範囲で）。 光への配慮 窓際や照明の真下を避けた席にします。 照明の明るさを調整する、本人の席の照明だけ減らす、などを考えます。 パソコンの画面の明るさや色を、本人が調整できるようにします。 静かな場所を使えるようにする 集中したいときや、刺激で疲れたときに使える静かな部屋やスペースを用意します（G6-070）。 本人に確認して決める 何に、どの程度敏感なのかは人によって違います。においや温度、服装の素材などに敏感な人もいます。本人に確認して、必要な配慮を決めます。", "id": "G6-069"}, "G6-070": {"conclusion": "新しく専用のスペースを用意するのは、簡単ではないことが多いものです。まずは今あるスペースを活用し、パーテーションで区切るなどの方法を考えます。ほかの用途と兼用になる場合は、人が少ない時間帯に使えるようにするなどの工夫をします。あわせて、休憩の取り方のルールも決めておきます。", "general": [["今あるスペースを活用する", ["空いている会議室、応接室、倉庫の一角などを候補にします。", "パーテーションやついたてで区切り、人目や音を遮ります。"]], ["兼用になる場合の工夫", ["会議室などと兼用する場合は、使える時間帯を決めておきます（人が少ない時間帯など）。", "使いたいときに使えないことがないよう、予約や優先のルールを決めます。"]], ["休憩のルールを決める", ["いつ、どのくらいの時間、どんなときに使うかを本人と決めます（G6-038）。", "使うときに上司に一言伝えるなど、連絡の方法も決めておきます。"]], ["本人の必要に合わせる", ["横になれる場所が必要か、静かに座れれば十分かなど、本人に必要な条件を確認します。", "ほかの社員も使える「誰でも使える静養スペース」として用意すると、本人が使いやすくなり、周囲の理解も得やすくなります。"]]], "sources": [], "q": "休憩スペースを別途設ける配慮を求められた場合、スペースの確保はどう考えればよいですか？", "cat": "設備・環境の配慮", "st": 3, "kw": "", "body": "今あるスペースを活用する 空いている会議室、応接室、倉庫の一角などを候補にします。 パーテーションやついたてで区切り、人目や音を遮ります。 兼用になる場合の工夫 会議室などと兼用する場合は、使える時間帯を決めておきます（人が少ない時間帯など）。 使いたいときに使えないことがないよう、予約や優先のルールを決めます。 休憩のルールを決める いつ、どのくらいの時間、どんなときに使うかを本人と決めます（G6-038）。 使うときに上司に一言伝えるなど、連絡の方法も決めておきます。 本人の必要に合わせる 横になれる場所が必要か、静かに座れれば十分かなど、本人に必要な条件を確認します。 ほかの社員も使える「誰でも使える静養スペース」として用意すると、本人が使いやすくなり、周囲の理解も得やすくなります。", "id": "G6-070"}, "G6-071": {"conclusion": "判断の基準は、本人の困りごとの大きさ、費用と効果、代わりの手段があるかどうかです。最近は、読み上げや音声認識（文字起こし）の機能が、パソコンやスマートフォン、会議ツールなどに標準で入っていることも多くあります。特別な機器を新たに入れる前に、今あるツールで使える機能がないかを探すことから始めるとよいでしょう。", "general": [["判断の基準", ["困りごとの大きさ：その機器がないと、業務にどの程度支障が出るか。", "費用と効果：導入や維持の費用に対して、どれだけ支障が取り除けるか。", "代わりの手段：ほかの方法で同じ効果が得られないか。"]], ["まず今あるツールを探す", ["パソコンやスマートフォンの読み上げ機能、画面拡大機能、オンライン会議ツールの字幕（文字起こし）機能など、標準で使える機能は多くあります。", "誰もが使えるように作られたユニバーサルデザインのツールは、ほかの社員にとっても便利なことがあります。"]], ["専用の機器が必要な場合", ["磁気ループ（補聴器に音を直接届ける設備）や点字ディスプレイなど、専用の機器が必要な場合は、本人に試してもらってから導入を決めます。", "導入費用には、障害者雇用納付金制度にもとづく助成金が使える場合があります（G6-068）。"]], ["本人に確認する", ["本人が使い慣れている機器やソフトがあれば、それを優先します（G6-028・G6-099）。"]]], "sources": [], "links": [["JEED 障害者雇用納付金制度に基づく助成金", "https://www.jeed.go.jp/disability/subsidy/index.html"]], "q": "情報保障のための機器（磁気ループ・音声読み上げソフト等）導入の判断基準は何ですか？", "cat": "設備・環境の配慮", "st": 3, "kw": "", "body": "判断の基準 困りごとの大きさ：その機器がないと、業務にどの程度支障が出るか。 費用と効果：導入や維持の費用に対して、どれだけ支障が取り除けるか。 代わりの手段：ほかの方法で同じ効果が得られないか。 まず今あるツールを探す パソコンやスマートフォンの読み上げ機能、画面拡大機能、オンライン会議ツールの字幕（文字起こし）機能など、標準で使える機能は多くあります。 誰もが使えるように作られたユニバーサルデザインのツールは、ほかの社員にとっても便利なことがあります。 専用の機器が必要な場合 磁気ループ（補聴器に音を直接届ける設備）や点字ディスプレイなど、専用の機器が必要な場合は、本人に試してもらってから導入を決めます。 導入費用には、障害者雇用納付金制度にもとづく助成金が使える場合があります（G6-068）。 本人に確認する 本人が使い慣れている機器やソフトがあれば、それを優先します（G6-028・G6-099）。", "id": "G6-071"}, "G6-072": {"conclusion": "本人の同意を得た範囲で説明します。障害名ではなく「なぜ必要か」を伝えることが基本です。その配慮があることで仕事がしやすくなること、なかったときにどんな困りごとが起きるかをあわせて伝えると、周囲の理解を得やすくなります。", "general": [["説明の前に本人と決めること", ["誰に、どこまで伝えるか（G10-068）", "障害名や診断名は伝えるか。伝えない場合も、必要性の説明はできる", "本人が説明の場にいるか、上司や人事が説明するか"]], ["伝える内容", ["必要性：ついたてを置く、席を移すなどの変更が、なぜ必要か（例：周りの動きや音が気になりやすく、集中するため）", "あることでどうなるか：集中でき、仕事の正確さや速さが上がる", "ないとどうなるか：集中が途切れやすく、ミスや疲れが増える", "周囲への影響：席の移動や通路の変更など、ほかの社員に関わる変更があれば、その内容と時期"]], ["伝えるときの工夫", ["「特別扱い」ではなく、仕事をしやすくするための調整であることを伝える", "ほかの社員からも、席や環境について困りごとがあれば相談してよいと伝える", "変更後にしばらくしてから、本人と周囲の様子を確認する"]]], "phrases": ["「〇〇さんが集中して仕事に取り組めるように、席の配置を少し変えます」", "「みなさんも、作業環境で困っていることがあれば、遠慮なく相談してください」"], "q": "オフィスレイアウト変更を伴う配慮を行う場合、他の社員への説明はどうすればよいですか？", "cat": "設備・環境の配慮", "st": 3, "kw": "", "body": "説明の前に本人と決めること 誰に、どこまで伝えるか（G10-068） 障害名や診断名は伝えるか。伝えない場合も、必要性の説明はできる 本人が説明の場にいるか、上司や人事が説明するか 伝える内容 必要性：ついたてを置く、席を移すなどの変更が、なぜ必要か（例：周りの動きや音が気になりやすく、集中するため） あることでどうなるか：集中でき、仕事の正確さや速さが上がる ないとどうなるか：集中が途切れやすく、ミスや疲れが増える 周囲への影響：席の移動や通路の変更など、ほかの社員に関わる変更があれば、その内容と時期 伝えるときの工夫 「特別扱い」ではなく、仕事をしやすくするための調整であることを伝える ほかの社員からも、席や環境について困りごとがあれば相談してよいと伝える 変更後にしばらくしてから、本人と周囲の様子を確認する 「〇〇さんが集中して仕事に取り組めるように、席の配置を少し変えます」 「みなさんも、作業環境で困っていることがあれば、遠慮なく相談してください」", "id": "G6-072"}, "G6-073": {"conclusion": "在宅勤務の制度がすでにある会社では、基本はほかの社員と同じルールで負担します。特に通信費などはその考え方です。一方で、障害のある人の在宅勤務に必要な機材には助成金が使える場合があり、重度の障害がある人が在宅勤務中にヘルパーを利用する際の支援制度もあります。地域によって使える制度が違うため、本人と一緒に、市町村や都道府県の窓口に確認しながら探します。", "general": [["基本はほかの社員と同じルール", ["通信費、光熱費、機材の貸与などは、在宅勤務の規程に沿って、ほかの社員と同じ扱いにします。", "規程がない場合は、費用の負担について事前に労使で話し合い、就業規則などに定めておきます（厚生労働省のテレワークガイドライン）。"]], ["障害に関わる機材", ["障害のために必要な機材（拡大読書器、読み上げソフト、特別な入力機器など）は、合理的配慮として会社が用意することを考えます（G6-071）。", "障害者雇用納付金制度にもとづく助成金が使える場合があります。"]], ["在宅勤務中の介助", ["重度の障害がある人が、在宅勤務中などにヘルパーの支援を受けられる制度（重度障害者等就労支援特別事業）があります。行っているかどうかは市町村によって違います。"]], ["地域の窓口に確認する", ["都道府県や市町村によって、独自の助成や支援制度があることもあります。本人と一緒に、自治体の窓口や地域の支援機関に確認します。"]]], "sources": ["厚生労働省「テレワークの適切な導入と実施の推進のためのガイドライン」"], "links": [["JEED 障害者雇用納付金制度に基づく助成金", "https://www.jeed.go.jp/disability/subsidy/index.html"]], "q": "在宅勤務のための機材や通信環境を配慮として整える場合、費用の負担はどう考えればよいですか？", "cat": "設備・環境の配慮", "st": 3, "kw": "", "body": "基本はほかの社員と同じルール 通信費、光熱費、機材の貸与などは、在宅勤務の規程に沿って、ほかの社員と同じ扱いにします。 規程がない場合は、費用の負担について事前に労使で話し合い、就業規則などに定めておきます（厚生労働省のテレワークガイドライン）。 障害に関わる機材 障害のために必要な機材（拡大読書器、読み上げソフト、特別な入力機器など）は、合理的配慮として会社が用意することを考えます（G6-071）。 障害者雇用納付金制度にもとづく助成金が使える場合があります。 在宅勤務中の介助 重度の障害がある人が、在宅勤務中などにヘルパーの支援を受けられる制度（重度障害者等就労支援特別事業）があります。行っているかどうかは市町村によって違います。 地域の窓口に確認する 都道府県や市町村によって、独自の助成や支援制度があることもあります。本人と一緒に、自治体の窓口や地域の支援機関に確認します。", "id": "G6-073"}, "G6-086": {"conclusion": "日々の配慮の責任者は、主に所属している職場の上司が基本です。そのうえで、ほかの部署とのやり取りや、どの部署に何をどこまで伝えるかの判断は、人事など間接的にサポートする部署が窓口になって統括する方がやりやすくなります。直属の上司だけでは、他部署にどこまで伝えてよいかを判断しにくいためです。", "general": [["役割分担", ["主たる職場の上司：日々の業務での配慮の実行と、本人の様子の把握。", "人事：部署をまたぐ調整、各部署に伝える内容と範囲の判断、記録の一元管理。"]], ["各部署への共有", ["関わる部署ごとに、業務上必要な配慮だけを、本人の同意を得た範囲で伝えます（G6-044・G6-045）。", "部署によって配慮の内容や伝え方がばらつかないよう、人事がまとめて共有します。"]], ["本人の相談窓口を一本化する", ["どの部署の業務で困ったときも、まず誰に相談すればよいかを本人に伝えておきます。"]], ["見直しの場", ["定期的な見直しでは、関わる部署の状況もあわせて確認します。必要に応じて、関係部署の担当者も交えて話し合います（G6-027）。"]]], "sources": [], "q": "複数の部署にまたがる業務を担当している社員への配慮は、誰が統括すればよいですか？", "cat": "特殊なケース", "st": 3, "kw": "", "body": "役割分担 主たる職場の上司：日々の業務での配慮の実行と、本人の様子の把握。 人事：部署をまたぐ調整、各部署に伝える内容と範囲の判断、記録の一元管理。 各部署への共有 関わる部署ごとに、業務上必要な配慮だけを、本人の同意を得た範囲で伝えます（G6-044・G6-045）。 部署によって配慮の内容や伝え方がばらつかないよう、人事がまとめて共有します。 本人の相談窓口を一本化する どの部署の業務で困ったときも、まず誰に相談すればよいかを本人に伝えておきます。 見直しの場 定期的な見直しでは、関わる部署の状況もあわせて確認します。必要に応じて、関係部署の担当者も交えて話し合います（G6-027）。", "id": "G6-086"}, "G6-087": {"conclusion": "基本は、一人ひとりの配慮をそれぞれ確認していくことです。同じ障害でも困りごとの程度や必要な配慮は違うため、「この人ができているから、あの人も同じで大丈夫」とは考えず、個々の困りごとから判断する方針を持ちます。そのうえで、ある人への配慮が別の人の支障にならないかを、チーム全体で確認します。", "general": [["一人ひとりの困りごとから判断する", ["同じ聴覚障害でも、聞こえの程度や合う方法は人によって違います。", "ほかの人との比較で判断せず、それぞれの困りごとをもとに配慮を決めます（G6-032）。"]], ["競合しやすい例", ["照明：弱視の人は明るい方がよく、光に過敏な人は暗い方がよい。", "音：読み上げソフトや電話を使う人と、音に敏感な人が近くの席にいる。"]], ["競合を確認する方法", ["新しい配慮を始めるときは、同じチームのほかの社員の配慮と照らし合わせます。", "席替えや設備の変更をするときも、チーム全体への影響を確認します。"]], ["両立させる工夫", ["席の配置を工夫する、個人用の照明やヘッドホンを使うなど、個別の対応で両立できることが多くあります。", "どうしても両立が難しい場合は、業務上の支障の大きさや安全に関わるかを基準に優先順位をつけ、それぞれの本人と話し合います（G6-021）。"]]], "sources": [], "q": "配慮を必要とする社員同士が同じチームにいる場合、配慮内容が競合しないかどう確認すればよいですか？", "cat": "特殊なケース", "st": 3, "kw": "複数の社員から異なる環境配慮の希望が出た場合、優先順位をどう決めればよいか。", "body": "一人ひとりの困りごとから判断する 同じ聴覚障害でも、聞こえの程度や合う方法は人によって違います。 ほかの人との比較で判断せず、それぞれの困りごとをもとに配慮を決めます（G6-032）。 競合しやすい例 照明：弱視の人は明るい方がよく、光に過敏な人は暗い方がよい。 音：読み上げソフトや電話を使う人と、音に敏感な人が近くの席にいる。 競合を確認する方法 新しい配慮を始めるときは、同じチームのほかの社員の配慮と照らし合わせます。 席替えや設備の変更をするときも、チーム全体への影響を確認します。 両立させる工夫 席の配置を工夫する、個人用の照明やヘッドホンを使うなど、個別の対応で両立できることが多くあります。 どうしても両立が難しい場合は、業務上の支障の大きさや安全に関わるかを基準に優先順位をつけ、それぞれの本人と話し合います（G6-021）。", "id": "G6-087"}, "G6-089": {"conclusion": "基本のプロセスは同じです。管理職であっても、その上の上司が関わって配慮を考えます。違うのは、本人に部下がいることです。配慮が部下の業務にどう影響するか、部下に何をどこまで伝えるかを、本人と相談して決めます。部下には、相談するというより、決めた内容を必要な範囲で伝える形になります。", "general": [["プロセスは同じ", ["困りごとの確認、話し合い、合意、記録、見直しという流れは、ほかの社員と変わりません（G6-001・G6-012）。", "配慮を考えるのは、本人のさらに上の上司と人事です。"]], ["部下への影響を考える", ["承認や指示のタイミング、会議の持ち方、不在時の代わりなど、配慮によって部下の業務に影響が出る点を洗い出します。", "部下に負担が集中しないよう、業務の流れを調整します。"]], ["開示範囲を本人と決める", ["部下に何をどこまで伝えるかは、本人と相談して決めます。障害名を伏せて、配慮の内容と部下へのお願いだけを伝える方法もあります（G6-044）。", "部下に伝えるときは、決めた内容を必要な範囲で伝えます。"]], ["管理職ならではの負担に配慮する", ["管理職は相談相手が少なく、一人で抱え込みやすい立場です。人事や上司が定期的に話を聞く機会を設けます（G12-003）。"]]], "sources": [], "q": "管理職自身が配慮を必要とする場合、通常の配慮検討プロセスと違いはありますか？", "cat": "特殊なケース", "st": 3, "kw": "", "body": "プロセスは同じ 困りごとの確認、話し合い、合意、記録、見直しという流れは、ほかの社員と変わりません（G6-001・G6-012）。 配慮を考えるのは、本人のさらに上の上司と人事です。 部下への影響を考える 承認や指示のタイミング、会議の持ち方、不在時の代わりなど、配慮によって部下の業務に影響が出る点を洗い出します。 部下に負担が集中しないよう、業務の流れを調整します。 開示範囲を本人と決める 部下に何をどこまで伝えるかは、本人と相談して決めます。障害名を伏せて、配慮の内容と部下へのお願いだけを伝える方法もあります（G6-044）。 部下に伝えるときは、決めた内容を必要な範囲で伝えます。 管理職ならではの負担に配慮する 管理職は相談相手が少なく、一人で抱え込みやすい立場です。人事や上司が定期的に話を聞く機会を設けます（G12-003）。", "id": "G6-089"}, "G6-090": {"conclusion": "配慮の内容は、国内と同じく本人の困りごとから考えるのが軸です。ただし、相手先（海外拠点や委託先）に配慮を求められるかどうかは、契約関係によって変わる別の問題です。まず契約関係を確認し、配慮が必要な場合や関わり方についてお願いがある場合は、本人が相手先で働き始める前に、相手先と調整しておきます。", "general": [["困りごとから考えるのは同じ", ["どこで働くかにかかわらず、本人の業務上の困りごとをもとに、必要な配慮を考えます。"]], ["契約関係を確認する", ["誰が本人の雇用主なのか、相手先とはどんな契約（業務委託、出向など）なのかを確認します。", "合理的配慮を提供する義務は、基本的に雇用主にあります。相手先にどこまで協力を求められるかは、契約の内容によって変わります。", "海外拠点の場合は、現地の法律や制度も関わるため、専門家に確認します。"]], ["働き始める前に相手先と調整する", ["必要な配慮と、相手先にお願いしたい関わり方を、本人が相手先に行く前に伝えて調整します。", "相手先に伝える情報は、本人の同意を得た範囲に限ります（G6-047）。"]], ["自社の同僚の中で配慮できる場合", ["相手先に配慮を求めなくても、同じ相手先で働く自社の同僚の間で業務を分担するなど、自社の中だけで配慮できる場合は、それで対応します。"]], ["相手先でも自社の同僚の間でも対応が難しい場合", ["自社側でできる配慮（オンラインでの定期面談、相談窓口の確保など）で補えないかを考えます。", "それでも難しい場合は、その配置そのものを見直すことも本人と話し合います（G6-039）。"]]], "sources": [], "q": "海外拠点や外部委託先で働く社員への配慮は、国内と同じ基準で考えてよいですか？", "cat": "特殊なケース", "st": 3, "kw": "", "body": "困りごとから考えるのは同じ どこで働くかにかかわらず、本人の業務上の困りごとをもとに、必要な配慮を考えます。 契約関係を確認する 誰が本人の雇用主なのか、相手先とはどんな契約（業務委託、出向など）なのかを確認します。 合理的配慮を提供する義務は、基本的に雇用主にあります。相手先にどこまで協力を求められるかは、契約の内容によって変わります。 海外拠点の場合は、現地の法律や制度も関わるため、専門家に確認します。 働き始める前に相手先と調整する 必要な配慮と、相手先にお願いしたい関わり方を、本人が相手先に行く前に伝えて調整します。 相手先に伝える情報は、本人の同意を得た範囲に限ります（G6-047）。 自社の同僚の中で配慮できる場合 相手先に配慮を求めなくても、同じ相手先で働く自社の同僚の間で業務を分担するなど、自社の中だけで配慮できる場合は、それで対応します。 相手先でも自社の同僚の間でも対応が難しい場合 自社側でできる配慮（オンラインでの定期面談、相談窓口の確保など）で補えないかを考えます。 それでも難しい場合は、その配置そのものを見直すことも本人と話し合います（G6-039）。", "id": "G6-090"}, "G6-091": {"conclusion": "雇用形態によって異なります。契約社員は自社が雇用している社員なので、期間が短くても、合理的配慮の義務はほかの社員と同じく自社にあります。派遣社員は、雇用主である派遣元が配慮を考えるのが基本です。ただし、派遣元から「こういう配慮ができないか」と相談があった場合は、派遣先としても一緒に確認し、できる限り協力します。", "general": [["契約社員の場合", ["自社と雇用契約を結んでいるので、正社員と同じように合理的配慮を考えます。", "契約期間が短いことは、配慮をしない理由にはなりません。期間に合わせて、すぐに実行できる配慮から始めます。"]], ["派遣社員の場合", ["合理的配慮を提供する義務は、雇用主である派遣元にあります。", "派遣先には、派遣元から配慮について相談があった場合に、話し合ってできる限り協力することが求められています（厚生労働省の派遣先向けの指針）。", "実際の職場環境は派遣先にあるため、席の位置や指示の出し方など、派遣先で実行する配慮も多くあります。"]], ["派遣社員の配慮を進めるとき", ["派遣元・派遣先・本人で、必要な配慮と役割分担を確認します。", "派遣先で本人から直接相談を受けた場合も、派遣元に共有し、一緒に対応します（本人の同意を得て）。"]]], "sources": ["厚生労働省「合理的配慮指針」", "厚生労働省「派遣先が講ずべき措置に関する指針」"], "q": "短期のプロジェクト参加者（契約社員・派遣社員）への配慮はどこまで会社が担えばよいですか？", "cat": "特殊なケース", "st": 3, "kw": "派遣労働者に対する差別禁止は、派遣先にも及びますか？", "body": "契約社員の場合 自社と雇用契約を結んでいるので、正社員と同じように合理的配慮を考えます。 契約期間が短いことは、配慮をしない理由にはなりません。期間に合わせて、すぐに実行できる配慮から始めます。 派遣社員の場合 合理的配慮を提供する義務は、雇用主である派遣元にあります。 派遣先には、派遣元から配慮について相談があった場合に、話し合ってできる限り協力することが求められています（厚生労働省の派遣先向けの指針）。 実際の職場環境は派遣先にあるため、席の位置や指示の出し方など、派遣先で実行する配慮も多くあります。 派遣社員の配慮を進めるとき 派遣元・派遣先・本人で、必要な配慮と役割分担を確認します。 派遣先で本人から直接相談を受けた場合も、派遣元に共有し、一緒に対応します（本人の同意を得て）。", "id": "G6-091"}, "G6-092": {"conclusion": "法令や安全基準（品質基準も同じ）が優先です。ただし、「安全基準があるから障害のある人には無理」とすぐに判断するのではなく、間に一つステップを挟みます。安全基準を守ることを前提に、作業のルールや手順を工夫すれば障害があっても対応できないかを考えます。工夫すれば対応できるなら進め、工夫しても基準を満たせないなら、その業務での配慮は難しいと判断します。", "general": [["法令・安全基準が優先", ["法令や業界の安全基準、品質基準を下げる配慮は行いません。"]], ["「すぐに無理」と判断しない", ["安全基準と障害が直接ぶつかるとは限りません。", "安全基準を守ることを前提に、作業手順を変える、確認の工程を加える、補助具を使う、担当する工程を分けるなどの工夫で、対応できないかを考えます。"]], ["業務の本質と照らし合わせる", ["配慮によって、その仕事の本質が変わってしまわないかを確認します（G6-006・G6-040）。"]], ["対応できない場合", ["工夫しても基準を満たせない場合は、その業務での配慮は難しいと判断し、理由を本人に説明します。", "そのうえで、ほかの業務や工程で力を発揮できないかを一緒に考えます（G6-039）。"]], ["判断の根拠を確認する", ["「危なそう」という印象ではなく、どの法令・どの基準のどの部分に関わるのかを具体的に確認します。必要に応じて、安全管理の担当者や専門家の意見を聞きます。"]]], "sources": [], "q": "配慮内容が法令や業界特有の安全基準と衝突する場合、どう折り合いをつければよいですか？", "cat": "特殊なケース", "st": 3, "kw": "危険な仕事が多い場合の対応はどうすればよいか", "body": "法令・安全基準が優先 法令や業界の安全基準、品質基準を下げる配慮は行いません。 「すぐに無理」と判断しない 安全基準と障害が直接ぶつかるとは限りません。 安全基準を守ることを前提に、作業手順を変える、確認の工程を加える、補助具を使う、担当する工程を分けるなどの工夫で、対応できないかを考えます。 業務の本質と照らし合わせる 配慮によって、その仕事の本質が変わってしまわないかを確認します（G6-006・G6-040）。 対応できない場合 工夫しても基準を満たせない場合は、その業務での配慮は難しいと判断し、理由を本人に説明します。 そのうえで、ほかの業務や工程で力を発揮できないかを一緒に考えます（G6-039）。 判断の根拠を確認する 「危なそう」という印象ではなく、どの法令・どの基準のどの部分に関わるのかを具体的に確認します。必要に応じて、安全管理の担当者や専門家の意見を聞きます。", "id": "G6-092"}, "G6-093": {"conclusion": "すべての出発点は、障害種別ではなく困りごとです。どんな場面で何に困っているのかを確認し、その困りごとに対応する方法を考えます。前例がない場合は、実際に試してみて、振り返って見直すことを繰り返します。これでよいのか不安なときは、専門家や支援機関の意見を聞きます。", "general": [["困りごとから考える", ["既存の配慮例は「障害種別」で整理されていることが多いですが、本人に合うとは限りません。", "業務の場面ごとに困りごとを書き出し、一つずつ対応を考えます（G6-032・G6-096）。"]], ["試して、見直す", ["前例がない配慮は、期間を決めて試し、振り返って調整します（G6-025）。", "うまくいかなかった方法も記録しておくと、次の検討に役立ちます。"]], ["本人が一番の専門家", ["本人が過去にうまくいった工夫や、自分なりの対処法を持っていることがあります。まず本人に聞きます。"]], ["専門家や支援機関に相談する", ["本人の同意を得て、主治医や支援機関の意見を聞きます。", "地域障害者職業センターでは、事業主向けに障害者雇用に関する相談や助言を受けられます。"]]], "sources": [], "q": "本人の障害特性が非常に個別性が高く、既存の配慮例が参考にならない場合、どう検討を進めればよいですか？", "cat": "特殊なケース", "st": 3, "kw": "", "body": "困りごとから考える 既存の配慮例は「障害種別」で整理されていることが多いですが、本人に合うとは限りません。 業務の場面ごとに困りごとを書き出し、一つずつ対応を考えます（G6-032・G6-096）。 試して、見直す 前例がない配慮は、期間を決めて試し、振り返って調整します（G6-025）。 うまくいかなかった方法も記録しておくと、次の検討に役立ちます。 本人が一番の専門家 本人が過去にうまくいった工夫や、自分なりの対処法を持っていることがあります。まず本人に聞きます。 専門家や支援機関に相談する 本人の同意を得て、主治医や支援機関の意見を聞きます。 地域障害者職業センターでは、事業主向けに障害者雇用に関する相談や助言を受けられます。", "id": "G6-093"}, "G6-095": {"conclusion": "雇用主が変わっても、労働契約の内容や就業規則がいきなり変わるわけではないため、基本的には配慮の内容も引き継がれていくと考えられます。ただ、障害への配慮は見落とされやすい部分です。どんな配慮を本人と合意して行っているかを引き継ぎの文書にまとめ、新しい雇用主ともきちんと話し合っておきます。", "general": [["労働条件は基本的に引き継がれる", ["合併の場合は、雇用契約がそのまま新しい会社に引き継がれます。会社分割の場合も、基本的には引き継がれます。", "事業譲渡の場合は、本人の同意を得て個別に引き継ぐ形になるなど、組織再編の方法によって扱いが変わります。具体的な扱いは専門家に確認します。"]], ["配慮の内容を文書で引き継ぐ", ["配慮の内容、その理由（困りごと）、合意日、見直し時期を、引き継ぎの文書にまとめます（G6-003・G6-012）。", "障害や健康に関する情報を新しい雇用主に渡すときは、本人の同意を得ます。"]], ["新しい雇用主と話し合う", ["引き継ぐ配慮を確認し、新しい職場で同じように実行できるかを話し合います。", "設備や制度が変わる場合は、代わりの方法を考えます。"]], ["本人への説明", ["雇用主が変わっても配慮が続くこと、変わる点があればその内容を、本人に早めに伝えます。", "再編後しばらくは面談の頻度を上げ、配慮が機能しているかを確認します。"]]], "sources": ["労働契約承継法（会社分割の場合）"], "q": "M&Aや組織再編で雇用主が変わる場合、既存の配慮内容の継続性はどう担保すればよいですか？", "cat": "特殊なケース", "st": 3, "kw": "", "body": "労働条件は基本的に引き継がれる 合併の場合は、雇用契約がそのまま新しい会社に引き継がれます。会社分割の場合も、基本的には引き継がれます。 事業譲渡の場合は、本人の同意を得て個別に引き継ぐ形になるなど、組織再編の方法によって扱いが変わります。具体的な扱いは専門家に確認します。 配慮の内容を文書で引き継ぐ 配慮の内容、その理由（困りごと）、合意日、見直し時期を、引き継ぎの文書にまとめます（G6-003・G6-012）。 障害や健康に関する情報を新しい雇用主に渡すときは、本人の同意を得ます。 新しい雇用主と話し合う 引き継ぐ配慮を確認し、新しい職場で同じように実行できるかを話し合います。 設備や制度が変わる場合は、代わりの方法を考えます。 本人への説明 雇用主が変わっても配慮が続くこと、変わる点があればその内容を、本人に早めに伝えます。 再編後しばらくは面談の頻度を上げ、配慮が機能しているかを確認します。", "id": "G6-095"}, "G6-110": {"conclusion": "禁止される差別とは、障害があることを理由に、障害のない人と比べて不利に扱うことです。募集・採用、賃金、配置、昇進・降格、教育訓練、福利厚生、職種や雇用形態の変更、退職の勧め、定年、解雇、労働契約の更新など、雇用のあらゆる場面が対象です。", "general": [["差別にあたる例", ["障害者であることを理由に、採用の対象から外す", "障害者だけ、賃金を低く決める、昇給させない", "障害者だけ、研修や福利厚生を利用させない", "障害者であることを理由に、解雇や雇止め（契約を更新しないこと）の対象にする"]], ["差別にあたらないもの", ["障害のある人の雇用の機会を広げるための取組（障害者専用求人など）", "合理的配慮を提供し、労働能力を適正に評価した結果として異なる取扱いになること"]]], "sources": ["障害者雇用促進法34条・35条", "障害者差別禁止指針（厚生労働省）"], "links": [["厚生労働省 障害者差別禁止・合理的配慮に関するQ&A（PDF）", "https://www.mhlw.go.jp/file/06-Seisakujouhou-11600000-Shokugyouanteikyoku/0000121387.pdf"]], "q": "雇用の場面で禁止される「差別」とは具体的に何を指しますか？", "cat": "合理的配慮の基本", "st": 3, "kw": "", "body": "差別にあたる例 障害者であることを理由に、採用の対象から外す 障害者だけ、賃金を低く決める、昇給させない 障害者だけ、研修や福利厚生を利用させない 障害者であることを理由に、解雇や雇止め（契約を更新しないこと）の対象にする 差別にあたらないもの 障害のある人の雇用の機会を広げるための取組（障害者専用求人など） 合理的配慮を提供し、労働能力を適正に評価した結果として異なる取扱いになること", "id": "G6-110"}, "G6-108": {"conclusion": "生じる可能性がある問題は、大きく二つあります。一つは、法律上の義務違反として、都道府県労働局から助言・指導・勧告を受けることです（直接の罰則はありません）。もう一つは、本人との争いとして、損害賠償を求められたり、処分や解雇が無効と判断されたりすることです。", "general": [["① 法律上の義務違反（行政の対応）", ["都道府県労働局が、必要に応じて事業主に助言・指導・勧告を行う", "差別禁止・合理的配慮の義務違反そのものに、直接の罰則はない"]], ["② 本人との争い（民事上の責任）", ["本人が労働局に申し出ると、労働局長による助言・指導・勧告や、紛争調整委員会による調停の対象になる", "裁判で、損害賠償を求められることがある", "配慮をしないまま行った懲戒・解雇・雇止め（契約を更新しないこと）などが、無効と判断されることがある（G1-003）"]], ["会社としての備え", ["苦情を受け付ける窓口を決め、まず社内で解決をめざす（自主的解決の努力義務）", "配慮の検討の経緯や本人とのやりとりを記録しておく"]]], "sources": ["障害者雇用促進法36条の6・74条の4〜74条の8"], "links": [["厚生労働省 障害者差別禁止・合理的配慮に関するQ&A（PDF）", "https://www.mhlw.go.jp/file/06-Seisakujouhou-11600000-Shokugyouanteikyoku/0000121387.pdf"]], "q": "差別禁止・合理的配慮の義務に違反した場合、会社にどのような問題が生じる可能性がありますか？", "cat": "合理的配慮の基本", "st": 3, "kw": "", "body": "① 法律上の義務違反（行政の対応） 都道府県労働局が、必要に応じて事業主に助言・指導・勧告を行う 差別禁止・合理的配慮の義務違反そのものに、直接の罰則はない ② 本人との争い（民事上の責任） 本人が労働局に申し出ると、労働局長による助言・指導・勧告や、紛争調整委員会による調停の対象になる 裁判で、損害賠償を求められることがある 配慮をしないまま行った懲戒・解雇・雇止め（契約を更新しないこと）などが、無効と判断されることがある（G1-003） 会社としての備え 苦情を受け付ける窓口を決め、まず社内で解決をめざす（自主的解決の努力義務） 配慮の検討の経緯や本人とのやりとりを記録しておく", "id": "G6-108"}, "G10-001": {"conclusion": "まず声をかけて、反応と呼吸を確認します。反応や普段どおりの呼吸がなければ、迷わず応援を呼んで119番とAEDを使います。", "steps": ["声をかけ、反応（意識）と呼吸を確認する", "反応がない・普段どおりの呼吸がない → 大声で応援を呼び、119番とAED", "反応はあるが顔色が悪い・冷や汗・胸の痛み・激しい頭痛・ろれつが回らない → 119番", "迷う → #7119（実施地域のみ）か社内の産業医・看護職に相談", "一人にせず、安全な場所で楽な姿勢で休ませて付き添う"], "cautions": ["無理に歩かせたり立たせたりしない。", "症状を伝えにくい特性の人は、顔色・呼吸・汗など見た目で判断する。"], "prepare": ["本人の同意を得て、緊急連絡先・持病・対応方法を「緊急時シート」にまとめておく。", "AEDの場所と、通報を判断する人を決めておく。"], "sources": ["総務省消防庁「救急車を呼ぶべき症状」", "日本赤十字社「一次救命処置」"], "q": "勤務中に急に顔色が悪くなり座り込んでしまった社員がいる。まず何をすればよいですか？", "cat": "体調急変・けが", "st": 5, "kw": "", "body": "声をかけ、反応（意識）と呼吸を確認する 反応がない・普段どおりの呼吸がない → 大声で応援を呼び、119番とAED 反応はあるが顔色が悪い・冷や汗・胸の痛み・激しい頭痛・ろれつが回らない → 119番 迷う → #7119（実施地域のみ）か社内の産業医・看護職に相談 一人にせず、安全な場所で楽な姿勢で休ませて付き添う 無理に歩かせたり立たせたりしない。 症状を伝えにくい特性の人は、顔色・呼吸・汗など見た目で判断する。 本人の同意を得て、緊急連絡先・持病・対応方法を「緊急時シート」にまとめておく。 AEDの場所と、通報を判断する人を決めておく。", "id": "G10-001"}, "G10-002": {"conclusion": "まず周りの危ない物をどけて安全を確保し、一人にせず付き添います。発作の種類ごとの対応を、前もって本人と決めておくと安心です。", "steps": ["周りの危ない物をどけて、本人の安全を確保する", "一人にせず、応援を呼んで付き添う", "【てんかん】押さえつけない・口に物を入れない。可能なら始まった時刻を確認", "【てんかん】5分以上続く・意識が戻らない・けが・初めての発作 → 119番", "【過呼吸】静かな場所で座らせ「ゆっくり吐きましょう」と声をかける。胸の痛み・初めて・治まらない → 119番か受診"], "cautions": ["過呼吸に紙袋を当てる方法は、酸素不足のおそれがあり勧められていない。", "発作が治まったら横向きに寝かせ、意識がはっきりするまで付き添う。"], "prepare": ["本人と「発作時の対応カード」（発作の様子、してほしいこと、救急車の目安、緊急連絡先）を作り、同意した範囲で周囲と共有しておく。"], "sources": ["日本てんかん協会「てんかん発作時の対応」"], "q": "持病の発作（てんかん・過呼吸等）が職場で起きた場合、周囲の社員はどう動けばよいですか？", "cat": "体調急変・けが", "st": 5, "kw": "", "body": "周りの危ない物をどけて、本人の安全を確保する 一人にせず、応援を呼んで付き添う 【てんかん】押さえつけない・口に物を入れない。可能なら始まった時刻を確認 【てんかん】5分以上続く・意識が戻らない・けが・初めての発作 → 119番 【過呼吸】静かな場所で座らせ「ゆっくり吐きましょう」と声をかける。胸の痛み・初めて・治まらない → 119番か受診 過呼吸に紙袋を当てる方法は、酸素不足のおそれがあり勧められていない。 発作が治まったら横向きに寝かせ、意識がはっきりするまで付き添う。 本人と「発作時の対応カード」（発作の様子、してほしいこと、救急車の目安、緊急連絡先）を作り、同意した範囲で周囲と共有しておく。", "id": "G10-002"}, "G10-003": {"conclusion": "基本の対応はほかの社員と同じです。そのうえで、痛みを伝えにくい人もいるため、「大丈夫」と言われても、けがの部位を目で見て確認します。", "steps": ["本人の話を聞く", "「大丈夫」でも、けがの部位を目で見て確認する", "応急処置をし、腫れ・出血・動かしにくさがあれば受診させる", "状況を知っている人が受診に付き添う", "業務中のけがは労災として受診する（健康保険は使わない）"], "cautions": ["知的障害やパニック、痛みの感じ方の特性、感覚の麻痺などで、本人がけがをうまく伝えられないことがある。見過ごしが最も危ない。", "「痛いですか」より「ここは痛いですか」と部位を指して聞く。", "持病や服薬で出血が止まりにくい場合がある。知っている情報は医師に伝える。"], "prepare": ["緊急時シート（G10-001）に、けがの際に気をつけたい持病・服薬も入れておく。"], "sources": ["厚生労働省「労災保険」「労働者死傷病報告」"], "q": "作業中にケガをした障害のある社員への初動対応で、ほかの社員と違う注意点はありますか？", "cat": "体調急変・けが", "st": 5, "kw": "", "body": "本人の話を聞く 「大丈夫」でも、けがの部位を目で見て確認する 応急処置をし、腫れ・出血・動かしにくさがあれば受診させる 状況を知っている人が受診に付き添う 業務中のけがは労災として受診する（健康保険は使わない） 知的障害やパニック、痛みの感じ方の特性、感覚の麻痺などで、本人がけがをうまく伝えられないことがある。見過ごしが最も危ない。 「痛いですか」より「ここは痛いですか」と部位を指して聞く。 持病や服薬で出血が止まりにくい場合がある。知っている情報は医師に伝える。 緊急時シート（G10-001）に、けがの際に気をつけたい持病・服薬も入れておく。", "id": "G10-003"}, "G10-004": {"conclusion": "「大丈夫」という言葉だけで判断せず、いったん作業を止めて休ませ、顔色や受け答えなど見た目の様子で判断します。", "steps": ["「大丈夫」という言葉だけで判断せず、いったん作業を止めて休ませる", "顔色・汗・受け答え・ふらつきなど、見た目で判断する", "反応がおかしい・意識がもうろう → 119番", "【熱中症】涼しい場所へ。首・脇・足の付け根を冷やし、水分と塩分をとらせる。自分で飲めない・よくならない → 受診", "迷ったら受診を勧める"], "cautions": ["迷惑をかけたくない、評価が気になるといった理由で「大丈夫」と言うことがある。", "内部障害や持病、体温調節が難しい障害のある人は、急に悪化することがある。"], "prepare": ["危険な症状と対応を本人と事前に決めておく。", "熱中症は、2025年6月から報告体制と対応手順の整備が事業者の義務になっている。"], "sources": ["厚生労働省「職場における熱中症対策の強化」", "環境省「熱中症環境保健マニュアル」"], "q": "体調が悪そうな社員が、本人は「大丈夫」と言い張っている。どう判断すればよいですか？（熱中症や内部障害の場合など）", "cat": "体調急変・けが", "st": 5, "kw": "精神障害のある社員が「大丈夫です」と言いますが、実際は無理をしているように見えます。どう見極めればよいですか？ 社員が「大丈夫です」としか答えない場合、どう対応すればよいか", "body": "「大丈夫」という言葉だけで判断せず、いったん作業を止めて休ませる 顔色・汗・受け答え・ふらつきなど、見た目で判断する 反応がおかしい・意識がもうろう → 119番 【熱中症】涼しい場所へ。首・脇・足の付け根を冷やし、水分と塩分をとらせる。自分で飲めない・よくならない → 受診 迷ったら受診を勧める 迷惑をかけたくない、評価が気になるといった理由で「大丈夫」と言うことがある。 内部障害や持病、体温調節が難しい障害のある人は、急に悪化することがある。 危険な症状と対応を本人と事前に決めておく。 熱中症は、2025年6月から報告体制と対応手順の整備が事業者の義務になっている。", "id": "G10-004"}, "G10-005": {"conclusion": "明らかに危ない症状なら、迷わず119番に電話します。救急車を呼ぶか迷うときは、#7119などの相談窓口や、社内の産業医・保健師に相談できます。", "steps": ["明らかに危険な症状 → 迷わず119番（迷う段階で電話しても、指令員が判断してくれる）", "救急車か受診か迷う → #7119（実施地域のみ）、または消防庁のアプリ「Q助」", "社内に産業医・保健師・看護職がいれば連絡する", "「たぶん大丈夫」で様子見をしない。迷ったら呼ぶ"], "cautions": ["本人の「大丈夫」や周囲の「いつものこと」で判断しない。", "結果的に軽症でも、呼んだことは問題ではない。"], "prepare": ["119番・#7119・産業医の連絡先と「迷ったら呼ぶ」を職場に掲示しておく。", "通報を判断する人と、不在時の代わりを決めておく。"], "sources": ["総務省消防庁「救急安心センター事業（#7119）」「全国版救急受診アプリ（Q助）」"], "q": "救急搬送が必要かどうかの判断に迷う場合、誰に相談すればよいですか？", "cat": "体調急変・けが", "st": 5, "kw": "産業医への緊急相談が必要かどうかを現場の管理職が判断する目安は何か。", "body": "明らかに危険な症状 → 迷わず119番（迷う段階で電話しても、指令員が判断してくれる） 救急車か受診か迷う → #7119（実施地域のみ）、または消防庁のアプリ「Q助」 社内に産業医・保健師・看護職がいれば連絡する 「たぶん大丈夫」で様子見をしない。迷ったら呼ぶ 本人の「大丈夫」や周囲の「いつものこと」で判断しない。 結果的に軽症でも、呼んだことは問題ではない。 119番・#7119・産業医の連絡先と「迷ったら呼ぶ」を職場に掲示しておく。 通報を判断する人と、不在時の代わりを決めておく。", "id": "G10-005"}, "G10-006": {"conclusion": "薬のことを細かく聞き出すのではなく、「今の体調」を確認して、それに合わせて休ませる、受診を勧めるなどの対応をします。服薬の判断は医療の専門家に任せます。", "steps": ["薬のことを細かく聞き出そうとせず、「今の体調」を確認する", "体調に応じて、休ませる・早退させる・受診を勧める", "服薬の判断は主治医など医療の専門家に任せる（連絡は本人の同意が原則）", "命に関わる状態 → 119番。知っている持病・服薬の情報を救急隊に伝える"], "cautions": ["服薬情報は特に慎重な扱いが必要な個人情報。周囲に知られたくない人も多い。", "職場が薬の影響を判断することはできない。"], "prepare": ["落ち着いている時に、飲み忘れ時や体調が崩れた時の対応、主治医・家族・支援機関に連絡してよいかを決めておく。", "服薬管理に課題があれば、生活面も支える支援機関への相談を勧める。"], "sources": ["個人情報保護委員会「個人情報保護法ガイドライン」（要配慮個人情報）"], "q": "持病の薬を飲み忘れて体調が不安定になっている様子だが、本人は服薬状況を話したがらない。どこまで踏み込んでよいですか？", "cat": "体調急変・けが", "st": 5, "kw": "", "body": "薬のことを細かく聞き出そうとせず、「今の体調」を確認する 体調に応じて、休ませる・早退させる・受診を勧める 服薬の判断は主治医など医療の専門家に任せる（連絡は本人の同意が原則） 命に関わる状態 → 119番。知っている持病・服薬の情報を救急隊に伝える 服薬情報は特に慎重な扱いが必要な個人情報。周囲に知られたくない人も多い。 職場が薬の影響を判断することはできない。 落ち着いている時に、飲み忘れ時や体調が崩れた時の対応、主治医・家族・支援機関に連絡してよいかを決めておく。 服薬管理に課題があれば、生活面も支える支援機関への相談を勧める。", "id": "G10-006"}, "G10-009": {"conclusion": "まず人命と安全の確保を優先し、そのあとで報告と記録、労災の手続きを進めます。手続きは落ち着いてからでも間に合います。", "steps": ["人命と安全の確保を最優先する（応急処置、必要なら119番、二次事故を防ぐ）", "上司・人事に報告する。家族への連絡は、本人の意向と事前の取り決めに沿って行う", "何が起きたかの事実を記録する（日時・場所・状況・目撃者・本人の説明）", "落ち着いてから労災の手続きに進む（受診時に労災であることを伝え、健康保険は使わない）", "業務中の事故で休業が出た場合は、労働基準監督署に労働者死傷病報告を出す"], "cautions": ["本人が状況をうまく説明できない場合は、目撃した人の話も記録する。", "労災にあたるかどうかを会社だけで判断して手続きを止めない。最終的な判断は労働基準監督署が行う。", "通勤中の事故は「通勤災害」として、業務中の事故とは手続きの書類が異なる。"], "prepare": [], "sources": ["厚生労働省「労災保険給付の概要」「労働者死傷病報告」"], "q": "移動中の転倒など、業務中や通勤中に事故が起きた場合、労災の手続きと社内の初動対応はどちらを優先すればよいですか？", "cat": "体調急変・けが", "st": 5, "kw": "", "body": "人命と安全の確保を最優先する（応急処置、必要なら119番、二次事故を防ぐ） 上司・人事に報告する。家族への連絡は、本人の意向と事前の取り決めに沿って行う 何が起きたかの事実を記録する（日時・場所・状況・目撃者・本人の説明） 落ち着いてから労災の手続きに進む（受診時に労災であることを伝え、健康保険は使わない） 業務中の事故で休業が出た場合は、労働基準監督署に労働者死傷病報告を出す 本人が状況をうまく説明できない場合は、目撃した人の話も記録する。 労災にあたるかどうかを会社だけで判断して手続きを止めない。最終的な判断は労働基準監督署が行う。 通勤中の事故は「通勤災害」として、業務中の事故とは手続きの書類が異なる。", "id": "G10-009"}, "G10-010": {"conclusion": "受診を勧めること自体はかまいません。命に関わる症状があれば119番を優先し、そうでなければ心配している理由を具体的に伝え、受診を拒む理由も聞きます。", "steps": ["命に関わる症状があれば、本人が拒んでも119番", "体調を心配していることと、受診を勧める理由を、具体的な様子をもとに伝える", "受診を拒む理由を聞く（時間・費用・病名を知られたくない・受診そのものへの不安など）", "受診するまでの間は、業務量を減らす、休ませるなど、安全を優先した働き方にする", "産業医や保健師との面談につなぐ", "本人の同意を得て、家族や支援機関と連携し、会社以外の人からも伝えてもらう"], "steps_label": "やること", "cautions": ["受診を勧めることは望ましいが、強制は難しい。ただし、就業規則に受診命令の定めがあれば、一定の範囲で命じられる場合もある（社労士などに確認する）。", "会社には社員の安全に配慮する義務がある。働き続けることが危険なら、就業を制限してよい。", "何よりも優先するのは、本人の命と安全。"], "prepare": [], "sources": ["労働契約法 第5条（安全配慮義務）"], "q": "体調不良が続いているのに本人が受診を拒んでいる。会社として受診を強く勧めてよいですか？", "cat": "体調急変・けが", "st": 5, "kw": "", "body": "命に関わる症状があれば、本人が拒んでも119番 体調を心配していることと、受診を勧める理由を、具体的な様子をもとに伝える 受診を拒む理由を聞く（時間・費用・病名を知られたくない・受診そのものへの不安など） 受診するまでの間は、業務量を減らす、休ませるなど、安全を優先した働き方にする 産業医や保健師との面談につなぐ 本人の同意を得て、家族や支援機関と連携し、会社以外の人からも伝えてもらう 受診を勧めることは望ましいが、強制は難しい。ただし、就業規則に受診命令の定めがあれば、一定の範囲で命じられる場合もある（社労士などに確認する）。 会社には社員の安全に配慮する義務がある。働き続けることが危険なら、就業を制限してよい。 何よりも優先するのは、本人の命と安全。", "id": "G10-010"}, "G10-011": {"conclusion": "まず本人を一人にせず、否定せずに話を聞きます。危険が差し迫っていれば119番、そうでなければ家族や産業医、支援機関など、決めておいた連絡先につなぎます。", "steps": ["本人を一人にしない。目の前の安全を確保し、必要なら応援を呼ぶ", "否定や説教をせず、まず話を聞く（「話してくれてありがとう」）", "具体的な方法や時期を口にする、手段を持っているなど、危険が差し迫っている → 119番（状況により110番）", "産業医・保健師と、上司・人事に連絡する", "主治医・家族・支援機関と連携する。原則は本人の同意を得るが、命に関わる場合は同意がなくても連絡する"], "cautions": ["「誰にも言わないで」と言われても、命に関わることは秘密にできないと正直に伝える。", "対応した人が一人で抱え込まない。必ず社内の専門職や上司と共有する。", "社内に専門職がいない場合は、こころの健康相談統一ダイヤル（0570-064-556）など公的な相談窓口も使える。"], "prepare": ["こうした場面での社内の連絡の流れ（誰に、どの順で）を決めておく。", "体調面に不安がある社員とは、本人の同意を得て主治医・家族・支援機関の連絡先と、連絡してよい範囲を決めておく（G10-008）。"], "sources": ["厚生労働省「ゲートキーパー養成研修」", "個人情報保護法 第27条（人の生命・身体の保護のための例外）"], "q": "自傷をほのめかす発言をした社員がいる。まず誰にどう連絡すればよいですか？", "cat": "自傷・他害", "st": 5, "kw": "外部の緊急相談窓口（いのちの電話等）を社内にどう周知しておくべきか。", "body": "本人を一人にしない。目の前の安全を確保し、必要なら応援を呼ぶ 否定や説教をせず、まず話を聞く（「話してくれてありがとう」） 具体的な方法や時期を口にする、手段を持っているなど、危険が差し迫っている → 119番（状況により110番） 産業医・保健師と、上司・人事に連絡する 主治医・家族・支援機関と連携する。原則は本人の同意を得るが、命に関わる場合は同意がなくても連絡する 「誰にも言わないで」と言われても、命に関わることは秘密にできないと正直に伝える。 対応した人が一人で抱え込まない。必ず社内の専門職や上司と共有する。 社内に専門職がいない場合は、こころの健康相談統一ダイヤル（0570-064-556）など公的な相談窓口も使える。 こうした場面での社内の連絡の流れ（誰に、どの順で）を決めておく。 体調面に不安がある社員とは、本人の同意を得て主治医・家族・支援機関の連絡先と、連絡してよい範囲を決めておく（G10-008）。", "id": "G10-011"}, "G10-014": {"conclusion": "すぐに返信し、否定せずに受け止めたうえで、電話か対面で直接話します。今どこにいるか、一人かどうかを確認し、危険があれば119番につなぎます。", "steps": ["すぐに返信する。既読のまま後回しにしない", "否定や説教をせず、受け止める（例：「伝えてくれてありがとう。心配しています」）", "電話か対面で直接話す。今どこにいるか、一人かどうかを確認する", "連絡がつかない、または危険が差し迫っている → 家族に連絡、119番（安否がわからない場合は110番）", "落ち着いたら産業医・保健師、上位職と共有し、一人で抱えない（G10-011）"], "cautions": ["文面だけでは本人の状態がわからない。文面の軽さ・重さで危険度を判断しない。", "勤務時間外に受け取った場合も、同じように対応する。"], "prepare": ["時間外にこうした連絡を受けた場合に、上司が相談できる連絡先を決めておく。", "本人の同意を得て、家族や支援機関の連絡先を知っておく（G10-008）。"], "sources": ["厚生労働省「ゲートキーパー養成研修」"], "q": "「消えたい」という趣旨のメッセージを、チャットやメールで受け取った上司はどう対応すればよいですか？", "cat": "自傷・他害", "st": 5, "kw": "", "body": "すぐに返信する。既読のまま後回しにしない 否定や説教をせず、受け止める（例：「伝えてくれてありがとう。心配しています」） 電話か対面で直接話す。今どこにいるか、一人かどうかを確認する 連絡がつかない、または危険が差し迫っている → 家族に連絡、119番（安否がわからない場合は110番） 落ち着いたら産業医・保健師、上位職と共有し、一人で抱えない（G10-011） 文面だけでは本人の状態がわからない。文面の軽さ・重さで危険度を判断しない。 勤務時間外に受け取った場合も、同じように対応する。 時間外にこうした連絡を受けた場合に、上司が相談できる連絡先を決めておく。 本人の同意を得て、家族や支援機関の連絡先を知っておく（G10-008）。", "id": "G10-014"}, "G10-015": {"conclusion": "原則は、本人の同意を得てから連絡します。ただし、命や身体に危険があり同意を得るのが難しい場合は、同意がなくても、必要な範囲で連絡できます。", "steps": ["原則は、本人の同意を得てから連絡する", "命や身体に危険がある場合で、同意を得ることが難しいとき（本人が拒む場合も含む）は、同意なしに連絡してよい", "伝えるのは、危険を防ぐのに必要な範囲に限る", "連絡した後、落ち着いた段階で、誰に何を伝えたかを本人に説明する"], "steps_label": "やること", "cautions": ["個人情報保護法では、命や身体を守るために必要で、本人の同意を得るのが難しいときは、同意がなくてもほかの人に伝えてよいことになっている（第18条・第27条の例外）。病歴や障害などの健康情報も同じ。", "「同意を得るのが難しい」には、本人が同意を拒んでいる場合も含まれると考えられている。迷うときは、命を優先する。", "社内規程での扱いは、顧問弁護士などに確認しておくとよい。"], "prepare": ["平常時に本人と、緊急時に誰へ連絡してよいかを決めて記録しておく（G10-008）。"], "sources": ["個人情報保護法 第18条第3項第2号・第27条第1項第2号", "個人情報保護委員会「個人情報保護法ガイドライン（通則編）」"], "q": "自傷・他害の兆候がある場合に、産業医への連絡は本人の同意なしに行ってよいですか？", "cat": "自傷・他害", "st": 5, "kw": "主治医の意見を緊急に確認したいが、本人の同意なしに連絡してよいか。", "body": "原則は、本人の同意を得てから連絡する 命や身体に危険がある場合で、同意を得ることが難しいとき（本人が拒む場合も含む）は、同意なしに連絡してよい 伝えるのは、危険を防ぐのに必要な範囲に限る 連絡した後、落ち着いた段階で、誰に何を伝えたかを本人に説明する 個人情報保護法では、命や身体を守るために必要で、本人の同意を得るのが難しいときは、同意がなくてもほかの人に伝えてよいことになっている（第18条・第27条の例外）。病歴や障害などの健康情報も同じ。 「同意を得るのが難しい」には、本人が同意を拒んでいる場合も含まれると考えられている。迷うときは、命を優先する。 社内規程での扱いは、顧問弁護士などに確認しておくとよい。 平常時に本人と、緊急時に誰へ連絡してよいかを決めて記録しておく（G10-008）。", "id": "G10-015"}, "G10-017": {"conclusion": "どちらの場合も、本人を一人にしないことが大切です。帰宅させるなら、家族や支援者に迎えに来てもらって引き渡し、受診も勧めます。", "steps": ["一人で帰さない。帰宅させる場合も、社内で様子を見る場合も、必ず誰かがそばにいる", "家族や支援者に連絡し、迎えに来てもらって引き渡す", "医療機関の受診を勧める（主治医がいれば主治医へ）", "引き渡すまでは、社内の静かな場所で付き添う", "翌日以降、誰が、誰と、どのように連絡を取るかを決めておく"], "steps_label": "やること", "cautions": ["引き渡せる人が見つからず、危険が続いている場合は、119番や医療機関に相談する。", "本人と連絡が取れなくなることもある。家族や支援者とも連絡の取り方を確認しておく。", "翌日以降は、本人・主治医・支援機関と相談しながら、業務量や接し方を見直す。"], "prepare": ["本人の同意を得て、家族・支援機関・主治医の連絡先を知っておく（G10-008）。"], "sources": [], "q": "自傷他害の兆候後、当日は帰宅させればよいですか、それとも社内で様子を見ればよいですか？", "cat": "自傷・他害", "st": 5, "kw": "", "body": "一人で帰さない。帰宅させる場合も、社内で様子を見る場合も、必ず誰かがそばにいる 家族や支援者に連絡し、迎えに来てもらって引き渡す 医療機関の受診を勧める（主治医がいれば主治医へ） 引き渡すまでは、社内の静かな場所で付き添う 翌日以降、誰が、誰と、どのように連絡を取るかを決めておく 引き渡せる人が見つからず、危険が続いている場合は、119番や医療機関に相談する。 本人と連絡が取れなくなることもある。家族や支援者とも連絡の取り方を確認しておく。 翌日以降は、本人・主治医・支援機関と相談しながら、業務量や接し方を見直す。 本人の同意を得て、家族・支援機関・主治医の連絡先を知っておく（G10-008）。", "id": "G10-017"}, "G10-018": {"conclusion": "連絡するかどうかは、現場の担当者一人ではなく、人事責任者などが判断します。一刻を争うときはその場の責任者が判断し、すぐに報告します。", "steps": ["連絡するかどうかは、人事責任者や上位職が判断する（現場の担当者が一人で決めない）", "判断する人が不在で一刻を争う場合は、その場の責任者が判断し、すぐに報告する", "家族に伝える内容は、本人の安全を守るのに必要な範囲に限る", "記録を残す：日時、本人の発言や様子、判断した人、連絡した相手、伝えた内容、判断の理由", "落ち着いた後、本人に連絡したことと、その理由を説明する"], "steps_label": "やること", "cautions": ["個人情報保護法：命や身体を守るために必要で、本人の同意を得るのが難しいときは、同意がなくても家族などに伝えてよいことになっている（第27条第1項第2号）。", "会社の責任：会社には、社員の命や体の安全に気を配る責任がある（安全配慮義務、労働契約法第5条）。命に関わる場面で何もしないことは、この責任を果たしていないことになりかねない。", "社内の取り決め：緊急時の連絡について規程や本人との取り決めがあれば、それに沿って対応したことも根拠になる。", "説明の言葉の例：「あなたの命と安全を最優先に考えて、会社として判断しました。伝えたのは〇〇だけです」"], "cautions_label": "本人から「連絡してほしくなかった」と言われたときの根拠", "prepare": ["緊急時に誰が判断し、どんな場合に、誰へ、何を連絡するかを、社内規程や本人との取り決めで事前に明確にしておく。", "入社時や定着面談で本人の同意を得て、連絡してよい家族と範囲を記録しておく（G10-008）。"], "sources": ["個人情報保護法 第27条第1項第2号", "労働契約法 第5条（安全配慮義務）"], "q": "本人の安全のために家族への連絡が必要と判断した場合、誰の権限で連絡してよいですか？", "cat": "自傷・他害", "st": 5, "kw": "", "body": "連絡するかどうかは、人事責任者や上位職が判断する（現場の担当者が一人で決めない） 判断する人が不在で一刻を争う場合は、その場の責任者が判断し、すぐに報告する 家族に伝える内容は、本人の安全を守るのに必要な範囲に限る 記録を残す：日時、本人の発言や様子、判断した人、連絡した相手、伝えた内容、判断の理由 落ち着いた後、本人に連絡したことと、その理由を説明する 個人情報保護法：命や身体を守るために必要で、本人の同意を得るのが難しいときは、同意がなくても家族などに伝えてよいことになっている（第27条第1項第2号）。 会社の責任：会社には、社員の命や体の安全に気を配る責任がある（安全配慮義務、労働契約法第5条）。命に関わる場面で何もしないことは、この責任を果たしていないことになりかねない。 社内の取り決め：緊急時の連絡について規程や本人との取り決めがあれば、それに沿って対応したことも根拠になる。 説明の言葉の例：「あなたの命と安全を最優先に考えて、会社として判断しました。伝えたのは〇〇だけです」 緊急時に誰が判断し、どんな場合に、誰へ、何を連絡するかを、社内規程や本人との取り決めで事前に明確にしておく。 入社時や定着面談で本人の同意を得て、連絡してよい家族と範囲を記録しておく（G10-008）。", "id": "G10-018"}, "G10-007": {"conclusion": "まず、きっかけになった刺激（音・光・人など）を減らし、本人が落ち着ける環境をつくります。無理に止めたり連れ出したりせず、安全を見守ります。", "steps": ["何の刺激がきっかけかを見る（事前に知っていれば、まずその刺激を取り除く）", "刺激を減らす：音（機器を止める・周りの声を落とす）、光（照明を落とす）、人（周りの人を離し、対応は1人にする）", "静かな場所へ誘導する（本人が動ける場合のみ。無理に連れて行かない）", "短い言葉で端的に伝える（例：「静かな部屋に行きましょう」）", "体に触れず、落ち着くまで待つ", "自分や周りを傷つけそうな場合は、距離をとって応援を呼ぶ（G10-012・013）"], "cautions": ["大声で制止する、叱る、質問を重ねるのは逆効果。", "パニックの理由は、落ち着いてから本人と振り返る。"], "prepare": ["本人と、苦手な刺激、パニックの前触れ、落ち着く方法、移動できる静かな場所を決めて、同意した範囲で周囲と共有しておく。", "イヤーマフや座席位置など、刺激を減らす配慮を日ごろから考えておく。"], "sources": [], "q": "感覚過敏のある社員がパニック状態になり、大声を出している。安全確保のためにまず何をすればよいですか？", "cat": "興奮・パニック", "st": 5, "kw": "", "body": "何の刺激がきっかけかを見る（事前に知っていれば、まずその刺激を取り除く） 刺激を減らす：音（機器を止める・周りの声を落とす）、光（照明を落とす）、人（周りの人を離し、対応は1人にする） 静かな場所へ誘導する（本人が動ける場合のみ。無理に連れて行かない） 短い言葉で端的に伝える（例：「静かな部屋に行きましょう」） 体に触れず、落ち着くまで待つ 自分や周りを傷つけそうな場合は、距離をとって応援を呼ぶ（G10-012・013） 大声で制止する、叱る、質問を重ねるのは逆効果。 パニックの理由は、落ち着いてから本人と振り返る。 本人と、苦手な刺激、パニックの前触れ、落ち着く方法、移動できる静かな場所を決めて、同意した範囲で周囲と共有しておく。 イヤーマフや座席位置など、刺激を減らす配慮を日ごろから考えておく。", "id": "G10-007"}, "G10-012": {"conclusion": "手や物が届かない距離をとり、出口側に立って逃げ道をふさがないようにします。周りの人を離し、危ない物を遠ざけて、安全を最優先にします。", "steps": ["周りの人が安全な距離をとる（手や物が届かない距離）", "出口側に立ち、自分と本人の両方の逃げ道をふさがない", "周りの人を離し、危ない物を遠ざける", "刺激しない：大声・詰め寄る・にらむ・体に触れるを避け、低く落ち着いた声で短く話す", "一人で対応せず、複数人で対応する（ただし取り囲まず、話しかけるのは1人）", "身の危険を感じたら110番"], "cautions": ["取り押さえようとしない。周りと本人の両方がけがをするおそれがある。"], "prepare": ["本人と、興奮の前触れや落ち着く方法を事前に確認し、同意した範囲で共有しておく（G10-007）。", "応援を呼ぶ方法と、駆けつける人を決めておく。"], "sources": [], "q": "他害の可能性がある興奮状態の社員に対し、周囲はどう距離を取ればよいですか？", "cat": "興奮・パニック", "st": 5, "kw": "", "body": "周りの人が安全な距離をとる（手や物が届かない距離） 出口側に立ち、自分と本人の両方の逃げ道をふさがない 周りの人を離し、危ない物を遠ざける 刺激しない：大声・詰め寄る・にらむ・体に触れるを避け、低く落ち着いた声で短く話す 一人で対応せず、複数人で対応する（ただし取り囲まず、話しかけるのは1人） 身の危険を感じたら110番 取り押さえようとしない。周りと本人の両方がけがをするおそれがある。 本人と、興奮の前触れや落ち着く方法を事前に確認し、同意した範囲で共有しておく（G10-007）。 応援を呼ぶ方法と、駆けつける人を決めておく。", "id": "G10-012"}, "G10-013": {"conclusion": "人に危険がなければ、無理に止めずに離れて見守ります。物が壊れることより、人の安全を優先し、刺激を減らして落ち着くのを待ちます。", "steps": ["本人と周囲に危険があるかを見る。物が壊れることより、人の安全を優先する", "危険がなければ、無理に止めず、離れて見守る", "周りから危ない物や投げられる物を遠ざけ、刺激（音・光・人）を減らす", "周りの人を離し、対応は少人数で行う", "本人や周囲に危険がとそうな場合は、距離をとって応援を呼ぶ（G10-012）", "落ち着いてから、本人と振り返る"], "cautions": ["パニックの最中は話が届かないことが多い。説得や注意はしない。", "振り返りでは責めるのではなく、きっかけと、次に早めに気づく方法を一緒に確認する。物の破損の扱いも、このときに落ち着いて話す。"], "prepare": ["本人と、パニックの前触れや落ち着く方法、移動できる静かな場所を決めておく（G10-007）。"], "sources": [], "q": "パニックで物に当たる・大声を出す状態になった場合、その場で止めたほうがよいですか、それとも離れて見守ったほうがよいですか？", "cat": "興奮・パニック", "st": 5, "kw": "", "body": "本人と周囲に危険があるかを見る。物が壊れることより、人の安全を優先する 危険がなければ、無理に止めず、離れて見守る 周りから危ない物や投げられる物を遠ざけ、刺激（音・光・人）を減らす 周りの人を離し、対応は少人数で行う 本人や周囲に危険がとそうな場合は、距離をとって応援を呼ぶ（G10-012） 落ち着いてから、本人と振り返る パニックの最中は話が届かないことが多い。説得や注意はしない。 振り返りでは責めるのではなく、きっかけと、次に早めに気づく方法を一緒に確認する。物の破損の扱いも、このときに落ち着いて話す。 本人と、パニックの前触れや落ち着く方法、移動できる静かな場所を決めておく（G10-007）。", "id": "G10-013"}, "G10-016": {"conclusion": "穏やかに、低めの声で、短くゆっくり話すのが基本です。「落ち着いて」の連呼や、責める言葉、理屈で説得する言葉は、かえって興奮を強めることがあります。", "steps": ["穏やかに、低めの声で、ゆっくり話す", "短く端的に、一度に一つだけ伝える", "「落ち着いて」は連呼しない。言うなら一言だけ", "気持ちを受け止める言葉をかける（例：「〇〇が嫌だったんですね」）", "次にとる行動を具体的に示す（例：「静かな部屋で少し休みましょう」）"], "steps_label": "やること", "cautions": ["否定する：「そんなことで怒らないで」", "責める・脅す：「みんな迷惑している」「このままだと困るよ」", "理由を問い詰める：「なんでそんなことするの」", "大声で話す、何人もが同時に話しかける"], "cautions_label": "避ける言葉・態度", "prepare": ["本人が落ち着きやすい言葉や方法を、平常時に確認しておく（G10-007）。"], "sources": [], "q": "興奮が収まらない社員を落ち着かせるための声かけで、避けたほうがよい言葉はありますか？", "cat": "興奮・パニック", "st": 5, "kw": "", "body": "穏やかに、低めの声で、ゆっくり話す 短く端的に、一度に一つだけ伝える 「落ち着いて」は連呼しない。言うなら一言だけ 気持ちを受け止める言葉をかける（例：「〇〇が嫌だったんですね」） 次にとる行動を具体的に示す（例：「静かな部屋で少し休みましょう」） 否定する：「そんなことで怒らないで」 責める・脅す：「みんな迷惑している」「このままだと困るよ」 理由を問い詰める：「なんでそんなことするの」 大声で話す、何人もが同時に話しかける 本人が落ち着きやすい言葉や方法を、平常時に確認しておく（G10-007）。", "id": "G10-016"}, "G10-027": {"conclusion": "その場で言い返さず、まず自分が一呼吸おきます。距離をとって短く落ち着いて応じ、興奮が続くようならその場を離れるか、応援を呼びます。", "steps": ["その場で言い返さない。まず自分が一呼吸おく", "距離をとり、短く落ち着いて応じる（例：「わかりました。少し時間を置いて話しましょう」）", "興奮が続く場合は、その場を離れるか応援を呼ぶ（G10-012）", "一人で抱えず、上司に報告する（日時と言動を記録する）", "落ち着いてから、怒りの理由を本人と確認する（上司や第三者を交えて）"], "cautions": ["言い返すと、本人をさらに興奮させるほか、本人から「ハラスメントを受けた」と受け止められ、話が広がるおそれもある。", "イラッとしたり落ち込んだりするのは自然なこと。その気持ちは、後で上司などに話してよい。", "本人から見ると、怒りの背景に、うまく伝えられない困りごとや、疲れ・不安がたまっていることがある。落ち着いてから、何に困っていたのかを聞く。"], "prepare": ["怒りを向けられた社員のケアを必ず行う。言った側に障害があるかどうかと、受けた側へのケアは分けて考える。", "「障害があるから仕方ない」と、受けた側に我慢を強いない（G12）。", "本人には、怒りをぶつける以外の伝え方（その場を離れる、上司に相談するなど）を一緒に考える。"], "prepare_label": "上司・職場が行うこと", "sources": [], "q": "障害のある社員から突然怒りをぶつけられた時、その場でどう対応すればよいですか？", "cat": "興奮・パニック", "st": 5, "kw": "", "body": "その場で言い返さない。まず自分が一呼吸おく 距離をとり、短く落ち着いて応じる（例：「わかりました。少し時間を置いて話しましょう」） 興奮が続く場合は、その場を離れるか応援を呼ぶ（G10-012） 一人で抱えず、上司に報告する（日時と言動を記録する） 落ち着いてから、怒りの理由を本人と確認する（上司や第三者を交えて） 言い返すと、本人をさらに興奮させるほか、本人から「ハラスメントを受けた」と受け止められ、話が広がるおそれもある。 イラッとしたり落ち込んだりするのは自然なこと。その気持ちは、後で上司などに話してよい。 本人から見ると、怒りの背景に、うまく伝えられない困りごとや、疲れ・不安がたまっていることがある。落ち着いてから、何に困っていたのかを聞く。 怒りを向けられた社員のケアを必ず行う。言った側に障害があるかどうかと、受けた側へのケアは分けて考える。 「障害があるから仕方ない」と、受けた側に我慢を強いない（G12）。 本人には、怒りをぶつける以外の伝え方（その場を離れる、上司に相談するなど）を一緒に考える。", "id": "G10-027"}, "G10-053": {"conclusion": "本人をその場から離して休ませ、代わりの人が顧客対応を引き継ぎます。こうした場面に備えて、交代する人と合図を前もって決めておきます。", "steps": ["本人をその場から離し、静かな場所へ移ってもらう（短い言葉で：「ここは代わります。少し休みましょう」）", "代わりの人が顧客対応を引き継ぐ", "代わりの人がいない場合は、顧客に少し待ってもらう、または日時を改めてもらう", "本人が落ち着くまで、一人にせず見守る（G10-007）", "落ち着いてから、何がきっかけだったかを本人と振り返る"], "cautions": ["顧客の前で本人を叱ったり、理由を問い詰めたりしない。", "顧客には「担当者が対応できなくなったため」など簡潔に伝え、本人の障害については説明しない（G6-047）。"], "prepare": ["顧客対応中に困ったときの合図、交代する人、移動できる場所を事前に決めておく。", "本人が苦手な対応場面（クレーム、電話の同時対応など）をつかみ、担当の割り振りを調整する。"], "sources": [], "q": "顧客対応でパニックになり対応が止まってしまった場合、その場のフォロー体制はどうあればよいですか？", "cat": "興奮・パニック", "st": 5, "kw": "", "body": "本人をその場から離し、静かな場所へ移ってもらう（短い言葉で：「ここは代わります。少し休みましょう」） 代わりの人が顧客対応を引き継ぐ 代わりの人がいない場合は、顧客に少し待ってもらう、または日時を改めてもらう 本人が落ち着くまで、一人にせず見守る（G10-007） 落ち着いてから、何がきっかけだったかを本人と振り返る 顧客の前で本人を叱ったり、理由を問い詰めたりしない。 顧客には「担当者が対応できなくなったため」など簡潔に伝え、本人の障害については説明しない（G6-047）。 顧客対応中に困ったときの合図、交代する人、移動できる場所を事前に決めておく。 本人が苦手な対応場面（クレーム、電話の同時対応など）をつかみ、担当の割り振りを調整する。", "id": "G10-053"}, "G10-008": {"conclusion": "障害の有無に関係なく、全員の緊急連絡先を入社時に登録します。体調面に不安がある人とは、本人の同意を得て、発作時の対応や主治医などを書面にしておきます。", "steps": ["全社員の緊急連絡先を登録する（入社時に。障害の有無に関係なく全員）", "体調面に不安がある社員とは、本人の同意を得て、持病・服薬・発作時などの対応方法・主治医を「緊急時シート」にまとめる", "保管場所と閲覧できる人を限定する（例：人事と直属の上司のみ）", "緊急時に、誰がどう取り出すかを決めておく（上司の不在時や時間外も含めて）", "異動時や年1回など、定期的に内容を更新する"], "steps_label": "これから整えること", "cautions": ["持病や服薬は、特に慎重な扱いが必要な個人情報。緊急時の対応に使うという目的を伝え、本人の同意を得て預かる。", "本人が書きたくない項目は、無理に求めない。", "主治医への連絡は本人の同意が原則。命に関わる緊急時は、救急隊や医療機関に必要な情報を伝える。"], "prepare": [], "sources": ["個人情報保護委員会「個人情報保護法ガイドライン」（要配慮個人情報）"], "q": "体調急変時の緊急連絡先（家族・主治医）を職場が知っていなかった。今後どう備えればよいですか？", "cat": "緊急時の備え", "st": 5, "kw": "緊急連絡先の家族と連絡が取れない場合の代替連絡先を、事前にどう整備しておくべきか。", "body": "全社員の緊急連絡先を登録する（入社時に。障害の有無に関係なく全員） 体調面に不安がある社員とは、本人の同意を得て、持病・服薬・発作時などの対応方法・主治医を「緊急時シート」にまとめる 保管場所と閲覧できる人を限定する（例：人事と直属の上司のみ） 緊急時に、誰がどう取り出すかを決めておく（上司の不在時や時間外も含めて） 異動時や年1回など、定期的に内容を更新する 持病や服薬は、特に慎重な扱いが必要な個人情報。緊急時の対応に使うという目的を伝え、本人の同意を得て預かる。 本人が書きたくない項目は、無理に求めない。 主治医への連絡は本人の同意が原則。命に関わる緊急時は、救急隊や医療機関に必要な情報を伝える。", "id": "G10-008"}, "G10-020": {"conclusion": "判断の基準を1枚のフロー図にまとめ、「安全が脅かされるおそれがあれば119番」「迷ったら呼ぶ」という原則を、研修などで前もって共有しておきます。", "steps": ["判断基準を1枚のフロー図にまとめる", "冒頭に原則を書く：「本人や周囲の安全が脅かされるおそれがあれば119番」「迷ったら呼ぶ」", "社内の専門職（産業医・保健師）への相談ルートと連絡先を入れる", "管理職の着任時や研修で説明し、職場にも掲示しておく", "実際に対応した後は振り返り、フローを更新する"], "steps_label": "これから整えること", "cautions": ["明らかに危険な症状（反応がない、呼吸がおかしいなど）は、専門職への相談を待たずに119番。", "呼んだ結果が軽症でも、判断した管理職を責めない。ためらいを生まない職場にする。"], "prepare": ["フロー図に入れる項目の例：119番を呼ぶ症状（G10-001）、迷ったときの相談先（#7119・社内の専門職、G10-005）、通報後の連絡先（人事・家族）、判断者が不在のときの代わり。"], "sources": ["総務省消防庁「救急車を呼ぶべき症状」"], "q": "119番通報が必要かどうかの判断基準を、現場の管理職に事前にどう共有しておけばよいですか？", "cat": "緊急時の備え", "st": 5, "kw": "警察・消防への通報が必要な状況とそうでない状況を、現場はどう見分ければよいか。", "body": "判断基準を1枚のフロー図にまとめる 冒頭に原則を書く：「本人や周囲の安全が脅かされるおそれがあれば119番」「迷ったら呼ぶ」 社内の専門職（産業医・保健師）への相談ルートと連絡先を入れる 管理職の着任時や研修で説明し、職場にも掲示しておく 実際に対応した後は振り返り、フローを更新する 明らかに危険な症状（反応がない、呼吸がおかしいなど）は、専門職への相談を待たずに119番。 呼んだ結果が軽症でも、判断した管理職を責めない。ためらいを生まない職場にする。 フロー図に入れる項目の例：119番を呼ぶ症状（G10-001）、迷ったときの相談先（#7119・社内の専門職、G10-005）、通報後の連絡先（人事・家族）、判断者が不在のときの代わり。", "id": "G10-020"}, "G10-021": {"conclusion": "「実際の言動の問題」と「受け取り方の違い」の両方の可能性を持ったまま、双方から別々に話を聞き、具体的な事実を確認して整理します。", "steps": ["「実際の言動の問題」と「特性による受け取り方の違い」の2つの可能性を、決めつけずに持っておく", "本人と、言ったとされる人の両方から、別々に聞き取る（目撃者がいればその人からも）", "具体的な言葉・日時・場面を、事実として確認し記録する", "本人の特性として受け取り方の違いが起こりやすいかを、本人や支援機関に確認する", "ハラスメントの可能性があれば、障害の有無に関係なく、社内のハラスメント対応の手順に沿って進める"], "steps_label": "やること", "cautions": ["ハラスメントにあたるかは、厚労省の指針で「平均的な労働者の感じ方」を基準に判断するとされている。ただし、本人が苦痛を感じたこと自体は否定しない。", "受け取り方の違いだった場合も、「本人の思い込み」で終わらせない。指示を具体的にする、文字でも伝えるなど、伝え方を見直す。", "障害特性をからかう・侮辱する言動は、それ自体がハラスメントにあたる。", "相談したことを理由に、本人を不利に扱わないようにする（法律でも禁止されている）。"], "prepare": [], "sources": ["労働施策総合推進法（パワハラ防止）", "厚生労働省「職場におけるパワーハラスメントに関して雇用管理上講ずべき措置等に関する指針」"], "q": "ハラスメントの訴えが、障害特性による受け取り方の違いなのか実際の言動の問題なのか判断が難しい。どう整理すればよいですか？", "cat": "対人トラブル・ハラスメント", "st": 5, "kw": "本人同士の言い分が食い違う対人トラブルで、事実確認はどのような手順で進めるべきか。", "body": "「実際の言動の問題」と「特性による受け取り方の違い」の2つの可能性を、決めつけずに持っておく 本人と、言ったとされる人の両方から、別々に聞き取る（目撃者がいればその人からも） 具体的な言葉・日時・場面を、事実として確認し記録する 本人の特性として受け取り方の違いが起こりやすいかを、本人や支援機関に確認する ハラスメントの可能性があれば、障害の有無に関係なく、社内のハラスメント対応の手順に沿って進める ハラスメントにあたるかは、厚労省の指針で「平均的な労働者の感じ方」を基準に判断するとされている。ただし、本人が苦痛を感じたこと自体は否定しない。 受け取り方の違いだった場合も、「本人の思い込み」で終わらせない。指示を具体的にする、文字でも伝えるなど、伝え方を見直す。 障害特性をからかう・侮辱する言動は、それ自体がハラスメントにあたる。 相談したことを理由に、本人を不利に扱わないようにする（法律でも禁止されている）。", "id": "G10-021"}, "G10-024": {"conclusion": "体調を崩している社員を守ることを先に行います。そのうえで事実を確認し、双方から別々に話を聞いて、席や業務のやり取りを工夫して接点を減らします。", "steps": ["体調を崩している社員の保護とケアを先に行う（産業医・保健師につなぐ、二人の接点を減らす）", "事実を特定する：いつ、どんな言動があったか、誰が見ていたかを記録する", "双方から別々に話を聞く。相手側にも改善できる点があれば、あわせて見直す", "行き過ぎた言動や事実と異なる批判は、障害の有無に関係なく、業務上の問題として本人に伝え、改善を求める", "なぜそうなっているのかを、本人から直接聞き、支援機関や産業医とも連携して探る", "就業規則の該当する規定を確認しておく"], "steps_label": "やること", "cautions": ["配置換えができない小さな職場でも、席の位置、業務の進め方、やり取りの経路（上司を通すなど）で接点を減らせる。", "障害を理由に問題を不問にしない。一方で、障害を理由に重く扱うこともしない。", "本人から「就業規則のどこに反するのか」と問われることもあるため、伝える前に根拠となる規定を確認しておく。"], "prepare": [], "sources": ["労働契約法 第5条（安全配慮義務）"], "q": "障害のある社員が特定の社員への批判的な言動を繰り返し、相手が体調を崩している。配置換えもできない小さな職場で、どう対応すればよいですか？", "cat": "対人トラブル・ハラスメント", "st": 5, "kw": "", "body": "体調を崩している社員の保護とケアを先に行う（産業医・保健師につなぐ、二人の接点を減らす） 事実を特定する：いつ、どんな言動があったか、誰が見ていたかを記録する 双方から別々に話を聞く。相手側にも改善できる点があれば、あわせて見直す 行き過ぎた言動や事実と異なる批判は、障害の有無に関係なく、業務上の問題として本人に伝え、改善を求める なぜそうなっているのかを、本人から直接聞き、支援機関や産業医とも連携して探る 就業規則の該当する規定を確認しておく 配置換えができない小さな職場でも、席の位置、業務の進め方、やり取りの経路（上司を通すなど）で接点を減らせる。 障害を理由に問題を不問にしない。一方で、障害を理由に重く扱うこともしない。 本人から「就業規則のどこに反するのか」と問われることもあるため、伝える前に根拠となる規定を確認しておく。", "id": "G10-024"}, "G10-025": {"conclusion": "中立の立場で、双方から別々に話を聞き、どちらが悪いかではなく、職場のルールに照らして整理します。必要に応じて、席や業務の距離をとります。", "steps": ["中立の立場で、双方から別々に話を聞く", "どちらが良い・悪いではなく、業務上のルール（就業規則や職場のルール）に照らして整理する", "判断とは別に、物理的・業務的な距離をとる（席、担当業務、やり取りの経路）", "一度話し合いの場を持ったうえで、それぞれを個別に支える", "それぞれに支援機関がいれば、本人の同意を得て連携する"], "steps_label": "やること", "cautions": ["障害のない社員同士のトラブルと、基本の対応は同じ。", "特性の違いがぶつかっていることがある（例：音に敏感な人と、声が大きくなりやすい人）。その場合は、双方の配慮の内容をあわせて見直す。", "「当事者同士で解決して」と任せきりにしない。日々のやり取りが続くと、関係が悪化しやすい。"], "prepare": [], "sources": [], "q": "障害のある社員同士でトラブルが起きた時、職場としてどう関わればよいですか？", "cat": "対人トラブル・ハラスメント", "st": 5, "kw": "対人トラブルの当事者を物理的に引き離す必要がある場合、配置転換はどの段階で検討すべきか。", "body": "中立の立場で、双方から別々に話を聞く どちらが良い・悪いではなく、業務上のルール（就業規則や職場のルール）に照らして整理する 判断とは別に、物理的・業務的な距離をとる（席、担当業務、やり取りの経路） 一度話し合いの場を持ったうえで、それぞれを個別に支える それぞれに支援機関がいれば、本人の同意を得て連携する 障害のない社員同士のトラブルと、基本の対応は同じ。 特性の違いがぶつかっていることがある（例：音に敏感な人と、声が大きくなりやすい人）。その場合は、双方の配慮の内容をあわせて見直す。 「当事者同士で解決して」と任せきりにしない。日々のやり取りが続くと、関係が悪化しやすい。", "id": "G10-025"}, "G10-026": {"conclusion": "人柄や障害ではなく、具体的な行動について、事実をもとに話します。次に同じ場面になったらどうしてほしいかを、具体的に伝えます。", "steps": ["何があったか、具体的な事実を確認して記録する", "事実をもとに本人に伝える（「〇月〇日に△△があった」）。人柄や障害ではなく、行動について話す", "期待される行動を具体的に示す（次に同じ場面になったら、何をどうしてほしいか）", "誰から、どう伝えるかを組織で決める（上司、人事、さらに上位の人、支援機関）", "その後の様子を見て支え、できたことも伝える"], "steps_label": "やること", "cautions": ["「ちゃんとして」のような抽象的な注意は伝わりにくく、本人の納得も得にくい。", "職場の外のトラブルは、業務に影響する範囲で関わる（G5-010）。", "繰り返す場合は記録を重ね、就業規則に沿った対応も考える。", "本人から見ると、トラブルのあとは「もう居場所がないのでは」と不安になっていることが多い。行動については具体的に伝えつつ、これからも一緒に働く
