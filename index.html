う業務を設計すればよいですか？", "body": "仕事探しの3つの考え方 障害者を前提にせず、「業務」から考える。誰が担えるかは、業務を出しきった後に考える 外部委託や派遣社員が担っている業務も、社内の仕事に戻す候補にする 雇用区分は総合職も含めて広く捉える。品質データの分析、作業標準書の作成、設備の保全、検査・分析など、専門性のある業務も対象にする 仕事の組み立て方 足し算：業務を作業に分け、切り出せる作業を集めて1つの仕事に組み立てる 引き算：今の職種を作業に分け、本人が苦手なことを除いて、得意な作業に集中してもらう 作業に分けるときは、準備・作業・確認や記録・片付けといった工程に分けると見つけやすい やり方を変えることも仕事づくりの一部。たとえば、週末にまとめて行っていた作業を毎日の作業に変えると、継続した仕事になる 探す範囲を広げる視点 日々の業務の流れの中で、若手社員が担っている準備や、結果の整理・集計などを代わりに担う 今は手が回っていないが、時間があれば取り組みたかった業務 業務のデジタル化にともなって、これから発生する業務（G3-015） 経験や専門性を活かせる業務。たとえば、病気で現場を離れた社員が、設備の保全や社内研修の講師を担っている例もある 配置の形も合わせて考える 1つの部署で1人分の仕事が集まらなくても、同じ部署の中で小さな業務を足し算すると、1人分に近づくことがある 各部署に1人ずつ配置するだけでなく、複数の部署から業務を集め、それを担う人を1か所（チーム）に採用・配置する方法もある（個別配置と集約型の比較はG3-009） 具体化と優先順位 「何を（What）」だけでなく「どのように（How）」まで書き出す。判断の多さ、やり取りの多さ、納期の厳しさを確認する 判断が必要な業務でも、判断の軸（基準）を決めておけば任せられることが多い。たとえば「測定値が基準値以下かを確認する」「在庫が決めた数を下回ったら発注リストに入れる」「この条件なら上司に確認する」など、基準と迷ったときの相談先をセットで示す 発生頻度（量が確保できるか）、現場の負担感、必要なスキル、会社としての成果を見て、取り組みやすく効果の大きい仕事から始める いきなり求人票から始めず、研修 → 各部署でのワークシート記入 → ヒアリングの順で、現場の不安を聞きながら合意をつくる（G1-010） 新しい仕事を作るときの注意 一時的な寄せ集めにならないよう、継続して発生する量があるかを確認する 担当する上司や、指示を出す人を決めておく 実務のチェックポイント（職域開拓） 目的の共有 障害者雇用の目的（なぜ行うか）が、経営層・人事・現場でそろっているか。法定雇用率への対応だけになっていないか 業務の具体化 受け入れ部署と業務を、採用活動の前に「何を（What）」「どのように（How）」まで具体化しているか 求人候補の整理 求人の候補を、雇用形態や採用ルートまで含めて一覧にしているか 現場の不安 現場の不安や心配を聞き取り、解決策とあわせて進めているか", "id": "G3-008"}, "G3-001": {"conclusion": "2つの方向で考えます。1つは、専門家が本来の業務に集中できるよう、その周辺にある準備や記録、資料の整理などを集めて仕事にする方向です。もう1つは、専門知識や経験を持つ人を専門職として採用し、専門業務そのものを担ってもらう方向です。「専門部署には任せられる仕事がない」と決めつけないことが大切です。", "general": [["方向1：専門家を支える業務を集める", ["専門家の1日の業務を、準備・作業・確認や記録・片付けといった工程に分け、専門知識がなくても担える部分を探す", "「この人にしかできない」と思われている業務にも、手順や判断の軸（基準）を決めれば任せられる部分がある", "専門家が後回しにしている業務や、時間があれば取り組みたかった業務も候補になる"]], ["方向2：専門職として採用する", ["専門知識や資格、職務経験のある人を、ほかの社員と同じ専門職として採用する", "理系の学生を研究開発の補助業務で採用する、ITエンジニアとして採用する、などの例がある", "病気やけがで現場を離れた社員が、経験を活かして設備の保全や社内研修の講師を担っている例もある"]], ["繁忙期と閑散期の差が大きい場合", ["繁忙期だけで見積もらず、1年を通して発生する業務を中心に組み立てる", "閑散期には、後回しになっている整理や改善の業務を組み合わせる", "1つの部署で足りなければ、ほかの部署の業務も集めて1人分にする（G3-008）"]], ["会社全体で、現場の仕事が限られている場合（建設業など）", ["現場の業務だけでなく、本社や事務所の業務も含めて、会社全体で探す", "業務の探し方に迷うときは、地域障害者職業センターや支援機関に相談する（G3-024）"]]], "q": "研究開発や設備保全など、専門性が高い部署では、どのように業務を探せばよいですか？", "cat": "仕事の切り出し", "st": 0, "kw": "施設保守や設備管理など、専門技術が中心の部署では、どこから業務を探せばよいですか？ 特定分野に精通した少人数部署で、繁忙期と閑散期の差が大きい場合、業務量はどう見積もればよいですか？ 建設業のため障がい者ができる仕事がかなり限定的ですがどうしたらよいでしょうか。", "body": "方向1：専門家を支える業務を集める 専門家の1日の業務を、準備・作業・確認や記録・片付けといった工程に分け、専門知識がなくても担える部分を探す 「この人にしかできない」と思われている業務にも、手順や判断の軸（基準）を決めれば任せられる部分がある 専門家が後回しにしている業務や、時間があれば取り組みたかった業務も候補になる 方向2：専門職として採用する 専門知識や資格、職務経験のある人を、ほかの社員と同じ専門職として採用する 理系の学生を研究開発の補助業務で採用する、ITエンジニアとして採用する、などの例がある 病気やけがで現場を離れた社員が、経験を活かして設備の保全や社内研修の講師を担っている例もある 繁忙期と閑散期の差が大きい場合 繁忙期だけで見積もらず、1年を通して発生する業務を中心に組み立てる 閑散期には、後回しになっている整理や改善の業務を組み合わせる 1つの部署で足りなければ、ほかの部署の業務も集めて1人分にする（G3-008） 会社全体で、現場の仕事が限られている場合（建設業など） 現場の業務だけでなく、本社や事務所の業務も含めて、会社全体で探す 業務の探し方に迷うときは、地域障害者職業センターや支援機関に相談する（G3-024）", "id": "G3-001"}, "G3-002": {"conclusion": "障害があることを理由に、機密情報を扱えないということはありません。ほかの社員と同じように、情報の取り扱いルールを決めて守ってもらえば、任せることができます。業務の探し方はほかの部署と同じで、業務を作業に分けて、任せられる部分を集めます。", "general": [["基本的な考え方", ["機密情報を任せられるかは、障害の有無ではなく、ルールを理解し守れるかで判断する", "秘密保持の誓約や研修は、ほかの社員と同じように行う"]], ["進め方", ["最初は機密度が比較的低い業務から始め、慣れてきたら範囲を広げる", "システムのアクセス権限は、担当する業務に必要な範囲に絞る（これはほかの社員と同じ考え方）", "判断が必要な場面は、判断の軸（基準）と、迷ったときの相談先を決めておく"]], ["ルールの伝え方の工夫", ["「何を」「誰に」「どこまで」話してよいかを、口頭だけでなく書面で具体的に示す", "書類の保管場所、持ち出し、メールの送り先の確認など、手順として決めておく", "例外を作らず、迷ったら必ず確認するルールにする"]]], "q": "人事など、機密性の高い情報を扱う部署では、どのように業務を考えればよいですか？", "cat": "仕事の切り出し", "st": 0, "kw": "", "body": "基本的な考え方 機密情報を任せられるかは、障害の有無ではなく、ルールを理解し守れるかで判断する 秘密保持の誓約や研修は、ほかの社員と同じように行う 進め方 最初は機密度が比較的低い業務から始め、慣れてきたら範囲を広げる システムのアクセス権限は、担当する業務に必要な範囲に絞る（これはほかの社員と同じ考え方） 判断が必要な場面は、判断の軸（基準）と、迷ったときの相談先を決めておく ルールの伝え方の工夫 「何を」「誰に」「どこまで」話してよいかを、口頭だけでなく書面で具体的に示す 書類の保管場所、持ち出し、メールの送り先の確認など、手順として決めておく 例外を作らず、迷ったら必ず確認するルールにする", "id": "G3-002"}, "G3-012": {"conclusion": "接客の仕事を最初から外す必要はありません。本人の得意によっては、接客そのものを担うこともできます。そのうえで、接客の前後にある準備や後片付け、店舗や施設の運営を支える業務など、お客様と直接接する時間が少ない業務を組み合わせる方法もあります。", "general": [["方向1：接客を担う", ["決まった流れで進む接客は、手順をマニュアルにすると任せやすい", "難しいお客様への対応や、判断が必要な場面は、引き継ぐ相手と方法を決めておく", "聞こえにくい人には筆談やタブレットを使うなど、伝え方を工夫すれば接客を担える場合もある"]], ["方向2：接客を支える業務を集める", ["開店前の準備や締め作業、在庫や発注の管理、予約や書類の管理など、裏方の業務を集める", "接客スタッフが接客に集中できるよう、接客の合間に行っている作業を切り出す"]], ["シフト勤務の現場", ["日勤だけなど、勤務する時間帯を固定し、その時間帯に発生する業務を集める", "勤務の時間帯や日数は、本人の体調や通院と合わせて相談して決める"]], ["現場に出ることが難しい場合（派遣業や介護の現場など）", ["各現場から本社や事務所に依頼されている事務作業を集めて、1人分の仕事にする（G3-008）", "本社が少人数でも、在宅勤務と組み合わせて業務を集める方法もある（G4-050）"]]], "q": "接客やシフト勤務が中心のサービス業の現場では、どのように業務を探せばよいですか？", "cat": "仕事の切り出し", "st": 0, "kw": "24時間交代制のシフト勤務が中心の現場では、障害者雇用の業務をどう設計すればよいですか？ 介護・福祉現場へのスタッフ派遣業で、障がいのある方を現場へ派遣することが難しく、本社も僅か6名しかおらず余裕がないため、障がい者雇用を進めることができないでいます。どうしたよいでしょうか。", "body": "方向1：接客を担う 決まった流れで進む接客は、手順をマニュアルにすると任せやすい 難しいお客様への対応や、判断が必要な場面は、引き継ぐ相手と方法を決めておく 聞こえにくい人には筆談やタブレットを使うなど、伝え方を工夫すれば接客を担える場合もある 方向2：接客を支える業務を集める 開店前の準備や締め作業、在庫や発注の管理、予約や書類の管理など、裏方の業務を集める 接客スタッフが接客に集中できるよう、接客の合間に行っている作業を切り出す シフト勤務の現場 日勤だけなど、勤務する時間帯を固定し、その時間帯に発生する業務を集める 勤務の時間帯や日数は、本人の体調や通院と合わせて相談して決める 現場に出ることが難しい場合（派遣業や介護の現場など） 各現場から本社や事務所に依頼されている事務作業を集めて、1人分の仕事にする（G3-008） 本社が少人数でも、在宅勤務と組み合わせて業務を集める方法もある（G4-050）", "id": "G3-012"}, "G3-015": {"conclusion": "業務がなくなるのではなく、形が変わると考えます。紙の入力や書類の整理が減る一方で、データの確認・修正、システムへの登録、デジタル化した情報の管理など、新しい仕事が生まれています。あわせて、デジタル化の影響を受けにくい、人の手がどうしても必要な仕事に目を向ける方法もあります。本人の得意やスキルに合わせて、2つの方向を組み合わせて仕事を組み替えていきます。", "general": [["方向1：デジタル化で新しく生まれる仕事", ["AIや読み取りソフトが出した結果の確認・修正", "システムへのデータ登録、マスタ情報の整備", "過去の紙資料や図面の電子化、ファイルの整理", "RPA（作業の自動化ツール）の運用、社内ポータルの更新"]], ["方向2：人の手が必要な仕事に目を向ける", ["現物（モノ）を扱う仕事：受け取り、仕分け、補充、組み立て、検品など", "その場に行かないとできない仕事：設備や備品の点検、職場環境の確認・整備など", "人の目や感覚で最終確認する仕事：品質や仕上がりのチェックなど", "人と直接関わる仕事：来客や社内の問い合わせへの対応、社員のサポートなど", "これらの仕事も、作業に分けて集めれば1人分の仕事になる（G3-008）"]], ["進め方", ["デジタル化を進める部署と一緒に、なくなる作業と、これから発生する作業を洗い出す", "本人の得意や希望に合わせて、方向1と方向2のどちらを中心にするかを考える", "方向1を選ぶ場合は、新しいツールの研修の機会をつくり、できる仕事の幅を広げる（G5-020）", "一度に変えず、今の業務と新しい業務を並行しながら少しずつ移す"]]], "q": "ペーパーレス化やDX・AIの導入で、障害のある社員が担当していた業務が減っています。どう新しい仕事を見つければよいですか？", "cat": "仕事の切り出し", "st": 0, "kw": "", "body": "方向1：デジタル化で新しく生まれる仕事 AIや読み取りソフトが出した結果の確認・修正 システムへのデータ登録、マスタ情報の整備 過去の紙資料や図面の電子化、ファイルの整理 RPA（作業の自動化ツール）の運用、社内ポータルの更新 方向2：人の手が必要な仕事に目を向ける 現物（モノ）を扱う仕事：受け取り、仕分け、補充、組み立て、検品など その場に行かないとできない仕事：設備や備品の点検、職場環境の確認・整備など 人の目や感覚で最終確認する仕事：品質や仕上がりのチェックなど 人と直接関わる仕事：来客や社内の問い合わせへの対応、社員のサポートなど これらの仕事も、作業に分けて集めれば1人分の仕事になる（G3-008） 進め方 デジタル化を進める部署と一緒に、なくなる作業と、これから発生する作業を洗い出す 本人の得意や希望に合わせて、方向1と方向2のどちらを中心にするかを考える 方向1を選ぶ場合は、新しいツールの研修の機会をつくり、できる仕事の幅を広げる（G5-020） 一度に変えず、今の業務と新しい業務を並行しながら少しずつ移す", "id": "G3-015"}, "G3-009": {"conclusion": "どちらにも長所と短所があり、会社の規模、業務の内容、支援できる体制で判断します。両方を組み合わせる会社も多く、まず集約型で経験や工夫をため、その後に各部署への個別配置に広げていく、という段階的な進め方もあります。", "general": [["個別配置（各部署に1人ずつなど）", ["長所：さまざまな部署の業務を担え、周囲の社員の理解が広がりやすい", "短所：部署ごとに支援の体制が必要で、受け入れ部署の負担が偏りやすい"]], ["集約型（専門のチームや特例子会社など）", ["長所：支援の担当者を置きやすく、経験や工夫がたまりやすい。各部署から業務を集めて仕事を安定させやすい", "短所：ほかの部署との関わりが少なくなり、障害者雇用への理解が会社全体に広がりにくい"]], ["個別配置が向いている場合", ["各部署に、1人分に近い業務量がある", "受け入れ部署に、指示や相談を担える人を置ける", "本人が、一般の社員と一緒に働く環境で力を発揮しやすい", "すでに障害者雇用の経験があり、社内に受け入れの工夫がたまっている"]], ["集約型が向いている場合", ["1つの部署では1人分の業務量が集まらず、複数の部署から集める必要がある", "各部署に支援を担える人を置くのが難しい", "採用人数が多く、まとまった体制で育成や支援をしたい", "障害者雇用を始めたばかりで、社内に経験や工夫が少ない"]], ["少しずつ進める方法（集約型 → 個別配置）", ["ステップ1：集約型のチームで、各部署から集めた業務を担う。支援の担当者のもとで、仕事の進め方や配慮の経験や工夫をためる", "ステップ2：チームで業務に慣れ、力をつけた人から、業務を依頼していた部署などへ個別に配置する", "ステップ3：チームは、新しく入社した人の受け入れと育成の場として続ける", "各部署はチームとのやり取りを通じて障害のある社員と関わるため、個別配置の受け入れ準備にもなる", "異動するかどうかは本人の希望と適性を確認して決め、異動後もしばらくはチームの担当者が相談に乗れるようにする"]]], "q": "障害のある社員を各部署に配置する「個別配置」と、1か所に集める「集約型」のどちらで進めればよいですか？", "cat": "仕事の切り出し", "st": 0, "kw": "", "body": "個別配置（各部署に1人ずつなど） 長所：さまざまな部署の業務を担え、周囲の社員の理解が広がりやすい 短所：部署ごとに支援の体制が必要で、受け入れ部署の負担が偏りやすい 集約型（専門のチームや特例子会社など） 長所：支援の担当者を置きやすく、経験や工夫がたまりやすい。各部署から業務を集めて仕事を安定させやすい 短所：ほかの部署との関わりが少なくなり、障害者雇用への理解が会社全体に広がりにくい 個別配置が向いている場合 各部署に、1人分に近い業務量がある 受け入れ部署に、指示や相談を担える人を置ける 本人が、一般の社員と一緒に働く環境で力を発揮しやすい すでに障害者雇用の経験があり、社内に受け入れの工夫がたまっている 集約型が向いている場合 1つの部署では1人分の業務量が集まらず、複数の部署から集める必要がある 各部署に支援を担える人を置くのが難しい 採用人数が多く、まとまった体制で育成や支援をしたい 障害者雇用を始めたばかりで、社内に経験や工夫が少ない 少しずつ進める方法（集約型 → 個別配置） ステップ1：集約型のチームで、各部署から集めた業務を担う。支援の担当者のもとで、仕事の進め方や配慮の経験や工夫をためる ステップ2：チームで業務に慣れ、力をつけた人から、業務を依頼していた部署などへ個別に配置する ステップ3：チームは、新しく入社した人の受け入れと育成の場として続ける 各部署はチームとのやり取りを通じて障害のある社員と関わるため、個別配置の受け入れ準備にもなる 異動するかどうかは本人の希望と適性を確認して決め、異動後もしばらくはチームの担当者が相談に乗れるようにする", "id": "G3-009"}, "G3-024": {"conclusion": "仕事の内容を見てもらい、障害のある社員が担えるようにするための助言は、公的機関に無料で相談できます。地域障害者職業センターやハローワークのほか、職場に出向いて支援するジョブコーチも活用できます。継続的に必要な場合は、自社の社員がジョブコーチの研修を受けて、社内で支援する方法もあります。", "general": [["主な相談先", ["地域障害者職業センター：職務の選定、作業の進め方、受け入れ体制づくりの助言（G8-017）", "ジョブコーチ（職場適応援助者）：職場に出向き、本人への作業指導や、上司・同僚への教え方の助言を行う。地域障害者職業センターに相談すると利用できる（G1-048）", "ハローワーク：募集・採用、職務の選定、受け入れ体制の整備についての相談", "JEED「就労支援機器貸出・相談窓口」：作業を助ける機器の貸出しと使い方の相談（G4-035）"]], ["自社でジョブコーチを育てる", ["障害のある社員が増える、継続的に支援が必要になる、といった場合は、自社の社員が「企業在籍型ジョブコーチ」の養成研修を受ける方法もある（G8-026）", "社内にジョブコーチがいると、仕事の切り出しや教え方の工夫を、社内で続けやすくなる。配置には助成金が使える場合がある（G1-033）"]], ["相談するときに準備するもの", ["部署ごとの業務の一覧と、それぞれの手順・頻度・量", "見てほしい作業の具体的な内容（写真や手順書があるとよい）", "これまでに考えたことと、うまくいかなかった点"]]], "links": [["厚生労働省 関係施設とサービスの概要（PDF）", "https://www.mhlw.go.jp/content/000653513.pdf"]], "q": "仕事の内容を見てもらい、障害のある社員が担えるようにするための助言を受けたい。どこに相談できますか？", "cat": "仕事の切り出し", "st": 0, "kw": "自社の業務の選定を手伝ってほしい", "body": "主な相談先 地域障害者職業センター：職務の選定、作業の進め方、受け入れ体制づくりの助言（G8-017） ジョブコーチ（職場適応援助者）：職場に出向き、本人への作業指導や、上司・同僚への教え方の助言を行う。地域障害者職業センターに相談すると利用できる（G1-048） ハローワーク：募集・採用、職務の選定、受け入れ体制の整備についての相談 JEED「就労支援機器貸出・相談窓口」：作業を助ける機器の貸出しと使い方の相談（G4-035） 自社でジョブコーチを育てる 障害のある社員が増える、継続的に支援が必要になる、といった場合は、自社の社員が「企業在籍型ジョブコーチ」の養成研修を受ける方法もある（G8-026） 社内にジョブコーチがいると、仕事の切り出しや教え方の工夫を、社内で続けやすくなる。配置には助成金が使える場合がある（G1-033） 相談するときに準備するもの 部署ごとの業務の一覧と、それぞれの手順・頻度・量 見てほしい作業の具体的な内容（写真や手順書があるとよい） これまでに考えたことと、うまくいかなかった点", "id": "G3-024"}, "G3-004": {"conclusion": "「この障害ならこの仕事」と決まっているわけではありません。得意・不得意は一人ひとり違うので、障害名ではなく、本人の特性と業務の特徴（判断の多さ、やり取りの多さ、納期の厳しさ）を照らし合わせて決めます。実際の企業では、専門職から製造現場まで、さまざまな形で障害のある社員が活躍しています（下の表）。", "general": [["業務の特徴から考える", ["判断：基準や手順が決まっている業務か、自分で判断する業務か。判断が必要でも、判断の軸（基準）を決めれば任せられることが多い", "やり取り：一人で完結するか、人とのやり取りが多いか", "納期：自分のペースで進められるか、急ぎの対応が多いか", "本人の特性と照らし合わせ、合う業務を選ぶ。合わない要素は、配慮や業務の分け方で補えることもある"]], ["企業での活躍のタイプと、障害の種類ごとの特性（下の表）", ["1つ目の表は、企業の取り組み事例を5つのタイプに整理したもの。「主な対象」は、そのタイプで多く見られる障害の種類の傾向です", "ほかの障害のある人が担っている例も多くあります。障害の種類で仕事を決めるのではなく、一人ひとりの得意や経験を確認して考えます", "2つ目の表は、障害の種類ごとの特性、業務で困りやすいこと、配慮の例をまとめたもの。障害の種類ごとの詳しい特性と配慮は、G1-073（発達障害）、G1-072（てんかん）、G1-074（高次脳機能障害）、G6-099（視覚障害）なども参照"]], ["他社の例を調べるには", ["JEED「障害者雇用事例リファレンスサービス」で、業種や障害の種類から検索できる（G5-016）"]]], "charts": [{"type": "table", "title": "障害のある社員の活躍のタイプと、主な対象", "head": ["タイプ", "業務のイメージ", "主な対象（傾向）"], "rows": [["A 経験者型", "これまでの専門性や職務経験が、会社の業務に合う形で採用。領域は会社によってさまざま", "身体（肢体不自由、内部障害）"], ["B 専門職型", "理系の学生などを対象にした研究開発の補助業務（データの分析など）、ITエンジニアなど", "身体、発達"], ["C 間接部門型", "人事・総務・経理などの業務を切り出して担う（書類やデータの管理、発送の準備など）", "精神、発達、（知的）"], ["D 製造現場型", "組み立て、加工、品質検査、部品交換など、各工程に特化して担う", "知的、発達、身体（聴覚）"], ["E 清掃・メンテナンス型", "オフィスや工場の清掃、社用車の清掃や日常点検など。数人のチームで担うことが多い", "知的、精神、発達"]], "note": "「主な対象」は傾向であり、障害の種類で仕事が決まるものではありません。"}, {"type": "table", "title": "障害の種類ごとの特性と、業務で困りやすいこと・配慮の例", "head": ["障害の種類", "主な特性", "業務で困りやすいこと", "配慮の例"], "rows": [["視覚障害", "見る力が弱い（弱視）、または見えない（全盲）", "移動、文字や画面など目で見る情報の処理", "声のかけ方や誘導の工夫、音声読み上げソフトの活用、混雑を避けた勤務時間"], ["聴覚障害", "聞こえない、または聞こえにくい", "口頭でのやり取り、会議", "手話・筆談・口話など伝え方を合わせる、音声を文字にするアプリ、議事録やメールでの指示"], ["音声・言語障害", "言葉で表現することが難しい", "話すことが中心の業務", "落ち着いて話を聞く姿勢、文字でのやり取り"], ["肢体不自由", "手足や体幹に障害がある", "移動、荷物の持ち上げや運搬", "移動や作業のしやすい場所への配置、バリアフリーな環境、時差出勤や車通勤"], ["内部障害", "心臓・腎臓などの臓器や、免疫の機能に障害がある", "体力面の不安、温度や湿度の変化、体調の悪化", "体力を考えた業務配分、温度・湿度の管理、通院や在宅勤務を考えた勤務体系"], ["知的障害", "知的な発達に遅れがある（できることには個人差が大きい）", "言葉の理解や表現、想定外のことへの対応", "作業の工程を細かく分ける、手順を写真や図で見える化する、指導や相談の担当者を決める"], ["精神障害", "うつ病、統合失調症、不安障害など。気分や体調に波がある", "疲れやすさによる勤務の不安定さ、新しいことへの不安", "定期的な面談で体調を確認、休憩の取り方や短時間勤務、通院の時間の確保、手順を決める"], ["発達障害", "ASD・ADHD・LDなど。得意と苦手の差が大きい", "やり取りのすれ違い、臨機応変な対応や同時進行、ミス", "具体的な指示、ルールや段取りの見える化、得意に合わせた業務、刺激の少ない環境"]], "note": "同じ障害でも特性や困りごとは一人ひとり違い、障害の種類が違っても困りごとが共通することも多くあります。本人に確認しながら配慮を決めます。"}], "links": [["JEED 障害者雇用事例リファレンスサービス", "https://www.ref.jeed.go.jp/index.html"]], "q": "障害のある人には、どのような業務が向いていますか？", "cat": "向いている業務と任せ方", "st": 0, "kw": "現場から「発達障害の特性を活かせる業務は何か」と聞かれた場合、どう答えればよいですか？ 会社の業務内容を考えると、精神障がい者、発達障がい者向けの仕事がありません。どうすればよいでしょうか。 繰り返しの作業であれば障害のある方の業務にすることができますか 障害者雇用ではどのような業務を任せられますか？ 「強みを活かせる仕事で」と本人や支援機関から言われますが、具体的にどんな業務をお願いすれば良いのか分からず困っています。 業務の選定をうまくやっている事例を知りたい 会社全体で業務の選定を考えたいのですが、他社では障害のある社員はどのような業務を担っているのでしょうか", "body": "業務の特徴から考える 判断：基準や手順が決まっている業務か、自分で判断する業務か。判断が必要でも、判断の軸（基準）を決めれば任せられることが多い やり取り：一人で完結するか、人とのやり取りが多いか 納期：自分のペースで進められるか、急ぎの対応が多いか 本人の特性と照らし合わせ、合う業務を選ぶ。合わない要素は、配慮や業務の分け方で補えることもある 企業での活躍のタイプと、障害の種類ごとの特性（下の表） 1つ目の表は、企業の取り組み事例を5つのタイプに整理したもの。「主な対象」は、そのタイプで多く見られる障害の種類の傾向です ほかの障害のある人が担っている例も多くあります。障害の種類で仕事を決めるのではなく、一人ひとりの得意や経験を確認して考えます 2つ目の表は、障害の種類ごとの特性、業務で困りやすいこと、配慮の例をまとめたもの。障害の種類ごとの詳しい特性と配慮は、G1-073（発達障害）、G1-072（てんかん）、G1-074（高次脳機能障害）、G6-099（視覚障害）なども参照 他社の例を調べるには JEED「障害者雇用事例リファレンスサービス」で、業種や障害の種類から検索できる（G5-016） 障害のある社員の活躍のタイプと、主な対象 A 経験者型 これまでの専門性や職務経験が、会社の業務に合う形で採用。領域は会社によってさまざま 身体（肢体不自由、内部障害） B 専門職型 理系の学生などを対象にした研究開発の補助業務（データの分析など）、ITエンジニアなど 身体、発達 C 間接部門型 人事・総務・経理などの業務を切り出して担う（書類やデータの管理、発送の準備など） 精神、発達、（知的） D 製造現場型 組み立て、加工、品質検査、部品交換など、各工程に特化して担う 知的、発達、身体（聴覚） E 清掃・メンテナンス型 オフィスや工場の清掃、社用車の清掃や日常点検など。数人のチームで担うことが多い 知的、精神、発達 障害の種類ごとの特性と、業務で困りやすいこと・配慮の例 視覚障害 見る力が弱い（弱視）、または見えない（全盲） 移動、文字や画面など目で見る情報の処理 声のかけ方や誘導の工夫、音声読み上げソフトの活用、混雑を避けた勤務時間 聴覚障害 聞こえない、または聞こえにくい 口頭でのやり取り、会議 手話・筆談・口話など伝え方を合わせる、音声を文字にするアプリ、議事録やメールでの指示 音声・言語障害 言葉で表現することが難しい 話すことが中心の業務 落ち着いて話を聞く姿勢、文字でのやり取り 肢体不自由 手足や体幹に障害がある 移動、荷物の持ち上げや運搬 移動や作業のしやすい場所への配置、バリアフリーな環境、時差出勤や車通勤 内部障害 心臓・腎臓などの臓器や、免疫の機能に障害がある 体力面の不安、温度や湿度の変化、体調の悪化 体力を考えた業務配分、温度・湿度の管理、通院や在宅勤務を考えた勤務体系 知的障害 知的な発達に遅れがある（できることには個人差が大きい） 言葉の理解や表現、想定外のことへの対応 作業の工程を細かく分ける、手順を写真や図で見える化する、指導や相談の担当者を決める 精神障害 うつ病、統合失調症、不安障害など。気分や体調に波がある 疲れやすさによる勤務の不安定さ、新しいことへの不安 定期的な面談で体調を確認、休憩の取り方や短時間勤務、通院の時間の確保、手順を決める 発達障害 ASD・ADHD・LDなど。得意と苦手の差が大きい やり取りのすれ違い、臨機応変な対応や同時進行、ミス 具体的な指示、ルールや段取りの見える化、得意に合わせた業務、刺激の少ない環境", "id": "G3-004"}, "G3-006": {"conclusion": "得意・不得意は、本人の特性だけで決まるものではなく、環境や条件によって変わります。そのため「できる・できない」ではなく、「どんな条件ならできるか」を見極めることが大切です。本人の話を聞くことと、実際の仕事ぶりを観察することの両方で確かめ、小さな作業から任せて、できることを少しずつ広げていきます。", "general": [["得意・不得意は環境で変わる", ["同じ特性でも、環境によって強みとして発揮されることもあれば、苦手として現れることもある（例：急な予定変更が苦手でも、ルールが明確な職場では力を発揮する）", "見極めるのは「何ができないか」ではなく、「どんな指示の出し方、手順、環境なら力を発揮できるか」という条件", "苦手が見えたときは、本人の力不足と決めつけず、指示の出し方や作業の分け方など、条件を変えられないかを考える"]], ["見極め方", ["本人に聞く：得意なこと、苦手なこと、これまでうまくいった工夫", "本人が持ってきたシートを活用する：支援機関などで作った、得意・苦手や必要な配慮をまとめた個人のシートがあれば、入社時に共有してもらう", "支援機関の情報を参考にする：訓練中の様子や評価の結果など（本人の同意を得て）", "実際にやってもらう：職場実習や入社後の最初の数週間を「見極めと調整の期間」と考え、いくつかの作業を試してもらう", "見るポイントを決めて観察する：正確さ、速さ、指示の理解、集中の続き方、疲れ方、急な変更への対応など"]], ["任せるのが不安なとき", ["作業を小さく分け、まず1つから任せる", "手順を一緒に確認し、最初は途中で確認する回数を多くする", "不安の中身（ミスが心配、教え方が分からない、体調が心配など）を分けて、それぞれに対策を考える", "できたことを本人に伝え、少しずつ任せる範囲を広げる", "任せる前から「できないだろう」と決めつけない（思い込みに気をつける）"]], ["一度で決めつけない", ["観察した結果は記録し、上司一人の印象ではなく、複数の目で確認する", "ミスは「できない証拠」ではなく、やり方を調整する材料と考える（G10-048）", "経験を積んで伸びることも多いので、定期的に見直し、配慮事項の書面に反映する（G5-023）"]]], "q": "障害のある社員の得意・不得意を見極めるコツはありますか？仕事を任せるのが不安なときはどうすればよいですか？", "cat": "向いている業務と任せ方", "st": 0, "kw": "業務遂行能力に不安を感じてしまい、なかなか仕事を任せることができません。どのように関わり、業務を依頼していけばよいでしょうか？", "body": "得意・不得意は環境で変わる 同じ特性でも、環境によって強みとして発揮されることもあれば、苦手として現れることもある（例：急な予定変更が苦手でも、ルールが明確な職場では力を発揮する） 見極めるのは「何ができないか」ではなく、「どんな指示の出し方、手順、環境なら力を発揮できるか」という条件 苦手が見えたときは、本人の力不足と決めつけず、指示の出し方や作業の分け方など、条件を変えられないかを考える 見極め方 本人に聞く：得意なこと、苦手なこと、これまでうまくいった工夫 本人が持ってきたシートを活用する：支援機関などで作った、得意・苦手や必要な配慮をまとめた個人のシートがあれば、入社時に共有してもらう 支援機関の情報を参考にする：訓練中の様子や評価の結果など（本人の同意を得て） 実際にやってもらう：職場実習や入社後の最初の数週間を「見極めと調整の期間」と考え、いくつかの作業を試してもらう 見るポイントを決めて観察する：正確さ、速さ、指示の理解、集中の続き方、疲れ方、急な変更への対応など 任せるのが不安なとき 作業を小さく分け、まず1つから任せる 手順を一緒に確認し、最初は途中で確認する回数を多くする 不安の中身（ミスが心配、教え方が分からない、体調が心配など）を分けて、それぞれに対策を考える できたことを本人に伝え、少しずつ任せる範囲を広げる 任せる前から「できないだろう」と決めつけない（思い込みに気をつける） 一度で決めつけない 観察した結果は記録し、上司一人の印象ではなく、複数の目で確認する ミスは「できない証拠」ではなく、やり方を調整する材料と考える（G10-048） 経験を積んで伸びることも多いので、定期的に見直し、配慮事項の書面に反映する（G5-023）", "id": "G3-006"}, "G3-005": {"conclusion": "仕事の広げ方には、難しさを上げる「縦」、別の業務を増やす「横」、教える・改善するなどの「役割」の3つの方向があります。今の業務が安定してできているかを確認したうえで、本人の希望と得意を聞き、合う方向を選んで少しずつ広げていきます。判断が必要な業務も、判断の軸（基準）と相談先を決めておけば任せられます。", "general": [["広げ方の3つの方向", ["縦に広げる：同じ業務の中で難しさを上げる（作業 → 確認・チェック → 改善の提案 など）", "横に広げる：同じくらいの難しさで、別の部署や別の種類の業務を増やす", "役割を広げる：マニュアルづくり、後から入った人への教え方、業務の改善など", "本人の得意や希望によって、合う方向は違う。どの方向に広げたいかを本人と話し合って決める"]], ["判断を伴う業務へ広げる工夫", ["判断が必要な業務でも、判断の軸（基準）を決めておけば任せられることが多い（G3-008）", "「この条件ならこうする」「この場合は上司に確認する」と、基準と相談先をセットで示す", "最初は判断の結果を一緒に確認し、ずれがなくなってきたら任せる範囲を広げる"]], ["進め方", ["今の業務の正確さや速さ、安定度を確認する", "本人に、やってみたい業務や興味のあることを聞く（G5-003）", "今の業務とつながりのある業務から広げる", "新しい業務の手順書を用意し、最初は一緒にやって見せる", "できるようになったことを評価に反映する（G5-020）"]], ["障害特性に合わせた工夫", ["聴覚障害のある社員なら、指示や会議の内容を文字で伝える仕組みを整えれば、できる業務の幅が広がる（G6-028）", "新しい業務が負担になっていないか、定着面談で確認する"]]], "q": "事務補助など、今の仕事の範囲を広げていくには、どう進めればよいですか？", "cat": "向いている業務と任せ方", "st": 0, "kw": "部下に聴覚障害のある方がいるが、新しい仕事を検討していきたい", "body": "広げ方の3つの方向 縦に広げる：同じ業務の中で難しさを上げる（作業 → 確認・チェック → 改善の提案 など） 横に広げる：同じくらいの難しさで、別の部署や別の種類の業務を増やす 役割を広げる：マニュアルづくり、後から入った人への教え方、業務の改善など 本人の得意や希望によって、合う方向は違う。どの方向に広げたいかを本人と話し合って決める 判断を伴う業務へ広げる工夫 判断が必要な業務でも、判断の軸（基準）を決めておけば任せられることが多い（G3-008） 「この条件ならこうする」「この場合は上司に確認する」と、基準と相談先をセットで示す 最初は判断の結果を一緒に確認し、ずれがなくなってきたら任せる範囲を広げる 進め方 今の業務の正確さや速さ、安定度を確認する 本人に、やってみたい業務や興味のあることを聞く（G5-003） 今の業務とつながりのある業務から広げる 新しい業務の手順書を用意し、最初は一緒にやって見せる できるようになったことを評価に反映する（G5-020） 障害特性に合わせた工夫 聴覚障害のある社員なら、指示や会議の内容を文字で伝える仕組みを整えれば、できる業務の幅が広がる（G6-028） 新しい業務が負担になっていないか、定着面談で確認する", "id": "G3-005"}, "G4-002": {"conclusion": "まず、障害のある社員を支えるために必要な「機能」を決めます。主に、日常の相談役、業務を指示する人、勤務や配慮を決める人の3つです。そのうえで、それぞれの機能を社内の誰が担うかを決め、社内で足りない部分は外部の支援機関を活用して補います。小さな組織では専任の担当者がいなくても、この形で体制をつくれます。", "general": [["① 必要な機能を決める", ["日常の相談役：困ったときに本人が気軽に相談できる人（現場の先輩など）", "業務を指示する人：仕事の指示を出し、進み具合を確認する人。指示を出す人は一人に決めると、本人が混乱しにくい", "勤務や配慮を決める人：勤務時間や配慮の内容を判断する人（上司、社長など）", "小さな組織では、1人が複数の機能を兼ねてもよい。ただし、相談役と評価をする人は分けたほうが、本人が相談しやすい"]], ["② 社内で担う人を決める", ["それぞれの機能を、誰が担うかを決めて本人に伝える", "担当の人が不在のときの代わりの人も決めておく", "配慮の内容を書面にして、担当が替わっても対応がぶれないようにする（G5-023）"]], ["③ 社外の支援機関を活用する", ["社内で担いきれない部分は、支援機関（就労移行支援事業所、障害者就業・生活支援センター、ジョブコーチなど）の力を借りる（G8-010）", "たとえば、生活面の相談や体調の変化への対応、仕事の教え方の助言などは、支援機関と分担できる", "定期的に連絡を取り合い、外部の支えを体制の一部として組み込む"]], ["一人に業務や支援が集中しているとき", ["今の担当業務と支援の負担を書き出し、ほかの人や支援機関に分けられるものを分ける", "担当者自身の相談先を決め、定期的に負担を確認する（G12-006）"]]], "q": "20名程度の小さな組織で、障害者雇用を支える体制をどう作ればよいですか？専任の担当者を置けない場合は？", "cat": "受け入れ体制", "st": 2, "kw": "障害のある社員に対する担当者を配置できない場合、具体的な配置部署はどのようにすればよいでしょうか 既に障害のある社員が1人で担当業務を抱えている状態を改善するには、どうすればよいですか？", "body": "① 必要な機能を決める 日常の相談役：困ったときに本人が気軽に相談できる人（現場の先輩など） 業務を指示する人：仕事の指示を出し、進み具合を確認する人。指示を出す人は一人に決めると、本人が混乱しにくい 勤務や配慮を決める人：勤務時間や配慮の内容を判断する人（上司、社長など） 小さな組織では、1人が複数の機能を兼ねてもよい。ただし、相談役と評価をする人は分けたほうが、本人が相談しやすい ② 社内で担う人を決める それぞれの機能を、誰が担うかを決めて本人に伝える 担当の人が不在のときの代わりの人も決めておく 配慮の内容を書面にして、担当が替わっても対応がぶれないようにする（G5-023） ③ 社外の支援機関を活用する 社内で担いきれない部分は、支援機関（就労移行支援事業所、障害者就業・生活支援センター、ジョブコーチなど）の力を借りる（G8-010） たとえば、生活面の相談や体調の変化への対応、仕事の教え方の助言などは、支援機関と分担できる 定期的に連絡を取り合い、外部の支えを体制の一部として組み込む 一人に業務や支援が集中しているとき 今の担当業務と支援の負担を書き出し、ほかの人や支援機関に分けられるものを分ける 担当者自身の相談先を決め、定期的に負担を確認する（G12-006）", "id": "G4-002"}, "G4-001": {"conclusion": "同じ係に複数いることには、仲間がいる安心感や、経験や工夫がたまるといった良い面があります。そのうえで、一人ひとり特性も必要な配慮も違うので、「障害のある社員」としてまとめて扱わず、個別に関わることが基本です。配慮が人によって違うことで不公平感が生まれないよう、理由を説明できるようにしておきます。", "general": [["複数いることの良い面", ["同じ立場の仲間がいて、相談し合えたり、安心して働けたりする", "受け入れや配慮の経験や工夫が、係の中にたまる", "業務をチームで分担でき、誰かが休んだときもカバーしやすい"]], ["気をつけること", ["配慮や指示の出し方は、一人ひとりに合わせる。同じ障害の種類でも必要な配慮は違う（G6-124）", "本人どうしで配慮の内容が違うことについて、説明を求められたら「それぞれの困りごとに合わせている」と伝える", "一人の配慮が、もう一人の負担にならないか確認する（例：音への配慮と、声で確認したい人の配慮がぶつかる）（G6-087）", "面談はそれぞれ個別に行う"]], ["本人どうしの関わり方", ["先輩が後輩に仕事を教える役割を担うと、先輩本人の成長や自信にもつながる", "ただし、支援や相談の役割まで本人に任せきりにしない。困りごとの相談は、上司や相談役が受ける", "障害の内容や配慮などの個人的な情報を、本人どうしで共有するかどうかは、それぞれの同意による"]], ["障害のある社員どうしのトラブル", ["障害の有無に関係なく、社員どうしのトラブルとして、事実を確認して対応する（G10-038）", "特性によって受け止め方が違うことがあるので、双方から個別に話を聞く"]]], "q": "障害のある社員が同じ係に複数いる場合、上司として何に気をつければよいですか？", "cat": "受け入れ体制", "st": 2, "kw": "障害者同士のトラブルは発生しませんか？", "body": "複数いることの良い面 同じ立場の仲間がいて、相談し合えたり、安心して働けたりする 受け入れや配慮の経験や工夫が、係の中にたまる 業務をチームで分担でき、誰かが休んだときもカバーしやすい 気をつけること 配慮や指示の出し方は、一人ひとりに合わせる。同じ障害の種類でも必要な配慮は違う（G6-124） 本人どうしで配慮の内容が違うことについて、説明を求められたら「それぞれの困りごとに合わせている」と伝える 一人の配慮が、もう一人の負担にならないか確認する（例：音への配慮と、声で確認したい人の配慮がぶつかる）（G6-087） 面談はそれぞれ個別に行う 本人どうしの関わり方 先輩が後輩に仕事を教える役割を担うと、先輩本人の成長や自信にもつながる ただし、支援や相談の役割まで本人に任せきりにしない。困りごとの相談は、上司や相談役が受ける 障害の内容や配慮などの個人的な情報を、本人どうしで共有するかどうかは、それぞれの同意による 障害のある社員どうしのトラブル 障害の有無に関係なく、社員どうしのトラブルとして、事実を確認して対応する（G10-038） 特性によって受け止め方が違うことがあるので、双方から個別に話を聞く", "id": "G4-001"}, "G4-003": {"conclusion": "上司の交代は、障害のある社員にとって大きな環境の変化です。これまでの配慮や関わり方、伝え方の工夫、調子を崩すサインを、書面と引き継ぎの場で確実に伝えることが第一です。本人には前もって交代を伝え、新しい上司が一人で抱えないよう、人事や前任者、支援機関が支える体制をつくります。", "general": [["上司の交代は、本人にとって大きな変化", ["特性によっては、環境の変化や先の見通しが立たない状況が、大きな負担になる", "いつ、誰に替わるかを、前もって本人に伝える", "新しい上司を事前に紹介し、できれば前任者と重なる期間をつくる"]], ["伝え方の工夫も引き継ぐ", ["口頭か文字か、どんな言い方が伝わりやすいか、どのくらいの頻度で確認していたかなど、これまでうまくいっていた伝え方の工夫を引き継ぐ", "こうした工夫は書面に残りにくいが、本人が安定して働けていた理由になっていることが多い", "伝え方が急に変わることが、不調のきっかけになることもある"]], ["調子を崩すサインを共有する", ["サインと、そのときの対処を、前任者から具体的に聞いておく", "交代後しばらくは、面談の回数を増やす（G5-024）", "交代直後の不調は、能力の問題ではなく「変化への反応」の場合がある"]], ["進め方", ["前任者から、配慮の内容、本人の得意・不得意を引き継ぐ（G6-003、G5-023）", "書面にない配慮が「当たり前」になっていないか、逆にもう必要ない配慮がないかを、本人と一緒に見直す", "最初の面談は、人事や前任者が同席して、本人と新しい上司の関係づくりを支える", "新しい上司が困ったときの相談先（人事、支援機関）を決めておく", "本人が新しい上司に言い出しにくいこともあるので、人事や支援機関を通じて本人の声を拾える経路を残しておく"]], ["長く勤めている社員だからこそ", ["本人のほうが業務に詳しいことも多い。業務のことは本人に教えてもらう姿勢でよい", "慣れた働き方を急に変えない。変える場合は理由を説明し、少しずつ進める", "年齢による体力の変化や、障害の状態の変化が起きていることもある。交代を機に、働き方全体を見直す"]]], "q": "若い上司や異動してきたばかりの上司が、長く勤めている障害のある社員の担当に慣れていない場合、どう進めればよいですか？", "cat": "受け入れ体制", "st": 2, "kw": "", "body": "上司の交代は、本人にとって大きな変化 特性によっては、環境の変化や先の見通しが立たない状況が、大きな負担になる いつ、誰に替わるかを、前もって本人に伝える 新しい上司を事前に紹介し、できれば前任者と重なる期間をつくる 伝え方の工夫も引き継ぐ 口頭か文字か、どんな言い方が伝わりやすいか、どのくらいの頻度で確認していたかなど、これまでうまくいっていた伝え方の工夫を引き継ぐ こうした工夫は書面に残りにくいが、本人が安定して働けていた理由になっていることが多い 伝え方が急に変わることが、不調のきっかけになることもある 調子を崩すサインを共有する サインと、そのときの対処を、前任者から具体的に聞いておく 交代後しばらくは、面談の回数を増やす（G5-024） 交代直後の不調は、能力の問題ではなく「変化への反応」の場合がある 進め方 前任者から、配慮の内容、本人の得意・不得意を引き継ぐ（G6-003、G5-023） 書面にない配慮が「当たり前」になっていないか、逆にもう必要ない配慮がないかを、本人と一緒に見直す 最初の面談は、人事や前任者が同席して、本人と新しい上司の関係づくりを支える 新しい上司が困ったときの相談先（人事、支援機関）を決めておく 本人が新しい上司に言い出しにくいこともあるので、人事や支援機関を通じて本人の声を拾える経路を残しておく 長く勤めている社員だからこそ 本人のほうが業務に詳しいことも多い。業務のことは本人に教えてもらう姿勢でよい 慣れた働き方を急に変えない。変える場合は理由を説明し、少しずつ進める 年齢による体力の変化や、障害の状態の変化が起きていることもある。交代を機に、働き方全体を見直す", "id": "G4-003"}, "G4-014": {"conclusion": "「任せる仕事が十分にあるか」「支える体制があるか」「本人の特性に合う環境か」の3つで判断します。上司や相談役には、一人で抱え込まず、周囲や支援機関と連携できる人が向いています。障害についての専門知識がなくても、普段の部下育成と同じ力が土台になり、足りない知識は後から補えます。", "general": [["配属先を選ぶ基準", ["仕事の量と内容：継続して発生する業務が十分にあり、本人の特性に合っているか", "支える体制：日常の相談役を置けるか、上司の理解があるか", "環境：音、人の出入り、通勤や移動のしやすさなどが、本人に合っているか", "部署の状況：繁忙すぎて関わる余裕がない、などの事情がないか"]], ["受け入れ部署の上司・相談役に向いている人", ["指示を具体的に、落ち着いて伝えられる", "本人の話を聞き、決めつけずに一緒に考えられる", "困ったときに、一人で抱えず人事や支援機関に相談できる"]], ["上司を任された人が不安なとき", ["障害についての専門知識がなくても大丈夫。指示を具体的に伝える、話を聞く、できたことを伝えるといった、普段の部下育成と同じ力が土台になる", "分からないことは、本人に聞いてよい。自分の特性や、うまくいく工夫を一番よく知っているのは本人", "最初から完璧に対応できなくてよい。やってみて、合わなければ本人と話し合って調整していけばよい", "一人で判断しなくてよい。勤務や配慮の判断は人事と一緒に行い、迷ったときは支援機関にも相談できる（G4-002）", "必要な知識は、社内研修や支援機関の助言で、受け入れてからでも身につけられる", "上司自身の相談先を決め、負担が大きくなっていないかを定期的に確認する（G12-006）"]]], "charts": [{"type": "table", "title": "実務のチェックポイント（採用前の受け入れ準備）", "head": ["項目", "確認すること"], "rows": [["前提の共有", "雇用の目的、受け入れ部署、任せる業務が、経営層・人事・現場で共有されているか"], ["相談窓口", "日常の相談窓口（現場のリーダー、相談役、人事など）を誰が担うか決めているか"], ["役割分担", "人事、配属先の上司、相談役が、それぞれ何を担うか決まっているか"], ["合理的配慮の考え方", "「本人の申し出と話し合いで決める」という考え方を、関係者で共有しているか"], ["過重な負担の判断", "配慮できるかどうかを、誰が、どの場で、どんな面から判断するか決めているか"], ["現場への説明", "現場の社員に、何を、どこまで、誰に伝えるかを採用前に考えているか"], ["支援機関", "相談できる支援機関（就労移行支援事業所、障害者就業・生活支援センターなど）を知っているか"]], "note": "ほかの段階のチェックポイントは G1-010 に一覧があります。", "xlsx": "tools/checklist-02-ukeire.xlsx", "xlsx_name": "02_採用前の受け入れ準備チェックリスト.xlsx", "check": true}], "q": "配属先の候補が複数ある場合、どのような基準で選べばよいですか？受け入れ部署の上司にはどんな人が向いていますか？", "cat": "受け入れ体制", "st": 2, "kw": "受け入れ部署の上司を選ぶ際、どのような人物が向いていますか？", "body": "配属先を選ぶ基準 仕事の量と内容：継続して発生する業務が十分にあり、本人の特性に合っているか 支える体制：日常の相談役を置けるか、上司の理解があるか 環境：音、人の出入り、通勤や移動のしやすさなどが、本人に合っているか 部署の状況：繁忙すぎて関わる余裕がない、などの事情がないか 受け入れ部署の上司・相談役に向いている人 指示を具体的に、落ち着いて伝えられる 本人の話を聞き、決めつけずに一緒に考えられる 困ったときに、一人で抱えず人事や支援機関に相談できる 上司を任された人が不安なとき 障害についての専門知識がなくても大丈夫。指示を具体的に伝える、話を聞く、できたことを伝えるといった、普段の部下育成と同じ力が土台になる 分からないことは、本人に聞いてよい。自分の特性や、うまくいく工夫を一番よく知っているのは本人 最初から完璧に対応できなくてよい。やってみて、合わなければ本人と話し合って調整していけばよい 一人で判断しなくてよい。勤務や配慮の判断は人事と一緒に行い、迷ったときは支援機関にも相談できる（G4-002） 必要な知識は、社内研修や支援機関の助言で、受け入れてからでも身につけられる 上司自身の相談先を決め、負担が大きくなっていないかを定期的に確認する（G12-006） 実務のチェックポイント（採用前の受け入れ準備） 前提の共有 雇用の目的、受け入れ部署、任せる業務が、経営層・人事・現場で共有されているか 相談窓口 日常の相談窓口（現場のリーダー、相談役、人事など）を誰が担うか決めているか 役割分担 人事、配属先の上司、相談役が、それぞれ何を担うか決まっているか 合理的配慮の考え方 「本人の申し出と話し合いで決める」という考え方を、関係者で共有しているか 過重な負担の判断 配慮できるかどうかを、誰が、どの場で、どんな面から判断するか決めているか 現場への説明 現場の社員に、何を、どこまで、誰に伝えるかを採用前に考えているか 支援機関 相談できる支援機関（就労移行支援事業所、障害者就業・生活支援センターなど）を知っているか", "id": "G4-014"}, "G4-005": {"conclusion": "障害者雇用だから正社員でなければならない、契約社員でなければならない、という決まりはありません。任せる仕事の内容と、本人の希望や体調に合わせて決めます。進め方の一つのモデルとして、契約社員や短時間勤務から始め、働きぶりを見て正社員への登用や勤務時間の延長につなげる道を、あらかじめ示しておく方法があります。", "general": [["決め方", ["任せる仕事の内容と責任に合わせて、ほかの社員と同じ基準で雇用形態と賃金を決める（G5-037）", "勤務時間は本人の体調や希望を聞いて決める。週20時間以上なら雇用率の算定対象になり、週10時間以上20時間未満でも精神障害者などは対象になる（G1-052）", "障害を理由に、雇用形態や賃金を不利に決めることはできない（G6-110）"]], ["進め方のモデルケース（一例）", ["契約社員や短時間勤務から始め、正社員登用や勤務時間の延長の基準と道筋を、あらかじめ示しておく（G5-006）", "本人の体調や仕事への慣れを見ながら、少しずつ条件を広げられるのが利点。登用の基準をはっきりさせておくことで、本人の目標にもなる", "これは一つの例で、仕事の内容や本人の経験によっては、最初から正社員として採用することもある（専門職など）"]], ["注意すること", ["有期雇用の場合、更新の基準を明示しておく（G5-007）", "労働条件通知書で、勤務時間、業務内容、賃金、更新の有無をはっきり示す"]]], "q": "障害者を採用するとき、雇用形態（正社員・契約社員・パートなど）や労働条件はどう考えればよいですか？", "cat": "雇用形態と労働条件", "st": 2, "kw": "他社ではどのような雇用形態・労働条件を設定しているのでしょうか 雇用形態・労働条件を決める上で、注意すべきことを教えてほしい 障害のある方を初めて採用するにあたり、どのような雇用形態（正社員、契約社員、パートタイムなど）で採用するのが適切か悩んでいます。選ぶ際のポイントや、それぞれのメリット・デメリットがあれば教えてください。 障害者の雇用形態や就業時間、賃金などはどのように考えたらよいでしょうか？ 障がい者雇用は正社員として雇用することが必須でしょうか。 障害者を採用する際、雇用形態（正社員・契約社員・パート）はどう考えればよいですか？", "body": "決め方 任せる仕事の内容と責任に合わせて、ほかの社員と同じ基準で雇用形態と賃金を決める（G5-037） 勤務時間は本人の体調や希望を聞いて決める。週20時間以上なら雇用率の算定対象になり、週10時間以上20時間未満でも精神障害者などは対象になる（G1-052） 障害を理由に、雇用形態や賃金を不利に決めることはできない（G6-110） 進め方のモデルケース（一例） 契約社員や短時間勤務から始め、正社員登用や勤務時間の延長の基準と道筋を、あらかじめ示しておく（G5-006） 本人の体調や仕事への慣れを見ながら、少しずつ条件を広げられるのが利点。登用の基準をはっきりさせておくことで、本人の目標にもなる これは一つの例で、仕事の内容や本人の経験によっては、最初から正社員として採用することもある（専門職など） 注意すること 有期雇用の場合、更新の基準を明示しておく（G5-007） 労働条件通知書で、勤務時間、業務内容、賃金、更新の有無をはっきり示す", "id": "G4-005"}, "G4-022": {"conclusion": "障害は、本人と環境との関係で生まれます。物理的な環境（設備、席、音や光）と、人の環境（指示の出し方、相談できる人、周囲の理解）の両方を整えることで、本人が力を発揮しやすくなります。必要な環境は一人ひとり違うので、障害の種類で決めつけず、本人と話し合って整えます。", "general": [["物理的な環境", ["通路の広さ、段差、トイレ、机の高さなど（主に身体障害）（G6-029）", "音、光、人の出入りなど、集中を妨げるもの（主に精神・発達障害）（G6-069）", "休憩できる場所"]], ["人の環境", ["指示を出す人を決める、指示を具体的に・文字でも伝える", "日常の相談役を決め、相談しやすい雰囲気をつくる", "周囲の社員に、本人の同意を得た範囲で配慮を共有する（G6-044）"]], ["仕事の進め方", ["手順書やチェックリストで、仕事の流れを見える形にする", "業務量や締め切りを、本人の状態に合わせて調整する"]], ["障害種別ごとの配慮", ["障害種別ごとの特性と配慮は、G6の「障害種別の特性と配慮」を参照（G6-099、G6-028、G6-029、G6-030、G6-101、G6-100、G1-073）"]]], "q": "障害者雇用にあたって、どのような職場環境をつくればよいですか？", "cat": "職場環境と業務改善", "st": 2, "kw": "障害種別によって職場環境づくりは違うと思いますが、どのような事例がありますか 身体障害者の場合の職場環境づくりの事例を知りたい 知的障害者の場合の職場環境づくりの事例を知りたい 精神障害者の場合の職場環境づくりの事例を知りたい 発達障害者の場合の職場環境づくりの事例を知りたい 職場環境改善はどのようにすればよいのでしょうか 職場環境改善の具体的な事例を知りたい", "body": "物理的な環境 通路の広さ、段差、トイレ、机の高さなど（主に身体障害）（G6-029） 音、光、人の出入りなど、集中を妨げるもの（主に精神・発達障害）（G6-069） 休憩できる場所 人の環境 指示を出す人を決める、指示を具体的に・文字でも伝える 日常の相談役を決め、相談しやすい雰囲気をつくる 周囲の社員に、本人の同意を得た範囲で配慮を共有する（G6-044） 仕事の進め方 手順書やチェックリストで、仕事の流れを見える形にする 業務量や締め切りを、本人の状態に合わせて調整する 障害種別ごとの配慮 障害種別ごとの特性と配慮は、G6の「障害種別の特性と配慮」を参照（G6-099、G6-028、G6-029、G6-030、G6-101、G6-100、G1-073）", "id": "G4-022"}, "G4-030": {"conclusion": "業務改善は、障害者雇用のためだけでなく、職場全体の効率化につながる取組です。業務を書き出し、手順をそろえ、見える形にすることで、障害のある社員が担える業務が増え、ほかの社員の負担も減ります。", "general": [["進め方", ["業務を書き出す：誰が、何を、どのくらいの時間でしているか", "手順をそろえる：人によってやり方が違う業務を、同じ手順にする", "見える形にする：手順書、チェックリスト、写真付きのマニュアル", "切り出す：決まった手順でできる業務を、障害のある社員の仕事として集める（G3-008）"]], ["負担が大きいと感じるとき", ["一度に全部を変えず、効果の大きい業務から始める", "費用は助成金や機器の貸出しも活用する（G1-033、G4-035）", "一つの職場で難しい場合は、会社全体の取組として、人事や経営層に体制や予算を求める（G7-004）", "支援機関やジョブコーチに助言を求める（G3-024）"]]], "q": "障害者雇用にあたって、業務改善はどのように進めればよいですか？", "cat": "職場環境と業務改善", "st": 2, "kw": "業務改善の具体的な事例を知りたい 業務改善により、多くの障害のある方を雇用できることはわかりますが、そのためには費用、時間、指導をする社員の準備が大変です 会社全体や事業部として取り組まなければ、一職場の対応では難しく、現状で手一杯で改善に目を向ける余裕がありません", "body": "進め方 業務を書き出す：誰が、何を、どのくらいの時間でしているか 手順をそろえる：人によってやり方が違う業務を、同じ手順にする 見える形にする：手順書、チェックリスト、写真付きのマニュアル 切り出す：決まった手順でできる業務を、障害のある社員の仕事として集める（G3-008） 負担が大きいと感じるとき 一度に全部を変えず、効果の大きい業務から始める 費用は助成金や機器の貸出しも活用する（G1-033、G4-035） 一つの職場で難しい場合は、会社全体の取組として、人事や経営層に体制や予算を求める（G7-004） 支援機関やジョブコーチに助言を求める（G3-024）", "id": "G4-030"}, "G4-035": {"conclusion": "高齢・障害・求職者雇用支援機構（JEED）の中央障害者雇用情報センターで、障害のある人の仕事を助ける機器を、原則6か月以内、無料で借りることができます。JEEDのホームページでは、障害の種類ごとに機器を探せる一覧も公開されています。導入前に試してから購入を判断できます。", "general": [["どんな機器があるか", ["画面拡大ソフトや音声読み上げソフト、拡大読書器（視覚障害）", "会議用の音声文字変換機器など（聴覚障害）", "操作しやすいマウス・キーボード、作業台など（肢体不自由）"]], ["借りられる条件", ["対象：障害者を雇用している、または雇用しようとしている事業主。トライアル雇用、職場実習、入社試験での利用もできる", "期間：原則6か月以内。費用：無料", "申込先：中央障害者雇用情報センター（電話 03-5638-2792、メール kiki@jeed.go.jp）"]], ["機器を探せる一覧", ["JEED「就労支援機器のページ」では、視覚・聴覚・上肢・知的・発達など障害の種類ごとに、機器の名前、価格、メーカーを調べられる", "貸出しできる機器だけを一覧で見ることもできる（貸出し中でも相談に応じてもらえる場合がある）"]], ["使い方", ["借りる前に、本人の困りごとと使う場面を整理しておく", "試用期間中に、本人と一緒に使いやすさを確認する", "購入する場合は、障害者作業施設設置等助成金などの対象になるか確認する（G1-033）"]]], "links": [["JEED 就労支援機器 貸出し機器の一覧", "https://www.kiki.jeed.go.jp/RentalProductList.html"], ["JEED 就労支援機器 すべての機器から選ぶ", "https://www.kiki.jeed.go.jp/AllProductList.html"]], "q": "障害のある社員の仕事を助ける機器を、借りることはできますか？", "cat": "職場環境と業務改善", "st": 2, "kw": "障害者を採用するに当たり、就労支援機器の貸出しを行っている機関があれば教えてください。", "body": "どんな機器があるか 画面拡大ソフトや音声読み上げソフト、拡大読書器（視覚障害） 会議用の音声文字変換機器など（聴覚障害） 操作しやすいマウス・キーボード、作業台など（肢体不自由） 借りられる条件 対象：障害者を雇用している、または雇用しようとしている事業主。トライアル雇用、職場実習、入社試験での利用もできる 期間：原則6か月以内。費用：無料 申込先：中央障害者雇用情報センター（電話 03-5638-2792、メール kiki@jeed.go.jp） 機器を探せる一覧 JEED「就労支援機器のページ」では、視覚・聴覚・上肢・知的・発達など障害の種類ごとに、機器の名前、価格、メーカーを調べられる 貸出しできる機器だけを一覧で見ることもできる（貸出し中でも相談に応じてもらえる場合がある） 使い方 借りる前に、本人の困りごとと使う場面を整理しておく 試用期間中に、本人と一緒に使いやすさを確認する 購入する場合は、障害者作業施設設置等助成金などの対象になるか確認する（G1-033）", "id": "G4-035"}, "G4-050": {"conclusion": "在宅で雇用する（テレワーク）場合も、通常の雇用と同じく法定雇用率の算定対象になります。通勤が難しい人や、地方に住んでいる人、体調の波や感覚過敏がある人などが、力を発揮しやすい働き方です。一方で、勤怠や体調の把握、孤立を防ぐコミュニケーション、業務の切り出しを、出社する場合以上に意識して整える必要があります。", "general": [["対象になりやすい人", ["通勤が難しい人（重度の身体障害、日中に通院や生活介助が必要な人など）", "地方に住んでいて、地域に事務系の求人が少ない人", "精神障害や発達障害があり、通勤や人の多い環境が負担になる人（感覚過敏など）", "難病のある人や、体調の波が大きい人", "パソコン操作、報告・相談の発信、自己管理ができることが大切になる。在宅が合うかどうかは人によるので、本人の希望と適性を確かめる"]], ["労務管理で気をつけること", ["出退勤や休憩の時間をつかむ（朝夕のオンラインミーティング、チャットの在席表示など）", "通院や体調の波に合わせて、フレックスや短時間勤務など柔軟な勤務時間を考える", "自宅の作業環境（机・椅子・照明・パソコン・通信）を確認し、通信費や機器の負担ルールを就業規則などで決めておく", "在宅で働く時間中のけがも労災の対象になる。健康診断も受けられるようにする"]], ["孤立を防ぐコミュニケーション", ["毎日の朝会などで、仕事の状況と体調を確認する", "オンラインでの雑談や定期的な集合研修など、チームの一員だと感じられる機会をつくる", "支援機関がついていれば、定期面談に同席してもらうなど連携する"]], ["業務の切り出しと評価", ["在宅でできる業務を各部署から集め、少しずつ難しさを上げていく。判断の軸を決めれば、専門性のある業務も任せられる（G3-008）", "処理件数など成果を見える形にして、評価や処遇に反映する"]], ["相談先", ["厚生労働省の委託事業「障害者のテレワーク雇用に関する無料相談窓口」で、導入から定着まで無料で相談できる"]]], "sources": ["厚生労働省「障害者テレワーク事例集」"], "links": [["障害者のテレワーク雇用に関する無料相談窓口（厚生労働省委託事業）", "https://twp.mhlw.go.jp/"], ["厚生労働省 障害者テレワーク事例集（PDF）", "https://www.mhlw.go.jp/content/001203253.pdf"], ["障害者のテレワーク雇用事例集・事例動画まとめ", "https://twp.mhlw.go.jp/useful/useful06.html"]], "q": "障害のある人を在宅（テレワーク）で雇用したい。どんな人が対象になり、何に気をつければよいですか？", "cat": "職場環境と業務改善", "st": 2, "kw": "", "body": "対象になりやすい人 通勤が難しい人（重度の身体障害、日中に通院や生活介助が必要な人など） 地方に住んでいて、地域に事務系の求人が少ない人 精神障害や発達障害があり、通勤や人の多い環境が負担になる人（感覚過敏など） 難病のある人や、体調の波が大きい人 パソコン操作、報告・相談の発信、自己管理ができることが大切になる。在宅が合うかどうかは人によるので、本人の希望と適性を確かめる 労務管理で気をつけること 出退勤や休憩の時間をつかむ（朝夕のオンラインミーティング、チャットの在席表示など） 通院や体調の波に合わせて、フレックスや短時間勤務など柔軟な勤務時間を考える 自宅の作業環境（机・椅子・照明・パソコン・通信）を確認し、通信費や機器の負担ルールを就業規則などで決めておく 在宅で働く時間中のけがも労災の対象になる。健康診断も受けられるようにする 孤立を防ぐコミュニケーション 毎日の朝会などで、仕事の状況と体調を確認する オンラインでの雑談や定期的な集合研修など、チームの一員だと感じられる機会をつくる 支援機関がついていれば、定期面談に同席してもらうなど連携する 業務の切り出しと評価 在宅でできる業務を各部署から集め、少しずつ難しさを上げていく。判断の軸を決めれば、専門性のある業務も任せられる（G3-008） 処理件数など成果を見える形にして、評価や処遇に反映する 相談先 厚生労働省の委託事業「障害者のテレワーク雇用に関する無料相談窓口」で、導入から定着まで無料で相談できる", "id": "G4-050"}, "G4-048": {"conclusion": "指示は具体的に、肯定的に、一度に一つずつ、文字でも伝えることが基本です。そのうえで、本人の特性に合わせて伝え方を工夫します（下の表）。どう伝えると分かりやすいかは、本人に聞くのが一番の近道です。指示を出す人を一人に絞り、やって見せてから、やってもらい、できたら認める、という順で教えます。", "general": [["教え方の基本", ["「何を、いつまでに、どのくらい」を具体的に伝える。あいまいな言葉を避ける", "肯定的に伝える。「〜しないで」ではなく「〜して」と、してほしいことを伝える。できたことは、その場で具体的に伝える", "一度に一つの指示にする。複数あるときは優先順位をつける", "口頭だけでなく、メモやチャット、手順書でも伝える", "やって見せる → やってもらう → 確認する → できたら認める、の順で教える", "どう伝えると分かりやすいかを本人に聞く。本人が持ってきた個人のシートや、支援機関の助言も参考にする（G3-006）", "指示を出す人を一人に絞る。複数の人から違う指示が出ると、混乱のもとになりやすい（G4-002）"]], ["特性に合わせた伝え方（下の表）", ["表は、障害の種類ごとに、伝わりやすくするための工夫の例をまとめたもの", "同じ障害でも、伝わりやすい方法は一人ひとり違う。表は参考にとどめ、本人に確認しながら合う方法を見つける", "障害の種類ごとの特性と配慮は、G3-004 の表も参照"]], ["仕事を始めてもらうとき", ["最初の数週間は「評価」ではなく「観察と調整」の期間と考える（G1-010）", "業務を分けて、少しずつ任せる範囲を広げる"]], ["指示の誤解が多いとき", ["本人に指示の内容を復唱してもらい、理解を確かめる", "誤解が起きたら、責めずに、どこで食い違ったかを一緒に確認する", "フィードバックは、事実と次にどうするかに絞って伝える（G10-047）"]], ["自分でできることを増やす", ["本人が自分で確認できるチェックリストを用意する", "質問のしかたや報告のタイミングを決めておく（G7-021）", "できるようになったことを本人と確認し、少しずつ任せる"]]], "charts": [{"type": "table", "title": "特性に合わせた伝え方の例", "head": ["障害の種類", "伝え方の工夫の例"], "rows": [["聴覚障害", "文字で伝える（メモ、チャット、音声を文字にするアプリ）。話すときは顔を見せ、口元が見えるようにする"], ["視覚障害", "「あれ」「そこ」ではなく、位置や物を言葉で具体的に伝える。資料は読み上げソフトで読める形で渡す"], ["肢体不自由", "作業の手順や道具の配置を、本人の動きやすさに合わせて一緒に決める"], ["知的障害", "短い言葉で、写真や図を使い、一つの工程ずつ教える。手順は毎回同じ流れにする"], ["発達障害", "あいまいな表現を避け、数字や期限で具体的に伝える。予定の変更は早めに伝え、作業は区切りを決めて示す"], ["精神障害", "体調の波に合わせて量を調整する。強い口調や急かす言い方を避け、落ち着いた場で伝える"], ["内部障害", "体力や通院に合わせて、作業の量や時間の見通しを先に伝える"]], "note": "同じ障害でも、伝わりやすい方法は一人ひとり違います。本人に確認しながら調整します。"}], "q": "障害のある社員の特性に合った指導方法がわかりません。どう関わればよいですか？", "cat": "指導とマネジメント", "st": 2, "kw": "仕事を始めてもらうときは何に気をつけるか どのようにすれば、本人の業務的自立を促せるでしょうか？ 業務指示を誤解してしまうことが多く、業務の進行に支障が出ることがあります。本人へフィードバックを行う際の最適な方法はありますか？", "body": "教え方の基本 「何を、いつまでに、どのくらい」を具体的に伝える。あいまいな言葉を避ける 肯定的に伝える。「〜しないで」ではなく「〜して」と、してほしいことを伝える。できたことは、その場で具体的に伝える 一度に一つの指示にする。複数あるときは優先順位をつける 口頭だけでなく、メモやチャット、手順書でも伝える やって見せる → やってもらう → 確認する → できたら認める、の順で教える どう伝えると分かりやすいかを本人に聞く。本人が持ってきた個人のシートや、支援機関の助言も参考にする（G3-006） 指示を出す人を一人に絞る。複数の人から違う指示が出ると、混乱のもとになりやすい（G4-002） 特性に合わせた伝え方（下の表） 表は、障害の種類ごとに、伝わりやすくするための工夫の例をまとめたもの 同じ障害でも、伝わりやすい方法は一人ひとり違う。表は参考にとどめ、本人に確認しながら合う方法を見つける 障害の種類ごとの特性と配慮は、G3-004 の表も参照 仕事を始めてもらうとき 最初の数週間は「評価」ではなく「観察と調整」の期間と考える（G1-010） 業務を分けて、少しずつ任せる範囲を広げる 指示の誤解が多いとき 本人に指示の内容を復唱してもらい、理解を確かめる 誤解が起きたら、責めずに、どこで食い違ったかを一緒に確認する フィードバックは、事実と次にどうするかに絞って伝える（G10-047） 自分でできることを増やす 本人が自分で確認できるチェックリストを用意する 質問のしかたや報告のタイミングを決めておく（G7-021） できるようになったことを本人と確認し、少しずつ任せる 特性に合わせた伝え方の例 聴覚障害 文字で伝える（メモ、チャット、音声を文字にするアプリ）。話すときは顔を見せ、口元が見えるようにする 視覚障害 「あれ」「そこ」ではなく、位置や物を言葉で具体的に伝える。資料は読み上げソフトで読める形で渡す 肢体不自由 作業の手順や道具の配置を、本人の動きやすさに合わせて一緒に決める 知的障害 短い言葉で、写真や図を使い、一つの工程ずつ教える。手順は毎回同じ流れにする 発達障害 あいまいな表現を避け、数字や期限で具体的に伝える。予定の変更は早めに伝え、作業は区切りを決めて示す 精神障害 体調の波に合わせて量を調整する。強い口調や急かす言い方を避け、落ち着いた場で伝える 内部障害 体力や通院に合わせて、作業の量や時間の見通しを先に伝える", "id": "G4-048"}, "G4-047": {"conclusion": "まず、なぜ手がつかないのか、なぜ忘れるのかという背景を本人と一緒に確認します。そのうえで、やることと締め切りを「見える形」にし、優先順位を決めるための判断の軸を伝えます。1日の始めにやることと順番を一緒に確認し、ツールやリマインダーで締め切りを知らせる仕組みをつくります。", "general": [["背景を見立てる", ["同じ「忘れる」「手がつかない」でも、背景によって打つ手が変わる", "特性によるもの：一度に覚えておける量が少ない、優先順位を判断するのが難しい など", "体調によるもの：睡眠の乱れ、疲れ、薬の影響 など", "職場側の要因：業務量が多すぎる、指示があいまい、頼む人が多い など", "背景は本人と一緒に確認する（G11-012）"]], ["優先順位の「判断の軸」を渡す", ["「締め切りが早いものから」「お客様に関わるものを先に」など、順番を決める基準を伝えておく", "基準があると、本人が自分で判断しやすくなる。迷ったときの相談先もあわせて決めておく（G3-008）"]], ["支え方", ["やることを一覧にする：タスク管理表、ホワイトボード、チャットのタスク機能など", "本人がこれまで使ってきた工夫（スマホのリマインダー、手帳など）を聞き、職場でも使えるようにする", "優先順位をつける：最初は上司が順番を決め、慣れてきたら本人が決めて確認する", "1日の始めと終わりに、短い確認の時間をとる", "締め切りは、カレンダーやリマインダーで自動的に知らせる", "大きな仕事は小さな作業に分け、それぞれに締め切りをつける", "少しずつ自分でできるようにする：上司が順番を決める → 本人が案を出し上司が確認する → 本人が決めて報告する、の順で広げる"]], ["気をつけること", ["一度に複数の仕事を頼まない。頼むときは順番を伝える", "途中で別の仕事を頼むときは、今の仕事をどうするかも伝える", "頼む側のルールを決める：依頼の窓口を一本化し、文字で締め切りまで書いて頼む。口頭での「ついでに」の依頼は避け、周囲の社員にも共有する", "急な割り込みの仕事が入ったときの扱いや、困ったときにいつ報告するかを決めておく", "忘れたことを責めるより、仕組みで防ぐことを考える"]]], "q": "何から手をつけてよいかわからなくなったり、締め切りを忘れたりする社員がいます。タスク管理や優先順位づけをどう支えればよいですか？", "cat": "指導とマネジメント", "st": 2, "kw": "", "body": "背景を見立てる 同じ「忘れる」「手がつかない」でも、背景によって打つ手が変わる 特性によるもの：一度に覚えておける量が少ない、優先順位を判断するのが難しい など 体調によるもの：睡眠の乱れ、疲れ、薬の影響 など 職場側の要因：業務量が多すぎる、指示があいまい、頼む人が多い など 背景は本人と一緒に確認する（G11-012） 優先順位の「判断の軸」を渡す 「締め切りが早いものから」「お客様に関わるものを先に」など、順番を決める基準を伝えておく 基準があると、本人が自分で判断しやすくなる。迷ったときの相談先もあわせて決めておく（G3-008） 支え方 やることを一覧にする：タスク管理表、ホワイトボード、チャットのタスク機能など 本人がこれまで使ってきた工夫（スマホのリマインダー、手帳など）を聞き、職場でも使えるようにする 優先順位をつける：最初は上司が順番を決め、慣れてきたら本人が決めて確認する 1日の始めと終わりに、短い確認の時間をとる 締め切りは、カレンダーやリマインダーで自動的に知らせる 大きな仕事は小さな作業に分け、それぞれに締め切りをつける 少しずつ自分でできるようにする：上司が順番を決める → 本人が案を出し上司が確認する → 本人が決めて報告する、の順で広げる 気をつけること 一度に複数の仕事を頼まない。頼むときは順番を伝える 途中で別の仕事を頼むときは、今の仕事をどうするかも伝える 頼む側のルールを決める：依頼の窓口を一本化し、文字で締め切りまで書いて頼む。口頭での「ついでに」の依頼は避け、周囲の社員にも共有する 急な割り込みの仕事が入ったときの扱いや、困ったときにいつ報告するかを決めておく 忘れたことを責めるより、仕組みで防ぐことを考える", "id": "G4-047"}, "G4-040": {"conclusion": "数値目標がある業務でも、目標の水準や達成までの期間、業務の分け方を調整できる場合があります。一方で、目標の達成がその職務の中心で、目標を変えられない場合もあります。そのときは、目標は変えずに達成するための「やり方」を支え、それでも難しければ、本人と話し合って業務内容や配置の見直しを考えます。", "general": [["目標を調整できる場合", ["目標の調整：最初は低めの目標や長めの期間から始め、少しずつ引き上げる", "業務の分け方：営業の準備（資料やリストの作成など）を本人が担い、対面や電話の部分はほかの人が担う、など", "評価の仕方：結果だけでなく、行動（架電数、準備の質など）も評価に含める"]], ["目標を変えられない場合", ["営業職として採用しているなど、目標の達成がその職務の中心である場合は、目標そのものを下げることは難しい。業務の本質を変えるほどの調整は、合理的配慮として求められない（G1-001）", "目標は変えずに、達成するための「やり方」を支える：話す内容の台本を用意する、電話の代わりにメールなど本人が得意な方法を使う、集中しやすい時間帯に業務を組む、慣れるまで同行して教える など", "それでも難しい場合は、本人と話し合い、目標のない業務や別の部署への配置換えなど、本人の力を発揮できる働き方を一緒に考える", "どこまで調整できて、どこからはできないのかを、会社として整理し、本人に理由とあわせて説明する", "ミスマッチを防ぐため、採用や配置の段階で、目標の有無と水準をはっきり伝えておく"]], ["気をつけること", ["目標を調整する場合も、その理由と期間を本人と話し合って決める（G6-041）", "周囲の社員に不公平感が出ないよう、本人の同意の範囲で説明する"]]], "q": "営業や電話かけなど、数値目標がある業務とセットになっている職務で、どう配慮すればよいですか？", "cat": "指導とマネジメント", "st": 2, "kw": "", "body": "目標を調整できる場合 目標の調整：最初は低めの目標や長めの期間から始め、少しずつ引き上げる 業務の分け方：営業の準備（資料やリストの作成など）を本人が担い、対面や電話の部分はほかの人が担う、など 評価の仕方：結果だけでなく、行動（架電数、準備の質など）も評価に含める 目標を変えられない場合 営業職として採用しているなど、目標の達成がその職務の中心である場合は、目標そのものを下げることは難しい。業務の本質を変えるほどの調整は、合理的配慮として求められない（G1-001） 目標は変えずに、達成するための「やり方」を支える：話す内容の台本を用意する、電話の代わりにメールなど本人が得意な方法を使う、集中しやすい時間帯に業務を組む、慣れるまで同行して教える など それでも難しい場合は、本人と話し合い、目標のない業務や別の部署への配置換えなど、本人の力を発揮できる働き方を一緒に考える どこまで調整できて、どこからはできないのかを、会社として整理し、本人に理由とあわせて説明する ミスマッチを防ぐため、採用や配置の段階で、目標の有無と水準をはっきり伝えておく 気をつけること 目標を調整する場合も、その理由と期間を本人と話し合って決める（G6-041） 周囲の社員に不公平感が出ないよう、本人の同意の範囲で説明する", "id": "G4-040"}, "G4-010": {"conclusion": "仲が良いこと自体は悪いことではありませんが、仕事の場としての距離感は必要です。本人と同僚の両方に、職場での関わり方のルールを具体的に伝えます。本人が距離感をつかみにくい特性の場合は、「いつ・どこで・どのくらい」話してよいかを具体的に決めると伝わりやすくなります。", "general": [["同僚への伝え方", ["親しくすることは否定せず、業務中は仕事としての関わりを優先するよう伝える", "手伝いすぎると、本人の成長の機会を減らすことになると伝える"]], ["本人への伝え方", ["プライベートな話は休憩時間に、など具体的なルールを決める", "相手が困っているサイン（返事が短い、仕事に戻るなど）を具体的に伝える", "責めるのではなく、職場のルールとして伝える"]], ["過度に親密な態度が続くとき", ["本人と個別に話し、どんな行動が相手を困らせているかを具体的に伝える", "改善しない場合は、本人を支援している機関とも相談する", "会社のルールに反する言動があれば、ほかの社員と同じように、通常どおり対応する（G10-038）"]]], "q": "同僚と障害のある社員が「友達感覚」の近い距離になり、業務やスキルの成長に支障が出ています。どう対応すればよいですか？", "cat": "指導とマネジメント", "st": 2, "kw": "業務時間中に頻繁にプライベートな話題を持ちかけ、周囲のメンバーの業務遂行にも影響が出ています。どうしたらよいでしょうか。 業務内外に関わらず、過度に親密な態度を取るメンバーにどう伝えたらよいでしょうか。", "body": "同僚への伝え方 親しくすることは否定せず、業務中は仕事としての関わりを優先するよう伝える 手伝いすぎると、本人の成長の機会を減らすことになると伝える 本人への伝え方 プライベートな話は休憩時間に、など具体的なルールを決める 相手が困っているサイン（返事が短い、仕事に戻るなど）を具体的に伝える 責めるのではなく、職場のルールとして伝える 過度に親密な態度が続くとき 本人と個別に話し、どんな行動が相手を困らせているかを具体的に伝える 改善しない場合は、本人を支援している機関とも相談する 会社のルールに反する言動があれば、ほかの社員と同じように、通常どおり対応する（G10-038）", "id": "G4-010"}, "G4-004": {"conclusion": "面接だけでは、職場での様子はわかりにくいものです。面接では「大丈夫ですか」と聞くのではなく、過去の具体的な場面と、そのときどうしたかを聞くことで、感情のコントロールや人との距離感について見えてくることがあります。あわせて、職場実習やトライアル雇用で実際に働く様子を見ること、支援機関から訓練中の様子を聞くことで、ミスマッチを減らせます。", "general": [["採用前にできること", ["職場実習やトライアル雇用で、実際の職場での様子を確かめる（G2-040、G2-033）", "本人の同意を得て、支援機関から訓練中の様子や、調子を崩したときの様子を聞く", "面接で、ストレスを感じる場面と、そのときの対処法を具体的に聞く（G2-007）"]], ["面接で聞く質問の例", ["気持ちの面：「これまでの職場や実習で、イライラしたり不安になったりしたのは、どんな場面でしたか？そのとき、どうしましたか？」", "落ち着く工夫：「気持ちが落ち着かなくなったとき、自分で落ち着くためにしている工夫はありますか？」", "サインと周囲への希望：「調子が崩れそうなとき、どんなサインが出ますか？周りの人にどう声をかけてもらえると助かりますか？」", "注意の受け止め方：「仕事で注意や指摘を受けるとき、どう伝えてもらうと受け止めやすいですか？」", "人との関わり：「職場の人とは、どんな関わり方が心地よいですか？休憩時間はどう過ごすことが多いですか？」", "意見の違い：「意見が合わない人がいたとき、これまでどうしてきましたか？」", "相談の仕方：「困ったことがあったとき、誰に、どのように相談してきましたか？」", "聞き方のポイント：答えに対して「それはどうしてですか」「そのあとどうなりましたか」と一段掘り下げる。業務に関係する範囲で聞き、病名や私生活に踏み込みすぎない"]], ["入社後にできること", ["最初の数週間は観察と調整の期間と考え、短い間隔で面談する（G5-024）", "感情の波が出たときの対応（休憩、相談先）を、本人と決めておく", "職場での関わり方のルールを具体的に伝える（G4-010）"]]], "q": "面接では問題がなさそうだった人が、入社後に感情のコントロールや対人距離の面でミスマッチを起こします。どう防げばよいですか？", "cat": "指導とマネジメント", "st": 2, "kw": "", "body": "採用前にできること 職場実習やトライアル雇用で、実際の職場での様子を確かめる（G2-040、G2-033） 本人の同意を得て、支援機関から訓練中の様子や、調子を崩したときの様子を聞く 面接で、ストレスを感じる場面と、そのときの対処法を具体的に聞く（G2-007） 面接で聞く質問の例 気持ちの面：「これまでの職場や実習で、イライラしたり不安になったりしたのは、どんな場面でしたか？そのとき、どうしましたか？」 落ち着く工夫：「気持ちが落ち着かなくなったとき、自分で落ち着くためにしている工夫はありますか？」 サインと周囲への希望：「調子が崩れそうなとき、どんなサインが出ますか？周りの人にどう声をかけてもらえると助かりますか？」 注意の受け止め方：「仕事で注意や指摘を受けるとき、どう伝えてもらうと受け止めやすいですか？」 人との関わり：「職場の人とは、どんな関わり方が心地よいですか？休憩時間はどう過ごすことが多いですか？」 意見の違い：「意見が合わない人がいたとき、これまでどうしてきましたか？」 相談の仕方：「困ったことがあったとき、誰に、どのように相談してきましたか？」 聞き方のポイント：答えに対して「それはどうしてですか」「そのあとどうなりましたか」と一段掘り下げる。業務に関係する範囲で聞き、病名や私生活に踏み込みすぎない 入社後にできること 最初の数週間は観察と調整の期間と考え、短い間隔で面談する（G5-024） 感情の波が出たときの対応（休憩、相談先）を、本人と決めておく 職場での関わり方のルールを具体的に伝える（G4-010）", "id": "G4-004"}, "G7-004": {"conclusion": "経営層には、障害者雇用を「法定雇用率への対応」ではなく、会社の成果や組織づくりにつながる取組として示すことが効果的です。あわせて、義務を果たせない場合には、納付金だけでなく、ハローワークの指導に応じた計画づくりや報告など、実務の負担が何年も続くことを、具体的な流れで伝えます（下の表）。", "general": [["伝える内容", ["法律上の義務：法定雇用率（2026年7月から2.7％）と、未達成の場合の納付金、行政指導、企業名公表（G1-050、G1-051）", "会社にとってのメリット：業務の見直し、多様性のある組織づくり、人材の確保（G1-011）", "同業他社の取組や、自社に近い事例（G5-016）"]], ["義務を果たせない場合に起きること（下の表）", ["納付金を納めても、雇用の義務はなくならない。達成状況が特に低い会社には、ハローワークから2年間の雇入れ計画を作るよう命令が出る", "計画を作って終わりではなく、実施状況の報告、計画どおり進まない場合の勧告、計画期間後の特別指導と、数年にわたって対応が続く", "特別指導では、ハローワークだけでなく労働局の幹部による訪問や、厚生労働省での指導を受けることもある", "それでも改善しない場合は企業名が公表され、採用や取引、社会的な信用に影響する。官公庁などの入札で、参加資格や評価に関わる場合もある", "担当者の手間も大きく、計画書や報告書の作成、指導への対応に、人事や経営層の時間が取られる"]], ["進め方", ["まず経営層・役職者向けの研修や説明会を行い、共通の理解をつくる", "目的（なぜ取り組むのか）を経営層の言葉で社内に発信してもらう", "役職者には、自部署でできる業務の洗い出しなど、具体的な役割を任せる（G3-008）", "小さな成功例をつくり、社内で共有する"]]], "charts": [{"type": "table", "title": "法定雇用率を達成できない場合の流れ", "head": ["段階", "内容", "会社に求められる対応"], "rows": [["毎年の報告", "6月1日時点の障害者の雇用状況を、ハローワークに報告する", "報告書の作成・提出"], ["納付金", "従業員100人を超える会社は、不足1人につき月額5万円（年60万円）", "毎年、JEEDに申告・納付"], ["雇入れ計画作成命令", "達成状況が特に低い会社に、ハローワークが2年間の雇入れ計画の作成を命令", "計画書の作成・提出、実施状況の報告"], ["適正実施勧告", "計画の進み具合が悪い場合に、計画期間中に勧告", "計画の見直し、採用活動の強化"], ["特別指導", "計画期間が終わっても改善しない場合、約9か月の特別指導", "ハローワークや労働局幹部の訪問、厚生労働省での指導への対応"], ["企業名公表", "それでも改善しない場合、厚生労働省が企業名を公表", "採用、取引、社会的な信用への影響"]], "note": "出典：障害者雇用促進法46条・47条、厚生労働省・都道府県労働局の公表資料。対象となる基準や期間は、年度によって変わることがあります。"}], "sources": ["障害者雇用促進法46条（雇入れ計画）・47条（公表）", "東京労働局「障害者雇用率未達成企業への指導」公表資料"], "links": [["東京労働局 公表資料（PDF）", "https://jsite.mhlw.go.jp/tokyo-roudoukyoku/content/contents/001418791.pdf"]], "q": "障害者雇用を進めるために、経営層や役職者の意識を変えるにはどうすればよいですか？", "cat": "理解促進", "st": 4, "kw": "役職者を中心にもっと障害のある方への理解を深めていかないと、現状では障害者雇用は厳しいと思うのですがどうしたらよいでしょうか 社内の理解が得られない、会社のトップが障害者雇用を認めてくれない 経営者として障害者雇用をどのように考え、どのようなことを行えばよいでしょうか？", "body": "伝える内容 法律上の義務：法定雇用率（2026年7月から2.7％）と、未達成の場合の納付金、行政指導、企業名公表（G1-050、G1-051） 会社にとってのメリット：業務の見直し、多様性のある組織づくり、人材の確保（G1-011） 同業他社の取組や、自社に近い事例（G5-016） 義務を果たせない場合に起きること（下の表） 納付金を納めても、雇用の義務はなくならない。達成状況が特に低い会社には、ハローワークから2年間の雇入れ計画を作るよう命令が出る 計画を作って終わりではなく、実施状況の報告、計画どおり進まない場合の勧告、計画期間後の特別指導と、数年にわたって対応が続く 特別指導では、ハローワークだけでなく労働局の幹部による訪問や、厚生労働省での指導を受けることもある それでも改善しない場合は企業名が公表され、採用や取引、社会的な信用に影響する。官公庁などの入札で、参加資格や評価に関わる場合もある 担当者の手間も大きく、計画書や報告書の作成、指導への対応に、人事や経営層の時間が取られる 進め方 まず経営層・役職者向けの研修や説明会を行い、共通の理解をつくる 目的（なぜ取り組むのか）を経営層の言葉で社内に発信してもらう 役職者には、自部署でできる業務の洗い出しなど、具体的な役割を任せる（G3-008） 小さな成功例をつくり、社内で共有する 法定雇用率を達成できない場合の流れ 毎年の報告 6月1日時点の障害者の雇用状況を、ハローワークに報告する 報告書の作成・提出 納付金 従業員100人を超える会社は、不足1人につき月額5万円（年60万円） 毎年、JEEDに申告・納付 雇入れ計画作成命令 達成状況が特に低い会社に、ハローワークが2年間の雇入れ計画の作成を命令 計画書の作成・提出、実施状況の報告 適正実施勧告 計画の進み具合が悪い場合に、計画期間中に勧告 計画の見直し、採用活動の強化 特別指導 計画期間が終わっても改善しない場合、約9か月の特別指導 ハローワークや労働局幹部の訪問、厚生労働省での指導への対応 企業名公表 それでも改善しない場合、厚生労働省が企業名を公表 採用、取引、社会的な信用への影響", "id": "G7-004"}, "G7-005": {"conclusion": "大がかりな準備は必要ありません。部署の会議などで短く目的を伝え、受け入れる人たちから気になっていることを気軽に聞き、「困ったときの相談先」を示すだけでも、現場の安心感は大きく変わります。最初からすべてを決めておく必要はなく、受け入れてから一緒に考えていけばよいことを伝えます。", "general": [["進め方（できるところから）", ["短く伝える：部署の会議や朝礼などの時間を少し使い、なぜ受け入れるのか、どんな仕事をお願いするのかを伝える", "気軽に聞く：上司や一緒に働く人に、気になっていることや不安を聞く。改まった場でなく、普段の会話の中でもよい", "相談先を示す：困ったときに誰に相談すればよいか（人事、支援機関など）を伝える。これだけで安心感が大きく変わる", "全部決めておかなくてよい：分からないことは、受け入れてから本人や支援機関と一緒に考えればよいと伝える", "支援機関の力を借りる：支援機関の担当者が、職場に来て本人の特性や関わり方を説明してくれることもある", "会社全体で大きく進める場合の手順は、G1-010 を参照"]], ["よくある声への答え方", ["「目的がわからない」→ 法定雇用率への対応だけでなく、業務の見直しや働きやすい職場づくりにつながることを伝える（G1-011）", "「過去に苦労した」→ その経験を否定せず、何が足りなかったか（相談先、業務の切り出し、支援機関との連携など）を一緒に振り返り、今回の対策を示す", "「余裕がない」→ 業務の切り出しが、現場の負担を減らすことにもつながると伝える。支援機関の力も借りる"]], ["職場の風土づくり", ["しごとサポーター養成講座など、社員向けの研修を使う（G7-008）", "受け入れ後も、うまくいっていることを共有する"]]], "q": "障害者を現場に配属するにあたり、現場の社員の理解をどう得ればよいですか？", "cat": "理解促進", "st": 4, "kw": "現場の管理職から「過去にメンタル不調の社員対応で苦労した」という懸念が出て、採用に消極的です。どう説明すればよいですか？ 現場から「障害者雇用は法定雇用率のためなのか、多様性のためなのか目的が分からない」という声が出ます。どう説明すればよいですか？ 職場風土醸成はどのようにすればよいのでしょうか 職場風土醸成の具体的な事例を知りたい 経営者や社員の理解を促進したいのですが、何から始めればよいでしょうか 障害者雇用は大切なことと思いますが、日々の仕事に余裕がないため一歩踏み出すことができません。どうしたらよいでしょうか", "body": "進め方（できるところから） 短く伝える：部署の会議や朝礼などの時間を少し使い、なぜ受け入れるのか、どんな仕事をお願いするのかを伝える 気軽に聞く：上司や一緒に働く人に、気になっていることや不安を聞く。改まった場でなく、普段の会話の中でもよい 相談先を示す：困ったときに誰に相談すればよいか（人事、支援機関など）を伝える。これだけで安心感が大きく変わる 全部決めておかなくてよい：分からないことは、受け入れてから本人や支援機関と一緒に考えればよいと伝える 支援機関の力を借りる：支援機関の担当者が、職場に来て本人の特性や関わり方を説明してくれることもある 会社全体で大きく進める場合の手順は、G1-010 を参照 よくある声への答え方 「目的がわからない」→ 法定雇用率への対応だけでなく、業務の見直しや働きやすい職場づくりにつながることを伝える（G1-011） 「過去に苦労した」→ その経験を否定せず、何が足りなかったか（相談先、業務の切り出し、支援機関との連携など）を一緒に振り返り、今回の対策を示す 「余裕がない」→ 業務の切り出しが、現場の負担を減らすことにもつながると伝える。支援機関の力も借りる 職場の風土づくり しごとサポーター養成講座など、社員向けの研修を使う（G7-008） 受け入れ後も、うまくいっていることを共有する", "id": "G7-005"}, "G7-002": {"conclusion": "行動の背景にある障害特性を知ると、「なぜそうなるのか」が理解しやすくなります。本人の同意を得た範囲で、特性と、職場でどう関わればよいかをセットで伝えることが大切です。ただし、すべてを障害のせいにせず、仕事上のルールは同じように守ってもらうことも伝えます。", "general": [["伝え方", ["本人の同意を得て、伝える範囲を決める（G6-044）", "診断名よりも、「どんな場面で、何が起きやすいか」と「どう関わればよいか」を具体的に伝える", "見えている行動（水面上）の背景に、障害特性（水面下）がある、という考え方を共有する"]], ["職場全体で理解を深める", ["精神・発達障害者しごとサポーター養成講座など、社員向けの研修を使う（G7-008）", "支援機関に職場で説明してもらう"]], ["気をつけること", ["「障害だから仕方ない」で終わらせず、配慮と仕事上のルールの両方を伝える", "周囲の社員が負担を一人で抱えないよう、相談先を決めておく（G12-001）"]]], "q": "精神障害による言動について、「性格ではなく障害から来るもの」と職場の理解を深めるには、どうすればよいですか？", "cat": "理解促進", "st": 4, "kw": "", "body": "伝え方 本人の同意を得て、伝える範囲を決める（G6-044） 診断名よりも、「どんな場面で、何が起きやすいか」と「どう関わればよいか」を具体的に伝える 見えている行動（水面上）の背景に、障害特性（水面下）がある、という考え方を共有する 職場全体で理解を深める 精神・発達障害者しごとサポーター養成講座など、社員向けの研修を使う（G7-008） 支援機関に職場で説明してもらう 気をつけること 「障害だから仕方ない」で終わらせず、配慮と仕事上のルールの両方を伝える 周囲の社員が負担を一人で抱えないよう、相談先を決めておく（G12-001）", "id": "G7-002"}, "G7-003": {"conclusion": "不満を言う社員を責めず、まず話を聞くことが大切です。そのうえで、合理的配慮は会社の好意ではなく、法律で会社に義務づけられたルールであること、そして特別扱いではなく、仕事をしやすくするための調整であることを伝えます。周囲の負担が実際に大きい場合は、業務の分担を見直します。", "general": [["前提：合理的配慮は会社の義務", ["障害のある社員への合理的配慮は、障害者雇用促進法で会社に義務づけられている（2016年4月から）（G1-001）", "つまり配慮は、上司や会社の「好意」や「特別扱い」ではなく、会社として行わなければならないルール", "ただし、何でも応じる必要はなく、会社にとって過重な負担にならない範囲で、本人と話し合って決める", "この前提を、管理職だけでなく職場の社員にも知っておいてもらうと、「なぜあの人だけ」という声が出にくくなる"]], ["対応の進め方", ["不満を言う社員から個別に話を聞き、何に困っているかを具体的にする", "配慮は「特別扱い」ではなく、それぞれが力を発揮するための調整であることを伝える。必要なら、誰でも困りごとを相談してよいことも伝える", "本人の同意を得た範囲で、配慮の理由を説明する（G6-072）", "負担が実際に偏っていれば、業務の分担を見直す（G6-023）"]], ["気をつけること", ["不満を我慢させるだけにしない。周囲の社員のケアも行う（G12-001）", "障害のある社員の前で、不満について話さない"]]], "phrases": ["「話してくれてありがとうございます。どんなところで困っているか、もう少し聞かせてください」", "「〇〇さんの配慮は、会社として行うことが法律で決められている、仕事を進めやすくするための調整です。みなさんも困っていることがあれば相談してください」"], "sources": ["障害者雇用促進法36条の2・36条の3（合理的配慮の提供義務）"], "q": "障害のある社員と組む仕事に不満を言う社員や、「なぜあの人だけ配慮されるのか」という声に、どう対応すればよいですか？", "cat": "理解促進", "st": 4, "kw": "周囲の社員から「なぜあの人だけ配慮されるのか」という不満が出ています。", "body": "前提：合理的配慮は会社の義務 障害のある社員への合理的配慮は、障害者雇用促進法で会社に義務づけられている（2016年4月から）（G1-001） つまり配慮は、上司や会社の「好意」や「特別扱い」ではなく、会社として行わなければならないルール ただし、何でも応じる必要はなく、会社にとって過重な負担にならない範囲で、本人と話し合って決める この前提を、管理職だけでなく職場の社員にも知っておいてもらうと、「なぜあの人だけ」という声が出にくくなる 対応の進め方 不満を言う社員から個別に話を聞き、何に困っているかを具体的にする 配慮は「特別扱い」ではなく、それぞれが力を発揮するための調整であることを伝える。必要なら、誰でも困りごとを相談してよいことも伝える 本人の同意を得た範囲で、配慮の理由を説明する（G6-072） 負担が実際に偏っていれば、業務の分担を見直す（G6-023） 気をつけること 不満を我慢させるだけにしない。周囲の社員のケアも行う（G12-001） 障害のある社員の前で、不満について話さない 「話してくれてありがとうございます。どんなところで困っているか、もう少し聞かせてください」 「〇〇さんの配慮は、会社として行うことが法律で決められている、仕事を進めやすくするための調整です。みなさんも困っていることがあれば相談してください」", "id": "G7-003"}, "G7-008": {"conclusion": "障害者雇用全般の知識を身につける方法は、大きく「研修・講習を受ける」と「動画や資料で学ぶ」の二つです。社内で障害者雇用を担う人なら、障害者職業生活相談員の資格認定講習や、ジョブコーチの養成研修が体系的に学べます。まず全体像をつかみたい場合は、エンカレッジの無料eラーニング「Work With Learning」や、公的機関の資料・事例集が手軽です。", "general": [["研修・講習で学ぶ", ["障害者職業生活相談員資格認定講習：障害者雇用の制度、障害特性、相談・指導の方法を学べる。社内の担当者が最初に受けるのにおすすめ（G1-053）", "企業在籍型ジョブコーチ養成研修：自社の社員がジョブコーチの研修を受け、社内で障害のある社員の職場適応を専門的に支える役割を担う（G1-048）", "精神・発達障害者しごとサポーター養成講座：一緒に働く社員が基本を知るための2時間程度の講座", "労働局・ハローワーク・地域障害者職業センターが開く事業主向けセミナー", "どれを受ければよいかの比較はG8-026を参照"]], ["動画で学ぶ", ["Work With Learning（エンカレッジ）：障害者雇用に取り組む企業向けの無料eラーニング。1本5分程度の動画で、法律・制度・実務の「基礎知識編」と、現場の困りごとを扱う「お悩み場面解決編」がある。人事、採用担当、管理職、受け入れ部署の社員など、立場に合わせて学べる"]], ["資料・事例で学ぶ", ["JEED「障害者雇用事例リファレンスサービス」：企業の取組事例と合理的配慮の事例を検索できる", "JEED「職場改善好事例集」や、各種マニュアル", "厚生労働省の合理的配慮指針・差別禁止指針と、そのQ&A", "障害者雇用に積極的な企業の見学：ハローワークや地域の支援団体に相談すると紹介を受けられることがある"]]], "links": [["Work With Learning（エンカレッジ）", "https://en-c.jp/workwith/learning/"], ["JEED 障害者雇用事例リファレンスサービス", "https://www.ref.jeed.go.jp/index.html"], ["JEED 障害者職業生活相談員（資格認定講習）", "https://www.jeed.go.jp/disability/employer/employer04/koshu.html"], ["厚生労働省 精神・発達障害者しごとサポーター", "https://www.mhlw.go.jp/seisakunitsuite/bunya/koyou_roudou/koyou/shougaishakoyou/shigotosupporter/index.html"]], "q": "障害者雇用全般の知識を身につけたい。セミナーや研修、教材にはどのようなものがありますか？", "cat": "理解促進", "st": 4, "kw": "基本的な知識を習得したいのですが、どのような文献を読めばよいでしょうか 障害者雇用に関するDVDを借りたいのですが、どのような手続きが必要でしょうか？ 参考になる本や文献を紹介してほしい 基礎知識に関するセミナーを受講したいのですが、どのようなものがありますか 先進企業を見学したい 合理的配慮の提供について理解を深めるためのセルフチェックシートはありますか？ 精神・発達障害者しごとサポーター養成講座について教えてください。", "body": "研修・講習で学ぶ 障害者職業生活相談員資格認定講習：障害者雇用の制度、障害特性、相談・指導の方法を学べる。社内の担当者が最初に受けるのにおすすめ（G1-053） 企業在籍型ジョブコーチ養成研修：自社の社員がジョブコーチの研修を受け、社内で障害のある社員の職場適応を専門的に支える役割を担う（G1-048） 精神・発達障害者しごとサポーター養成講座：一緒に働く社員が基本を知るための2時間程度の講座 労働局・ハローワーク・地域障害者職業センターが開く事業主向けセミナー どれを受ければよいかの比較はG8-026を参照 動画で学ぶ Work With Learning（エンカレッジ）：障害者雇用に取り組む企業向けの無料eラーニング。1本5分程度の動画で、法律・制度・実務の「基礎知識編」と、現場の困りごとを扱う「お悩み場面解決編」がある。人事、採用担当、管理職、受け入れ部署の社員など、立場に合わせて学べる 資料・事例で学ぶ JEED「障害者雇用事例リファレンスサービス」：企業の取組事例と合理的配慮の事例を検索できる JEED「職場改善好事例集」や、各種マニュアル 厚生労働省の合理的配慮指針・差別禁止指針と、そのQ&A 障害者雇用に積極的な企業の見学：ハローワークや地域の支援団体に相談すると紹介を受けられることがある", "id": "G7-008"}, "G7-021": {"conclusion": "質問をやめさせるのではなく、質問しなくても本人が自分で確認できる仕組みをつくることが大切です。作業の様子を動画に撮る、手順書やメモにまとめるなど、くり返し聞かれる内容をいつでも見返せる形にします。あわせて、質問のしかたやタイミングのルールを一緒に決めます。質問の多さの背景に、不安や理解のしにくさがあることも多いので、その点にも目を向けます。", "general": [["自分で確認できる仕組みをつくる", ["作業の手順を動画で撮影し、本人がいつでも見返せるようにする。言葉や文字より、動きを見たほうが分かりやすい人も多い", "手順書は、写真や図を入れ、作業の順番どおりに並べる", "よく聞かれる内容は、Q&Aとしてまとめ、本人と一緒に付け足していく", "本人がメモを取る時間をとり、その場で一緒に確認する", "「まずこれを見て、それでも分からなければ質問する」という順番を決めておく"]], ["工夫の例", ["質問の時間を決める（例：午前と午後に1回ずつ、まとめて聞く）", "急ぎの質問とそうでない質問を分け、急がないものはメモにためてもらう", "質問する前に確認する資料を決めておく"]], ["伝え方", ["責めずに、「こうしてもらえると助かる」という形で伝える", "質問してくれること自体は良いことだと伝えたうえで、ルールを提案する"]], ["背景にも目を向ける", ["不安が強い、一度で覚えにくい、などの特性がある場合は、指示の出し方や手順書の作り方を見直す（G4-048）", "対応する社員が一人で抱えないよう、質問の窓口を複数にする"]]], "phrases": ["「質問はまとめて、11時と15時に聞いてもらえると助かります」"], "q": "同じ質問が何度も来たり、調べればわかることまで質問されたりして疲れてしまいます。どう伝えればよいですか？", "cat": "日々の関わり方", "st": 4, "kw": "", "body": "自分で確認できる仕組みをつくる 作業の手順を動画で撮影し、本人がいつでも見返せるようにする。言葉や文字より、動きを見たほうが分かりやすい人も多い 手順書は、写真や図を入れ、作業の順番どおりに並べる よく聞かれる内容は、Q&Aとしてまとめ、本人と一緒に付け足していく 本人がメモを取る時間をとり、その場で一緒に確認する 「まずこれを見て、それでも分からなければ質問する」という順番を決めておく 工夫の例 質問の時間を決める（例：午前と午後に1回ずつ、まとめて聞く） 急ぎの質問とそうでない質問を分け、急がないものはメモにためてもらう 質問する前に確認する資料を決めておく 伝え方 責めずに、「こうしてもらえると助かる」という形で伝える 質問してくれること自体は良いことだと伝えたうえで、ルールを提案する 背景にも目を向ける 不安が強い、一度で覚えにくい、などの特性がある場合は、指示の出し方や手順書の作り方を見直す（G4-048） 対応する社員が一人で抱えないよう、質問の窓口を複数にする 「質問はまとめて、11時と15時に聞いてもらえると助かります」", "id": "G7-021"}, "G7-023": {"conclusion": "まず本人の話を受け止めたうえで、具体的な発言や行動と、それが周囲にどう影響しているかを、責めずに伝えます。そのとき、会社や職場として大切にしている考え方とあわせて伝えると、本人も「障害があるから言われている」のではなく、「全員に共通する職場のルール」として受け止めやすくなります。発言の背景に不安や体調の悪さがないかも確認し、周囲の社員が疲れきらないよう、関わる人を分ける工夫もします。", "general": [["本人への関わり方", ["個別に話す場をつくり、「いつ、どんな発言が、周りにどう受け止められているか」を具体的に伝える", "気持ちを話したいときは、決まった相手（上司や相談役）に話すようルールを決める", "不安や体調の悪さが背景にないか確認し、必要なら業務の調整や支援機関への相談をする"]], ["会社や職場の考え方として伝える", ["本人の気持ちや話は、まず否定せずに受け止める", "そのうえで、「この職場では、お互いが気持ちよく働けるよう、前向きな言葉を大切にしている」など、会社や職場として大切にしている考え方を伝える", "障害の有無に関係なく、全員に同じように求めていることだと伝えると、本人も納得しやすい", "職場の行動指針や、チームで決めた約束ごとがあれば、それをもとに説明する。なければ、職場全体で話し合って決めるのもよい"]], ["周囲の社員への配慮", ["一人の社員がいつも聞き役にならないよう、関わる人を分ける", "周囲の社員の負担や気持ちも聞く（G12-001）"]]], "phrases": ["「話してくれてありがとうございます。そう感じているんですね」", "「この職場では、みんなが気持ちよく働けるよう、前向きな言葉で伝え合うことを大切にしています。これは〇〇さんだけでなく、全員にお願いしていることです」"], "q": "悪気はないとわかっていますが、ネガティブな発言や行動で周囲が疲れてしまいます。どう関わればよいですか？", "cat": "日々の関わり方", "st": 4, "kw": "", "body": "本人への関わり方 個別に話す場をつくり、「いつ、どんな発言が、周りにどう受け止められているか」を具体的に伝える 気持ちを話したいときは、決まった相手（上司や相談役）に話すようルールを決める 不安や体調の悪さが背景にないか確認し、必要なら業務の調整や支援機関への相談をする 会社や職場の考え方として伝える 本人の気持ちや話は、まず否定せずに受け止める そのうえで、「この職場では、お互いが気持ちよく働けるよう、前向きな言葉を大切にしている」など、会社や職場として大切にしている考え方を伝える 障害の有無に関係なく、全員に同じように求めていることだと伝えると、本人も納得しやすい 職場の行動指針や、チームで決めた約束ごとがあれば、それをもとに説明する。なければ、職場全体で話し合って決めるのもよい 周囲の社員への配慮 一人の社員がいつも聞き役にならないよう、関わる人を分ける 周囲の社員の負担や気持ちも聞く（G12-001） 「話してくれてありがとうございます。そう感じているんですね」 「この職場では、みんなが気持ちよく働けるよう、前向きな言葉で伝え合うことを大切にしています。これは〇〇さんだけでなく、全員にお願いしていることです」", "id": "G7-023"}, "G7-024": {"conclusion": "まず努力していることを受け止め、そのうえで、会社が期待している成果と、今の状態との差を具体的に伝えます。何をどこまでできればよいのかを本人と一緒に確認し、そこに向けた次の目標と支援を決めます。", "general": [["伝え方の順番", ["努力や取り組みを受け止め、認める", "会社が期待している成果を、具体的な基準で伝える（何を、どのくらい、どの水準で）", "今の状態と期待との差を、事実で伝える", "差を埋めるための次の目標と、会社としての支援（教え方、業務の調整など）を一緒に決める"]], ["気をつけること", ["期待している成果が、そもそも本人に伝わっていたかを振り返る", "努力が報われにくい原因が、業務の合わなさや配慮の不足にないか確認する（G10-049）", "評価の基準は、ほかの社員と同じ考え方で決める（G5-020）"]]], "phrases": ["「〇〇さんが頑張ってくれていることは、よくわかっています。そのうえで、会社として期待していることを一緒に確認させてください」"], "q": "「努力しているのに認められない」と相談されましたが、実際には期待する成果に届いていません。どう返答すればよいですか？", "cat": "日々の関わり方", "st": 4, "kw": "", "body": "伝え方の順番 努力や取り組みを受け止め、認める 会社が期待している成果を、具体的な基準で伝える（何を、どのくらい、どの水準で） 今の状態と期待との差を、事実で伝える 差を埋めるための次の目標と、会社としての支援（教え方、業務の調整など）を一緒に決める 気をつけること 期待している成果が、そもそも本人に伝わっていたかを振り返る 努力が報われにくい原因が、業務の合わなさや配慮の不足にないか確認する（G10-049） 評価の基準は、ほかの社員と同じ考え方で決める（G5-020） 「〇〇さんが頑張ってくれていることは、よくわかっています。そのうえで、会社として期待していることを一緒に確認させてください」", "id": "G7-024"}, "G2-018": {"conclusion": "採用計画は、法定雇用率から必要な人数を出すだけでなく、「どの部署で、どんな仕事を、どんな体制で受け入れるか」まで決めて立てます。退職や定年による減少も見込んで、数年単位で計画します。", "general": [["計画に入れること", ["必要な人数：法定雇用率の引き上げや、従業員数の増減、退職・定年の見込みも含めて計算する（G1-050）", "受け入れ部署と仕事：どの部署で、どんな業務を担ってもらうか（G3-008）", "受け入れ体制：相談役、上司、支援機関との連携（G4-002）", "採用の時期とルート：実習の時期、採用ルート（G2-008）", "雇用形態と労働条件（G4-005）"]], ["気をつけること", ["人数合わせの採用にならないよう、仕事と体制の準備を先に行う", "採用した人が職場になじみ、力を発揮できるペースで計画する。受け入れ部署の体制や、教える人の負担も見ながら、入社の時期や配属先を決める", "採用だけでなく、定着の計画もあわせて立てる（G5-015）"]]], "q": "障害者の採用計画は、どのように考えればよいですか？", "cat": "採用計画とルート", "st": 1, "kw": "採用計画を立てる時の留意点を知りたい", "body": "計画に入れること 必要な人数：法定雇用率の引き上げや、従業員数の増減、退職・定年の見込みも含めて計算する（G1-050） 受け入れ部署と仕事：どの部署で、どんな業務を担ってもらうか（G3-008） 受け入れ体制：相談役、上司、支援機関との連携（G4-002） 採用の時期とルート：実習の時期、採用ルート（G2-008） 雇用形態と労働条件（G4-005） 気をつけること 人数合わせの採用にならないよう、仕事と体制の準備を先に行う 採用した人が職場になじみ、力を発揮できるペースで計画する。受け入れ部署の体制や、教える人の負担も見ながら、入社の時期や配属先を決める 採用だけでなく、定着の計画もあわせて立てる（G5-015）", "id": "G2-018"}, "G2-008": {"conclusion": "障害者の採用ルートには、ハローワークのほか、就労移行支援事業所、特別支援学校、大学のキャリアセンター、民間の人材紹介会社や求人サイトなどがあります。地域の支援機関に相談して、地域に情報を広げてもらう方法もあります。複数のルートを組み合わせるのが一般的です。", "general": [["主な採用ルート", ["ハローワーク（全国に544か所）：障害者専門の窓口で、求人の受付から応募者の紹介、合同面接会の案内、採用後の雇用管理の相談まで無料で対応している。求人は、障害者専用の求人にするか、一般の求人で応募を受け付けるかを選べる（G2-044）。仕事の内容、勤務時間、配慮できることを具体的に書くと、応募者が判断しやすい", "就労移行支援事業所（全国に約3,000か所）：訓練を受けた人を紹介してもらえる。実習の受け入れから始めることが多い（G1-049）", "特別支援学校（全国に約1,200校）：新卒採用。学校の進路指導の担当者に連絡し、2年生・3年生での職場実習を受け入れるところから始めるのが一般的。実習の結果をふまえ、本人・保護者・学校と相談して採用を決める。卒業後の一定期間は、学校が定着の相談に乗ってくれることが多い", "大学のキャリアセンター（全国の大学は約800校）：障害のある学生の就職支援を行っている", "障害者職業能力開発校（国立・都道府県立）：障害のある人に事務やITなどの職業訓練を行う公共の訓練校。必要な技能を持つ人を採用したいときに、訓練生の実習受け入れや修了生の紹介を相談できる。都道府県の一般の職業訓練校（高等技術専門校など）に、障害のある人向けのコースがある場合もある", "民間の人材紹介会社・求人サイト：費用はかかるが、専門職や事務職の人材を探しやすい"]], ["地域の支援機関から情報を広げてもらう", ["地域障害者職業センター（各都道府県に1か所以上、全国47か所と5支所）や、障害者就業・生活支援センター（全国に約340か所）は、地域の支援機関や求職者の情報を持っている", "まずここに問い合わせて求人の内容を伝え、地域の就労移行支援事業所や学校などに情報を広げてもらう方法もある（G8-010）"]]], "sources": ["ハローワークの設置数：労働政策研究・研修機構「データブック国際労働比較」（2025年4月時点）", "障害者就業・生活支援センターの設置数：厚生労働省資料（2023年4月時点 337か所）", "就労移行支援事業所・特別支援学校・大学の数はおおよその数"], "links": [], "q": "ハローワーク以外に、どのような採用ルートがありますか？", "cat": "採用計画とルート", "st": 1, "kw": "支援学校から新卒生を採用したいのですが、どうすればよいでしょうか 採用予定職務に必要な技能を有する障害者を雇いたいときはどうしたらよいでしょうか？（障害者職業能力開発校） 障害者を採用したい、紹介してほしいときはどうしたらいいでしょうか？（ハローワーク） 採用チャネルが複数あり、どれを使えばよいかわかりません。 採用にはどのようなルートがあるのか知りたい 障害者の採用のための募集活動、人材の確保について教えてください。 障害者求人を出す方法を教えてほしい 高等技術専門校とはどのような特徴のある学校ですか", "body": "主な採用ルート ハローワーク（全国に544か所）：障害者専門の窓口で、求人の受付から応募者の紹介、合同面接会の案内、採用後の雇用管理の相談まで無料で対応している。求人は、障害者専用の求人にするか、一般の求人で応募を受け付けるかを選べる（G2-044）。仕事の内容、勤務時間、配慮できることを具体的に書くと、応募者が判断しやすい 就労移行支援事業所（全国に約3,000か所）：訓練を受けた人を紹介してもらえる。実習の受け入れから始めることが多い（G1-049） 特別支援学校（全国に約1,200校）：新卒採用。学校の進路指導の担当者に連絡し、2年生・3年生での職場実習を受け入れるところから始めるのが一般的。実習の結果をふまえ、本人・保護者・学校と相談して採用を決める。卒業後の一定期間は、学校が定着の相談に乗ってくれることが多い 大学のキャリアセンター（全国の大学は約800校）：障害のある学生の就職支援を行っている 障害者職業能力開発校（国立・都道府県立）：障害のある人に事務やITなどの職業訓練を行う公共の訓練校。必要な技能を持つ人を採用したいときに、訓練生の実習受け入れや修了生の紹介を相談できる。都道府県の一般の職業訓練校（高等技術専門校など）に、障害のある人向けのコースがある場合もある 民間の人材紹介会社・求人サイト：費用はかかるが、専門職や事務職の人材を探しやすい 地域の支援機関から情報を広げてもらう 地域障害者職業センター（各都道府県に1か所以上、全国47か所と5支所）や、障害者就業・生活支援センター（全国に約340か所）は、地域の支援機関や求職者の情報を持っている まずここに問い合わせて求人の内容を伝え、地域の就労移行支援事業所や学校などに情報を広げてもらう方法もある（G8-010）", "id": "G2-008"}, "G2-016": {"conclusion": "障害者雇用では、採用の費用だけでなく、配慮に必要な機器や設備、職場環境の整備、受け入れの準備、働き続けるための支援などにも費用や時間がかかります。一方で、こうした費用の多くには、国の助成金や機器の無料貸出しなどの支援制度があります。かかる費用と使える支援をセットで考え、無理のない計画を立てます。", "general": [["かかる費用・時間", ["配慮に必要な機器や設備：画面の読み上げソフト、拡大読書器、手すりやスロープ、作業しやすい机や道具など", "職場環境の整備：休憩できる場所、座席の配置、音や光の調整など", "受け入れの準備：仕事の切り出し、手順書やマニュアルづくり、社内研修", "働き続けるための支援：相談役や上司の時間、定期的な面談、手話通訳などの人の配置、ジョブコーチによる支援", "働き方の調整：通勤の配慮、短時間勤務や通院への対応など"]], ["費用を支える主な支援制度", ["機器や設備：作業施設や設備の整備に使える助成金（JEED）。就労支援機器の無料貸出しもある（G4-035）", "人の配置：職場介助者や手話通訳者の配置・委嘱に使える助成金、ジョブコーチによる支援に使える助成金（JEED）", "雇い入れ：特定求職者雇用開発助成金、トライアル雇用助成金（ハローワーク・労働局）（G2-033）", "正社員への転換：キャリアアップ助成金（障害者正社員化コース）", "外部の支援：支援機関による定着支援や、地域障害者職業センターのジョブコーチ支援は、会社の費用負担なく使えるものが多い", "助成金の詳しい内容と窓口は G1-033 を参照。多くの助成金は、購入や雇い入れの「前」に申請が必要"]], ["考え方", ["かかる費用を洗い出し、使える支援制度と照らし合わせてから計画する", "配慮にかかる費用は、障害のある社員が力を発揮し、長く働いてもらうための投資と考える。定着すれば、採用をくり返す費用も減らせる", "法定雇用率を達成している会社には調整金や報奨金が支給され、達成しない場合は納付金がかかる。こうした点も比較の材料になる（G1-051）"]]], "links": [["厚生労働省 雇用関係助成金一覧", "https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/koyou/kyufukin/index_00057.html"], ["JEED 障害者雇用納付金制度に基づく助成金", "https://www.jeed.go.jp/disability/data/handbook/q2k4vk000003mbox.html"]], "q": "障害者雇用にかかる費用（配慮や受け入れ準備も含めて）は、どう考えればよいですか？", "cat": "採用計画とルート", "st": 1, "kw": "", "body": "かかる費用・時間 配慮に必要な機器や設備：画面の読み上げソフト、拡大読書器、手すりやスロープ、作業しやすい机や道具など 職場環境の整備：休憩できる場所、座席の配置、音や光の調整など 受け入れの準備：仕事の切り出し、手順書やマニュアルづくり、社内研修 働き続けるための支援：相談役や上司の時間、定期的な面談、手話通訳などの人の配置、ジョブコーチによる支援 働き方の調整：通勤の配慮、短時間勤務や通院への対応など 費用を支える主な支援制度 機器や設備：作業施設や設備の整備に使える助成金（JEED）。就労支援機器の無料貸出しもある（G4-035） 人の配置：職場介助者や手話通訳者の配置・委嘱に使える助成金、ジョブコーチによる支援に使える助成金（JEED） 雇い入れ：特定求職者雇用開発助成金、トライアル雇用助成金（ハローワーク・労働局）（G2-033） 正社員への転換：キャリアアップ助成金（障害者正社員化コース） 外部の支援：支援機関による定着支援や、地域障害者職業センターのジョブコーチ支援は、会社の費用負担なく使えるものが多い 助成金の詳しい内容と窓口は G1-033 を参照。多くの助成金は、購入や雇い入れの「前」に申請が必要 考え方 かかる費用を洗い出し、使える支援制度と照らし合わせてから計画する 配慮にかかる費用は、障害のある社員が力を発揮し、長く働いてもらうための投資と考える。定着すれば、採用をくり返す費用も減らせる 法定雇用率を達成している会社には調整金や報奨金が支給され、達成しない場合は納付金がかかる。こうした点も比較の材料になる（G1-051）", "id": "G2-016"}, "G2-002": {"conclusion": "障害者雇用では、仕事の内容と同じくらい、職場との相性が大切です。求人票だけで伝えようとするより、職場見学や実習で実際に現場を見に来てもらい、一緒に働く人や職場の雰囲気を知ってもらうことが、魅力を伝えるいちばんの近道です。仕事の内容だけでなく、「どんな人と、どんな職場で働くか」を中心に伝え、障害のある社員の声も紹介すると、働くイメージを持ってもらいやすくなります。", "general": [["現場を見に来てもらう", ["職場見学会や実習を案内し、実際の職場や仕事を見てもらう（G2-040、G2-033）", "本人にとっては「ここで働けそうか」、会社にとっては「この職場に合いそうか」を、お互いに確かめる機会になる", "見学や実習で気になった点は、配慮や仕事の分け方で調整できないかを一緒に考える。相性を調整していく過程そのものが、会社の魅力として伝わる"]], ["人と職場を中心に伝える", ["仕事の内容だけでなく、一緒に働く人、相談できる人、職場の雰囲気を伝える", "上司や先輩がどんな人か、困ったときにどう支えているかを、具体的な場面で伝える", "働きやすさの工夫（休憩の取り方、通院への配慮、相談の仕組みなど）も、職場の様子とあわせて示す"]], ["障害のある社員の声を伝える", ["実際に働いている障害のある社員のインタビューや1日の流れを、ホームページや説明会で紹介する（本人の同意を得て）", "「入社前に不安だったこと」「働いてみてよかったこと」「どんな配慮を受けているか」など、本人の言葉で伝えると、求職者が働くイメージを持ちやすい"]], ["求人票で伝えること", ["仕事の内容：1日の流れ、具体的な作業", "働き方：勤務時間、休憩、通院への配慮、在宅勤務の可否など", "長く働けること：キャリアの道（正社員登用など）", "条件が厳しい仕事（早朝勤務、立ち仕事など）は隠さずに書き、配慮できることもあわせて示す"]], ["情報の届け方", ["ハローワークだけでなく、就労移行支援事業所、特別支援学校、障害者就業・生活支援センターなどに直接情報を届ける（G2-008）", "合同面接会に参加する"]]], "q": "求人票や会社説明会で、障害のある求職者に魅力が伝わりません。どう工夫すればよいですか？応募を増やすには？", "cat": "採用計画とルート", "st": 1, "kw": "応募を増やすために、求人をどのように周知すればよいですか？ 従事業務はゴルフ場コース管理で、早朝出勤があり、終日アウトドアで立ち仕事もあるため、求人を出してもなかなか応募がなく、定着率もよくない状況です。何かよい対策はありますか。また、同じような業種の雇用事例があれば紹介してほしいです。", "body": "現場を見に来てもらう 職場見学会や実習を案内し、実際の職場や仕事を見てもらう（G2-040、G2-033） 本人にとっては「ここで働けそうか」、会社にとっては「この職場に合いそうか」を、お互いに確かめる機会になる 見学や実習で気になった点は、配慮や仕事の分け方で調整できないかを一緒に考える。相性を調整していく過程そのものが、会社の魅力として伝わる 人と職場を中心に伝える 仕事の内容だけでなく、一緒に働く人、相談できる人、職場の雰囲気を伝える 上司や先輩がどんな人か、困ったときにどう支えているかを、具体的な場面で伝える 働きやすさの工夫（休憩の取り方、通院への配慮、相談の仕組みなど）も、職場の様子とあわせて示す 障害のある社員の声を伝える 実際に働いている障害のある社員のインタビューや1日の流れを、ホームページや説明会で紹介する（本人の同意を得て） 「入社前に不安だったこと」「働いてみてよかったこと」「どんな配慮を受けているか」など、本人の言葉で伝えると、求職者が働くイメージを持ちやすい 求人票で伝えること 仕事の内容：1日の流れ、具体的な作業 働き方：勤務時間、休憩、通院への配慮、在宅勤務の可否など 長く働けること：キャリアの道（正社員登用など） 条件が厳しい仕事（早朝勤務、立ち仕事など）は隠さずに書き、配慮できることもあわせて示す 情報の届け方 ハローワークだけでなく、就労移行支援事業所、特別支援学校、障害者就業・生活支援センターなどに直接情報を届ける（G2-008） 合同面接会に参加する", "id": "G2-002"}, "G2-044": {"conclusion": "募集・採用では、障害があることを理由に、応募の機会を与えないことや、障害のない人と異なる条件をつけることが禁止されています。一方で、障害のある人だけを対象にした求人（障害者専用求人）は、障害のある人の雇用の機会を広げるための取組として法律上認められており、差別にはあたりません。", "general": [["禁止される例", ["障害者であることを理由に、応募を受け付けない、採用の対象から外す", "障害者だけに、不利な条件（特別な資格や試験など）をつける", "採用基準を満たす人の中から、障害のない人を優先して採用する", "業務に必要のない「心身ともに健全な方」などの要件を設ける"]], ["差別にあたらないもの", ["障害者専用求人を出すこと（障害のある人の雇用の機会を広げるための取組として認められている）", "合理的配慮を提供したうえで、能力を適正に評価した結果、不採用とすること", "障害者専用求人と一般求人で処遇が異なる場合は、仕事の内容や責任の違いなど合理的な理由が必要"]], ["あわせて考えること", ["障害の有無にかかわらず一般の求人で募集し、応募者が障害を開示するかどうかを選べるようにする方法もある", "面接などの採用選考では、本人の申し出に応じて合理的配慮を行う（試験時間の延長、筆談など）"]]], "sources": ["障害者雇用促進法34条・36条の2", "障害者差別禁止指針（厚生労働省）"], "links": [["厚生労働省 障害者差別禁止・合理的配慮に関するQ&A（PDF）", "https://www.mhlw.go.jp/file/06-Seisakujouhou-11600000-Shokugyouanteikyoku/0000121387.pdf"]], "q": "募集・採用時に禁止される差別行為の具体例を教えてください。", "cat": "面接と差別禁止", "st": 1, "kw": "「心身ともに健全な方」という応募要件は問題になりますか？ 障害者専用の求人を出すことや、その際の処遇差は違反になりますか？ 障がいの有無に関係なく雇用する予定であり、障がい者枠で募集することは考えていません。 合理的配慮を提供した上で、能力評価の結果として不採用とすることは問題ありませんか？", "body": "禁止される例 障害者であることを理由に、応募を受け付けない、採用の対象から外す 障害者だけに、不利な条件（特別な資格や試験など）をつける 採用基準を満たす人の中から、障害のない人を優先して採用する 業務に必要のない「心身ともに健全な方」などの要件を設ける 差別にあたらないもの 障害者専用求人を出すこと（障害のある人の雇用の機会を広げるための取組として認められている） 合理的配慮を提供したうえで、能力を適正に評価した結果、不採用とすること 障害者専用求人と一般求人で処遇が異なる場合は、仕事の内容や責任の違いなど合理的な理由が必要 あわせて考えること 障害の有無にかかわらず一般の求人で募集し、応募者が障害を開示するかどうかを選べるようにする方法もある 面接などの採用選考では、本人の申し出に応じて合理的配慮を行う（試験時間の延長、筆談など）", "id": "G2-044"}, "G2-006": {"conclusion": "面接では、仕事をするうえで必要な配慮を知るために、障害の状況や必要な配慮を聞くことは問題ありません。ただし、聞く目的を伝え、本人が答えたくないことを無理に聞かないことが大切です。聞いた情報は採用選考と配慮の検討のためだけに使い、社内で共有する範囲は本人と決めます。", "general": [["聞いてよいこと", ["仕事をするうえで困ること、得意なこと・苦手なこと", "必要な配慮（勤務時間、通院、作業環境、コミュニケーションの方法など）", "体調管理の方法や、支援機関の利用状況"]], ["注意すること", ["なぜ聞くのか（配慮を考えるため）を先に伝える", "診断名や病歴を詳しく聞く必要はない。仕事に関係することに絞る", "家族の状況や、思想・信条など、仕事に関係のないことは聞かない", "答えたくないことには答えなくてよいと伝える"]], ["情報の扱い", ["障害に関する情報は「要配慮個人情報（病歴や障害など、特に慎重に扱う必要がある個人情報）」。取得するときは本人の同意を得る", "社内で誰にどこまで共有するかを本人と決める（G10-068）", "不採用になった人の情報は、目的を果たしたら適切に廃棄する"]]], "phrases": ["「入社後に働きやすい環境を整えるために、差し支えない範囲で教えてください」", "「答えにくいことは、答えなくても大丈夫です」"], "sources": ["個人情報保護法20条2項（要配慮個人情報の取得）", "職業安定法5条の5（求職者の個人情報の取扱い）"], "links": [["厚生労働省 障害者差別禁止・合理的配慮に関するQ&A（PDF）", "https://www.mhlw.go.jp/file/06-Seisakujouhou-11600000-Shokugyouanteikyoku/0000121387.pdf"]], "q": "質問が原因で応募者を不快にさせないか不安です。障害者差別の禁止のことも気になります。面接で、どこまで障害のことを聞いてよいですか？", "cat": "面接と差別禁止", "st": 1, "kw": "面接でどこまで障害について踏み込んで聞いてよいのかわかりません。 採用の際に個人情報の取扱いが気になります 応募者の方に、障害についてどこまでオープンに話してもらうべきか、また、その情報を社内のどこまで共有すべきか悩んでいます。適切な対応方法を教えてください。", "body": "聞いてよいこと 仕事をするうえで困ること、得意なこと・苦手なこと 必要な配慮（勤務時間、通院、作業環境、コミュニケーションの方法など） 体調管理の方法や、支援機関の利用状況 注意すること なぜ聞くのか（配慮を考えるため）を先に伝える 診断名や病歴を詳しく聞く必要はない。仕事に関係することに絞る 家族の状況や、思想・信条など、仕事に関係のないことは聞かない 答えたくないことには答えなくてよいと伝える 情報の扱い 障害に関する情報は「要配慮個人情報（病歴や障害など、特に慎重に扱う必要がある個人情報）」。取得するときは本人の同意を得る 社内で誰にどこまで共有するかを本人と決める（G10-068） 不採用になった人の情報は、目的を果たしたら適切に廃棄する 「入社後に働きやすい環境を整えるために、差し支えない範囲で教えてください」 「答えにくいことは、答えなくても大丈夫です」", "id": "G2-006"}, "G2-007": {"conclusion": "面接は、「必要な配慮を聞く場」であると同時に、「本人が自分の特性をどれだけ理解しているかを見極める場」です。「スキル・経験」「必要な配慮とその背景」「自己理解の度合い」の3つの軸で確認し、「何に困るか」だけでなく、「なぜ困るか」「調子を崩す前にどんなサインがあり、どう対処しているか」まで掘り下げて聞きます。面接で確認しきれなかったことは記録して入社前・入社後に引き継ぎ、支援機関の情報や職場実習も組み合わせて判断します。", "general": [["確認する3つの軸", ["スキル・経験：一般の面接と同じく、業務に必要な力があるか", "必要な配慮とその背景：何に困るか、なぜ困るか、どう対処しているか", "自己理解の度合い：自分の特性をどれだけ客観的に言葉にできているか"]], ["質問の工夫", ["「困ったときどうしていますか」ではなく、「困りそうな場面を、自分でどう予測していますか」と、本人の主体性を確認する", "調子を崩す前のサイン（予兆）と、そのときの自分の対処法まで聞く。答えの具体さから、自己理解の度合いが見えてくる", "答えに対して「それはどうしてですか」と、一段掘り下げる", "抽象的な答えには、具体的な例を挙げてもらう", "在宅勤務やフレックスなどの希望は、「それがないと、どんな困りごとが起きますか？」と聞き、「働き方の希望」か「特性上必要な配慮」かを区別する", "具体的な質問の例は G4-004 も参照"]], ["話しやすい面接にする工夫", ["緊張しやすい人には、質問を紙や画面で示す、考える時間をとるなど、答えやすい形にする", "沈黙があっても、すぐに次の質問に移らず、「ゆっくりで大丈夫です」と待つ。言い換えて聞き直すのもよい", "オンライン面接では、表情や間が読み取りにくい前提で、気になる点は言葉で確認する", "本人が希望すれば、支援機関の担当者に同席してもらう"]], ["面接の準備と判断", ["本人・支援機関・社内の情報を事前に整理し、面接で聞くことを一覧にしておく", "配属予定の上司の同席や、面接環境（音・光・座席）の配慮を準備する", "配慮の要望は、その場で即答せず、持ち帰って考える", "本人の同意を得て支援機関から情報を得る。職場実習やトライアル雇用で相性を確かめる（G2-040、G2-033）", "面接で確認できたこと・できなかったことを記録し、内定〜入社前の準備や配属先への引き継ぎに使う（G2-026）。面接は確認の「入口」と考え、確認しきれなかった点は入社前・入社後に確認を続ける"]], ["聞いてはいけないこと", ["業務に関係のない家族のことや、思想・信条などは聞かない。聞いてよい範囲はG2-006を参照"]]], "charts": [{"type": "table", "title": "実務のチェックポイント（募集・選考）", "head": ["区分", "項目", "確認すること"], "rows": [["面接の前", "事前の情報整理", "応募書類、支援機関からの情報などを整理し、「確認済みのこと」と「面接で聞くこと」を分けているか"], ["面接の前", "面接の準備", "同席者（配属予定の上司など）と、面接の環境（音・光・座席、オンラインのときの配慮）を準備しているか"], ["面接の前", "筆記試験・適性検査", "受け方の配慮（文字の拡大、読み上げ、時間の延長、別室など）の希望を事前に聞いているか。業務に必要な力を測る内容か。結果だけで判断せず、面接や実習とあわせて判断しているか"], ["面接の中", "3つの軸", "「スキル・経験」「必要な配慮とその背景」「自分の特性をどこまで理解しているか」の3つで質問を用意しているか"], ["面接の中", "配慮の背景", "「何に困るか」だけでなく、「なぜ困るか」「自分でどう対処しているか」まで聞いているか"], ["面接の中", "もう一段の掘り下げ", "一問一答で終わらせず、答えや沈黙に対して「それはどうしてですか」と掘り下げているか"], ["面接の中", "希望と配慮の区別", "在宅勤務やフレックスなどが、「働き方の希望」か「特性上必要な配慮」かを区別しているか"], ["面接の後", "その場で約束しない", "配慮の希望は、その場で約束せず「持ち帰って社内で考える」と伝えているか"], ["面接の後", "過重な負担の判断", "費用だけでなく、頻度、ほかの方法があるか、ほかの社員への影響も含めて判断しているか"]], "note": "ほかの段階のチェックポイントは G1-010 に一覧があります。", "xlsx": "tools/checklist-03-mensetsu.xlsx", "xlsx_name": "03_募集・選考チェックリスト.xlsx", "check": true}], "q": "面接では、どのような質問をすれば、本人の能力や必要な配慮をつかみ、ミスマッチを防げますか？", "cat": "面接と差別禁止", "st": 1, "kw": "面接のポイントを教えてほしい 面接で特に考慮して確認すべき点を教えてほしい 採用選考はどのような方法で実施したらよいでしょうか？また、採用面接時に特に配慮するべきことはありますか？ 面接において、障害特性別に留意すべき点を教えてほしい 自社でハローワークに障がい者求人を出したところ、てんかんの方から問い合わせがありました。面接などの対応やてんかんのことについて知りたいです。 障害者の採用にあたり、何をポイントに採否を決めたらよいでしょうか？ 定着しやすい方を見極めるポイントはありますか？ 面接において、支援者から情報を得ることは必要ですか マッチングをうまく進めるためにはどうすればよいでしょうか。採用してもすぐ辞めてしまう場合があるため、適性のある人と巡り合う方法を教えてほしいです。 障がい者の特性がわからず適職がマッチングできません。請負業務で大手化粧品の箱詰め・梱包・出荷作業で知的障がい者1名を雇用しています。さらに人材の確保と雇用率達成の観点から合同面接会等で求人を出していますがマッチングできていないため、長期安定雇用に向けた求人支援を相談したいです。", "body": "確認する3つの軸 スキル・経験：一般の面接と同じく、業務に必要な力があるか 必要な配慮とその背景：何に困るか、なぜ困るか、どう対処しているか 自己理解の度合い：自分の特性をどれだけ客観的に言葉にできているか 質問の工夫 「困ったときどうしていますか」ではなく、「困りそうな場面を、自分でどう予測していますか」と、本人の主体性を確認する 調子を崩す前のサイン（予兆）と、そのときの自分の対処法まで聞く。答えの具体さから、自己理解の度合いが見えてくる 答えに対して「それはどうしてですか」と、一段掘り下げる 抽象的な答えには、具体的な例を挙げてもらう 在宅勤務やフレックスなどの希望は、「それがないと、どんな困りごとが起きますか？」と聞き、「働き方の希望」か「特性上必要な配慮」かを区別する 具体的な質問の例は G4-004 も参照 話しやすい面接にする工夫 緊張しやすい人には、質問を紙や画面で示す、考える時間をとるなど、答えやすい形にする 沈黙があっても、すぐに次の質問に移らず、「ゆっくりで大丈夫です」と待つ。言い換えて聞き直すのもよい オンライン面接では、表情や間が読み取りにくい前提で、気になる点は言葉で確認する 本人が希望すれば、支援機関の担当者に同席してもらう 面接の準備と判断 本人・支援機関・社内の情報を事前に整理し、面接で聞くことを一覧にしておく 配属予定の上司の同席や、面接環境（音・光・座席）の配慮を準備する 配慮の要望は、その場で即答せず、持ち帰って考える 本人の同意を得て支援機関から情報を得る。職場実習やトライアル雇用で相性を確かめる（G2-040、G2-033） 面接で確認できたこと・できなかったことを記録し、内定〜入社前の準備や配属先への引き継ぎに使う（G2-026）。面接は確認の「入口」と考え、確認しきれなかった点は入社前・入社後に確認を続ける 聞いてはいけないこと 業務に関係のない家族のことや、思想・信条などは聞かない。聞いてよい範囲はG2-006を参照 実務のチェックポイント（募集・選考） 事前の情報整理 応募書類、支援機関からの情報などを整理し、「確認済みのこと」と「面接で聞くこと」を分けているか 面接の準備 同席者（配属予定の上司など）と、面接の環境（音・光・座席、オンラインのときの配慮）を準備しているか 筆記試験・適性検査 受け方の配慮（文字の拡大、読み上げ、時間の延長、別室など）の希望を事前に聞いているか。業務に必要な力を測る内容か。結果だけで判断せず、面接や実習とあわせて判断しているか 3つの軸 「スキル・経験」「必要な配慮とその背景」「自分の特性をどこまで理解しているか」の3つで質問を用意しているか 配慮の背景 「何に困るか」だけでなく、「なぜ困るか」「自分でどう対処しているか」まで聞いているか もう一段の掘り下げ 一問一答で終わらせず、答えや沈黙に対して「それはどうしてですか」と掘り下げているか 希望と配慮の区別 在宅勤務やフレックスなどが、「働き方の希望」か「特性上必要な配慮」かを区別しているか その場で約束しない 配慮の希望は、その場で約束せず「持ち帰って社内で考える」と伝えているか 過重な負担の判断 費用だけでなく、頻度、ほかの方法があるか、ほかの社員への影響も含めて判断しているか", "id": "G2-007"}, "G2-040": {"conclusion": "職場実習は、本人と会社が、実際の仕事を通じてお互いを知るための機会です。雇用契約を結ばない実習であれば、給与を支払う必要はなく、実習をしたからといって必ず採用する必要もありません。", "general": [["実習の目的", ["本人：仕事の内容や職場の雰囲気を知り、自分に合うかを確かめる", "会社：本人の得意・不得意、必要な配慮を知り、仕事との相性を確かめる", "職場の社員：障害のある人と一緒に働く経験を積み、理解を深める"]], ["受け入れ方", ["就労移行支援事業所、特別支援学校、ハローワーク、地域障害者職業センターなどに相談して受け入れる", "実習の目的、期間、内容、時間、担当者を、送り出す機関と事前に決めておく", "実習中のけがに備え、送り出す機関の保険の加入状況を確認する"]], ["よくある疑問", ["給与：雇用契約を結ばない実習では不要。ただし、実質的に労働とみなされる場合は賃金の支払いが必要になる", "採用の義務：ない。実習の結果を見て判断してよい。結果は本人と送り出す機関に丁寧に伝える", "実習で採用の目安をつけること：問題ない。ただし面接など選考の機会は公平に設ける"]], ["行政のサポート", ["障害者トライアル雇用（雇用して試す制度。助成金あり）（G2-033）", "ジョブコーチ支援（G1-048）、職場適応訓練（都道府県）など"]]], "sources": ["労働基準法9条（労働者の定義）"], "q": "職場実習を受け入れるとき、給与は必要ですか？実習をしたら採用しなければいけませんか？", "cat": "職場実習・トライアル雇用", "st": 1, "kw": "実習の受入時や新規雇用時の行政のサポートはありますか 実習を受け入れることも社内理解を図る上で効果があると聞きました。どのようにすれば実習を受け入れることができるのでしょうか 実習はどのような目的で行うのでしょうか どうすれば実習を受け入れることができますか 実習すれば、必ず採用しなければならないのでしょうか 職場体験実習で、ある程度採用したい人の目途をつけてもよいのでしょうか。明らかに不採用であろう方については面接をしなくてもよいのでしょうか。 実習の受入時や、新規雇用時には支援機関のサポート等をお願いしたい", "body": "実習の目的 本人：仕事の内容や職場の雰囲気を知り、自分に合うかを確かめる 会社：本人の得意・不得意、必要な配慮を知り、仕事との相性を確かめる 職場の社員：障害のある人と一緒に働く経験を積み、理解を深める 受け入れ方 就労移行支援事業所、特別支援学校、ハローワーク、地域障害者職業センターなどに相談して受け入れる 実習の目的、期間、内容、時間、担当者を、送り出す機関と事前に決めておく 実習中のけがに備え、送り出す機関の保険の加入状況を確認する よくある疑問 給与：雇用契約を結ばない実習では不要。ただし、実質的に労働とみなされる場合は賃金の支払いが必要になる 採用の義務：ない。実習の結果を見て判断してよい。結果は本人と送り出す機関に丁寧に伝える 実習で採用の目安をつけること：問題ない。ただし面接など選考の機会は公平に設ける 行政のサポート 障害者トライアル雇用（雇用して試す制度。助成金あり）（G2-033） ジョブコーチ支援（G1-048）、職場適応訓練（都道府県）など", "id": "G2-040"}, "G2-001": {"conclusion": "実習の目的、期間、内容、担当者を、送り出す機関（就労移行支援事業所、特別支援学校など）と事前に決めておきます。実習で何を確かめたいかをはっきりさせ、本人にとっても会社にとっても判断材料になる実習にします。", "general": [["事前に決めること", ["目的：採用を前提にした実習か、職場を知るための実習か", "期間と時間：日数、1日の勤務時間", "内容：どの作業を、どの順番で体験してもらうか。易しい作業から始め、少しずつ実際の業務に近づける", "担当者：指示を出す人、相談役を決める", "評価のしかた：何を見るか（正確さ、速さ、指示の理解、体調の安定など）を決めておく"]], ["準備すること", ["作業の手順書やチェックリスト", "職場の社員への説明（実習生が来ること、関わり方）", "けがに備えた保険の確認（送り出す機関に確認する）（G2-040）"]], ["実習中・実習後", ["毎日の終わりに、本人と短く振り返る", "実習の最後に、本人・送り出す機関と一緒に振り返り、結果を伝える"]]], "charts": [{"type": "table", "title": "実務のチェックポイント（職場実習・見学の受け入れ）", "head": ["時期", "項目", "確認すること"], "rows": [["受け入れ前", "目的の共有", "採用を前提にした実習か、職場を知るための実習かを、本人・送り出す機関・社内で共有しているか"], ["受け入れ前", "確かめたいこと", "実習で何を確かめたいか（作業への向き不向き、体力、職場との相性など）を決めているか"], ["受け入れ前", "内容と順番", "体験してもらう作業と順番を決め、易しい作業から実際の業務に近づける計画になっているか"], ["受け入れ前", "担当者", "指示を出す人と相談役を決め、不在のときの代わりも決めているか"], ["受け入れ前", "事前の情報", "本人の得意・苦手、必要な配慮、体調面で気をつけることを、送り出す機関から聞いているか（本人の同意を得て）"], ["受け入れ前", "職場への説明", "実習生が来ること、関わり方、困ったときの相談先を、職場の社員に伝えているか"], ["受け入れ前", "手続き", "保険、通勤方法、持ち物、服装、初日の集合場所と時間を、送り出す機関と確認しているか（G2-040）"], ["実習中", "毎日の振り返り", "1日の終わりに、本人とその日できたこと・困ったことを短く振り返っているか"], ["実習中", "観察と記録", "あらかじめ決めた見るポイント（正確さ、速さ、指示の理解、疲れ方など）で様子を記録しているか"], ["実習中", "調整", "うまくいかない作業があれば、教え方や作業の分け方を変えて試しているか"], ["実習後", "振り返りの場", "本人・送り出す機関と一緒に振り返り、よかった点と課題を具体的に伝えているか"], ["実習後", "次の判断", "採用するかどうか、追加の実習が必要かなどの判断と、その理由を本人と送り出す機関に伝えているか"], ["実習後", "引き継ぎ", "採用する場合、実習で分かった配慮や教え方を記録し、配属先に引き継いでいるか（G5-023）"]], "note": "ほかの段階のチェックポイントは G1-010 に一覧があります。", "check": true, "xlsx": "tools/checklist-04-jisshu.xlsx", "xlsx_name": "04_職場実習受け入れチェックリスト.xlsx"}], "q": "職場実習や見学を受け入れるとき、事前に何を準備すればよいですか？", "cat": "職場実習・トライアル雇用", "st": 1, "kw": "知的障害のある方のお試し勤務（職場実習）を受け入れる時のポイントは何ですか？ 採用候補者の方に実習に来ていただくことになりました。本人にとっても企業にとっても有意義な実習にするために、どのように実習プログラムを組み立てれば良いでしょうか？ 実習時の注意点を教えてほしい", "body": "事前に決めること 目的：採用を前提にした実習か、職場を知るための実習か 期間と時間：日数、1日の勤務時間 内容：どの作業を、どの順番で体験してもらうか。易しい作業から始め、少しずつ実際の業務に近づける 担当者：指示を出す人、相談役を決める 評価のしかた：何を見るか（正確さ、速さ、指示の理解、体調の安定など）を決めておく 準備すること 作業の手順書やチェックリスト 職場の社員への説明（実習生が来ること、関わり方） けがに備えた保険の確認（送り出す機関に確認する）（G2-040） 実習中・実習後 毎日の終わりに、本人と短く振り返る 実習の最後に、本人・送り出す機関と一緒に振り返り、結果を伝える 実務のチェックポイント（職場実習・見学の受け入れ） 受け入れ前 目的の共有 採用を前提にした実習か、職場を知るための実習かを、本人・送り出す機関・社内で共有しているか 受け入れ前 確かめたいこと 実習で何を確かめたいか（作業への向き不向き、体力、職場との相性など）を決めているか 受け入れ前 内容と順番 体験してもらう作業と順番を決め、易しい作業から実際の業務に近づける計画になっているか 受け入れ前 担当者 指示を出す人と相談役を決め、不在のときの代わりも決めているか 受け入れ前 事前の情報 本人の得意・苦手、必要な配慮、体調面で気をつけることを、送り出す機関から聞いているか（本人の同意を得て） 受け入れ前 職場への説明 実習生が来ること、関わり方、困ったときの相談先を、職場の社員に伝えているか 受け入れ前 手続き 保険、通勤方法、持ち物、服装、初日の集合場所と時間を、送り出す機関と確認しているか（G2-040） 実習中 毎日の振り返り 1日の終わりに、本人とその日できたこと・困ったことを短く振り返っているか 実習中 観察と記録 あらかじめ決めた見るポイント（正確さ、速さ、指示の理解、疲れ方など）で様子を記録しているか 実習中 調整 うまくいかない作業があれば、教え方や作業の分け方を変えて試しているか 実習後 振り返りの場 本人・送り出す機関と一緒に振り返り、よかった点と課題を具体的に伝えているか 実習後 次の判断 採用するかどうか、追加の実習が必要かなどの判断と、その理由を本人と送り出す機関に伝えているか 実習後 引き継ぎ 採用する場合、実習で分かった配慮や教え方を記録し、配属先に引き継いでいるか（G5-023）", "id": "G2-001"}, "G2-033": {"conclusion": "障害者トライアル雇用は、障害のある人を原則3か月（精神障害者は原則6か月）試行的に雇用し、仕事との相性を確かめてから継続雇用につなげる制度です。試行期間という区切りがあるので、会社も本人も安心して始められ、期間中は助成金も受け取れます。", "general": [["使うメリット", ["仕事との相性を確かめられる：実際に働いてもらい、任せる仕事や職場環境が本人に合っているかを、会社と本人の双方が確かめられる", "一度区切りをつけられる：試行期間の終わりに、本人と話し合って継続雇用するかを決められる。初めての障害者雇用でも始めやすい", "配慮や受け入れ体制を試しながら整えられる：期間中に必要な配慮や教え方を見つけ、本採用後に生かせる", "助成金を受け取れる（下記）"]], ["助成の内容", ["精神障害者：月額最大8万円（最初の3か月）、その後月額最大4万円（3か月）", "精神障害者以外：月額最大4万円（原則3か月）", "週20時間以上の勤務が難しい精神・発達障害者を対象にした「短時間トライアルコース」もある（月額最大4万円、最長12か月）"]], ["使い方", ["ハローワークなどの紹介で雇い入れる必要がある", "トライアル期間中も雇用契約を結ぶので、賃金や社会保険などは通常どおり", "期間の終わりに、本人と話し合って継続雇用するかを決める"]]], "sources": ["トライアル雇用助成金（障害者トライアルコース・障害者短時間トライアルコース）"], "q": "障害者トライアル雇用とは、どんな制度ですか？使うメリットは何ですか？", "cat": "職場実習・トライアル雇用", "st": 1, "kw": "", "body": "使うメリット 仕事との相性を確かめられる：実際に働いてもらい、任せる仕事や職場環境が本人に合っているかを、会社と本人の双方が確かめられる 一度区切りをつけられる：試行期間の終わりに、本人と話し合って継続雇用するかを決められる。初めての障害者雇用でも始めやすい 配慮や受け入れ体制を試しながら整えられる：期間中に必要な配慮や教え方を見つけ、本採用後に生かせる 助成金を受け取れる（下記） 助成の内容 精神障害者：月額最大8万円（最初の3か月）、その後月額最大4万円（3か月） 精神障害者以外：月額最大4万円（原則3か月） 週20時間以上の勤務が難しい精神・発達障害者を対象にした「短時間トライアルコース」もある（月額最大4万円、最長12か月） 使い方 ハローワークなどの紹介で雇い入れる必要がある トライアル期間中も雇用契約を結ぶので、賃金や社会保険などは通常どおり 期間の終わりに、本人と話し合って継続雇用するかを決める", "id": "G2-033"}, "G2-026": {"conclusion": "入社までの期間は、受け入れの準備を整える大切な期間です。労働条件と仕事の内容を確定し、配慮の内容を書面にまとめ、社内の支援体制と職場への説明を整えておきます。", "general": [["準備すること", ["労働条件：雇用形態、勤務時間、賃金、契約期間を労働条件通知書で示す（G4-005）", "仕事の内容：最初に任せる業務と、手順書", "配慮の内容：面接で聞いた配慮を書面にまとめ、誰に・どこまで伝えるかを決める（G5-023）", "支援体制：相談役、上司、人事の役割分担と、支援機関との連絡方法（G4-002）", "職場環境：座席、使う道具やソフトの準備", "職場への説明：いつ、誰が、どこまで伝えるかを決めて、入社前に行う"]], ["社内の制度", ["就業規則や人事評価、健康管理の制度は、基本はほかの社員と同じものを使う", "通院のための休暇や勤務時間の調整など、必要な配慮が制度で対応できるか確認する"]], ["本人との事前確認", ["業務内容、通勤経路、入社後の予定を、入社前に本人と確認する"]]], "charts": [{"type": "table", "title": "実務のチェックポイント（内定〜入社前）", "head": ["項目", "確認すること"], "rows": [["引き継ぐ範囲", "面接で分かった配慮事項を、誰が、誰に、どこまで伝えるかを、内定後すぐに決めているか"], ["配慮事項の書面化", "配慮事項を、本人・上司・人事で共有できる書面にまとめているか（G5-023）"], ["環境の調整", "座席、使うツール、マニュアルなど、予想できる調整を入社前に済ませているか（出社日と在宅日それぞれ）"], ["本人との事前確認", "業務内容、通勤経路、最初の流れを、入社前に本人と確認する機会を設けているか"], ["見通しの共有", "入社初日から最初の1か月のスケジュールを、できるだけ具体的に本人に伝えているか"], ["職場への説明", "現場への説明を、いつ、誰から、どのくらい詳しく行うか決め、直前になりすぎていないか"]], "note": "ほかの段階のチェックポイントは G1-010 に一覧があります。", "xlsx": "tools/checklist-05-nyusha-mae.xlsx", "xlsx_name": "05_内定〜入社前チェックリスト.xlsx", "check": true}], "q": "採用が決まった後、入社までに社内で何を準備すればよいですか？", "cat": "入社までの準備", "st": 2, "kw": "就業規則、人事評価制度、健康管理制度などはどのようにしたらよいでしょうか？ 障害者雇用に関する社内の支援体制はどのようにしたらよいでしょうか？ 障害者を雇用するときは具体的にどうしたらいいか", "body": "準備すること 労働条件：雇用形態、勤務時間、賃金、契約期間を労働条件通知書で示す（G4-005） 仕事の内容：最初に任せる業務と、手順書 配慮の内容：面接で聞いた配慮を書面にまとめ、誰に・どこまで伝えるかを決める（G5-023） 支援体制：相談役、上司、人事の役割分担と、支援機関との連絡方法（G4-002） 職場環境：座席、使う道具やソフトの準備 職場への説明：いつ、誰が、どこまで伝えるかを決めて、入社前に行う 社内の制度 就業規則や人事評価、健康管理の制度は、基本はほかの社員と同じものを使う 通院のための休暇や勤務時間の調整など、必要な配慮が制度で対応できるか確認する 本人との事前確認 業務内容、通勤経路、入社後の予定を、入社前に本人と確認する 実務のチェックポイント（内定〜入社前） 引き継ぐ範囲 面接で分かった配慮事項を、誰が、誰に、どこまで伝えるかを、内定後すぐに決めているか 配慮事項の書面化 配慮事項を、本人・上司・人事で共有できる書面にまとめているか（G5-023） 環境の調整 座席、使うツール、マニュアルなど、予想できる調整を入社前に済ませているか（出社日と在宅日それぞれ） 本人との事前確認 業務内容、通勤経路、最初の流れを、入社前に本人と確認する機会を設けているか 見通しの共有 入社初日から最初の1か月のスケジュールを、できるだけ具体的に本人に伝えているか 職場への説明 現場への説明を、いつ、誰から、どのくらい詳しく行うか決め、直前になりすぎていないか", "id": "G2-026"}, "G2-031": {"conclusion": "まず、夜勤がその仕事の中心かどうかで考えます。夜勤が業務の中心であれば、夜勤ができることを前提に採用を組み立て、求人票や面接ではっきり伝えて確認します。入社後は、夜勤を続けるための調整（回数、休憩、相談体制など）が合理的配慮の対象になります。障害があることだけを理由に、夜勤ができないと決めつけることはできません。", "general": [["夜勤が業務の中心である場合", ["夜勤ができることを前提に、採用を組み立てる", "求人票に夜勤があること、回数や時間帯をはっきり書く", "面接や職場実習で、夜勤の経験や、睡眠・体調の管理の方法を確認する（G2-007）", "夜勤そのものをなくすことは、業務の本質を変えることになるため、合理的配慮として求められない場合がある（G1-001）"]], ["入社後の合理的配慮", ["夜勤を続けるための調整は、合理的配慮の対象になる。たとえば、夜勤の回数や連続の調整、仮眠や休憩の取り方、夜勤明けの休みの確保など", "夜勤中に相談できる人や、緊急時の連絡方法を決めておく", "睡眠や服薬が体調に影響しやすい人もいる（精神障害、てんかんなど）（G1-072）。必要に応じて主治医や産業医の意見を聞く", "始めのうちは回数を少なくするなど少しずつ進め、体調を確認する"]], ["夜勤が業務の一部である場合", ["日勤だけで担える業務と組み合わせられないかを考える", "ほかの社員と同じように、本人の希望と体調、業務の内容をふまえて判断する"]]], "q": "夜勤のある職場で、障害のある社員に夜勤をお願いできますか？", "cat": "雇用形態と労働条件", "st": 2, "kw": "", "body": "夜勤が業務の中心である場合 夜勤ができることを前提に、採用を組み立てる 求人票に夜勤があること、回数や時間帯をはっきり書く 面接や職場実習で、夜勤の経験や、睡眠・体調の管理の方法を確認する（G2-007） 夜勤そのものをなくすことは、業務の本質を変えることになるため、合理的配慮として求められない場合がある（G1-001） 入社後の合理的配慮 夜勤を続けるための調整は、合理的配慮の対象になる。たとえば、夜勤の回数や連続の調整、仮眠や休憩の取り方、夜勤明けの休みの確保など 夜勤中に相談できる人や、緊急時の連絡方法を決めておく 睡眠や服薬が体調に影響しやすい人もいる（精神障害、てんかんなど）（G1-072）。必要に応じて主治医や産業医の意見を聞く 始めのうちは回数を少なくするなど少しずつ進め、体調を確認する 夜勤が業務の一部である場合 日勤だけで担える業務と組み合わせられないかを考える ほかの社員と同じように、本人の希望と体調、業務の内容をふまえて判断する", "id": "G2-031"}, "G2-057": {"conclusion": "勧めてかまいません。障害者就業・生活支援センターは、仕事と生活の両面の相談に、期間の区切りなく乗ってくれる機関で、職場定着の大きな支えになります。会社以外にも相談できる場所があることのメリットを、本人に伝えます。", "general": [["勧めるときのポイント", ["「何かあったときに、会社以外にも相談できる場所があると安心」という形で伝える", "就労定着支援など、ほかの支援が終わった後の相談先にもなることを伝える（G5-038）"]], ["登録した後", ["本人の同意を得て、会社とセンターの連絡方法を決めておく", "困りごとがあれば、会社からも相談する（G8-001）"]]], "phrases": ["「仕事や生活のことで困ったときに、会社以外にも相談できる場所があると安心だと思います。よかったら一度話を聞いてみませんか」"], "q": "定着してほしいので、障害者就業・生活支援センターへの登録を本人に勧めてもよいですか？", "cat": "支援機関の種類と使い方", "st": 4, "kw": "", "body": "勧めるときのポイント 「何かあったときに、会社以外にも相談できる場所があると安心」という形で伝える 就労定着支援など、ほかの支援が終わった後の相談先にもなることを伝える（G5-038） 登録した後 本人の同意を得て、会社とセンターの連絡方法を決めておく 困りごとがあれば、会社からも相談する（G8-001） 「仕事や生活のことで困ったときに、会社以外にも相談できる場所があると安心だと思います。よかったら一度話を聞いてみませんか」", "id": "G2-057"}, "G2-012": {"conclusion": "態度の変化だけを注意するのではなく、まず変化の背景を確かめることが大切です。体調の悪化、業務や職場の変化、配慮の変化、私生活の変化、将来への不安、疲れの蓄積など、何かが起きている可能性があります（下の表）。落ち着いた場で個別に話を聞き、背景に合わせて業務の調整や支援機関との連携を行います。", "general": [["考えられる背景（下の表）", ["真面目に働いてきた人ほど、無理を重ねていることがある。集中力の低下やいらだちは、限界に近づいているサインのことも多い", "背景は一つとは限らない。表を参考に、本人の話と最近の出来事を照らし合わせて確かめる"]], ["進め方", ["いつ頃から、どんな変化があるかを、事実として整理する", "人前ではなく、個別に落ち着いて話を聞く。注意より先に「最近どうですか」と様子を聞く", "体調、業務量、人間関係、私生活などに変化がないか確認する", "必要に応じて、業務量の調整や休みの取り方を考える", "本人を支援している機関があれば、本人の同意を得て相談する"]], ["伝え方の工夫", ["反発されても、感情的に言い返さない", "注意するときは、事実と次にどうしてほしいかに絞って伝える（G10-047）", "体調の悪化が疑われる場合は、受診を勧めることも考える（G10-010）"]]], "phrases": ["「最近、少し疲れているように見えますが、何か困っていることはありませんか」"], "charts": [{"type": "table", "title": "態度が変わったときに考えられる背景と対応の例", "head": ["考えられる背景", "具体的な例", "対応の例"], "rows": [["体調の悪化", "睡眠不足、薬の変更や飲み忘れ、持病の悪化、季節の変わり目の不調", "体調を聞き、休みの取り方や業務量を調整する。必要に応じて受診を勧める（G10-010）"], ["業務の変化", "業務量の増加、新しい業務、締め切りの重なり、慣れた業務がなくなった", "業務量と優先順位を見直し、手順や指示の出し方を整える（G4-047）"], ["職場の変化", "上司や同僚の異動、席替え、周囲とのすれ違いやトラブル、孤立", "人間関係で困っていないかを聞き、必要なら関わり方や配置を調整する"], ["配慮の変化", "これまでの配慮がなくなった、伝え方が変わった、相談役が替わった", "これまでの配慮が続いているかを確認し、配慮事項の書面を見直す（G5-023、G4-003）"], ["私生活の変化", "家族の病気や介護、引っ越し、生活リズムの乱れ、お金の不安", "話せる範囲で聞き、生活面は支援機関（障害者就業・生活支援センターなど）につなぐ（G2-057）"], ["将来への不安", "契約更新や評価、キャリアへの不安、ほかの社員との比較", "評価の基準や今後の見通しを、具体的に伝える"], ["疲れの蓄積", "無理を重ねて頑張り続けてきた、うまくいかない経験が続いて自信をなくしている", "頑張りを認め、業務の負担を一時的に軽くする。できていることを具体的に伝える"]], "note": "背景は一つとは限りません。決めつけずに、本人の話を聞きながら確かめます。"}], "q": "真面目に働いていた障害のある社員が、最近は集中力が落ち、注意すると反発するようになりました。どう対応すればよいですか？", "cat": "勤怠や様子の変化", "st": 5, "kw": "", "body": "考えられる背景（下の表） 真面目に働いてきた人ほど、無理を重ねていることがある。集中力の低下やいらだちは、限界に近づいているサインのことも多い 背景は一つとは限らない。表を参考に、本人の話と最近の出来事を照らし合わせて確かめる 進め方 いつ頃から、どんな変化があるかを、事実として整理する 人前ではなく、個別に落ち着いて話を聞く。注意より先に「最近どうですか」と様子を聞く 体調、業務量、人間関係、私生活などに変化がないか確認する 必要に応じて、業務量の調整や休みの取り方を考える 本人を支援している機関があれば、本人の同意を得て相談する 伝え方の工夫 反発されても、感情的に言い返さない 注意するときは、事実と次にどうしてほしいかに絞って伝える（G10-047） 体調の悪化が疑われる場合は、受診を勧めることも考える（G10-010） 「最近、少し疲れているように見えますが、何か困っていることはありませんか」 態度が変わったときに考えられる背景と対応の例 体調の悪化 睡眠不足、薬の変更や飲み忘れ、持病の悪化、季節の変わり目の不調 体調を聞き、休みの取り方や業務量を調整する。必要に応じて受診を勧める（G10-010） 業務の変化 業務量の増加、新しい業務、締め切りの重なり、慣れた業務がなくなった 業務量と優先順位を見直し、手順や指示の出し方を整える（G4-047） 職場の変化 上司や同僚の異動、席替え、周囲とのすれ違いやトラブル、孤立 人間関係で困っていないかを聞き、必要なら関わり方や配置を調整する 配慮の変化 これまでの配慮がなくなった、伝え方が変わった、相談役が替わった これまでの配慮が続いているかを確認し、配慮事項の書面を見直す（G5-023、G4-003） 私生活の変化 家族の病気や介護、引っ越し、生活リズムの乱れ、お金の不安 話せる範囲で聞き、生活面は支援機関（障害者就業・生活支援センターなど）につなぐ（G2-057） 将来への不安 契約更新や評価、キャリアへの不安、ほかの社員との比較 評価の基準や今後の見通しを、具体的に伝える 疲れの蓄積 無理を重ねて頑張り続けてきた、うまくいかない経験が続いて自信をなくしている 頑張りを認め、業務の負担を一時的に軽くする。できていることを具体的に伝える", "id": "G2-012"}, "G1-001": {"conclusion": "合理的配慮とは、障害のある人が障害のない人と同じように働けるよう、一人ひとりの障害の状況に合わせて、会社が職場の環境や働き方を調整することです。雇用の場面では、国連の障害者権利条約の批准を受けた法改正により、2016年4月から事業主の義務になりました。配慮は、仕事をするうえで必要なものであること、本人と話し合って決めること、会社にとって過重な負担にならない範囲で行うこと、が原則です。", "general": [["配慮の原則", ["仕事に関わる配慮であること：職務を円滑に行うために必要な調整が対象。日常生活のために必要な物（眼鏡や車いすなど）の提供までは含まれない", "本人と話し合って決めること：本人の困りごとと希望を聞き、一緒に内容を考える（G6-116）", "複数の方法があるときは、会社が選べる：本人の意向を十分に聞いたうえで、会社にとって提供しやすい方法を選んでよい（G6-021）", "過重な負担にならない範囲で行うこと（下記）"]], ["過重な負担とは", ["次の要素を総合的に見て、会社ごとに判断する：①事業活動への影響の程度、②実現の難しさ、③費用・負担の程度、④企業の規模、⑤企業の財務状況、⑥公的な支援（助成金など）を使えるかどうか", "過重な負担にあたる場合も、本人にその理由を説明し、負担にならない範囲でほかにできる配慮を考える（G6-006）"]], ["どんな配慮か（例）", ["募集・採用：面接での筆談、試験時間の延長、点字や拡大文字の問題用紙", "採用後：業務量や勤務時間の調整、通院のための休暇、作業手順の図示、指示を文字で伝える、休憩場所の確保、机や通路の改修など", "配慮の内容は、障害の種類だけでなく、一人ひとりの困りごとと希望によって異なる（G6-124）"]], ["対象", ["障害者手帳を持っていない人も対象になる（G6-004）"]]], "sourc
