", ["配慮は働く土台を整えるもので、業務の基準を下げるものではありません（G6-009）。", "「お願い」に留めて必要な指導をしないと、本人が成長の機会を失い、周囲との不公平感にもつながります。"]], ["伝え方の基本", ["具体的に：「ちゃんとして」ではなく「〇〇の数字を、提出前にもう一度確認してください」。", "肯定的に：できていることを先に伝え、「次は〇〇してほしい」と、してほしい行動で伝えます。", "その場面に即して：時間がたってからまとめて伝えるのではなく、そのつど個別の場面について伝えます。"]], ["相手に合わせた調整", ["精神的に負荷がかかりやすい人には、責める言い方を避け、相手を尊重しながら率直に伝えます（アサーティブな伝え方）。", "口頭での理解が難しい人には、要点をメモやチャットなど文字でも伝えます。どの伝え方が合うかは、本人と確認しておきます。"]], ["会社の考え方として伝える", ["指導の基準は、障害の有無に関係なく全員に同じであることを伝える。「障害があるから注意される」のではなく、「会社として全員に求めていること」として受け止めやすくなる", "できていない点だけでなく、してほしいことを肯定的に、具体的に伝える（例：「遅れないで」ではなく「9時までに席に着いてください」）"]]], "phrases": ["「〇〇はよくできていました。次は△△の確認も加えてもらえますか」", "「口頭だとわかりにくければ、要点をチャットでも送りますね」"], "sources": [], "q": "障害のある社員に「指導」をしてもよいのですか？「お願い」に留めたほうがよいですか？", "cat": "指導と伝え方", "st": 3, "kw": "", "body": "指導と配慮は両立する 配慮は働く土台を整えるもので、業務の基準を下げるものではありません（G6-009）。 「お願い」に留めて必要な指導をしないと、本人が成長の機会を失い、周囲との不公平感にもつながります。 伝え方の基本 具体的に：「ちゃんとして」ではなく「〇〇の数字を、提出前にもう一度確認してください」。 肯定的に：できていることを先に伝え、「次は〇〇してほしい」と、してほしい行動で伝えます。 その場面に即して：時間がたってからまとめて伝えるのではなく、そのつど個別の場面について伝えます。 相手に合わせた調整 精神的に負荷がかかりやすい人には、責める言い方を避け、相手を尊重しながら率直に伝えます（アサーティブな伝え方）。 口頭での理解が難しい人には、要点をメモやチャットなど文字でも伝えます。どの伝え方が合うかは、本人と確認しておきます。 会社の考え方として伝える 指導の基準は、障害の有無に関係なく全員に同じであることを伝える。「障害があるから注意される」のではなく、「会社として全員に求めていること」として受け止めやすくなる できていない点だけでなく、してほしいことを肯定的に、具体的に伝える（例：「遅れないで」ではなく「9時までに席に着いてください」） 「〇〇はよくできていました。次は△△の確認も加えてもらえますか」 「口頭だとわかりにくければ、要点をチャットでも送りますね」", "id": "G5-001"}, "G5-002": {"conclusion": "依頼するときに、完成度の基準を最初に具体的に示します。「この期限までに、このラインをクリアすればOK」と伝え、どこまでで十分かをはっきりさせます。背景にある本人のこだわりは否定せず、途中で一度確認するタイミングを設けて、レベルと進み具合をすり合わせます。", "general": [["完成度の基準を最初に示す", ["期限と、どこまでできればOKかを、依頼の時点で具体的に伝えます（例：「社内確認用なので、数字が合っていれば体裁は整えなくてよい」）。", "基準があいまいだと、完璧を目指して必要以上に時間をかけてしまうことがあります。"]], ["こだわりは否定しない", ["丁寧さやこだわりは、特性からくる本人の強みでもあります。その点は認めたうえで、今回求める水準を伝えます。", "完成度の高さが活きる業務があれば、そうした仕事を任せることも考えます。"]], ["途中で確認する", ["期限の途中で一度、進み具合と仕上がりのレベルを確認する時間を設けます。", "求める水準を超えていたら、その時点で「ここまでで十分です」と伝えます。"]], ["「完成」の判断の軸を渡す", ["「誤字がなければよい」「見た目のきれいさは問わない」など、どこまでできれば完成かの基準を具体的に渡す", "本人から見ると、丁寧さや完成度へのこだわりは強みでもある。強みとして認めたうえで、求める水準を伝える"]]], "phrases": ["「今回は〇日までに、△△ができていればOKです。見た目は整えなくて大丈夫です」", "「丁寧に作ってくれてありがとう。今回はここまでで十分なので、次の作業に進んでください」"], "sources": [], "q": "依頼した以上の完成度を目指してしまい、期待とのズレが生じる社員に、どう関わればよいですか？", "cat": "指導と伝え方", "st": 3, "kw": "", "body": "完成度の基準を最初に示す 期限と、どこまでできればOKかを、依頼の時点で具体的に伝えます（例：「社内確認用なので、数字が合っていれば体裁は整えなくてよい」）。 基準があいまいだと、完璧を目指して必要以上に時間をかけてしまうことがあります。 こだわりは否定しない 丁寧さやこだわりは、特性からくる本人の強みでもあります。その点は認めたうえで、今回求める水準を伝えます。 完成度の高さが活きる業務があれば、そうした仕事を任せることも考えます。 途中で確認する 期限の途中で一度、進み具合と仕上がりのレベルを確認する時間を設けます。 求める水準を超えていたら、その時点で「ここまでで十分です」と伝えます。 「完成」の判断の軸を渡す 「誤字がなければよい」「見た目のきれいさは問わない」など、どこまでできれば完成かの基準を具体的に渡す 本人から見ると、丁寧さや完成度へのこだわりは強みでもある。強みとして認めたうえで、求める水準を伝える 「今回は〇日までに、△△ができていればOKです。見た目は整えなくて大丈夫です」 「丁寧に作ってくれてありがとう。今回はここまでで十分なので、次の作業に進んでください」", "id": "G5-002"}, "G5-005": {"conclusion": "不安が強くなりやすい人も多いため、不安を与えない伝え方を心がけます。否定より肯定的に、具体的に・短く・わかりやすく伝え、あいまいな表現は避けます。体調の波があっても対応できる別の案を用意しておくと、本人も安心できます。体調の確認は「大丈夫？」だけでなく、具体的に聞きます。", "general": [["肯定的に伝える", ["否定的な言い方は、不安を強めやすくなります。「〇〇はダメ」ではなく「〇〇してもらえると助かります」と、してほしいことで伝えます。"]], ["具体的に、短く、わかりやすく", ["言われたことを正しく理解できたかという不安もあります。一度に伝えることは一つにし、具体的に短く伝えます。", "「なるべく早く」「適当に」などのあいまいな表現は避け、「〇時までに」のように伝えます。"]], ["体調の波を前提に、別の案を持っておく", ["体調を崩した日でも業務が回るよう、代わりの人や後回しにできる業務を決めておきます。", "「休んでも大丈夫な体制がある」とわかっていると、本人の不安が減り、かえって安定しやすくなります。"]], ["体調は具体的に聞く", ["「大丈夫？」と聞かれると、多くの人は「大丈夫です」と答えてしまいます。「昨日は眠れましたか」「今日の体調は10段階でどのくらいですか」など、具体的に聞きます。"]], ["一人ひとり違うことを忘れない", ["精神障害といっても、症状や苦手なことは人によって違います。どんな伝え方が合うかは、本人に確認するのが一番確実です。"]]], "phrases": ["「この資料、15時までにお願いできますか。わからない点があれば途中で聞いてください」", "「今日の体調は10段階でどのくらいですか」"], "sources": [], "q": "精神障害のある社員とのコミュニケーションで、話し方・伝え方のコツはありますか？", "cat": "指導と伝え方", "st": 3, "kw": "精神障がい者の接し方や必要な配慮事項などを知りたいです。 精神障害のある社員への「頑張れ」という声かけは適切か", "body": "肯定的に伝える 否定的な言い方は、不安を強めやすくなります。「〇〇はダメ」ではなく「〇〇してもらえると助かります」と、してほしいことで伝えます。 具体的に、短く、わかりやすく 言われたことを正しく理解できたかという不安もあります。一度に伝えることは一つにし、具体的に短く伝えます。 「なるべく早く」「適当に」などのあいまいな表現は避け、「〇時までに」のように伝えます。 体調の波を前提に、別の案を持っておく 体調を崩した日でも業務が回るよう、代わりの人や後回しにできる業務を決めておきます。 「休んでも大丈夫な体制がある」とわかっていると、本人の不安が減り、かえって安定しやすくなります。 体調は具体的に聞く 「大丈夫？」と聞かれると、多くの人は「大丈夫です」と答えてしまいます。「昨日は眠れましたか」「今日の体調は10段階でどのくらいですか」など、具体的に聞きます。 一人ひとり違うことを忘れない 精神障害といっても、症状や苦手なことは人によって違います。どんな伝え方が合うかは、本人に確認するのが一番確実です。 「この資料、15時までにお願いできますか。わからない点があれば途中で聞いてください」 「今日の体調は10段階でどのくらいですか」", "id": "G5-005"}, "G5-017": {"conclusion": "特別扱いしすぎず、配慮以外のところはほかの社員と同じように接することが基本です。障害は、年齢や性別と同じく、その人を形づくる要素のひとつにすぎません。そのうえで、具体的に伝えることと、誰もが働きやすい職場をつくることが、結果として本人との良い関係につながります。", "general": [["特別扱いしすぎない", ["決めた配慮はきちんと行い、それ以外は、ほかの社員と同じように接する", "「障害があるかないか」で分けて考えず、障害はその人の一面と捉える", "遠慮しすぎて声をかけない、仕事を任せない、注意しない、といった接し方は、かえって本人を孤立させる"]], ["具体的に伝える", ["「ちゃんと」「なるべく早く」などのあいまいな言葉を避け、何を、いつまでに、どのくらい、を具体的に伝える", "口頭だけでなく、メモやチャットなど、文字でも残す", "わからないことがないか、本人が確認しやすい雰囲気をつくる"]], ["誰もが働きやすい職場をめざす", ["本人だけに合わせるのではなく、周囲も含めて、困ったときに相談しやすく、意見を言いやすい職場（心理的安全性のある職場）をめざす", "具体的に伝える、手順を見える形にする、などの工夫は、ほかの社員にとっても働きやすさにつながる"]], ["わからないときは本人に聞く", ["接し方に迷ったら、どうしてほしいかを本人に聞く。障害の種類が同じでも、望む接し方は人によって違う", "本人の同意があれば、周囲に伝えてほしいこと、伝えてほしくないことも確認しておく"]]], "phrases": ["「わかりにくいところがあったら、いつでも聞いてくださいね」", "「こういう伝え方で大丈夫ですか。もっとわかりやすい方法があれば教えてください」"], "q": "障害のある社員と、周囲の社員はどのようにコミュニケーションを取り、接すればよいですか？", "cat": "指導と伝え方", "st": 3, "kw": "障害のある社員がいる職場ですが、職場の仲間なのに接し方がわからない方がいます。どのようにすればよいでしょうか 障害のある社員がいる職場ですが、職場の仲間なのに接し方がわからない方がいます。どうしたらよいでしょうか 話すことが苦手な方とどうコミュニケーションをとるか", "body": "特別扱いしすぎない 決めた配慮はきちんと行い、それ以外は、ほかの社員と同じように接する 「障害があるかないか」で分けて考えず、障害はその人の一面と捉える 遠慮しすぎて声をかけない、仕事を任せない、注意しない、といった接し方は、かえって本人を孤立させる 具体的に伝える 「ちゃんと」「なるべく早く」などのあいまいな言葉を避け、何を、いつまでに、どのくらい、を具体的に伝える 口頭だけでなく、メモやチャットなど、文字でも残す わからないことがないか、本人が確認しやすい雰囲気をつくる 誰もが働きやすい職場をめざす 本人だけに合わせるのではなく、周囲も含めて、困ったときに相談しやすく、意見を言いやすい職場（心理的安全性のある職場）をめざす 具体的に伝える、手順を見える形にする、などの工夫は、ほかの社員にとっても働きやすさにつながる わからないときは本人に聞く 接し方に迷ったら、どうしてほしいかを本人に聞く。障害の種類が同じでも、望む接し方は人によって違う 本人の同意があれば、周囲に伝えてほしいこと、伝えてほしくないことも確認しておく 「わかりにくいところがあったら、いつでも聞いてくださいね」 「こういう伝え方で大丈夫ですか。もっとわかりやすい方法があれば教えてください」", "id": "G5-017"}, "G5-026": {"conclusion": "休憩時間や業務外の付き合いは、本来は社員の自由で、会社が細かく管理する必要はありません。ただ、障害のある社員の場合、特性によって人との距離感がつかみにくかったり、誘いを断れなかったりして、トラブルにつながることがあります。業務に支障が出ている場合や、トラブルの兆しがある場合は、会社として関わります。", "general": [["障害のある社員の場合に起こりやすいこと", ["人との距離感がつかみにくく、相手が困っているのに話しかけ続ける、個人的なことを聞きすぎる、などが起きる（G4-010）", "誘いや頼みごとを断れず、無理に付き合って疲れてしまう。休憩時間に休めず、午後の仕事や体調に影響する", "休憩中の雑談に入れず、孤立していると感じる（G5-009）", "お金の貸し借り、SNSでのやり取り、恋愛感情などをめぐってトラブルになる", "からかいや、断りにくい誘いなど、本人がいやな思いをしていても言い出せない"]], ["関わる判断の目安", ["基本は社員の自由に任せ、会社が管理する必要はない", "業務に支障が出ているか（休憩が長引く、業務中も私語が続くなど）", "トラブルやハラスメントにつながっていないか（からかい、無理な誘い、金銭の貸し借りなど）", "本人や周囲から相談があったか", "これらがなければ、基本は見守る"]], ["飲み会などへの誘い方", ["障害の有無で誘う・誘わないを分けない。ほかの社員と同じように声をかける", "参加するかどうかは本人に任せ、断っても気にしなくてよいことを伝える", "服薬や体調、感覚過敏などで配慮が必要な場合は、本人に聞いておく（席の位置、早めの退出など）", "参加しないことを理由に、職場で不利に扱わない"]]], "phrases": ["「よかったら参加してください。無理はしなくて大丈夫です」"], "q": "休憩時間や業務外での社員同士の付き合い（飲み会など）に、会社はどこまで関わればよいですか？", "cat": "指導と伝え方", "st": 3, "kw": "障害のある社員を飲み会や忘年会に誘ってもよいでしょうか", "body": "障害のある社員の場合に起こりやすいこと 人との距離感がつかみにくく、相手が困っているのに話しかけ続ける、個人的なことを聞きすぎる、などが起きる（G4-010） 誘いや頼みごとを断れず、無理に付き合って疲れてしまう。休憩時間に休めず、午後の仕事や体調に影響する 休憩中の雑談に入れず、孤立していると感じる（G5-009） お金の貸し借り、SNSでのやり取り、恋愛感情などをめぐってトラブルになる からかいや、断りにくい誘いなど、本人がいやな思いをしていても言い出せない 関わる判断の目安 基本は社員の自由に任せ、会社が管理する必要はない 業務に支障が出ているか（休憩が長引く、業務中も私語が続くなど） トラブルやハラスメントにつながっていないか（からかい、無理な誘い、金銭の貸し借りなど） 本人や周囲から相談があったか これらがなければ、基本は見守る 飲み会などへの誘い方 障害の有無で誘う・誘わないを分けない。ほかの社員と同じように声をかける 参加するかどうかは本人に任せ、断っても気にしなくてよいことを伝える 服薬や体調、感覚過敏などで配慮が必要な場合は、本人に聞いておく（席の位置、早めの退出など） 参加しないことを理由に、職場で不利に扱わない 「よかったら参加してください。無理はしなくて大丈夫です」", "id": "G5-026"}, "G5-003": {"conclusion": "まず、希望の背景を確認します（キャリアや給与を上げたいのか、認めてほしいのか）。キャリア志向なら、役割を少しずつ広げ、まだ任せられない場合は「ここまでできたら次を任せる」というステップを示します。認めてほしい気持ちが背景なら、できていることをきちんと評価して伝えます。職務の幅に限りがある場合は、正社員登用などのキャリアの道を本人と一緒に考えます。", "general": [["希望の背景を確認する", ["キャリアを上げたい、給与を上げたい、認めてほしい、今の仕事に物足りなさがある、など背景によって対応が変わります。"]], ["キャリア志向の場合：少しずつ広げる", ["一度に大きく任せるのではなく、役割を少しずつ広げます。", "まだ任せられない場合は、任せられない理由と、「ここまでできたら次を任せる」という具体的なステップを示します。"]], ["認めてほしい気持ちの場合：きちんと評価する", ["実際にできていることを具体的に認めて伝えます。必要以上に高く評価するのではありません。", "あわせて、キャリアアップに必要な水準も伝えておきます。"]], ["職務の幅に限りがある場合", ["障害者雇用の枠で職務が決まっていて、今の部署では任せられる仕事を広げにくいこともあります。", "その場合も、正社員登用制度や他部署の業務など、キャリアアップの道を本人と一緒に考えます（G5-006）。"]]], "phrases": ["「中心的な仕事をしたいという気持ちはうれしいです。まず〇〇を一人でできるようになったら、次は△△を任せたいと考えています」"], "sources": [], "q": "「もっと中心的な仕事をしたい」と希望する社員に、任せられる範囲との折り合いをどうつければよいですか？", "cat": "意欲とキャリア", "st": 3, "kw": "", "body": "希望の背景を確認する キャリアを上げたい、給与を上げたい、認めてほしい、今の仕事に物足りなさがある、など背景によって対応が変わります。 キャリア志向の場合：少しずつ広げる 一度に大きく任せるのではなく、役割を少しずつ広げます。 まだ任せられない場合は、任せられない理由と、「ここまでできたら次を任せる」という具体的なステップを示します。 認めてほしい気持ちの場合：きちんと評価する 実際にできていることを具体的に認めて伝えます。必要以上に高く評価するのではありません。 あわせて、キャリアアップに必要な水準も伝えておきます。 職務の幅に限りがある場合 障害者雇用の枠で職務が決まっていて、今の部署では任せられる仕事を広げにくいこともあります。 その場合も、正社員登用制度や他部署の業務など、キャリアアップの道を本人と一緒に考えます（G5-006）。 「中心的な仕事をしたいという気持ちはうれしいです。まず〇〇を一人でできるようになったら、次は△△を任せたいと考えています」", "id": "G5-003"}, "G5-004": {"conclusion": "基本は、本人の役割と貢献を「見える化」することです。貢献していることをきちんと認め、入社まもない人には戦力として期待していると伝えます。仕事の意味を伝えながら小さな成功体験を積み重ね、面談などで周囲への貢献を言葉にして返します。今後のキャリアの見通しを一緒に考えることも有効です。", "general": [["まず気持ちを受け止める", ["「そんなことはない」とすぐ否定せず、なぜそう感じたのかを聞きます。きっかけになった出来事や言葉があることも多くあります。"]], ["役割と貢献を見える化する", ["本人の仕事が、誰の、どの業務に役立っているかを具体的に伝えます。", "入社まもない人には、「戦力として期待している」というメッセージをはっきり伝えます。"]], ["小さな成功体験を積み重ねる", ["仕事の意味を伝えたうえで、達成しやすい目標から始め、できたことを面談などで具体的に認めます。"]], ["キャリアの見通しを一緒に考える", ["この先どんな仕事や役割に広げていけるかを、本人と一緒に描きます（G5-003）。"]], ["仕事の中身も見直す", ["実際に仕事が少ない、誰でもよい作業しか任されていないなど、本人の感じ方に根拠がある場合もあります。その場合は、任せる業務の切り出し方そのものを見直します。"]], ["本人から見ると", ["「雇用枠」「雇用率のため」といった言葉や扱いが、何気ない会話や業務の任され方から本人に伝わっていることがある", "会社として障害者雇用に取り組む目的（戦力として力を発揮してほしいこと）を、本人にもはっきり伝える"]]], "phrases": ["「〇〇さんがまとめてくれたデータを、営業部が毎週の会議で使っています。とても助かっています」"], "sources": [], "q": "「障害者雇用枠を埋めるためにいるだけ」と感じ、意欲が下がっている社員のモチベーションをどう高めればよいですか？", "cat": "意欲とキャリア", "st": 3, "kw": "", "body": "まず気持ちを受け止める 「そんなことはない」とすぐ否定せず、なぜそう感じたのかを聞きます。きっかけになった出来事や言葉があることも多くあります。 役割と貢献を見える化する 本人の仕事が、誰の、どの業務に役立っているかを具体的に伝えます。 入社まもない人には、「戦力として期待している」というメッセージをはっきり伝えます。 小さな成功体験を積み重ねる 仕事の意味を伝えたうえで、達成しやすい目標から始め、できたことを面談などで具体的に認めます。 キャリアの見通しを一緒に考える この先どんな仕事や役割に広げていけるかを、本人と一緒に描きます（G5-003）。 仕事の中身も見直す 実際に仕事が少ない、誰でもよい作業しか任されていないなど、本人の感じ方に根拠がある場合もあります。その場合は、任せる業務の切り出し方そのものを見直します。 本人から見ると 「雇用枠」「雇用率のため」といった言葉や扱いが、何気ない会話や業務の任され方から本人に伝わっていることがある 会社として障害者雇用に取り組む目的（戦力として力を発揮してほしいこと）を、本人にもはっきり伝える 「〇〇さんがまとめてくれたデータを、営業部が毎週の会議で使っています。とても助かっています」", "id": "G5-004"}, "G5-006": {"conclusion": "障害の有無ではなく、正社員登用や再任用の基準を満たしているかで判断します。合理的配慮を受けていることで評価を下げるのではなく、業務をこなし役割を担っているかを正当に評価します。一方、登用によって勤務時間や責任が変わり、体調や特性の面で無理が生じそうな場合は、本人と十分に話し合って慎重に決めます。", "general": [["基準は障害のない社員と同じ", ["登用・再任用の基準（業務の達成度、役割、勤務の安定など）に照らして判断します。", "障害があることだけを理由に登用の対象から外すことは、障害者差別にあたります。"]], ["配慮を受けていることで評価を下げない", ["配慮を受けた状態で、業務をこなし役割を果たしているかを評価します（G6-009）。", "登用後も、必要な合理的配慮は引き続き提供します。"]], ["体調や特性に合うかを本人と一緒に考える", ["正社員になると、勤務時間、異動、責任の範囲などが変わることがあります。", "それが本人の体調や特性に合うかを、本人と話し合って判断します。会社が一方的に「無理だろう」と決めるのではなく、本人の意向と、必要な配慮を踏まえて考えます。", "必要であれば、登用後の働き方（勤務時間や業務範囲）を調整したうえで登用することも考えます。"]], ["会社としての準備", ["登用や再任用の基準と手続きを、あらかじめ文書で示しておく。基準がはっきりしていると、本人の目標にもなる（G4-005）"]]], "sources": ["厚生労働省「障害者差別禁止指針」"], "q": "障害のある社員の正規社員への登用や再任用は、どのように考えればよいですか？", "cat": "意欲とキャリア", "st": 3, "kw": "", "body": "基準は障害のない社員と同じ 登用・再任用の基準（業務の達成度、役割、勤務の安定など）に照らして判断します。 障害があることだけを理由に登用の対象から外すことは、障害者差別にあたります。 配慮を受けていることで評価を下げない 配慮を受けた状態で、業務をこなし役割を果たしているかを評価します（G6-009）。 登用後も、必要な合理的配慮は引き続き提供します。 体調や特性に合うかを本人と一緒に考える 正社員になると、勤務時間、異動、責任の範囲などが変わることがあります。 それが本人の体調や特性に合うかを、本人と話し合って判断します。会社が一方的に「無理だろう」と決めるのではなく、本人の意向と、必要な配慮を踏まえて考えます。 必要であれば、登用後の働き方（勤務時間や業務範囲）を調整したうえで登用することも考えます。 会社としての準備 登用や再任用の基準と手続きを、あらかじめ文書で示しておく。基準がはっきりしていると、本人の目標にもなる（G4-005）", "id": "G5-006"}, "G5-020": {"conclusion": "障害があるからずっと同じ仕事、ではなく、できることを増やしていくことが基本です。2022年の障害者雇用促進法の改正（2023年4月施行）で、職業能力の開発と向上が事業主の責務として明記されました。目標を決めて振り返る、研修の機会をつくる、成長を評価と処遇に反映する、という仕組みを整えましょう。", "general": [["目標を決めて振り返る", ["本人と一緒に、半年や1年などの期間で「できるようになりたいこと」を決める", "定期的に面談をして、できたこと、難しかったことを振り返り、次の目標を決める", "目標は、本人の特性や体調に合わせて、少し背伸びすれば届く水準にする"]], ["学ぶ機会をつくる", ["ほかの社員と同じ研修に参加できるようにする。必要なら資料や進め方を調整する（合理的配慮）", "仕事の中で教える（OJT）ときは、手順を区切り、見える形にして教える", "新しい業務を少しずつ任せ、できる範囲を広げていく"]], ["成長を評価と処遇に反映する", ["できるようになったことを、評価にきちんと反映する", "昇給や昇格、正社員登用など、成長が処遇につながる道筋を示す", "障害があることを理由に、評価や昇進の対象から外さない"]]], "sources": ["障害者雇用促進法5条（事業主の責務。2022年改正で職業能力の開発・向上に関する措置を明記、2023年4月1日施行）", "障害者差別禁止指針（教育訓練・昇進などでの差別の禁止）"], "links": [["厚生労働省 障害者雇用促進法の改正（令和4年）", "https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000077386_00019.html"]], "q": "障害のある社員の能力開発は、どのように進めればよいですか？", "cat": "意欲とキャリア", "st": 3, "kw": "障害者に対する人材育成等の視点を踏まえた支援について必要なことは何ですか？ 能力開発の具体的な事例を知りたい 障害のある社員に対しては、どのような教育が必要でしょうか 障害のある社員の成長を促したいと考えていますが、本人が苦手意識を持っている業務に対して、どこまでチャレンジを促すべきか悩んでいます。", "body": "目標を決めて振り返る 本人と一緒に、半年や1年などの期間で「できるようになりたいこと」を決める 定期的に面談をして、できたこと、難しかったことを振り返り、次の目標を決める 目標は、本人の特性や体調に合わせて、少し背伸びすれば届く水準にする 学ぶ機会をつくる ほかの社員と同じ研修に参加できるようにする。必要なら資料や進め方を調整する（合理的配慮） 仕事の中で教える（OJT）ときは、手順を区切り、見える形にして教える 新しい業務を少しずつ任せ、できる範囲を広げていく 成長を評価と処遇に反映する できるようになったことを、評価にきちんと反映する 昇給や昇格、正社員登用など、成長が処遇につながる道筋を示す 障害があることを理由に、評価や昇進の対象から外さない", "id": "G5-020"}, "G5-021": {"conclusion": "アビリンピックは、障害のある人が仕事の技能を競う大会（障害者技能競技大会）です。都道府県ごとの地方大会、全国大会、約4年に1度の国際大会があります。大会への参加を目標にすることで、本人の技能向上や自信につながり、社内で能力開発に取り組むきっかけにもなります。", "general": [["どんな大会か", ["目的は、障害のある人の職業能力を高めることと、企業や社会の理解を深めて雇用を進めること", "地方大会は、各都道府県と高齢・障害・求職者雇用支援機構（JEED）の支部などが開く。全国大会の選手選考を兼ねている", "全国大会は国際大会の年を除いて毎年開かれる"]], ["種目の例", ["パソコンデータ入力、ワード・プロセッサ、表計算、データベース、オフィスアシスタント、ビルクリーニング、喫茶サービス、製品パッキング、フラワーアレンジメント、写真撮影など", "種目によっては、対象の障害が限られているものもある。種目は大会ごとに異なる"]], ["参加の条件（地方大会の例）", ["15歳以上で、身体障害者手帳、療育手帳、精神障害者保健福祉手帳のいずれかを持っていること", "その都道府県に住んでいるか、その都道府県の事業所で働いていること", "詳しい条件は、各都道府県やJEED支部の募集案内で確認する"]], ["能力開発への生かし方", ["大会への参加を、本人の目標設定のひとつにする（G5-020）", "練習を通じて、仕事の正確さやスピード、手順の理解が高まる", "出場や入賞が本人の自信になり、社内で成果を共有することで、周囲の理解も深まる", "参加させるかどうかは本人の意向を聞いて決め、練習の時間や負担にも配慮する"]]], "sources": ["広島県「アビリンピック」ページ（全国大会・国際大会の概要）", "香川県「アビリンピックかがわ2026」募集案内（参加資格・種目）"], "links": [["広島県 アビリンピックについて", "https://www.pref.hiroshima.lg.jp/site/work2/wn500172.html"], ["香川県 アビリンピックかがわ2026 参加選手募集", "https://www.pref.kagawa.lg.jp/rosei/gino/20270206_abilympics_kagawa.html"]], "q": "アビリンピックが能力開発に役立つと聞きました。どのようなものですか？", "cat": "意欲とキャリア", "st": 3, "kw": "アビリンピックの競技作品を見せて欲しいのですが。", "body": "どんな大会か 目的は、障害のある人の職業能力を高めることと、企業や社会の理解を深めて雇用を進めること 地方大会は、各都道府県と高齢・障害・求職者雇用支援機構（JEED）の支部などが開く。全国大会の選手選考を兼ねている 全国大会は国際大会の年を除いて毎年開かれる 種目の例 パソコンデータ入力、ワード・プロセッサ、表計算、データベース、オフィスアシスタント、ビルクリーニング、喫茶サービス、製品パッキング、フラワーアレンジメント、写真撮影など 種目によっては、対象の障害が限られているものもある。種目は大会ごとに異なる 参加の条件（地方大会の例） 15歳以上で、身体障害者手帳、療育手帳、精神障害者保健福祉手帳のいずれかを持っていること その都道府県に住んでいるか、その都道府県の事業所で働いていること 詳しい条件は、各都道府県やJEED支部の募集案内で確認する 能力開発への生かし方 大会への参加を、本人の目標設定のひとつにする（G5-020） 練習を通じて、仕事の正確さやスピード、手順の理解が高まる 出場や入賞が本人の自信になり、社内で成果を共有することで、周囲の理解も深まる 参加させるかどうかは本人の意向を聞いて決め、練習の時間や負担にも配慮する", "id": "G5-021"}, "G5-007": {"conclusion": "働きぶりを理由に契約を更新しないこと自体はできますが、法律でルールが決められています。いきなり「更新しない」と伝えるのではなく、評価の基準を示して記録を残す、必要な配慮をしたうえで、面談で改善の機会をつくる、という順番で進めることが、トラブルを防ぐことにつながります。", "general": [["契約を更新しないときのルール（労働契約法第19条）", ["何度も更新していて、期間の定めがない契約とほとんど同じになっている場合や、本人が「次も更新される」と期待するのが自然な場合は、誰が見ても納得できる理由がなければ、更新しないことは認められません。", "3回以上更新している、または1年を超えて続いている契約を更新しない場合は、少なくとも30日前に予告する必要があります。本人から求められれば、理由を書面で示します。"]], ["評価基準と記録を積み重ねる", ["求める業務の水準を事前に示し、それに対してどうだったかを、日付と具体的な事実で記録します。"]], ["配慮を尽くしたかを確認する", ["必要な合理的配慮を提供していたか、話し合いをしていたかを振り返ります。必要な配慮をしないまま働きぶりを理由にすると、障害を理由に不利に扱ったと受け取られることがあります。"]], ["面談で改善の機会を提供する", ["課題を具体的に伝え、改善の目標と期間を決めて取り組んでもらいます。その経過も記録します。"]], ["専門家に相談する", ["判断の前に、社労士や弁護士に相談します。本人に支援機関がついていれば、本人の同意を得て早めに状況を共有します。"]]], "sources": ["労働契約法 第19条", "厚生労働省「有期労働契約の締結、更新、雇止め等に関する基準」"], "q": "非常勤の契約更新で、働きぶりを理由に更新しない判断はどこまで可能ですか？トラブルを防ぐために何が必要ですか？", "cat": "契約と処遇", "st": 3, "kw": "", "body": "契約を更新しないときのルール（労働契約法第19条） 何度も更新していて、期間の定めがない契約とほとんど同じになっている場合や、本人が「次も更新される」と期待するのが自然な場合は、誰が見ても納得できる理由がなければ、更新しないことは認められません。 3回以上更新している、または1年を超えて続いている契約を更新しない場合は、少なくとも30日前に予告する必要があります。本人から求められれば、理由を書面で示します。 評価基準と記録を積み重ねる 求める業務の水準を事前に示し、それに対してどうだったかを、日付と具体的な事実で記録します。 配慮を尽くしたかを確認する 必要な合理的配慮を提供していたか、話し合いをしていたかを振り返ります。必要な配慮をしないまま働きぶりを理由にすると、障害を理由に不利に扱ったと受け取られることがあります。 面談で改善の機会を提供する 課題を具体的に伝え、改善の目標と期間を決めて取り組んでもらいます。その経過も記録します。 専門家に相談する 判断の前に、社労士や弁護士に相談します。本人に支援機関がついていれば、本人の同意を得て早めに状況を共有します。", "id": "G5-007"}, "G5-037": {"conclusion": "障害があることを理由に、賃金を低く決めることはできません。ほかの社員と同じく、担当する仕事の内容や責任、勤務時間、能力の評価にもとづいて決めます。最低賃金も同じように適用されます。", "general": [["決め方の基本", ["同じ仕事・同じ働き方の社員と比べて、障害を理由に不利な賃金や昇給・賞与にしない（差別禁止）", "仕事の内容、責任の重さ、勤務時間、能力の評価にもとづいて決める", "合理的配慮（勤務時間の短縮など）の結果として働く時間が短くなる場合、その分の賃金が少なくなることは差別にはあたらない"]], ["最低賃金", ["最低賃金は障害のある社員にも適用される", "精神または身体の障害により著しく労働能力が低い場合に限り、都道府県労働局長の許可を得て最低賃金を減額できる特例があるが、手続きと要件は厳しい"]], ["評価と昇給", ["評価の基準と結果を本人に説明できるようにする", "できるようになったことを昇給や賞与に反映する（G5-020）"]]], "sources": ["障害者雇用促進法35条（差別禁止）・障害者差別禁止指針", "最低賃金法7条（減額の特例）"], "links": [["厚生労働省 障害者差別禁止・合理的配慮に関するQ&A（PDF）", "https://www.mhlw.go.jp/file/06-Seisakujouhou-11600000-Shokugyouanteikyoku/0000121387.pdf"]], "q": "障害のある社員の賃金は、どのように決めればよいですか？", "cat": "契約と処遇", "st": 3, "kw": "同じ職場であれば、障害のある社員とない社員とで、給与・昇給・賞与面の処遇は同じにしなければならないのでしょうか 障がい者の賃金を決める際の留意点、業績評価、昇給についてどのように考えたらよいでしょうか。", "body": "決め方の基本 同じ仕事・同じ働き方の社員と比べて、障害を理由に不利な賃金や昇給・賞与にしない（差別禁止） 仕事の内容、責任の重さ、勤務時間、能力の評価にもとづいて決める 合理的配慮（勤務時間の短縮など）の結果として働く時間が短くなる場合、その分の賃金が少なくなることは差別にはあたらない 最低賃金 最低賃金は障害のある社員にも適用される 精神または身体の障害により著しく労働能力が低い場合に限り、都道府県労働局長の許可を得て最低賃金を減額できる特例があるが、手続きと要件は厳しい 評価と昇給 評価の基準と結果を本人に説明できるようにする できるようになったことを昇給や賞与に反映する（G5-020）", "id": "G5-037"}, "G5-008": {"conclusion": "どちらが正しいかを決めるのではなく、両方とも本人の本音の一部と捉えます。相手によって話しやすさは違うものです。違いを否定せず、なぜ違うのかを確認し、支援員との情報共有や、本人・上司・支援員の三者面談で認識をそろえていきます。", "general": [["どちらも本音の一部", ["職場では評価を気にして言えないこと、支援員には言いにくいことなど、相手によって話せる内容は変わります。", "「職場で言っていることが本当だ」「支援員に言ったことが本当だ」と、どちらかに決めつけないようにします。"]], ["なぜ違うのかを確認する", ["本人の同意を得て支援員と情報を共有し、どんな場面で、どんな背景からその話が出たのかを確認します。"]], ["三者面談で認識をそろえる", ["本人・上司・支援員の三者で話す場を設け、困りごとや希望を同じテーブルで確認します。", "本人が職場で言いにくかったことを、支援員の助けを借りて伝えられる場にもなります。"]], ["職場で話しやすくする", ["職場で本音を言いにくい様子があれば、面談の場の設定や聞き方を見直します（G6-002）。"]], ["本人から見ると", ["職場では「評価に響くのでは」「契約に影響するのでは」と心配して、本音を言いにくいことが多い", "面談の目的が評価ではなく、働きやすくするための確認であることを伝えると、話しやすくなる"]]], "sources": [], "q": "支援機関の支援員に話す内容と、職場で話す内容が大きく違う場合、どう対応すればよいですか？", "cat": "本人の状況把握と支援", "st": 3, "kw": "", "body": "どちらも本音の一部 職場では評価を気にして言えないこと、支援員には言いにくいことなど、相手によって話せる内容は変わります。 「職場で言っていることが本当だ」「支援員に言ったことが本当だ」と、どちらかに決めつけないようにします。 なぜ違うのかを確認する 本人の同意を得て支援員と情報を共有し、どんな場面で、どんな背景からその話が出たのかを確認します。 三者面談で認識をそろえる 本人・上司・支援員の三者で話す場を設け、困りごとや希望を同じテーブルで確認します。 本人が職場で言いにくかったことを、支援員の助けを借りて伝えられる場にもなります。 職場で話しやすくする 職場で本音を言いにくい様子があれば、面談の場の設定や聞き方を見直します（G6-002）。 本人から見ると 職場では「評価に響くのでは」「契約に影響するのでは」と心配して、本音を言いにくいことが多い 面談の目的が評価ではなく、働きやすくするための確認であることを伝えると、話しやすくなる", "id": "G5-008"}, "G5-009": {"conclusion": "まず疎外感の背景を確認します。本人が周囲と関係を築きにくいのか、情報共有の仕組みから外れているのか、周囲が遠慮して声をかけていないのか、によって打つ手が変わります。無理に気を使いすぎる必要はありませんが、役割を果たしていることを認めることや、周囲と関われる居場所をつくることが解決につながる場合があります。", "general": [["背景を見極める", ["本人側：周囲との関係を自分から築くのが苦手。", "仕組み側：会議やチャットに入っていない、連絡が口頭だけで伝わっていないなど、情報共有から外れている。", "周囲側：どう接してよいかわからず、遠慮して声かけや雑談を控えている。"]], ["仕組みの問題はすぐ直す", ["必要な会議・メール・チャットに本人が入っているかを確認し、口頭だけの連絡は文字でも共有します。"]], ["役割を認める", ["本人が担っている仕事と、それが役立っていることを、面談などで具体的に伝えます（G5-004）。"]], ["関われる居場所をつくる", ["定例の短いミーティングや、決まった相談相手など、周囲と自然に関われる場を用意します。", "周囲には、特別扱いではなく普段どおりに接してよいことを伝えます。"]], ["無理をさせない", ["雑談や飲み会への参加を求めるなど、本人に負担になる関わり方は避けます。どの程度の関わりを望むかは人によって違います。"]], ["本人から見ると", ["特性によっては、雑談の輪に入るきっかけがつかめない、休憩中の過ごし方に迷う、ということがある", "一人で過ごす時間を大切にしたい人もいる。望む関わり方は人それぞれなので、本人に聞いてから考える"]]], "sources": [], "q": "職場で疎外感を感じている様子の障害のある社員に、どう関わればよいですか？", "cat": "本人の状況把握と支援", "st": 3, "kw": "", "body": "背景を見極める 本人側：周囲との関係を自分から築くのが苦手。 仕組み側：会議やチャットに入っていない、連絡が口頭だけで伝わっていないなど、情報共有から外れている。 周囲側：どう接してよいかわからず、遠慮して声かけや雑談を控えている。 仕組みの問題はすぐ直す 必要な会議・メール・チャットに本人が入っているかを確認し、口頭だけの連絡は文字でも共有します。 役割を認める 本人が担っている仕事と、それが役立っていることを、面談などで具体的に伝えます（G5-004）。 関われる居場所をつくる 定例の短いミーティングや、決まった相談相手など、周囲と自然に関われる場を用意します。 周囲には、特別扱いではなく普段どおりに接してよいことを伝えます。 無理をさせない 雑談や飲み会への参加を求めるなど、本人に負担になる関わり方は避けます。どの程度の関わりを望むかは人によって違います。 本人から見ると 特性によっては、雑談の輪に入るきっかけがつかめない、休憩中の過ごし方に迷う、ということがある 一人で過ごす時間を大切にしたい人もいる。望む関わり方は人それぞれなので、本人に聞いてから考える", "id": "G5-009"}, "G5-010": {"conclusion": "職場が関わるのは、「業務への影響」と「体調」の範囲です。体調は本人のセルフケアと上司のラインケアで管理し、遅刻が増えるなど業務に影響が出ていれば対応します。私生活そのものに踏み込むのはやりすぎになりやすいため、生活面は支援機関（就労移行支援事業所、障害者就業・生活支援センターなど）や、場合によっては家族と連携して支えます。", "general": [["職場が関わる範囲", ["業務への影響：遅刻・欠勤の増加、ミスの増加、集中できていないなど、事実として見える変化。", "体調：睡眠や食事の乱れが体調に出ている、など。"]], ["体調はセルフケアとラインケアで", ["本人が自分の体調を知って伝えられるよう支え（セルフケア）、上司は変化に気づいて声をかけ、必要なら業務を調整します（ラインケア）。"]], ["私生活には踏み込みすぎない", ["家庭の事情の詳細を聞き出したり、解決に乗り出したりするのは、職場の役割を超えやすくなります。", "本人が話してきた場合は聞きますが、職場で対応できる範囲と、外部につなぐことを分けて伝えます。"]], ["生活面は外部と連携する", ["本人の同意を得て、もともと利用していた就労移行支援事業所や、障害者就業・生活支援センターなど生活面も支援する機関と連携します。", "会社によっては、本人の同意を得て家族と連携するケースもあります。"]]], "sources": ["厚生労働省「労働者の心の健康の保持増進のための指針」"], "q": "家庭など私生活の悩みが仕事に影響している場合、職場としてどこまで関わればよいですか？", "cat": "本人の状況把握と支援", "st": 3, "kw": "家族から「職場でのストレスが原因で家庭内トラブルが起きている」と相談があった場合、会社はどこまで関与すべきか。 家族やプライベートで経験したネガティブな感情が、仕事中の態度やパフォーマンスに影響してしまう社員がいます。どのようなサポートや対応が考えられますか？", "body": "職場が関わる範囲 業務への影響：遅刻・欠勤の増加、ミスの増加、集中できていないなど、事実として見える変化。 体調：睡眠や食事の乱れが体調に出ている、など。 体調はセルフケアとラインケアで 本人が自分の体調を知って伝えられるよう支え（セルフケア）、上司は変化に気づいて声をかけ、必要なら業務を調整します（ラインケア）。 私生活には踏み込みすぎない 家庭の事情の詳細を聞き出したり、解決に乗り出したりするのは、職場の役割を超えやすくなります。 本人が話してきた場合は聞きますが、職場で対応できる範囲と、外部につなぐことを分けて伝えます。 生活面は外部と連携する 本人の同意を得て、もともと利用していた就労移行支援事業所や、障害者就業・生活支援センターなど生活面も支援する機関と連携します。 会社によっては、本人の同意を得て家族と連携するケースもあります。", "id": "G5-010"}, "G5-011": {"conclusion": "セルフケアは本人が主体です。職場の役割は、それを支える環境づくり（ラインケア）です。①本人が自分の体調をつかみ、報告・相談できる仕組みを用意すること、②疲労のサインや困りごとが見えたときにどう支えるかを決めておくこと、の2つの軸で考えます。", "general": [["軸1：本人が体調を表に出せる仕組み", ["体調チェック表や日報などで、本人が毎日自分の体調を記録し、上司と共有できるようにします。", "記録を続けることで、本人が自分の調子の波や崩れるきっかけに気づきやすくなります。", "項目は、睡眠・気分・疲れなど数項目に絞り、続けやすい形にします。"]], ["軸2：サインが見えたときの支え方", ["疲労のサインや困りごとが見えたら、短い面談で状況を聞き、業務量や進め方を調整します。", "休めていない様子があれば、休憩の取り方や休み方のルールを決め、休むよう伝えます。"]], ["事前に決めておく", ["どんなサインが出たら、誰に、どう伝えるかを本人と決めておきます（G10-001の緊急時シートとあわせて）。"]], ["支援機関の活用", ["本人が支援機関で使っていた体調管理のツールがあれば、職場でも引き続き使うと定着しやすくなります。"]], ["本人の工夫を活かす", ["本人がこれまで続けてきた体調管理の方法（睡眠の記録、服薬の工夫、休み方など）を聞き、職場でも続けられるようにする", "セルフケアを学べる教材や情報サイトは G1-005 を参照"]]], "sources": ["厚生労働省「労働者の心の健康の保持増進のための指針」"], "q": "障害のある社員本人のセルフケア（体調管理）を、職場としてどう支えればよいですか？", "cat": "本人の状況把握と支援", "st": 3, "kw": "体調の変化にどう気づき、どう対応すればよいか、現場の判断にばらつきがあります。", "body": "軸1：本人が体調を表に出せる仕組み 体調チェック表や日報などで、本人が毎日自分の体調を記録し、上司と共有できるようにします。 記録を続けることで、本人が自分の調子の波や崩れるきっかけに気づきやすくなります。 項目は、睡眠・気分・疲れなど数項目に絞り、続けやすい形にします。 軸2：サインが見えたときの支え方 疲労のサインや困りごとが見えたら、短い面談で状況を聞き、業務量や進め方を調整します。 休めていない様子があれば、休憩の取り方や休み方のルールを決め、休むよう伝えます。 事前に決めておく どんなサインが出たら、誰に、どう伝えるかを本人と決めておきます（G10-001の緊急時シートとあわせて）。 支援機関の活用 本人が支援機関で使っていた体調管理のツールがあれば、職場でも引き続き使うと定着しやすくなります。 本人の工夫を活かす 本人がこれまで続けてきた体調管理の方法（睡眠の記録、服薬の工夫、休み方など）を聞き、職場でも続けられるようにする セルフケアを学べる教材や情報サイトは G1-005 を参照", "id": "G5-011"}, "G5-012": {"conclusion": "職場が診断名を決めつけるのではなく、業務上どんな困りごとが起きているかに着目します。その困りごとを解決するために、伝え方や環境を工夫します。発達障害のある人への関わり方の基本は、診断の有無にかかわらず多くの人に役立つので、そのまま使えます。必要に応じて人事や産業医と連携しますが、障害を決めつけないことを最も重視します。", "general": [["診断名ではなく、困りごとに着目する", ["「発達障害では」と周囲が判断するのではなく、「締め切りに遅れる」「指示の一部が抜ける」など、業務上の事実に目を向けます（G6-005）。"]], ["関わり方の基本（伝え方）", ["具体的に伝える：「早めに」ではなく「〇日の15時までに」。", "一度に一つずつ伝える。", "口頭だけでなく、メモやチャットなど文字でも伝える。", "作業の全体像と手順、見通しを示す。", "肯定的に、してほしい行動で伝える。"]], ["関わり方の基本（環境）", ["音や人の出入りが気になる場合は、席の位置を工夫する。", "予定の変更は、できるだけ早めに伝える。", "チェックリストやテンプレートを用意する。"]], ["必要に応じて連携する", ["工夫しても困りごとが続く場合は、人事や産業医に相談します。", "受診を勧めるかどうかは、G5-013を参照してください。"]], ["会社の考え方として伝える", ["困りごとへの対応は、診断の有無に関係なく、職場のルールや仕事の進め方として全員に同じように伝える", "「あなたが特別だから」ではなく「この職場ではこうしている」と伝えると、本人も受け止めやすい"]]], "sources": [], "q": "発達障害などの特性が疑われるが、本人に自覚がなく診断も受けていない社員に、どう対応すればよいですか？", "cat": "本人の状況把握と支援", "st": 3, "kw": "", "body": "診断名ではなく、困りごとに着目する 「発達障害では」と周囲が判断するのではなく、「締め切りに遅れる」「指示の一部が抜ける」など、業務上の事実に目を向けます（G6-005）。 関わり方の基本（伝え方） 具体的に伝える：「早めに」ではなく「〇日の15時までに」。 一度に一つずつ伝える。 口頭だけでなく、メモやチャットなど文字でも伝える。 作業の全体像と手順、見通しを示す。 肯定的に、してほしい行動で伝える。 関わり方の基本（環境） 音や人の出入りが気になる場合は、席の位置を工夫する。 予定の変更は、できるだけ早めに伝える。 チェックリストやテンプレートを用意する。 必要に応じて連携する 工夫しても困りごとが続く場合は、人事や産業医に相談します。 受診を勧めるかどうかは、G5-013を参照してください。 会社の考え方として伝える 困りごとへの対応は、診断の有無に関係なく、職場のルールや仕事の進め方として全員に同じように伝える 「あなたが特別だから」ではなく「この職場ではこうしている」と伝えると、本人も受け止めやすい", "id": "G5-012"}, "G5-013": {"conclusion": "勧めること自体は可能ですが、慎重に行います。メンタル不調での受診は一般的になっていますが、発達障害の特性を理由に勧めると「なぜ決めつけるのか」とトラブルになることがあります。本人との信頼関係があり、本人自身が困っているという前提があるときに、「こういう選択肢もある」と紹介する程度にとどめ、強制はしません。職場の関係への影響を避けるため、産業医・保健師・人事など第三者から伝えてもらう方法もあります。", "general": [["勧める前提", ["本人との信頼関係がある。", "本人自身が困りごとを感じている。", "この2つがないまま勧めると、「障害者扱いされた」と受け止められやすくなります。"]], ["伝え方", ["診断名や「発達障害かもしれない」とは言いません。", "本人の困りごとを起点に、「専門家に相談すると、楽になる方法が見つかるかもしれない」と、選択肢の一つとして紹介します。", "受診するかどうかは本人が決めることで、強制はしません。受診しないことを理由に、不利に扱ってもいけません。"]], ["第三者から伝えてもらう", ["上司が直接勧めると、その後の職場の関係が悪くなることがあります。", "産業医・保健師・人事など、職場の外の立場の人との面談につなぎ、そこから伝えてもらう方法も有効です。"]], ["前提がそろわない場合", ["受診を勧めるより、まず伝え方や環境の工夫で困りごとを減らすことを優先します（G5-012）。"]]], "phrases": ["「最近〇〇で苦労しているように見えます。一人で抱えずに、産業医の先生に相談してみるのも一つの方法ですよ」"], "sources": [], "q": "特性が疑われる社員に、受診やカウンセリングを勧めてもよいですか？勧める場合はどう伝えればよいですか？", "cat": "本人の状況把握と支援", "st": 3, "kw": "", "body": "勧める前提 本人との信頼関係がある。 本人自身が困りごとを感じている。 この2つがないまま勧めると、「障害者扱いされた」と受け止められやすくなります。 伝え方 診断名や「発達障害かもしれない」とは言いません。 本人の困りごとを起点に、「専門家に相談すると、楽になる方法が見つかるかもしれない」と、選択肢の一つとして紹介します。 受診するかどうかは本人が決めることで、強制はしません。受診しないことを理由に、不利に扱ってもいけません。 第三者から伝えてもらう 上司が直接勧めると、その後の職場の関係が悪くなることがあります。 産業医・保健師・人事など、職場の外の立場の人との面談につなぎ、そこから伝えてもらう方法も有効です。 前提がそろわない場合 受診を勧めるより、まず伝え方や環境の工夫で困りごとを減らすことを優先します（G5-012）。 「最近〇〇で苦労しているように見えます。一人で抱えずに、産業医の先生に相談してみるのも一つの方法ですよ」", "id": "G5-013"}, "G5-018": {"conclusion": "うつ病は精神障害者保健福祉手帳の対象になりえますが、実際には手帳を取っていない人、取れない人のほうが多いのが現状です。取れる状態でも、取るかどうかは本人が決めることなので、「うつ病だから手帳がある」とは言えません。会社は手帳の有無にかかわらず、体調の確認と、必要な業務の調整を行います。", "general": [["手帳について", ["うつ病は精神障害者保健福祉手帳の対象になりうる。申請は、初めて受診した日から6か月以上たってから、住んでいる市区町村の窓口で行う", "等級は1〜3級で、2年ごとに更新がある", "病状によっては対象にならないこともあり、取得できるかどうかは審査で決まる"]], ["会社が気をつけること", ["手帳を取るかどうかは本人の意思で決まる。取得を会社から強く勧めたり、無理に求めたりしないようにする", "本人を特定して手帳の有無を聞けるのは、本人が障害者雇用の支援制度を使いたいと自分から申し出た場合など、限られた場合だけ", "本人から手帳について相談があれば、制度の情報を伝え、本人が判断できるようにする"]], ["本人への対応", ["体調を確認する：定期的に面談し、睡眠や疲れ、通院の状況などを無理のない範囲で聞く", "業務を調整する：負担の大きい業務（締め切りに追われる仕事、対人負担の大きい仕事、残業など）があれば、本人と相談して量や内容を調整する", "手帳がなくても、障害者雇用促進法上の合理的配慮の対象になりうる。本人の申し出があれば、配慮を話し合う", "必要に応じて、産業医や主治医の意見を聞く。体調が大きく崩れている場合は、休職も考える"]]], "sources": ["精神保健福祉法45条（精神障害者保健福祉手帳）", "プライバシーに配慮した障害者の把握・確認ガイドライン（厚生労働省）：本人の意思に反して手帳の取得を強要してはならない", "障害者雇用促進法2条・36条の3（障害者の定義・合理的配慮。手帳の有無にかかわらない）"], "links": [["厚生労働省 プライバシーに配慮した障害者の把握・確認ガイドライン", "https://www.mhlw.go.jp/content/000581119.pdf"]], "q": "「うつ病」の社員がいます。障害者手帳は発行されますか？本人にどう対応すればよいですか？", "cat": "本人の状況把握と支援", "st": 3, "kw": "職場で働いている方がメンタル不調になり「うつ病」と診断された場合、どのようにすればよいでしょうか", "body": "手帳について うつ病は精神障害者保健福祉手帳の対象になりうる。申請は、初めて受診した日から6か月以上たってから、住んでいる市区町村の窓口で行う 等級は1〜3級で、2年ごとに更新がある 病状によっては対象にならないこともあり、取得できるかどうかは審査で決まる 会社が気をつけること 手帳を取るかどうかは本人の意思で決まる。取得を会社から強く勧めたり、無理に求めたりしないようにする 本人を特定して手帳の有無を聞けるのは、本人が障害者雇用の支援制度を使いたいと自分から申し出た場合など、限られた場合だけ 本人から手帳について相談があれば、制度の情報を伝え、本人が判断できるようにする 本人への対応 体調を確認する：定期的に面談し、睡眠や疲れ、通院の状況などを無理のない範囲で聞く 業務を調整する：負担の大きい業務（締め切りに追われる仕事、対人負担の大きい仕事、残業など）があれば、本人と相談して量や内容を調整する 手帳がなくても、障害者雇用促進法上の合理的配慮の対象になりうる。本人の申し出があれば、配慮を話し合う 必要に応じて、産業医や主治医の意見を聞く。体調が大きく崩れている場合は、休職も考える", "id": "G5-018"}, "G5-027": {"conclusion": "本人の同意を得たうえで、主治医に伝えたいことを本人と一緒に整理する、職場の様子を書面にして渡す、場合によっては会社の担当者が受診に同行する、などの支え方があります。主治医の意見は大切な参考になりますが、主治医は職場の業務や環境を詳しく知らないため、どの程度取り入れるかは会社が判断します。", "general": [["会社ができる支え方", ["受診の前に、職場での様子や困りごと、主治医に聞きたいことを本人と一緒にメモにまとめる", "本人の同意を得て、業務内容や職場での様子を書面にして、本人から主治医に渡してもらう", "本人が希望し、同意が得られれば、会社の担当者（上司や人事）が受診に同行し、職場の状況を直接伝える", "支援機関の支援員が同行できるか相談する方法もある", "主治医に意見を聞きたい点（勤務時間、業務量、配慮など）を、具体的な質問の形で書面にする"]], ["主治医の意見の受け止め方", ["主治医は治療の専門家で、職場の業務や環境を詳しく知らないことが多い。意見はそのまま受け入れるのではなく、職場の実情に照らして、どこまで取り入れるかを会社が判断する", "判断に迷うときは、産業医の意見も聞き、本人と話し合って決める（G6-022）", "意見を取り入れない部分がある場合は、その理由を本人に説明する"]], ["注意すること", ["受診するかどうか、何を伝えるかは本人が決める。同行も本人が望む場合に限る", "会社が受診の内容を細かく聞き出さない", "健康に関する情報は、見られる人を限定して扱う"]]], "q": "社員が主治医に体調や職場での困りごとをうまく伝えられていない様子です。会社としてどう支えればよいですか？", "cat": "本人の状況把握と支援", "st": 3, "kw": "主治医に相談しても、職場での具体的な対応についてアドバイスが得られません。", "body": "会社ができる支え方 受診の前に、職場での様子や困りごと、主治医に聞きたいことを本人と一緒にメモにまとめる 本人の同意を得て、業務内容や職場での様子を書面にして、本人から主治医に渡してもらう 本人が希望し、同意が得られれば、会社の担当者（上司や人事）が受診に同行し、職場の状況を直接伝える 支援機関の支援員が同行できるか相談する方法もある 主治医に意見を聞きたい点（勤務時間、業務量、配慮など）を、具体的な質問の形で書面にする 主治医の意見の受け止め方 主治医は治療の専門家で、職場の業務や環境を詳しく知らないことが多い。意見はそのまま受け入れるのではなく、職場の実情に照らして、どこまで取り入れるかを会社が判断する 判断に迷うときは、産業医の意見も聞き、本人と話し合って決める（G6-022） 意見を取り入れない部分がある場合は、その理由を本人に説明する 注意すること 受診するかどうか、何を伝えるかは本人が決める。同行も本人が望む場合に限る 会社が受診の内容を細かく聞き出さない 健康に関する情報は、見られる人を限定して扱う", "id": "G5-027"}, "G5-035": {"conclusion": "まず、何が難しいのかを本人と一緒に具体的にします。仕事そのものが合わないのか、教え方や手順、環境に原因があるのかで、対応が変わります。仕事の分け方や教え方を見直し、それでも難しい場合は、本人の得意を生かせる別の業務を組み合わせます。", "general": [["原因を分けて考える", ["仕事の内容：判断が多い、急ぎの対応が多い、コミュニケーション（人とのやり取り）が多いなど、本人の特性と合わない要素があるか", "教え方・手順：一度にたくさん伝えていないか、手順書があるか、確認の機会があるか（G4-048）", "環境：音や人の出入り、席の位置などが集中の妨げになっていないか", "体調：入社直後の緊張や疲れが影響していないか"]], ["見直し方", ["仕事を細かい作業に分け、できる部分から任せる。難しい部分は一時的にほかの人が担う", "手順書やチェックリストを用意し、最初は一緒にやって見せる", "最初の数週間は「評価」ではなく「観察と調整」の期間と考える（G1-010）", "それでも難しい場合は、ほかの部署の業務も含めて、本人の得意を生かせる仕事を組み合わせる（G3-008）"]], ["相談先", ["就労移行支援事業所や障害者就業・生活支援センターなど、本人を支援している機関に相談する", "地域障害者職業センターのジョブコーチ支援も使える（G1-048）"]], ["それでも雇用を続けるのが難しいと考えるとき", ["「仕事が合わない」ことだけを理由に、すぐに契約の打ち切り（解雇や雇止め）を考えない。業務の変更や配置転換、合理的配慮を十分に考えたかが問われる（G6-110）", "試用期間中でも、本採用をしないことには合理的な理由が必要になる", "有期契約で更新しない場合は、更新の基準や手続きを確認する（G5-007、G10-075）", "考えた業務の調整や配慮、本人との話し合いの経過を記録に残す", "判断する前に、社労士や弁護士に相談する（G10-094）"]]], "q": "採用したものの、準備していた仕事が本人には難しいようです。どう対応すればよいですか？", "cat": "本人の状況把握と支援", "st": 3, "kw": "", "body": "原因を分けて考える 仕事の内容：判断が多い、急ぎの対応が多い、コミュニケーション（人とのやり取り）が多いなど、本人の特性と合わない要素があるか 教え方・手順：一度にたくさん伝えていないか、手順書があるか、確認の機会があるか（G4-048） 環境：音や人の出入り、席の位置などが集中の妨げになっていないか 体調：入社直後の緊張や疲れが影響していないか 見直し方 仕事を細かい作業に分け、できる部分から任せる。難しい部分は一時的にほかの人が担う 手順書やチェックリストを用意し、最初は一緒にやって見せる 最初の数週間は「評価」ではなく「観察と調整」の期間と考える（G1-010） それでも難しい場合は、ほかの部署の業務も含めて、本人の得意を生かせる仕事を組み合わせる（G3-008） 相談先 就労移行支援事業所や障害者就業・生活支援センターなど、本人を支援している機関に相談する 地域障害者職業センターのジョブコーチ支援も使える（G1-048） それでも雇用を続けるのが難しいと考えるとき 「仕事が合わない」ことだけを理由に、すぐに契約の打ち切り（解雇や雇止め）を考えない。業務の変更や配置転換、合理的配慮を十分に考えたかが問われる（G6-110） 試用期間中でも、本採用をしないことには合理的な理由が必要になる 有期契約で更新しない場合は、更新の基準や手続きを確認する（G5-007、G10-075） 考えた業務の調整や配慮、本人との話し合いの経過を記録に残す 判断する前に、社労士や弁護士に相談する（G10-094）", "id": "G5-035"}, "G5-014": {"conclusion": "退職の主な理由は、人間関係、業務とのミスマッチ、体調の悪化、相談できないこと、などです。防ぐためのポイントは、退職につながる不調のサインを早くつかみ、早めに対応することです。定期面談や日報など、本人の様子がわかる機会を持ち、会社には言いにくいことは、本人が利用していた支援機関との連携でつかみます。", "general": [["主な退職理由", ["人間関係・職場の雰囲気：厚労省の調査（平成25年度障害者雇用実態調査）では、精神障害のある人の前職の離職理由（個人的理由）で「職場の雰囲気・人間関係」が33.8%と最も多くなっています。", "業務とのミスマッチ：仕事内容が合わない、求められる水準が合わない。", "体調の悪化：疲れやすさや体調の波から、働き続けるのが難しくなる。", "相談できない：困りごとを抱えたまま、限界を迎えて退職に至る。"]], ["定着の現状", ["高齢・障害・求職者雇用支援機構（JEED）の2017年の調査では、精神障害のある人の就職後1年時点の定着率は約5割で、障害種別の中で最も低くなっています。"]], ["サインを早くつかむ", ["定期面談、日報や体調チェック表（G5-011）など、本人の様子がわかる機会を日常的に持ちます。", "遅刻や欠勤の増加、表情や口数の変化、ミスの増加などは、不調のサインになりえます。"]], ["早めに対応する", ["サインに気づいたら、退職の話が出る前に面談し、業務量や配慮を見直します。"]], ["支援機関と連携する", ["本人が会社には言いにくいことも、もともと利用していた就労移行支援事業所などには話していることがあります。本人の同意を得て、定期的に情報を共有します（G5-008）。"]]], "charts": [{"type": "table", "title": "退職につながりやすい理由と、防ぐための対応", "head": ["退職理由", "早めに気づくサイン", "防ぐための対応"], "rows": [["人間関係・職場の雰囲気", "孤立している、口数が減る、特定の人を避ける", "関わり方を調整し、相談役を決める（G5-009）"], ["業務とのミスマッチ", "ミスが増える、手持ちぶさた、意欲が下がる", "業務の内容や量、教え方を見直す（G3-006）"], ["体調の悪化", "遅刻や欠勤が増える、表情が変わる", "業務量や勤務時間を調整し、受診や支援機関につなぐ（G11-001）"], ["相談できない", "困りごとを話さない、「大丈夫」が増える", "定期的な面談を仕組みにする（G5-024）"]]}], "sources": ["厚生労働省「平成25年度障害者雇用実態調査」", "高齢・障害・求職者雇用支援機構「障害者の就業状況等に関する調査研究」（2017年）"], "q": "障害のある社員が退職に至るのは、どのような理由が多いですか？防ぐために何ができますか？", "cat": "定着の全体像", "st": 3, "kw": "雇用しても短期間で退職したり、急に出社しなくなる場合、どのような対応をしたらよいでしょうか。 障害者の職場定着率はどれくらいですか？何が定着率に影響しますか？", "body": "主な退職理由 人間関係・職場の雰囲気：厚労省の調査（平成25年度障害者雇用実態調査）では、精神障害のある人の前職の離職理由（個人的理由）で「職場の雰囲気・人間関係」が33.8%と最も多くなっています。 業務とのミスマッチ：仕事内容が合わない、求められる水準が合わない。 体調の悪化：疲れやすさや体調の波から、働き続けるのが難しくなる。 相談できない：困りごとを抱えたまま、限界を迎えて退職に至る。 定着の現状 高齢・障害・求職者雇用支援機構（JEED）の2017年の調査では、精神障害のある人の就職後1年時点の定着率は約5割で、障害種別の中で最も低くなっています。 サインを早くつかむ 定期面談、日報や体調チェック表（G5-011）など、本人の様子がわかる機会を日常的に持ちます。 遅刻や欠勤の増加、表情や口数の変化、ミスの増加などは、不調のサインになりえます。 早めに対応する サインに気づいたら、退職の話が出る前に面談し、業務量や配慮を見直します。 支援機関と連携する 本人が会社には言いにくいことも、もともと利用していた就労移行支援事業所などには話していることがあります。本人の同意を得て、定期的に情報を共有します（G5-008）。 退職につながりやすい理由と、防ぐための対応 人間関係・職場の雰囲気 孤立している、口数が減る、特定の人を避ける 関わり方を調整し、相談役を決める（G5-009） 業務とのミスマッチ ミスが増える、手持ちぶさた、意欲が下がる 業務の内容や量、教え方を見直す（G3-006） 体調の悪化 遅刻や欠勤が増える、表情が変わる 業務量や勤務時間を調整し、受診や支援機関につなぐ（G11-001） 相談できない 困りごとを話さない、「大丈夫」が増える 定期的な面談を仕組みにする（G5-024）", "id": "G5-014"}, "G5-015": {"conclusion": "定着の基本は、業務の相性、相談先の確保、体調管理、周囲の理解と評価、定期的な面談です。ジョブコーチ支援の考え方では、本人だけでなく、上司・同僚、会社の仕組み、家族のそれぞれに働きかけ、最終的には職場の中で自然に支え合える状態（ナチュラルサポート）をつくることが目標とされています。", "general": [["本人への働きかけ", ["業務の相性：本人の得意なこと・苦手なことと、仕事の内容が合っているかを確認し、合わなければ調整する", "仕事の進め方：手順を区切って教え、できるようになるまで確認する", "職場でのコミュニケーション：報告・相談の仕方を具体的に決める", "体調や生活リズムの管理：睡眠、通院、疲れのサインなどを、本人と一緒につかむ"]], ["上司・同僚への働きかけ", ["障害の理解：本人の同意を得た範囲で、特性や配慮の内容を共有する", "関わり方や教え方：具体的に伝える、確認しながら進める、などを周囲にも伝える", "本人を支える役割（キーパーソン）を決め、その人に負担が偏らないようにする（G12-006）"]], ["会社の仕組みとして整えること", ["相談先の確保：上司以外にも、人事や支援機関など、相談できる先を複数つくる", "定着面談：入社直後は頻繁に、慣れてきたら間隔をあけて、定期的に面談する", "評価：できるようになったことをきちんと評価し、処遇に反映する（G5-020）", "配置や職務内容は、本人の成長や体調に合わせて見直す"]], ["家族・支援機関との連携", ["本人の同意を得て、家族や支援機関と情報を共有し、生活面の変化に早く気づけるようにする", "ジョブコーチ（職場適応援助者）による支援も使える。地域障害者職業センターなどに相談する"]], ["ジョブコーチ支援の流れ（参考）", ["集中支援：職場での課題を分析し、集中的に改善する", "移行支援：支援の経験や工夫を上司や同僚に伝え、支える役割を少しずつ職場に移していく", "その後の確認：数週間から数か月に一度、様子を確認する", "めざすのは、外部の支援者がいなくても職場の中で自然に支えられる状態（ナチュラルサポート）"]]], "charts": [{"type": "table", "title": "実務のチェックポイント（入社直後〜定着期）", "head": ["区分", "項目", "確認すること"], "rows": [["入社直後", "相談役を伝える", "日常の相談役が誰か（人事か、現場の決まった先輩か）を、本人にはっきり伝えているか"], ["入社直後", "関係づくりを優先", "最初の週は「業務を教える」より「安心して質問できる関係づくり」を優先しているか"], ["入社直後", "少しずつ増やす", "業務を分け、難しさや量を少しずつ上げていく計画になっているか"], ["入社直後", "観察と調整の期間", "最初の数週間を「評価」ではなく「観察と調整」の期間と考えているか"], ["入社直後", "短い振り返り", "週1回15分程度などの短い確認を、最初から仕組みとして入れているか（G5-024）"], ["入社直後", "周囲への伝え分け", "「必要な配慮」と「ほかの社員と同じ扱いでよい部分」を、周囲に伝え分けているか"], ["定着期", "定期的な振り返り", "月1回など、働き方全体について話す場を仕組みにしているか（本人からの申し出待ちにしていないか）"], ["定着期", "双方から確認", "本人と上司の両方から、業務・体調・人間関係の状況を聞いているか"], ["定着期", "配慮の見直し", "状況の変化に合わせて配慮を見直しているか（減らせる配慮も含めて）"], ["定着期", "キャリアと成長", "「この先どうなりたいか」を話す機会があり、ほかの社員と同じ評価の軸で成長の機会を考えているか"], ["定着期", "生活面の相談先", "給与、社会保険、生活面で困ったときの相談先を伝えているか"], ["定着期", "連携の経路", "人事や外部の機関（定着支援、ジョブコーチなど）と連携する経路を、前もって決めているか"], ["定着期", "支える側の負担", "相談役や上司が一人で抱え込んでいないか、支える側の負担も知っているか"]], "note": "ほかの段階のチェックポイントは G1-010 に一覧があります。", "xlsx": "tools/checklist-06-teichaku.xlsx", "xlsx_name": "06_入社直後〜定着期チェックリスト.xlsx", "check": true}], "sources": ["厚生労働省「職場適応援助者（ジョブコーチ）支援事業について」（支援の対象・内容・流れ）"], "links": [["厚生労働省 ジョブコーチ支援の概要（PDF）", "https://www.mhlw.go.jp/content/11704000/000708359.pdf"]], "q": "定着のために重要なことは何ですか。マネジメント上の注意点を教えてください", "cat": "定着の全体像", "st": 3, "kw": "採用した障害者の職場定着のためにどのような取組を行えばよいですか？ 採用しても長続きするか心配 障害者の方に職場に定着してもらうためにはどうしたらよいですか？ 具体的なマネジメント方法を知りたい 採用した障害者の職場定着のための支援として、どのようなものを準備すればよいでしょうか？", "body": "本人への働きかけ 業務の相性：本人の得意なこと・苦手なことと、仕事の内容が合っているかを確認し、合わなければ調整する 仕事の進め方：手順を区切って教え、できるようになるまで確認する 職場でのコミュニケーション：報告・相談の仕方を具体的に決める 体調や生活リズムの管理：睡眠、通院、疲れのサインなどを、本人と一緒につかむ 上司・同僚への働きかけ 障害の理解：本人の同意を得た範囲で、特性や配慮の内容を共有する 関わり方や教え方：具体的に伝える、確認しながら進める、などを周囲にも伝える 本人を支える役割（キーパーソン）を決め、その人に負担が偏らないようにする（G12-006） 会社の仕組みとして整えること 相談先の確保：上司以外にも、人事や支援機関など、相談できる先を複数つくる 定着面談：入社直後は頻繁に、慣れてきたら間隔をあけて、定期的に面談する 評価：できるようになったことをきちんと評価し、処遇に反映する（G5-020） 配置や職務内容は、本人の成長や体調に合わせて見直す 家族・支援機関との連携 本人の同意を得て、家族や支援機関と情報を共有し、生活面の変化に早く気づけるようにする ジョブコーチ（職場適応援助者）による支援も使える。地域障害者職業センターなどに相談する ジョブコーチ支援の流れ（参考） 集中支援：職場での課題を分析し、集中的に改善する 移行支援：支援の経験や工夫を上司や同僚に伝え、支える役割を少しずつ職場に移していく その後の確認：数週間から数か月に一度、様子を確認する めざすのは、外部の支援者がいなくても職場の中で自然に支えられる状態（ナチュラルサポート） 実務のチェックポイント（入社直後〜定着期） 相談役を伝える 日常の相談役が誰か（人事か、現場の決まった先輩か）を、本人にはっきり伝えているか 関係づくりを優先 最初の週は「業務を教える」より「安心して質問できる関係づくり」を優先しているか 少しずつ増やす 業務を分け、難しさや量を少しずつ上げていく計画になっているか 観察と調整の期間 最初の数週間を「評価」ではなく「観察と調整」の期間と考えているか 短い振り返り 週1回15分程度などの短い確認を、最初から仕組みとして入れているか（G5-024） 周囲への伝え分け 「必要な配慮」と「ほかの社員と同じ扱いでよい部分」を、周囲に伝え分けているか 定期的な振り返り 月1回など、働き方全体について話す場を仕組みにしているか（本人からの申し出待ちにしていないか） 双方から確認 本人と上司の両方から、業務・体調・人間関係の状況を聞いているか 配慮の見直し 状況の変化に合わせて配慮を見直しているか（減らせる配慮も含めて） キャリアと成長 「この先どうなりたいか」を話す機会があり、ほかの社員と同じ評価の軸で成長の機会を考えているか 生活面の相談先 給与、社会保険、生活面で困ったときの相談先を伝えているか 連携の経路 人事や外部の機関（定着支援、ジョブコーチなど）と連携する経路を、前もって決めているか 支える側の負担 相談役や上司が一人で抱え込んでいないか、支える側の負担も知っているか", "id": "G5-015"}, "G5-016": {"conclusion": "定着マネジメントの事例は、高齢・障害・求職者雇用支援機構（JEED）の「障害者雇用事例リファレンスサービス」や「職場改善好事例集」、厚生労働省の公表資料などで調べられます。業種や障害の種類、企業の規模で絞り込んで、自社に近い事例を探すのがおすすめです。", "general": [["事例を探せるところ", ["JEED「障害者雇用事例リファレンスサービス」：障害者雇用に工夫して取り組む企業の事例と、合理的配慮の事例を検索できる", "JEED「職場改善好事例集」：毎年テーマを決めて、職場改善の取組をまとめている", "厚生労働省「もにす認定制度」：障害者雇用に優良な取組をする中小企業の認定制度。認定企業の取組は、地域のロールモデルとして公表されている"]], ["公表資料にある定着の取組の例", ["日報で業務の状況をつかみ、週ごとに計画を立て、遅れがあれば支援する（サービス業）", "スキルを5段階で評価し、その評価を賞与に反映する（製造業）", "一人ひとりのキャリアプランや個別の支援計画をつくる（医療・福祉）", "出典：厚生労働省 労働政策審議会障害者雇用分科会 資料（中小事業主へのヒアリング結果）"]], ["事例を読むときのポイント", ["そのまま真似するのではなく、「何のために、どんな仕組みにしたか」を読み取る", "G5-015の定着のポイント（業務の相性、相談先、体調管理、周囲の理解と評価、定着面談）のどれに当たる取組かを考えると、自社に取り入れやすい"]]], "sources": ["厚生労働省 第89回労働政策審議会障害者雇用分科会 資料（中小事業主ヒアリング結果）"], "links": [["JEED 障害者雇用事例リファレンスサービス", "https://www.ref.jeed.go.jp/index.html"], ["厚生労働省 もにす認定制度", "https://www.mhlw.go.jp/stf/monisu.html"], ["厚生労働省 労働政策審議会障害者雇用分科会 資料（PDF）", "https://www.mhlw.go.jp/content/11704000/000551569.pdf"]], "q": "定着マネジメントの事例を知りたい", "cat": "定着の全体像", "st": 3, "kw": "障害者雇用のイメージを高めるため、実際の障害者雇用事例などを知りたいのですが、どうすればよいですか？ 様々な分野で働く障害者の事例を知りたいのですが、どのようなものがありますか？ 同業他社の障がい者雇用の取組みを知りたいです。 業種別（製造業、サービス業等）の事例を知りたい", "body": "事例を探せるところ JEED「障害者雇用事例リファレンスサービス」：障害者雇用に工夫して取り組む企業の事例と、合理的配慮の事例を検索できる JEED「職場改善好事例集」：毎年テーマを決めて、職場改善の取組をまとめている 厚生労働省「もにす認定制度」：障害者雇用に優良な取組をする中小企業の認定制度。認定企業の取組は、地域のロールモデルとして公表されている 公表資料にある定着の取組の例 日報で業務の状況をつかみ、週ごとに計画を立て、遅れがあれば支援する（サービス業） スキルを5段階で評価し、その評価を賞与に反映する（製造業） 一人ひとりのキャリアプランや個別の支援計画をつくる（医療・福祉） 出典：厚生労働省 労働政策審議会障害者雇用分科会 資料（中小事業主へのヒアリング結果） 事例を読むときのポイント そのまま真似するのではなく、「何のために、どんな仕組みにしたか」を読み取る G5-015の定着のポイント（業務の相性、相談先、体調管理、周囲の理解と評価、定着面談）のどれに当たる取組かを考えると、自社に取り入れやすい", "id": "G5-016"}, "G5-023": {"conclusion": "配慮事項は、本人と話し合って決めた内容を書面にまとめ、本人の同意を得た範囲で、関係者に共有します。書面にしておくと、担当者が替わっても配慮が引き継がれ、関係者によって対応がばらつくのを防げます。", "general": [["書面にまとめる内容（例）", ["本人の得意なこと・苦手なこと", "必要な配慮と、その理由（どんな場面で困るか）", "体調が悪いときのサインと、そのときの対応", "相談先（社内の担当者、支援機関の連絡先）", "共有してよい範囲（誰に、どこまで伝えるか）"]], ["共有の進め方", ["本人と話し合って内容を決め、誰に・どこまで伝えるかも本人と決める（G10-068）", "診断名は伝えず、配慮の内容だけを伝える方法もある（G6-044）", "上司や相談役など、配慮に関わる人には書面で、職場全体には必要な範囲を口頭で、など伝え方を分ける", "書面は見られる人を限定して保管する（G6-045）"]], ["共有した後", ["定着面談などで、定期的に内容を見直し、変わったら共有し直す（G6-027）", "上司や担当者が替わるときは、この書面をもとに、前任・新任・本人の三者で引き継ぐ（進め方はG6-003）"]]], "q": "障害のある社員の配慮事項を、社内で共有するときは、どのように進めればよいですか？", "cat": "定着の全体像", "st": 3, "kw": "", "body": "書面にまとめる内容（例） 本人の得意なこと・苦手なこと 必要な配慮と、その理由（どんな場面で困るか） 体調が悪いときのサインと、そのときの対応 相談先（社内の担当者、支援機関の連絡先） 共有してよい範囲（誰に、どこまで伝えるか） 共有の進め方 本人と話し合って内容を決め、誰に・どこまで伝えるかも本人と決める（G10-068） 診断名は伝えず、配慮の内容だけを伝える方法もある（G6-044） 上司や相談役など、配慮に関わる人には書面で、職場全体には必要な範囲を口頭で、など伝え方を分ける 書面は見られる人を限定して保管する（G6-045） 共有した後 定着面談などで、定期的に内容を見直し、変わったら共有し直す（G6-027） 上司や担当者が替わるときは、この書面をもとに、前任・新任・本人の三者で引き継ぐ（進め方はG6-003）", "id": "G5-023"}, "G5-024": {"conclusion": "決まった頻度はありません。入社直後は多めに行い、慣れてきたら間隔をあけていくのが基本で、本人の状態や職場の状況に合わせて決めます。大切なのは、本人の申し出を待たずに、会社から定期的に行う仕組みにしておくことです。", "general": [["頻度の決め方（一例）", ["入社〜1か月：週1回、15分程度の短い確認", "〜3か月：2週間に1回程度", "〜1年：月1回程度", "その後：数か月に1回程度", "これはあくまで一例です。本人と相談し、負担にならず、変化に早く気づける頻度にします。"]], ["頻度を上げたほうがよいとき", ["体調や勤怠に変化があったとき（G6-063）", "業務内容や上司、部署が変わったとき", "本人から相談があったとき"]], ["支援機関に同席してもらうとよいとき（目安）", ["入社直後や、定着支援の期間中の定期面談", "体調や勤怠の乱れが続き、会社だけでは原因や対応が分からないとき", "配慮の内容を見直すとき、業務内容や部署、上司が変わるとき", "本人が会社に直接言いにくそうなことがあるとき", "休職・復職や、契約更新など、働き方の大きな判断をするとき", "同席の前に本人の了解を得ます。支援機関の役割は会社と本人の間に入って調整することで、判断するのは会社です。"]], ["進め方のポイント", ["本人からの申し出を待たず、会社から定期的に行う仕組みにする", "業務の悩みだけでなく、体調や生活面も含めて「働き方全体」について話す"]]], "q": "定着面談はどのくらいの頻度で行うのがよいですか？", "cat": "定着の全体像", "st": 3, "kw": "", "body": "頻度の決め方（一例） 入社〜1か月：週1回、15分程度の短い確認 〜3か月：2週間に1回程度 〜1年：月1回程度 その後：数か月に1回程度 これはあくまで一例です。本人と相談し、負担にならず、変化に早く気づける頻度にします。 頻度を上げたほうがよいとき 体調や勤怠に変化があったとき（G6-063） 業務内容や上司、部署が変わったとき 本人から相談があったとき 支援機関に同席してもらうとよいとき（目安） 入社直後や、定着支援の期間中の定期面談 体調や勤怠の乱れが続き、会社だけでは原因や対応が分からないとき 配慮の内容を見直すとき、業務内容や部署、上司が変わるとき 本人が会社に直接言いにくそうなことがあるとき 休職・復職や、契約更新など、働き方の大きな判断をするとき 同席の前に本人の了解を得ます。支援機関の役割は会社と本人の間に入って調整することで、判断するのは会社です。 進め方のポイント 本人からの申し出を待たず、会社から定期的に行う仕組みにする 業務の悩みだけでなく、体調や生活面も含めて「働き方全体」について話す", "id": "G5-024"}, "G5-043": {"conclusion": "伝えてかまいません。むしろ伝えることが大切です。企業の不安や困りごと、できること・できないことを正直に伝えるほど、適切な支援を受けやすくなります。ただし、支援機関は本人とも関わる立場なので、伝えた内容が本人に伝わる可能性も考え、伝え方には注意します。", "general": [["伝えたほうがよいこと", ["業務の中で困っていること、本人の様子で気になっていること", "会社としてできる配慮と、難しい配慮", "受け入れる側の負担や不安"]], ["伝えるときのポイント", ["感想ではなく、いつ、どんな場面で、何が起きたかという事実で伝える", "本人を責めるためではなく、一緒に解決するための相談として伝える", "本人に関する情報のやり取りは、本人の同意の範囲で行う"]], ["伝え方に注意したいこと", ["支援機関は本人の支援もしているため、企業が話した内容が本人に伝わることがあります。", "特に契約更新や雇用の継続にかかわる話は、まだ決まっていない段階で「続けられないかもしれない」とだけ伝えると、本人に必要以上の不安が広がることがあります。", "こうした話をするときは、「何が課題で、どう改善すればよいか」「改善が見られれば続けられるが、見られなければ難しくなる可能性がある」というように、意図と見通しをセットで伝え、誤解を招かないようにします。", "本人にどこまで、どのように伝えるかも、支援機関とあらかじめすり合わせておきます。"]], ["あわせて", ["支援機関に任せきりにせず、会社としてどうしたいかも伝える（G8-001）"]]], "q": "支援機関に、企業としての本音（不安や困りごと）を伝えてもよいですか？", "cat": "定着の全体像", "st": 3, "kw": "", "body": "伝えたほうがよいこと 業務の中で困っていること、本人の様子で気になっていること 会社としてできる配慮と、難しい配慮 受け入れる側の負担や不安 伝えるときのポイント 感想ではなく、いつ、どんな場面で、何が起きたかという事実で伝える 本人を責めるためではなく、一緒に解決するための相談として伝える 本人に関する情報のやり取りは、本人の同意の範囲で行う 伝え方に注意したいこと 支援機関は本人の支援もしているため、企業が話した内容が本人に伝わることがあります。 特に契約更新や雇用の継続にかかわる話は、まだ決まっていない段階で「続けられないかもしれない」とだけ伝えると、本人に必要以上の不安が広がることがあります。 こうした話をするときは、「何が課題で、どう改善すればよいか」「改善が見られれば続けられるが、見られなければ難しくなる可能性がある」というように、意図と見通しをセットで伝え、誤解を招かないようにします。 本人にどこまで、どのように伝えるかも、支援機関とあらかじめすり合わせておきます。 あわせて 支援機関に任せきりにせず、会社としてどうしたいかも伝える（G8-001）", "id": "G5-043"}, "G5-038": {"conclusion": "定着支援には、就労移行支援事業所が就職後6か月間行う定着支援、その後に使える福祉サービスの「就労定着支援」（最長3年）、地域障害者職業センターのジョブコーチ支援、障害者就業・生活支援センターの相談などがあります。いずれも、本人と会社の間に入って、職場での困りごとの整理や生活面の相談に乗ります。", "general": [["主な支援", ["就労移行支援事業所の定着支援（就職後6か月間）：就労移行支援事業所から就職した場合、就職後6か月間は、その事業所が職場訪問や面談などの定着支援を行う", "就労定着支援（障害福祉サービス）：就職後6か月を過ぎた後、最長3年間使える。本人との面談や会社との調整を行う。就労移行支援の6か月と合わせると、就職後最長3年6か月の支援を受けられる", "ジョブコーチ支援：職場を訪問し、本人の仕事の進め方や、上司・同僚の関わり方を支援する（G1-048）", "障害者就業・生活支援センター：仕事と生活の両面の相談に、期間の区切りなく乗る。就労定着支援が終わった後の相談先にもなる（G8-010）"]], ["支援の流れ（就労移行支援事業所から就職した場合）", ["就職〜6か月：就労移行支援事業所による定着支援", "6か月〜3年6か月：就労定着支援（本人が利用を希望した場合）", "その後：障害者就業・生活支援センターなどに引き継ぐ。支援が切れる時期を会社も知っておく"]], ["会社として気をつけること", ["どの機関が本人を支援しているか、連絡先と担当者を知っておく（G10-060）", "支援機関に任せきりにせず、会社の考えや困りごとも伝える（G8-001）"]]], "charts": [{"type": "table", "title": "職場定着を支える主な外部の支援", "head": ["支援", "期間", "主な内容"], "rows": [["就労移行支援事業所の定着支援", "就職後6か月間", "職場訪問や面談で、本人と会社の間を調整する"], ["就労定着支援（障害福祉サービス）", "就職後6か月以降、最長3年", "本人との面談、会社との調整"], ["ジョブコーチ支援", "1〜8か月（標準は2〜4か月）", "職場で、仕事の進め方や関わり方を支援する"], ["障害者就業・生活支援センター", "期間の区切りなし", "仕事と生活の両面の相談"]], "note": "利用できるかどうかや期間は、本人の状況や地域によって異なります。"}], "sources": ["障害者総合支援法（就労定着支援）"], "q": "障害のある社員の職場定着を支える、外部の支援にはどのようなものがありますか？", "cat": "定着の全体像", "st": 3, "kw": "", "body": "主な支援 就労移行支援事業所の定着支援（就職後6か月間）：就労移行支援事業所から就職した場合、就職後6か月間は、その事業所が職場訪問や面談などの定着支援を行う 就労定着支援（障害福祉サービス）：就職後6か月を過ぎた後、最長3年間使える。本人との面談や会社との調整を行う。就労移行支援の6か月と合わせると、就職後最長3年6か月の支援を受けられる ジョブコーチ支援：職場を訪問し、本人の仕事の進め方や、上司・同僚の関わり方を支援する（G1-048） 障害者就業・生活支援センター：仕事と生活の両面の相談に、期間の区切りなく乗る。就労定着支援が終わった後の相談先にもなる（G8-010） 支援の流れ（就労移行支援事業所から就職した場合） 就職〜6か月：就労移行支援事業所による定着支援 6か月〜3年6か月：就労定着支援（本人が利用を希望した場合） その後：障害者就業・生活支援センターなどに引き継ぐ。支援が切れる時期を会社も知っておく 会社として気をつけること どの機関が本人を支援しているか、連絡先と担当者を知っておく（G10-060） 支援機関に任せきりにせず、会社の考えや困りごとも伝える（G8-001） 職場定着を支える主な外部の支援 就労移行支援事業所の定着支援 就職後6か月間 職場訪問や面談で、本人と会社の間を調整する 就労定着支援（障害福祉サービス） 就職後6か月以降、最長3年 本人との面談、会社との調整 ジョブコーチ支援 1〜8か月（標準は2〜4か月） 職場で、仕事の進め方や関わり方を支援する 障害者就業・生活支援センター 期間の区切りなし 仕事と生活の両面の相談", "id": "G5-038"}, "G5-044": {"conclusion": "精神・発達障害のある人の職場定着を支えるツールとして、本人が毎日の体調や気分、仕事の様子を記録し、職場の担当者や支援者と共有するクラウド型のツールがあります。代表的なものに「SPIS（エスピス）」や「キモチプラス」があります。体調の変化に早く気づき、話し合いのきっかけをつくることが主な目的です。", "general": [["主なツール", ["SPIS（エスピス）：インターネット上の日報システム。本人が睡眠時間、服薬、体調、仕事の状況、一日の感想などを記録し、職場の担当者や外部の支援者がコメントを返す。記録がたまるので、体調が崩れる前のサインを見つけやすい", "キモチプラス：スマートフォンやパソコンで体調や気分を記録し、グラフなどで見える化する。日々の記録に加えて、病気や障害のある人の多くの体験談をもとに、選択肢を選ぶだけで悩みや会社への相談事を整理でき、内容に応じた対策を学べる。本人のセルフケアや自己理解を深めることにも力を入れている"]], ["ツールを使うメリット", ["体調の波や変化に、本人も周囲も早く気づける", "言葉で伝えるのが苦手な人も、記録を通じて困りごとを伝えやすくなる", "面談で、記録をもとに具体的に話し合える", "職場の担当者と支援機関が同じ情報を見られる"]], ["導入するときの注意", ["本人の同意を得て始め、誰が記録を見るか、誰がいつコメントを返すかを決めておく", "健康に関する情報を扱うので、見られる人を限定する", "ツールに任せきりにせず、定期的な面談と組み合わせる（G5-024）", "費用や導入方法は、各サービスの提供元や地域の支援機関に確認する"]]], "links": [["SPIS 公式サイト", "https://www.spis.jp/"], ["京都ジョブパーク よくある質問（職場定着・SPIS）", "https://www.pref.kyoto.jp/jobpark/faqteichaku.html"], ["内閣官房 デジ田メニューブック（キモチプラス）", "https://www.cas.go.jp/jp/seisaku/digitaldenen/menubook/2023/1027.html"]], "q": "精神・発達障害のある社員の職場定着を支えるツールには、どのようなものがありますか？", "cat": "定着の全体像", "st": 3, "kw": "", "body": "主なツール SPIS（エスピス）：インターネット上の日報システム。本人が睡眠時間、服薬、体調、仕事の状況、一日の感想などを記録し、職場の担当者や外部の支援者がコメントを返す。記録がたまるので、体調が崩れる前のサインを見つけやすい キモチプラス：スマートフォンやパソコンで体調や気分を記録し、グラフなどで見える化する。日々の記録に加えて、病気や障害のある人の多くの体験談をもとに、選択肢を選ぶだけで悩みや会社への相談事を整理でき、内容に応じた対策を学べる。本人のセルフケアや自己理解を深めることにも力を入れている ツールを使うメリット 体調の波や変化に、本人も周囲も早く気づける 言葉で伝えるのが苦手な人も、記録を通じて困りごとを伝えやすくなる 面談で、記録をもとに具体的に話し合える 職場の担当者と支援機関が同じ情報を見られる 導入するときの注意 本人の同意を得て始め、誰が記録を見るか、誰がいつコメントを返すかを決めておく 健康に関する情報を扱うので、見られる人を限定する ツールに任せきりにせず、定期的な面談と組み合わせる（G5-024） 費用や導入方法は、各サービスの提供元や地域の支援機関に確認する", "id": "G5-044"}, "G6-004": {"conclusion": "必要です。手帳の有無にかかわらず、障害によって働くうえで支障があれば合理的配慮の対象です。雇用率に算定されないこととは別の話なので、社内でも共通理解をつくります。", "general": [["法律上の障害者は手帳所持者に限らない", ["障害者雇用促進法の定義は手帳の有無を問いません。発達障害や難病で手帳のない人も含まれます。"]], ["確認は診断書などで", ["手帳がない場合は診断書や意見書で確認します。必要な範囲で、本人の同意を得て行います。"]], ["雇用率とは別の制度", ["雇用率は会社の数の話、合理的配慮は一人ひとりの働きやすさの話です。"]], ["社内の共通理解をつくる", ["「手帳＝配慮の対象」という思い込みがあると、手帳のない社員への配慮が特別扱いに見られます。"]]], "sources": ["障害者雇用促進法 第2条", "厚生労働省「合理的配慮指針」"], "q": "障害者手帳を持っていない社員にも、合理的配慮は必要ですか？", "cat": "対象と把握", "st": 3, "kw": "差別禁止・合理的配慮の対象となる障害者の範囲はどこまでですか？", "body": "法律上の障害者は手帳所持者に限らない 障害者雇用促進法の定義は手帳の有無を問いません。発達障害や難病で手帳のない人も含まれます。 確認は診断書などで 手帳がない場合は診断書や意見書で確認します。必要な範囲で、本人の同意を得て行います。 雇用率とは別の制度 雇用率は会社の数の話、合理的配慮は一人ひとりの働きやすさの話です。 社内の共通理解をつくる 「手帳＝配慮の対象」という思い込みがあると、手帳のない社員への配慮が特別扱いに見られます。", "id": "G6-004"}, "G6-005": {"conclusion": "障害を決めつけて対応するのは不適切です。声かけは障害かどうかではなく、業務上の困りごとという事実をもとにします。障害を明かすかは本人が決めることで、本人が話してきたらプライバシーに配慮して丁寧に聞きます。", "general": [["決めつけない", ["印象やうわさ、健診結果をもとに個人に障害の有無を尋ねるのは、厚労省のガイドラインでも不適切とされています。", "障害を疑って業務から外すなど不利に扱えば、差別にあたるおそれがあります。"]], ["事実と困りごとで声をかける", ["業務上の事実をもとに困りごとを聞くのは、障害の有無に関係なく上司として当然の対応です。"]], ["明かすかは本人が決める", ["誘導や、受診・手帳の確認を迫ることは避けます。本人が自分から話すのは問題ありません。"]], ["プライバシーに配慮する", ["一大決心で話していることもあります。誰にどこまで伝えるかを本人と決めます。"]]], "phrases": ["「最近〇〇で確認漏れが続いていますが、やりにくいところはありますか」", "（打ち明けられたら）「話してくれてありがとう。仕事で困っていることはありますか」「このことを誰にどこまで伝えてよいですか」"], "sources": ["厚生労働省「プライバシーに配慮した障害者の把握・確認ガイドライン」"], "q": "本人からの申し出がないまま、職場側が障害を疑って対応することは、差別にあたりませんか？", "cat": "対象と把握", "st": 3, "kw": "配慮が必要そうに見えるが本人から申し出がない場合、会社側から確認してよいか。", "body": "決めつけない 印象やうわさ、健診結果をもとに個人に障害の有無を尋ねるのは、厚労省のガイドラインでも不適切とされています。 障害を疑って業務から外すなど不利に扱えば、差別にあたるおそれがあります。 事実と困りごとで声をかける 業務上の事実をもとに困りごとを聞くのは、障害の有無に関係なく上司として当然の対応です。 明かすかは本人が決める 誘導や、受診・手帳の確認を迫ることは避けます。本人が自分から話すのは問題ありません。 プライバシーに配慮する 一大決心で話していることもあります。誰にどこまで伝えるかを本人と決めます。 「最近〇〇で確認漏れが続いていますが、やりにくいところはありますか」 （打ち明けられたら）「話してくれてありがとう。仕事で困っていることはありますか」「このことを誰にどこまで伝えてよいですか」", "id": "G6-005"}, "G6-102": {"conclusion": "採用時に確認した障害の情報を、配属の検討に活かすこと自体は通常のことです。ただし、情報を知っていることと、本人がそれを配属に反映してほしいと考えているかは別の話です。会社が一方的に決めるのではなく、本人の希望と同意をあわせて確認したうえで反映します。", "general": [["配属に活かすのは通常のこと", ["業務上の支障と必要な配慮を踏まえて配属先を考えるのは、合理的配慮の一部でもあります。"]], ["本人の希望と同意を確認する", ["どの情報を、どの程度配属に反映してよいかを本人と話し合います。", "本人がどんな仕事や部署を希望しているかも、あわせて聞きます。"]], ["障害だけを理由に配属を限定しない", ["「障害があるからこの部署は無理」と一律に決めると、障害を理由とした差別にあたるおそれがあります。", "判断の軸は、障害名ではなく、業務上の支障と配慮で解決できるかどうかです。"]], ["配属先に伝える情報は必要な範囲で", ["配属先の上司などに伝える内容と範囲は、本人の同意を得て決めます。病名ではなく、業務上の困りごとと必要な配慮を中心に伝えます（G6-003）。"]], ["会社の目線で", ["配属は、本人が戦力として力を発揮できる場所を選ぶためのもの。障害の情報は、そのための材料として、本人の同意を得て使う"]]], "sources": ["厚生労働省「障害者差別禁止指針」", "厚生労働省「合理的配慮指針」"], "q": "採用時に把握した障害情報を、配属決定にどこまで反映してよいですか？", "cat": "対象と把握", "st": 3, "kw": "採用選考時に得た障害情報を、配属先に伝える前に確認すべき同意の範囲は何か。", "body": "配属に活かすのは通常のこと 業務上の支障と必要な配慮を踏まえて配属先を考えるのは、合理的配慮の一部でもあります。 本人の希望と同意を確認する どの情報を、どの程度配属に反映してよいかを本人と話し合います。 本人がどんな仕事や部署を希望しているかも、あわせて聞きます。 障害だけを理由に配属を限定しない 「障害があるからこの部署は無理」と一律に決めると、障害を理由とした差別にあたるおそれがあります。 判断の軸は、障害名ではなく、業務上の支障と配慮で解決できるかどうかです。 配属先に伝える情報は必要な範囲で 配属先の上司などに伝える内容と範囲は、本人の同意を得て決めます。病名ではなく、業務上の困りごとと必要な配慮を中心に伝えます（G6-003）。 会社の目線で 配属は、本人が戦力として力を発揮できる場所を選ぶためのもの。障害の情報は、そのための材料として、本人の同意を得て使う", "id": "G6-102"}, "G6-107": {"conclusion": "社内で障害の有無を把握・確認するときは、厚生労働省のガイドラインに沿って、原則は全社員に向けて呼びかける方法で行います。特定の社員を名指しして手帳の有無を尋ねることは、本人が自分から申し出た場合などに限られます。", "general": [["把握・確認の方法", ["原則は、メールや社内掲示などで全社員に向けて、障害者雇用の支援制度の案内とあわせて申告を呼びかける", "特定の人に問い合わせできるのは、本人が支援制度を使いたいと自分から申し出た場合など、本人が自発的に提供した情報がある場合に限られる", "確認するときは、利用目的（雇用率の報告、支援制度の利用など）を本人に伝える"]], ["避けたいこと", ["本人の意思に反して、障害の申告や手帳の取得を強要する", "回答を拒んだ社員に繰り返し迫る、不利に扱う", "産業医などを通じて申告や手帳の取得を迫る"]], ["本人から申し出があったとき", ["申し出てくれたことを受け止め、何に困っているか、どんな配慮を望むかを聞く", "手帳で確認する場合は、写しの保管方法と見られる人を限定する"]]], "sources": ["プライバシーに配慮した障害者の把握・確認ガイドライン（厚生労働省）"], "links": [["厚生労働省 プライバシーに配慮した障害者の把握・確認ガイドライン（PDF）", "https://www.mhlw.go.jp/content/000581119.pdf"]], "q": "社内で障害の有無をつかむ際、どのような方法・注意点がありますか？", "cat": "対象と把握", "st": 3, "kw": "本人から障害の申し出があった場合、どのように確認すればよいですか？ 社員が障がい者手帳を所持しているかどうか確認する方法はありますか。 障害を有していると思われる社員がいます。本人に障害者手帳などの有無を確認してもよいですか？", "body": "把握・確認の方法 原則は、メールや社内掲示などで全社員に向けて、障害者雇用の支援制度の案内とあわせて申告を呼びかける 特定の人に問い合わせできるのは、本人が支援制度を使いたいと自分から申し出た場合など、本人が自発的に提供した情報がある場合に限られる 確認するときは、利用目的（雇用率の報告、支援制度の利用など）を本人に伝える 避けたいこと 本人の意思に反して、障害の申告や手帳の取得を強要する 回答を拒んだ社員に繰り返し迫る、不利に扱う 産業医などを通じて申告や手帳の取得を迫る 本人から申し出があったとき 申し出てくれたことを受け止め、何に困っているか、どんな配慮を望むかを聞く 手帳で確認する場合は、写しの保管方法と見られる人を限定する", "id": "G6-107"}, "G6-109": {"conclusion": "A型・B型のどちらにも、差別禁止と合理的配慮の義務はあります。ただし、もとになる法律が異なります。A型は利用者と雇用契約を結ぶため、障害者雇用促進法（雇用の場面）が適用されます。B型は雇用契約を結ばないため雇用促進法の対象ではありませんが、福祉サービスを提供する事業者として、障害者差別解消法にもとづく差別禁止と合理的配慮の提供が求められます。", "general": [["A型事業所", ["利用者は事業所と雇用契約を結ぶ労働者なので、労働基準法などの労働関係の法律が適用される", "あわせて、障害者雇用促進法の差別禁止・合理的配慮の義務が、雇用の場面に適用される"]], ["B型事業所", ["利用者は雇用契約を結ばないため、労働者にはあたらず、障害者雇用促進法の対象ではない", "一方で、福祉サービスを提供する事業者として、障害者差別解消法が適用される。不当な差別的取扱いの禁止に加え、合理的配慮の提供も2024年4月から義務になっている", "作業内容や作業時間の調整、説明のしかたの工夫など、利用者一人ひとりに合わせた配慮を、本人と話し合って行う"]], ["あわせて知っておきたいこと", ["A型の利用者も、福祉サービスの利用者としては障害者差別解消法の対象になる", "福祉分野の事業者向けには、厚生労働省が差別解消法にもとづく対応指針を示している"]]], "sources": ["障害者雇用促進法34条〜36条の4", "障害者差別解消法8条（事業者における差別の禁止・合理的配慮の提供）", "厚生労働省 福祉事業者向け対応指針（障害者差別解消法）"], "q": "就労継続支援A型・B型事業所にも、差別禁止・合理的配慮の義務は適用されますか？", "cat": "対象と把握", "st": 3, "kw": "", "body": "A型事業所 利用者は事業所と雇用契約を結ぶ労働者なので、労働基準法などの労働関係の法律が適用される あわせて、障害者雇用促進法の差別禁止・合理的配慮の義務が、雇用の場面に適用される B型事業所 利用者は雇用契約を結ばないため、労働者にはあたらず、障害者雇用促進法の対象ではない 一方で、福祉サービスを提供する事業者として、障害者差別解消法が適用される。不当な差別的取扱いの禁止に加え、合理的配慮の提供も2024年4月から義務になっている 作業内容や作業時間の調整、説明のしかたの工夫など、利用者一人ひとりに合わせた配慮を、本人と話し合って行う あわせて知っておきたいこと A型の利用者も、福祉サービスの利用者としては障害者差別解消法の対象になる 福祉分野の事業者向けには、厚生労働省が差別解消法にもとづく対応指針を示している", "id": "G6-109"}, "G6-124": {"conclusion": "障害の種類によって特性が違えば、必要な配慮も違います。特性にもとづいて異なる配慮を行い、その結果として取扱いが異なることは、問題ありません。大切なのは、障害の種類で一律に決めるのではなく、一人ひとりの特性と必要な配慮にもとづいて判断することです。", "general": [["考え方", ["障害の種類によって、困りごとや必要な配慮は異なる（たとえば、視覚障害なら資料の読み上げ、精神障害なら業務量や勤務時間の調整、など）", "特性に合わせて異なる配慮を行うことは、合理的配慮そのもの", "職業能力などを適正に評価した結果として取扱いが異なることも、問題ない"]], ["実務での注意", ["障害の種類で一律に仕事や処遇を決めず、一人ひとりの特性・能力・必要な配慮をもとに判断する", "同じ障害の種類でも、必要な配慮は人によって違う", "取扱いが異なる場合は、その理由を本人に説明できるようにする"]]], "sources": ["障害者差別禁止指針（厚生労働省）"], "links": [["厚生労働省 障害者差別禁止・合理的配慮に関するQ&A（PDF）", "https://www.mhlw.go.jp/file/06-Seisakujouhou-11600000-Shokugyouanteikyoku/0000121387.pdf"]], "q": "障害の種類（身体・知的・精神・発達など）によって、取扱いを変えることは禁止にあたりますか？", "cat": "対象と把握", "st": 3, "kw": "", "body": "考え方 障害の種類によって、困りごとや必要な配慮は異なる（たとえば、視覚障害なら資料の読み上げ、精神障害なら業務量や勤務時間の調整、など） 特性に合わせて異なる配慮を行うことは、合理的配慮そのもの 職業能力などを適正に評価した結果として取扱いが異なることも、問題ない 実務での注意 障害の種類で一律に仕事や処遇を決めず、一人ひとりの特性・能力・必要な配慮をもとに判断する 同じ障害の種類でも、必要な配慮は人によって違う 取扱いが異なる場合は、その理由を本人に説明できるようにする", "id": "G6-124"}, "G6-002": {"conclusion": "まず話しやすい場（時間帯・場所・同席者）を整えます。事前の質問票、選択式や文字での回答、支援員の同席など答え方を工夫し、すぐに答えを求めず、待つこと・責めないことを大切にします。", "general": [["場を整える", ["本人の体調がよい時間帯、落ち着ける場所を選び、話しにくい同席者がいないか確認します。"]], ["答え方の選択肢を増やす", ["事前に質問票を渡すと、考えをまとめてから話せます。", "選択式（多い／ちょうどよい／少ない など）や、メール・チャットでの回答も有効です。"]], ["支援員に同席してもらう", ["本人の状況を知る支援員がいると、本人だけでは伝えきれないことを補えます。同席は本人の同意を得て依頼します。"]], ["待つ、責めない", ["沈黙を待ち、否定しないことが、次に話してもらう土台になります。"]], ["本人から見ると", ["本音を話すと評価が下がる、契約に響く、と心配していることが多い", "面談の目的は評価ではなく、働きやすくするための確認であること、話した内容をどこまで共有するかを、最初に伝える"]]], "phrases": ["「評価の場ではなく、働きやすくするための場です」", "「ここで話した内容は、了解なく他の人に伝えません」", "「今日でなくても大丈夫です。思いついたら後でメールでも構いません」"], "sources": [], "q": "定着面談で本人が本音を話しにくそうにしている場合、聞き出す工夫はありますか？", "cat": "申し出と意思確認", "st": 3, "kw": "本人が配慮を求めることに遠慮している様子がある場合、どう声をかければ話しやすいか。", "body": "場を整える 本人の体調がよい時間帯、落ち着ける場所を選び、話しにくい同席者がいないか確認します。 答え方の選択肢を増やす 事前に質問票を渡すと、考えをまとめてから話せます。 選択式（多い／ちょうどよい／少ない など）や、メール・チャットでの回答も有効です。 支援員に同席してもらう 本人の状況を知る支援員がいると、本人だけでは伝えきれないことを補えます。同席は本人の同意を得て依頼します。 待つ、責めない 沈黙を待ち、否定しないことが、次に話してもらう土台になります。 本人から見ると 本音を話すと評価が下がる、契約に響く、と心配していることが多い 面談の目的は評価ではなく、働きやすくするための確認であること、話した内容をどこまで共有するかを、最初に伝える 「評価の場ではなく、働きやすくするための場です」 「ここで話した内容は、了解なく他の人に伝えません」 「今日でなくても大丈夫です。思いついたら後でメールでも構いません」", "id": "G6-002"}, "G6-012": {"conclusion": "書面化は2段階で考えます。申し出を受けた時点では、論点をお互いに共有するためのメモを残します。最終的に配慮の内容が合意できた時点で、本人・上司・人事が確認したうえで、正式な書面に残します。書面の様式は、社内で統一しておくのが望ましいです。", "general": [["申し出を受けた時点：メモで共有", ["申し出の日付、本人の希望、その理由（困りごと）を簡単にメモし、本人と内容を確認します。", "途中段階なので、正式な書面でなくてかまいません。言った言わないを防ぎ、話し合いの論点をそろえるためのものです。"]], ["合意した時点：正式な書面に", ["配慮の内容、その理由、開始日、次に見直す時期を記載します。", "本人・上司・人事が内容を確認し、合意した記録として残します。"]], ["様式を統一する", ["部署ごとに書き方が違うと、引き継ぎや見直しのときに困ります。社内で共通の様式（合理的配慮シートなど）を決めておきます。"]], ["見直したら更新する", ["配慮の内容を変えたときは、書面も更新し、変更の経緯を残します（G6-008）。"]]], "sources": [], "q": "配慮の申し出を口頭で受けた場合、書面化はどのタイミングで行えばよいですか？", "cat": "申し出と意思確認", "st": 3, "kw": "合理的配慮を提供する際、その内容を決定し締結する上で、特に注意すべき点は何でしょうか？", "body": "申し出を受けた時点：メモで共有 申し出の日付、本人の希望、その理由（困りごと）を簡単にメモし、本人と内容を確認します。 途中段階なので、正式な書面でなくてかまいません。言った言わないを防ぎ、話し合いの論点をそろえるためのものです。 合意した時点：正式な書面に 配慮の内容、その理由、開始日、次に見直す時期を記載します。 本人・上司・人事が内容を確認し、合意した記録として残します。 様式を統一する 部署ごとに書き方が違うと、引き継ぎや見直しのときに困ります。社内で共通の様式（合理的配慮シートなど）を決めておきます。 見直したら更新する 配慮の内容を変えたときは、書面も更新し、変更の経緯を残します（G6-008）。", "id": "G6-012"}, "G6-013": {"conclusion": "上司はできるだけ同席します。ただ、上司だけでは合理的配慮の考え方や制度を十分に理解していない場合があるため、制度面や公平性の面から人事が入ることも有効です。場合によっては、本人をよく知る支援者の同席も考えます。", "general": [["上司はできるだけ同席", ["日々の業務で配慮を実際に行うのは上司です。本人の希望と業務の実情の両方を踏まえて話し合うために、上司の同席は欠かせません。"]], ["人事が入る意味", ["上司だけでは、合理的配慮の考え方や社内制度を十分に理解していないことがあります。", "人事が入ることで、制度面の確認や、ほかの社員との公平性の視点を補えます。"]], ["支援者の同席", ["本人が一人では希望を伝えにくい場合は、本人の同意を得て、本人をよく知る支援機関の支援員に同席してもらいます（G6-002）。"]], ["検討の場面と、定着面談の場面", ["配慮の内容を社内で考える会議に本人が同席しない場合は、事前に本人の意見を聞き、会議の結論は本人に説明して合意を得ます。", "定着面談にも、人事だけでなく上司が同席するのが基本です。上司に話しにくい内容がありそうなときは、人事と本人だけで話す時間を一部設けます。"]]], "sources": [], "q": "配慮の意思確認の面談には、誰が同席すればよいですか？（上司だけか、人事も入ったほうがよいか）", "cat": "申し出と意思確認", "st": 3, "kw": "配慮内容を検討する会議に本人を同席させるべきか、それとも別途意見を聞くべきか。 定着面談に人事だけでなく現場の上司も同席させるべきか。", "body": "上司はできるだけ同席 日々の業務で配慮を実際に行うのは上司です。本人の希望と業務の実情の両方を踏まえて話し合うために、上司の同席は欠かせません。 人事が入る意味 上司だけでは、合理的配慮の考え方や社内制度を十分に理解していないことがあります。 人事が入ることで、制度面の確認や、ほかの社員との公平性の視点を補えます。 支援者の同席 本人が一人では希望を伝えにくい場合は、本人の同意を得て、本人をよく知る支援機関の支援員に同席してもらいます（G6-002）。 検討の場面と、定着面談の場面 配慮の内容を社内で考える会議に本人が同席しない場合は、事前に本人の意見を聞き、会議の結論は本人に説明して合意を得ます。 定着面談にも、人事だけでなく上司が同席するのが基本です。上司に話しにくい内容がありそうなときは、人事と本人だけで話す時間を一部設けます。", "id": "G6-013"}, "G6-017": {"conclusion": "採用面接の時点では、実際の職場や業務のイメージがつかないため、入社後に配慮の希望が変わるのは自然なことです。なぜ変わったのか、どういう面から変わったのかを確認し、改めて話し合って合意します。入社前に記録した内容は、実際の職場に照らして更新します。", "general": [["希望が変わるのは自然なこと", ["面接時は職場の環境や業務の中身がまだわからず、必要な配慮を具体的に想像しにくいものです。", "入社後に希望が変わったことを、「最初と話が違う」と否定的に受け止めないようにします。"]], ["変わった理由を確認する", ["実際の業務で新たな困りごとが出てきたのか、環境に慣れて不要になったのかなど、変化の背景を聞きます。"]], ["改めて話し合って合意する", ["新しい希望についても、業務上の必要性、障害による支障、過重な負担にならないか、の3つの軸で考えます（G6-001）。"]], ["記録を更新する", ["入社前の記録と実際の職場を照らし合わせ、配慮の内容を書面で更新します（G6-012）。", "変更するときは、本人・上司・人事が新しい内容を確認し、変更の理由と日付を残します。"]], ["入社後の早い時期に確認の場を", ["入社後の早い時期（一例として1か月後など）に一度面談を設け、面接時の配慮が合っているかを確認しておくと、変化に早く対応できます。時期は、本人の様子や業務に合わせて決めます。"]]], "sources": [], "q": "採用面接時と入社後で配慮の希望が変わった場合、どう対応を更新すればよいですか？", "cat": "申し出と意思確認", "st": 3, "kw": "定着面談の結果、配慮内容を変更する場合の社内手続きはどう進めればよいか。", "body": "希望が変わるのは自然なこと 面接時は職場の環境や業務の中身がまだわからず、必要な配慮を具体的に想像しにくいものです。 入社後に希望が変わったことを、「最初と話が違う」と否定的に受け止めないようにします。 変わった理由を確認する 実際の業務で新たな困りごとが出てきたのか、環境に慣れて不要になったのかなど、変化の背景を聞きます。 改めて話し合って合意する 新しい希望についても、業務上の必要性、障害による支障、過重な負担にならないか、の3つの軸で考えます（G6-001）。 記録を更新する 入社前の記録と実際の職場を照らし合わせ、配慮の内容を書面で更新します（G6-012）。 変更するときは、本人・上司・人事が新しい内容を確認し、変更の理由と日付を残します。 入社後の早い時期に確認の場を 入社後の早い時期（一例として1か月後など）に一度面談を設け、面接時の配慮が合っているかを確認しておくと、変化に早く対応できます。時期は、本人の様子や業務に合わせて決めます。", "id": "G6-017"}, "G6-018": {"conclusion": "基本は本人の意思を尊重します。あわせて、なぜ撤回したいのか、背景を確認します。撤回した結果、安全や業務に支障が出るおそれがある場合は、その理由を伝えたうえで、改めて相談します。", "general": [["本人の意思を尊重する", ["配慮は本人の希望にもとづくものなので、撤回したいという意思は尊重します。"]], ["撤回の理由を確認する", ["「周りの目が気になる」「特別扱いされたくない」「評価が下がるのでは」といった不安が背景にあることがあります。", "そうした不安が理由なら、配慮の伝え方や周囲への説明を見直すことで、配慮を続けられる場合もあります（G6-044）。"]], ["安全や業務に支障が出る場合", ["配慮をやめると安全面や業務に支障が出るおそれがある場合は、その理由を具体的に伝え、改めて話し合います。"]], ["記録と、再申し出の道", ["撤回の申し出と理由、話し合った内容を記録しておきます（G6-012）。", "「必要になったら、いつでもまた相談してください」と伝え、再び申し出やすい状態にしておきます。"]], ["本人から見ると", ["撤回の背景に、「周りに知られたくない」「特別扱いと思われたくない」という気持ちがあることが多い", "配慮は特別扱いではなく、力を発揮するための調整であること、周囲にどこまで伝えるかは本人と決められることを伝える"]]], "sources": [], "q": "配慮の申し出を拒否・撤回したいと本人が言った場合、会社はどう対応すればよいですか？", "cat": "申し出と意思確認", "st": 3, "kw": "", "body": "本人の意思を尊重する 配慮は本人の希望にもとづくものなので、撤回したいという意思は尊重します。 撤回の理由を確認する 「周りの目が気になる」「特別扱いされたくない」「評価が下がるのでは」といった不安が背景にあることがあります。 そうした不安が理由なら、配慮の伝え方や周囲への説明を見直すことで、配慮を続けられる場合もあります（G6-044）。 安全や業務に支障が出る場合 配慮をやめると安全面や業務に支障が出るおそれがある場合は、その理由を具体的に伝え、改めて話し合います。 記録と、再申し出の道 撤回の申し出と理由、話し合った内容を記録しておきます（G6-012）。 「必要になったら、いつでもまた相談してください」と伝え、再び申し出やすい状態にしておきます。 本人から見ると 撤回の背景に、「周りに知られたくない」「特別扱いと思われたくない」という気持ちがあることが多い 配慮は特別扱いではなく、力を発揮するための調整であること、周囲にどこまで伝えるかは本人と決められることを伝える", "id": "G6-018"}, "G6-019": {"conclusion": "配慮の主体は本人なので、基本は本人の意向を優先します。そのうえで、家族は本人とは違う目線を持つ貴重な情報源です。家族がどんな点を心配しているかを聞くことはあってよいでしょう。家族とどこまで関わるかは会社によって方針が分かれるため、自社の方針に照らして判断します。", "general": [["主体は本人", ["雇用契約を結んでいるのは本人です。配慮の内容は、本人の意向を基本に、本人と会社で話し合って決めます。"]], ["家族は貴重な情報源", ["家族は、家庭での様子や体調の変化など、職場では見えない面を知っています。", "本人が自分の状況をうまく伝えられない、把握しきれていない場合には、家族の懸念を聞くことが役立つことがあります。"]], ["家族の話を聞くときの注意", ["家族と話す場合は、原則として本人の同意を得ます。", "家族の意見を聞いても、最終的には本人と話し合って決めます。家族の希望だけで配慮の内容を変えることはしません。"]], ["会社の方針に照らす", ["「雇用は本人との関係なので、家族は関与しない」という方針の会社もあります。", "どこまで家族と関わるかを事前に社内で決めておくと、対応がぶれません。"]], ["命や安全に関わる場合は別", ["本人の命や安全に関わる緊急時は、本人の同意を待たずに家族へ連絡することもあります（G10-018）。"]]], "sources": [], "q": "配慮の申し出について、本人と家族の意向が異なる場合はどちらを優先すればよいですか？", "cat": "申し出と意思確認", "st": 3, "kw": "家族の意向と本人の意向が食い違う場合、会社はどちらを優先して動くべきか。", "body": "主体は本人 雇用契約を結んでいるのは本人です。配慮の内容は、本人の意向を基本に、本人と会社で話し合って決めます。 家族は貴重な情報源 家族は、家庭での様子や体調の変化など、職場では見えない面を知っています。 本人が自分の状況をうまく伝えられない、把握しきれていない場合には、家族の懸念を聞くことが役立つことがあります。 家族の話を聞くときの注意 家族と話す場合は、原則として本人の同意を得ます。 家族の意見を聞いても、最終的には本人と話し合って決めます。家族の希望だけで配慮の内容を変えることはしません。 会社の方針に照らす 「雇用は本人との関係なので、家族は関与しない」という方針の会社もあります。 どこまで家族と関わるかを事前に社内で決めておくと、対応がぶれません。 命や安全に関わる場合は別 本人の命や安全に関わる緊急時は、本人の同意を待たずに家族へ連絡することもあります（G10-018）。", "id": "G6-019"}, "G6-096": {"conclusion": "「いつ、どこで、何が、どのように困るのか」を一つずつ確認して具体化します。実際の業務や職場環境の場面を示しながら聞くと、本人もイメージしやすくなります。それでも具体的にならない場合は、選択肢を示して選んでもらう、一定期間試してみて決める、といった方法をとります。", "general": [["5W1Hで聞く", ["いつ（どの時間帯・どんなとき）、どこで（どの場所・どの業務）、何が（何に困るのか）、どのように（どの程度、どんな支障が出るのか）を一つずつ確認します。"]], ["業務や環境の場面とセットで聞く", ["「この業務を、この環境で行うとしたら、どんな配慮があると働きやすいですか」と、実際の場面を示して聞きます。", "場面が具体的にならないと、本人も必要な配慮を言葉にしにくいものです。"]], ["選択肢を示す", ["「A（席の位置を変える）とB（イヤーマフを使う）では、どちらが合いそうですか」のように選択肢を示すと、答えやすくなります。"]], ["試してみて決める", ["一定期間（例：2週間〜1か月）試し、その後に振り返って続けるか、変えるかを決めます。", "試す期間と振り返りの日を、最初に決めておきます（G6-027）。"]], ["支援機関の力を借りる", ["本人が以前利用していた支援機関には、本人に合う配慮の情報があることがあります。本人の同意を得て相談します。"]]], "phrases": ["「困るのは、どの業務をしているときが多いですか」", "「AとBの方法があるのですが、どちらが合いそうですか。まず2週間試してみましょう」"], "sources": [], "q": "本人から配慮の申し出があったが、内容が漠然としている場合、どう具体化のヒアリングを進めればよいですか？", "cat": "申し出と意思確認", "st": 3, "kw": "", "body": "5W1Hで聞く いつ（どの時間帯・どんなとき）、どこで（どの場所・どの業務）、何が（何に困るのか）、どのように（どの程度、どんな支障が出るのか）を一つずつ確認します。 業務や環境の場面とセットで聞く 「この業務を、この環境で行うとしたら、どんな配慮があると働きやすいですか」と、実際の場面を示して聞きます。 場面が具体的にならないと、本人も必要な配慮を言葉にしにくいものです。 選択肢を示す 「A（席の位置を変える）とB（イヤーマフを使う）では、どちらが合いそうですか」のように選択肢を示すと、答えやすくなります。 試してみて決める 一定期間（例：2週間〜1か月）試し、その後に振り返って続けるか、変えるかを決めます。 試す期間と振り返りの日を、最初に決めておきます（G6-027）。 支援機関の力を借りる 本人が以前利用していた支援機関には、本人に合う配慮の情報があることがあります。本人の同意を得て相談します。 「困るのは、どの業務をしているときが多いですか」 「AとBの方法があるのですが、どちらが合いそうですか。まず2週間試してみましょう」", "id": "G6-096"}, "G6-001": {"conclusion": "「わがままか」ではなく、①業務上必要か、②障害による支障があるか、③職場に過重な負担にならないか、の3つの軸で整理します。本人と話し合い、希望の背景にある困りごとを確かめ、代わりの案も含めて考えます。", "general": [["判断の3つの軸", ["業務遂行上の必要性：担う業務に必要な配慮か。", "障害による支障：障害のために業務に支障が出ているか。", "過重な負担：事業への影響、実現の難しさ、費用、企業規模、財務状況、公的支援の有無の6要素で判断します。"]], ["話し合いが前提", ["職場が一方的に決めず、本人の意向を尊重して話し合います。"]], ["困りごとに目を向け、代わりの案を示す", ["「なぜその配慮が必要か」を聞くと、希望どおりでなくても解決策が見つかります。", "できない場合は理由を説明し、代わりにできることを示します。"]], ["記録を残す", ["希望・検討内容・結論・見直し時期を記録します。引き継ぎやトラブル時の根拠になります。"]], ["会社の考え方として伝える", ["合理的配慮は会社の義務だが、何でも応じるものではなく、過重な負担にならない範囲で話し合って決めるもの（G7-003）", "この考え方を本人にも伝えておくと、「わがまま」「拒否された」という受け止めのすれ違いを防ぎやすい"]]], "sources": ["厚生労働省「合理的配慮指針」"], "q": "本人の要求が業務上妥当な配慮なのか、単なるわがままなのか判断がつかない場合、どう整理すればよいですか？", "cat": "検討の進め方と線引き", "st": 3, "kw": "求められた合理的配慮に対し「わがままでは？」と思う場合のアプローチはどうしたらいいですか？ 配慮の申し出内容と、実際に必要な配慮にずれがある場合、どう擦り合わせを進めればよいか。 本人の甘えではないかと現場の管理職が感じている場合、それをどう会社としてすり合わせるべきか。", "body": "判断の3つの軸 業務遂行上の必要性：担う業務に必要な配慮か。 障害による支障：障害のために業務に支障が出ているか。 過重な負担：事業への影響、実現の難しさ、費用、企業規模、財務状況、公的支援の有無の6要素で判断します。 話し合いが前提 職場が一方的に決めず、本人の意向を尊重して話し合います。 困りごとに目を向け、代わりの案を示す 「なぜその配慮が必要か」を聞くと、希望どおりでなくても解決策が見つかります。 できない場合は理由を説明し、代わりにできることを示します。 記録を残す 希望・検討内容・結論・見直し時期を記録します。引き継ぎやトラブル時の根拠になります。 会社の考え方として伝える 合理的配慮は会社の義務だが、何でも応じるものではなく、過重な負担にならない範囲で話し合って決めるもの（G7-003） この考え方を本人にも伝えておくと、「わがまま」「拒否された」という受け止めのすれ違いを防ぎやすい", "id": "G6-001"}, "G6-006": {"conclusion": "①本人が望んでいない、②業務の本質が変わる、③過重な負担になる、の場合です。ただしいずれも一方的に決めず、理由を説明して話し合い、できる範囲の代わりの案を考えます。", "general": [["本人が望んでいない場合", ["障害を知っている社員には、会社から支障の有無を確認したうえで、本人が希望しないことを確かめます。"]], ["業務の本質が変わる場合", ["その仕事に欠かせない中核業務そのものを免除する配慮は、範囲を超えます。業務内容や配置の見直しとして考えます。"]], ["過重な負担になる場合", ["6要素で個別に判断します。「費用がかかる」「前例がない」だけでは過重な負担とはいえません。助成金などで実現できることもあります。"]], ["「しない」で終わらせない", ["過重な負担でも、負担にならない範囲の配慮は行う必要があります。理由と経過は記録します。"]]], "sources": ["厚生労働省「合理的配慮指針」"], "q": "合理的配慮を「しない」と判断してよいのは、どのような場合ですか？", "cat": "検討の進め方と線引き", "st": 3, "kw": "障害者が希望する配慮が過重な負担に当たる場合はどうすればよいですか？ 「過重な負担」はどのような基準で判断すればよいですか？", "body": "本人が望んでいない場合 障害を知っている社員には、会社から支障の有無を確認したうえで、本人が希望しないことを確かめます。 業務の本質が変わる場合 その仕事に欠かせない中核業務そのものを免除する配慮は、範囲を超えます。業務内容や配置の見直しとして考えます。 過重な負担になる場合 6要素で個別に判断します。「費用がかかる」「前例がない」だけでは過重な負担とはいえません。助成金などで実現できることもあります。 「しない」で終わらせない 過重な負担でも、負担にならない範囲の配慮は行う必要があります。理由と経過は記録します。", "id": "G6-006"}, "G6-007": {"conclusion": "できない理由を具体的に伝え、「この形はできないが、別の形ならどうか」と代わりの案をセットで示します。要望が多いときは、本人と優先順位を決めて順番に考え、内容を記録します。", "general": [["理由を具体的に", ["「難しい」ではなく、業務上の具体的な理由を伝えます。"]], ["代わりの案とセットで", ["断ることではなく、困りごとを一緒に解決する姿勢を示します。"]], ["優先順位を一緒に決める", ["要望を一覧にし、支障の大きいものから順に、見直し時期を決めて試します。"]], ["文書と記録で残す", ["その場では納得しても後から理解が追いつくこともあるため、決まったこと・難しいことと理由・代わりの案・次の見直し日を文書で渡し、記録します。"]], ["会社の基準として伝える", ["できない理由は、「あなただから」ではなく「会社としての基準」として、障害の有無に関係なく同じ考え方で説明する", "できないことだけでなく、できることを先に伝えると、本人も受け止めやすい"]]], "phrases": ["「この業務は〇〇のため、△△はどうしても必要です。その代わり、□□ならできます」", "「全部を一度には難しいので、一番困っていることから一緒に決めましょう」"], "sources": ["厚生労働省「合理的配慮指針」"], "q": "要望が多い社員に、配慮できないことをどう伝えればよいですか？", "cat": "検討の進め方と線引き", "st": 3, "kw": "配慮内容の検討結果を本人にどう説明すれば納得感を得やすいか。 配慮を断る場合、本人にどう説明すれば納得を得やすいか。 配慮内容が会社の経営状況・体制上難しい場合、代替案の示し方はどうあるべきか。 本人の希望する配慮が業務上実現困難な場合、代替案をどう一緒に検討すればよいか。 特性理解や合理的配慮への主張が強い社員がいます。企業としてどこまで対応する必要があるのでしょうか？時には過度な要求だと感じることもあり、対応に苦慮しています。", "body": "理由を具体的に 「難しい」ではなく、業務上の具体的な理由を伝えます。 代わりの案とセットで 断ることではなく、困りごとを一緒に解決する姿勢を示します。 優先順位を一緒に決める 要望を一覧にし、支障の大きいものから順に、見直し時期を決めて試します。 文書と記録で残す その場では納得しても後から理解が追いつくこともあるため、決まったこと・難しいことと理由・代わりの案・次の見直し日を文書で渡し、記録します。 会社の基準として伝える できない理由は、「あなただから」ではなく「会社としての基準」として、障害の有無に関係なく同じ考え方で説明する できないことだけでなく、できることを先に伝えると、本人も受け止めやすい 「この業務は〇〇のため、△△はどうしても必要です。その代わり、□□ならできます」 「全部を一度には難しいので、一番困っていることから一緒に決めましょう」", "id": "G6-007"}, "G6-020": {"conclusion": "どちらか一方が主導するのではなく、役割を分けて両方が関わります。日々の業務に責任を持つ現場は「本人が働きやすいか、業務上の支障が取り除けるか」を、人事は「会社の制度や公平性の面で問題がないか」を判断します。二方向から関わることで、一人が抱え込むことも防げます。", "general": [["現場の役割", ["日々の業務に責任を持つ立場として、本人がどんな場面で困っているか、配慮で業務上の支障が取り除けるかを判断します。", "配慮を実際に行うのも現場です。"]], ["人事の役割", ["社内制度（勤務時間、休暇、就業規則など）に照らして問題がないか、ほかの社員との公平性が保てるかを確認します。", "部署をまたぐ調整や、記録の管理も人事が担います。"]], ["二方向で関わる意味", ["現場だけだと、上司一人が判断を抱え込んだり、部署によって対応がばらついたりします。", "人事だけだと、実際の業務に合わない配慮になりがちです。"]], ["過重な負担の最終判断", ["配慮を「行わない」と判断する場合や、過重な負担にあたるかを判断する場合は、現場だけで決めず、人事が取りまとめて会社として判断します。", "費用が大きいものや、制度の変更を伴うものは、経営層の判断も仰ぎます。"]]], "sources": [], "q": "配慮内容を考える際、現場の管理職と人事のどちらが主導すればよいですか？", "cat": "検討の進め方と線引き", "st": 3, "kw": "過重な負担の判断を誰が最終的に行うべきか（現場か人事か経営層か）。 現場と人事・総務部門はどのように連携すればよいか知りたい", "body": "現場の役割 日々の業務に責任を持つ立場として、本人がどんな場面で困っているか、配慮で業務上の支障が取り除けるかを判断します。 配慮を実際に行うのも現場です。 人事の役割 社内制度（勤務時間、休暇、就業規則など）に照らして問題がないか、ほかの社員との公平性が保てるかを確認します。 部署をまたぐ調整や、記録の管理も人事が担います。 二方向で関わる意味 現場だけだと、上司一人が判断を抱え込んだり、部署によって対応がばらついたりします。 人事だけだと、実際の業務に合わない配慮になりがちです。 過重な負担の最終判断 配慮を「行わない」と判断する場合や、過重な負担にあたるかを判断する場合は、現場だけで決めず、人事が取りまとめて会社として判断します。 費用が大きいものや、制度の変更を伴うものは、経営層の判断も仰ぎます。", "id": "G6-020"}, "G6-021": {"conclusion": "「本人にとっての効果の大きさ」と「過重な負担にならないか（実現できるか）」の掛け算で考えます。効果の大きさを出発点に、それぞれの案がどこまで負担になるかを見て、両方のバランスがよいものを選びます。どちらがよいか判断がつかない場合は、試してみて、振り返ってから決めます。", "general": [["2つの軸で比べる", ["効果：その配慮で、本人の業務上の支障がどれだけ取り除けるか。", "負担：費用、手間、ほかの社員への影響など、職場にとってどれだけ負担になるか（G6-001の6要素）。", "理想は「効果が大きく、負担が小さい」案です。効果が大きくても負担が重すぎれば、実現は難しくなります。"]], ["本人の意向を尊重する", ["厚生労働省の指針では、配慮の方法が複数ある場合、本人の意向を十分に尊重したうえで、会社にとって提供しやすい方法を選ぶことも認められています。", "選ぶ理由を本人に説明し、納得してもらうことが大切です。"]], ["迷ったら試してみる", ["判断がつかない場合は、一定期間試し、振り返ってから確定します（G6-096）。"]], ["組み合わせも考える", ["一つの案にこだわらず、負担の小さい案を組み合わせることで、同じくらいの効果が得られる場合もあります。"]]], "sources": ["厚生労働省「合理的配慮指針」"], "q": "複数の配慮案が候補にある場合、優先順位はどう決めればよいですか？", "cat": "検討の進め方と線引き", "st": 3, "kw": "配慮の方法が複数考えられる場合、どちらを採用すべきですか？", "body": "2つの軸で比べる 効果：その配慮で、本人の業務上の支障がどれだけ取り除けるか。 負担：費用、手間、ほかの社員への影響など、職場にとってどれだけ負担になるか（G6-001の6要素）。 理想は「効果が大きく、負担が小さい」案です。効果が大きくても負担が重すぎれば、実現は難しくなります。 本人の意向を尊重する 厚生労働省の指針では、配慮の方法が複数ある場合、本人の意向を十分に尊重したうえで、会社にとって提供しやすい方法を選ぶことも認められています。 選ぶ理由を本人に説明し、納得してもらうことが大切です。 迷ったら試してみる 判断がつかない場合は、一定期間試し、振り返ってから確定します（G6-096）。 組み合わせも考える 一つの案にこだわらず、負担の小さい案を組み合わせることで、同じくらいの効果が得られる場合もあります。", "id": "G6-021"}, "G6-022": {"conclusion": "検討の初期の段階で意見をもらうのが望ましいです。最後に意見をもらうと、それまで考えた内容がひっくり返ることがあるためです。主治医の意見書や産業医との面談で医学的な意見を聞き、そのうえで職場の実情や過重な負担にならないかを踏まえて、本人と会社で話し合って決めます。", "general": [["初期に意見をもらう", ["検討を始めた段階で、主治医の意見書や産業医の面談で、配慮が必要な点や避けたほうがよいことを確認します。", "検討の終盤に意見をもらうと、内容のやり直しが必要になることがあります。"]], ["主治医の意見書", ["主治医の意見書がある場合は、本人に提出をお願いします。", "会社から主治医に問い合わせる場合は、本人の同意を得たうえで、職場の業務内容を伝えて具体的な意見をもらうようにします。"]], ["産業医の役割", ["主治医は本人の病状をよく知る立場、産業医は職場の業務や環境を踏まえて判断する立場です。両方の意見を聞くと判断しやすくなります。"]], ["意見をそのまま受け入れる必要はない", ["医師の意見は大切な判断材料ですが、すべてをそのまま実行する必要はありません。", "職場の実情や過重な負担にならないかを踏まえ、本人と会社で話し合って決めます（G6-001）。"]]], "sources": [], "q": "配慮内容の検討にあたり、産業医や主治医の意見をどの段階で取り入れればよいですか？", "cat": "検討の進め方と線引き", "st": 3, "kw": "", "body": "初期に意見をもらう 検討を始めた段階で、主治医の意見書や産業医の面談で、配慮が必要な点や避けたほうがよいことを確認します。 検討の終盤に意見をもらうと、内容のやり直しが必要になることがあります。 主治医の意見書 主治医の意見書がある場合は、本人に提出をお願いします。 会社から主治医に問い合わせる場合は、本人の同意を得たうえで、職場の業務内容を伝えて具体的な意見をもらうようにします。 産業医の役割 主治医は本人の病状をよく知る立場、産業医は職場の業務や環境を踏まえて判断する立場です。両方の意見を聞くと判断しやすくなります。 意見をそのまま受け入れる必要はない 医師の意見は大切な判断材料ですが、すべてをそのまま実行する必要はありません。 職場の実情や過重な負担にならないかを踏まえ、本人と会社で話し合って決めます（G6-001）。", "id": "G6-022"}, "G6-023": {"conclusion": "配慮を決めたら、周囲の社員にかかる時間や作業の量だけでなく、気持ちの面の負担も含めて見積もります。そのうえで、一時的な負担か、ずっと続く負担かを分けて、ほかの業務を減らすなどの調整をします。やってみないとわからない部分も多いので、始めた後も定期的に見直し、周囲の声を聞き続けることが大切です。", "general": [["見積もること", ["時間と作業量：誰に、どんな作業が、どのくらい増えるか（例：ダブルチェックに1日何分かかるか）", "気持ちの面の負担：教える、声をかける、体調を気にかける、などの精神的な負担", "期間：一時的な負担（入社直後や体調が不安定な時期など）か、ずっと続く負担か"]], ["見積もりに合わせて調整する", ["一時的な負担なら、その期間だけ、周囲の社員のほかの業務を減らす", "ずっと続く負担なら、周囲の社員の業務分担そのものを見直す", "負担が一人に集中しないよう、複数の人で分担する（G12-006）"]], ["始めた後も見直す", ["配慮はやってみないとわからない部分が多い。最初の見積もりにこだわらず、定期的に見直す", "本人と周囲の両方から、負担の感じ方を聞く。数字だけで判断しない", "周囲の負担感に寄り添い、話を聞くこと自体が、職場の納得感や協力につながる"]], ["負担が大きすぎる場合", ["周囲の負担があまりに大きく、ほかの方法もない場合は、本人と話し合って、別の配慮の方法を探す", "会社にとって過重な負担かどうかは、事業への影響、実現の難しさ、費用などを総合的に見て判断する（合理的配慮指針）"]]], "sources": ["合理的配慮指針（厚生労働省）：過重な負担の判断要素"], "q": "配慮の具体化にあたり、他の社員の業務にどの程度影響が出るかをどう見積もればよいですか？", "cat": "検討の進め方と線引き", "st": 3, "kw": "", "body": "見積もること 時間と作業量：誰に、どんな作業が、どのくらい増えるか（例：ダブルチェックに1日何分かかるか） 気持ちの面の負担：教える、声をかける、体調を気にかける、などの精神的な負担 期間：一時的な負担（入社直後や体調が不安定な時期など）か、ずっと続く負担か 見積もりに合わせて調整する 一時的な負担なら、その期間だけ、周囲の社員のほかの業務を減らす ずっと続く負担なら、周囲の社員の業務分担そのものを見直す 負担が一人に集中しないよう、複数の人で分担する（G12-006） 始めた後も見直す 配慮はやってみないとわからない部分が多い。最初の見積もりにこだわらず、定期的に見直す 本人と周囲の両方から、負担の感じ方を聞く。数字だけで判断しない 周囲の負担感に寄り添い、話を聞くこと自体が、職場の納得感や協力につながる 負担が大きすぎる場合 周囲の負担があまりに大きく、ほかの方法もない場合は、本人と話し合って、別の配慮の方法を探す 会社にとって過重な負担かどうかは、事業への影響、実現の難しさ、費用などを総合的に見て判断する（合理的配慮指針）", "id": "G6-023"}, "G6-032": {"conclusion": "どちらの障害を優先するかではなく、業務上の困りごとから整理します。たとえば身体障害の手帳を持ちながら、発達障害や精神障害の特性もある人がいます。手帳の種類や障害名で判断するのではなく、実際にどんな場面で何に困っているかを起点に配慮を考えます。", "general": [["障害名ではなく困りごとから", ["障害ごとに配慮を考えると、重なりや抜けが生じます。", "業務の場面ごとに「何に困っているか」を書き出し、それぞれに必要な配慮を考えます。"]], ["手帳だけで判断しない", ["手帳に記載された障害以外にも、特性や困りごとがあることがあります。手帳の種類だけで配慮の範囲を決めないようにします（G6-004）。"]], ["困りごとの優先順位", ["困りごとが多い場合は、業務への支障が大きいもの、安全に関わるもの、本人にとって切実なものから順に取り組みます。", "一度に全部ではなく、見直し時期を決めて少しずつ進めます（G6-007）。"]], ["専門家の意見を聞く", ["障害が重なることで生じる困りごともあるため、本人の同意を得て、主治医や支援機関の意見を聞きます（G6-022）。"]]], "sources": [], "q": "複数の障害を併せ持つ社員への配慮は、どちらを優先して考えればよいですか？", "cat": "検討の進め方と線引き", "st": 3, "kw": "複数の疾患・障害が絡み合い、配慮の優先順位付けが難しいケースはどう整理すべきか。", "body": "障害名ではなく困りごとから 障害ごとに配慮を考えると、重なりや抜けが生じます。 業務の場面ごとに「何に困っているか」を書き出し、それぞれに必要な配慮を考えます。 手帳だけで判断しない 手帳に記載された障害以外にも、特性や困りごとがあることがあります。手帳の種類だけで配慮の範囲を決めないようにします（G6-004）。 困りごとの優先順位 困りごとが多い場合は、業務への支障が大きいもの、安全に関わるもの、本人にとって切実なものから順に取り組みます。 一度に全部ではなく、見直し時期を決めて少しずつ進めます（G6-007）。 専門家の意見を聞く 障害が重なることで生じる困りごともあるため、本人の同意を得て、主治医や支援機関の意見を聞きます（G6-022）。", "id": "G6-032"}, "G6-058": {"conclusion": "交えてよいでしょう。認識に大きな開きがあるときは、前提条件や「配慮」というものの捉え方そのものが食い違っていることがあります。会社から伝えるより、支援機関・産業医など第三者に入ってもらう方が話が進むことがあります。現場と本人だけで話している場合は、人事が第三者的に入ることも有効です。あわせて、合理的配慮の考え方を客観的な事実として伝えます。", "general": [["食い違いの原因を確かめる", ["配慮の目的（業務上の支障を取り除くこと）や、会社ができる範囲についての前提が、本人と会社で違っていることがあります。"]], ["第三者の候補", ["本人をよく知る支援機関の支援員、産業医、そして現場と本人だけで話している場合は人事。", "本人の同意を得て同席を依頼します。"]], ["合理的配慮の考え方を客観的に伝える", ["「合理的配慮は、障害による業務上の支障を取り除くための調整で、過重な負担にならない範囲で行うもの」という考え方を、厚労省の資料なども使って説明します（G6-001）。", "会社の言い分としてではなく、共通のルールとして示すと、受け止めてもらいやすくなります。"]], ["それでも解決しない場合", ["社内の苦情処理の窓口で扱います。", "さらに解決しない場合は、都道府県労働局による助言・指導や、調停の制度も利用できます。"]]], "sources": ["障害者雇用促進法（紛争の解決）", "厚生労働省「合理的配慮指針」"], "q": "配慮の程度について本人と会社の認識に大きな開きがある場合、第三者を交えたほうがよいですか？", "cat": "検討の進め方と線引き", "st": 3, "kw": "合理的配慮をめぐって話し合いがまとまらない場合、どのように解決すればよいですか？", "body": "食い違いの原因を確かめる 配慮の目的（業務上の支障を取り除くこと）や、会社ができる範囲についての前提が、本人と会社で違っていることがあります。 第三者の候補 本人をよく知る支援機関の支援員、産業医、そして現場と本人だけで話している場合は人事。 本人の同意を得て同席を依頼します。 合理的配慮の考え方を客観的に伝える 「合理的配慮は、障害による業務上の支障を取り除くための調整で、過重な負担にならない範囲で行うもの」という考え方を、厚労省の資料なども使って説明します（G6-001）。 会社の言い分としてではなく、共通のルールとして示すと、受け止めてもらいやすくなります。 それでも解決しない場合 社内の苦情処理の窓口で扱います。 さらに解決しない場合は、都道府県労働局による助言・指導や、調停の制度も利用できます。", "id": "G6-058"}, "G6-116": {"conclusion": "合理的配慮は、①本人からの申し出（または会社からの確認）、②本人との話し合い、③配慮内容の決定と説明、④実施と見直し、の流れで進めます。採用後の社員については、会社から職場で困っていることがないかを確認することも求められています。", "general": [["基本の流れ", ["申し出・確認：募集・採用時は本人の申し出から、採用後は会社から定期的に困りごとを確認する", "話し合い：本人の困りごとと希望を聞き、どんな配慮ができるかを一緒に考える（G6-096）", "決定と説明：決めた配慮の内容を本人に伝える。できない配慮がある場合は理由を説明する（G6-007）", "実施と見直し：配慮を始めた後も、定期的に効果を確認して見直す（G6-027）"]], ["あわせてやること", ["決めた内容は書面に残す（G6-012）", "誰にどこまで共有するかを本人と決める（G10-068）", "相談窓口を決めて社員に知らせる"]]], "charts": [{"type": "table", "title": "合理的配慮の進め方", "head": ["段階", "やること", "関連する回答"], "rows": [["① 申し出・確認", "採用時は本人の申し出から、採用後は会社からも困りごとを確認する", "G6-005"], ["② 話し合い", "困りごとと希望を聞き、どんな配慮ができるかを一緒に考える", "G6-096"], ["③ 決定と説明", "決めた内容を伝え、書面に残す。できない配慮は理由と代わりの案を伝える", "G6-012、G6-007"], ["④ 実施と見直し", "配慮を始めた後も、定期的に効果を確認して見直す", "G6-027"]]}], "sources": ["合理的配慮指針（厚生労働省）"], "links": [["厚生労働省 障害者差別禁止・合理的配慮に関するQ&A（PDF）", "https://www.mhlw.go.jp/file/06-Seisakujouhou-11600000-Shokugyouanteikyoku/0000121387.pdf"]], "q": "合理的配慮を提供する際の基本的な手続きの流れを教えてください。", "cat": "合理的配慮の基本", "st": 3, "kw": "", "body": "基本の流れ 申し出・確認：募集・採用時は本人の申し出から、採用後は会社から定期的に困りごとを確認する 話し合い：本人の困りごとと希望を聞き、どんな配慮ができるかを一緒に考える（G6-096） 決定と説明：決めた配慮の内容を本人に伝える。できない配慮がある場合は理由を説明する（G6-007） 実施と見直し：配慮を始めた後も、定期的に効果を確認して見直す（G6-027） あわせてやること 決めた内容は書面に残す（G6-012） 誰にどこまで共有するかを本人と決める（G10-068） 相談窓口を決めて社員に知らせる 合理的配慮の進め方 ① 申し出・確認 採用時は本人の申し出から、採用後は会社からも困りごとを確認する G6-005 ② 話し合い 困りごとと希望を聞き、どんな配慮ができるかを一緒に考える G6-096 ③ 決定と説明 決めた内容を伝え、書面に残す。できない配慮は理由と代わりの案を伝える G6-012、G6-007 ④ 実施と見直し 配慮を始めた後も、定期的に効果を確認して見直す G6-027", "id": "G6-116"}, "G6-122": {"conclusion": "合理的配慮について判断に迷ったときは、困りごとの内容に応じて、公的な窓口に無料で相談できます。「提供しなければならないか」「差別にあたるか」といった制度の判断はハローワーク・都道府県労働局、「具体的にどんな配慮ができるか」は地域障害者職業センター、と使い分けます。", "general": [["困りごと別の相談先", ["「この配慮は提供しなければならないのか」「過重な負担にあたるのか」「この対応は差別にあたるのか」→ ハローワーク、都道府県労働局（G1-001、G6-110）", "「具体的にどんな配慮ができるか」「職場でどう進めればよいか」→ 地域障害者職業センター。必要に応じてジョブコーチが職場に来て助言する（G8-017、G1-048）", "「本人と話し合いがまとまらない」→ まず社内で話し合いを続ける。解決しなければ、都道府県労働局による助言・指導や、紛争調整委員会の調停を使える（G6-058、G6-108）", "「配慮のための設備や機器の費用が心配」→ JEEDの都道府県支部（助成金）、就労支援機器の貸出し（G1-033、G4-035）", "「本人の生活面も含めて相談したい」→ 障害者就業・生活支援センター（G8-010）"]], ["相談するときに準備するもの", ["本人からの申し出の内容と、これまでの話し合いの経緯", "会社として考えた配慮の案と、難しいと考える理由", "本人の業務内容と職場の状況"]], ["あわせて知っておきたいこと", ["法的な判断が必要な場合や、争いになりそうな場合は、社労士や弁護士にも相談する（G10-094）"]]], "charts": [{"type": "table", "title": "困りごと別の相談先", "head": ["困りごと", "相談先"], "rows": [["この配慮は提供しなければならないか、差別にあたるか", "ハローワーク、都道府県労働局"], ["具体的にどんな配慮ができるか、職場でどう進めるか", "地域障害者職業センター（ジョブコーチ）"], ["本人と話し合いがまとまらない", "まず社内で話し合い、解決しなければ都道府県労働局"], ["設備や機器の費用が心配", "JEEDの都道府県支部（助成金）、就労支援機器の貸出し"], ["生活面も含めて相談したい", "障害者就業・生活支援センター"], ["法的な判断が必要、争いになりそう", "社労士、弁護士"]]}], "links": [["厚生労働省 障害者差別禁止・合理的配慮に関するQ&A（PDF）", "https://www.mhlw.go.jp/file/06-Seisakujouhou-11600000-Shokugyouanteikyoku/0000121387.pdf"]], "q": "合理的配慮について判断に迷ったとき（この配慮は提供しなければならないのか、差別にあたるのか、など）、どこに相談できますか？", "cat": "検討の進め方と線引き", "st": 3, "kw": "", "body": "困りごと別の相談先 「この配慮は提供しなければならないのか」「過重な負担にあたるのか」「この対応は差別にあたるのか」→ ハローワーク、都道府県労働局（G1-001、G6-110） 「具体的にどんな配慮ができるか」「職場でどう進めればよいか」→ 地域障害者職業センター。必要に応じてジョブコーチが職場に来て助言する（G8-017、G1-048） 「本人と話し合いがまとまらない」→ まず社内で話し合いを続ける。解決しなければ、都道府県労働局による助言・指導や、紛争調整委員会の調停を使える（G6-058、G6-108） 「配慮のための設備や機器の費用が心配」→ JEEDの都道府県支部（助成金）、就労支援機器の貸出し（G1-033、G4-035） 「本人の生活面も含めて相談したい」→ 障害者就業・生活支援センター（G8-010） 相談するときに準備するもの 本人からの申し出の内容と、これまでの話し合いの経緯 会社として考えた配慮の案と、難しいと考える理由 本人の業務内容と職場の状況 あわせて知っておきたいこと 法的な判断が必要な場合や、争いになりそうな場合は、社労士や弁護士にも相談する（G10-094） 困りごと別の相談先 この配慮は提供しなければならないか、差別にあたるか ハローワーク、都道府県労働局 具体的にどんな配慮ができるか、職場でどう進めるか 地域障害者職業センター（ジョブコーチ） 本人と話し合いがまとまらない まず社内で話し合い、解決しなければ都道府県労働局 設備や機器の費用が心配 JEEDの都道府県支部（助成金）、就労支援機器の貸出し 生活面も含めて相談したい 障害者就業・生活支援センター 法的な判断が必要、争いになりそう 社労士、弁護士", "id": "G6-122"}, "G6-009": {"conclusion": "配慮は支障を取り除いて土台を整えるもので、成果は業務との相性や本人の成長で決まります。分けて考えたうえで、「配慮しているから成果が低くてよい」とはせず、成果は基準を明確にして評価します。", "general": [["配慮と成果を分ける", ["配慮はスタートラインをそろえるもので、成果を保証するものではありません。"]], ["見直す順番", ["①配慮が機能しているか → ②業務との相性 → ③指導・育成ができているか、の順に確認します。"]], ["成果は成果として評価する", ["期待する成果と基準を事前に伝えます。配慮のうえで適正に評価した結果の差は、差別にあたりません。", "一方、配慮を受けていること自体を理由に評価を下げてはいけません。"]], ["成果の判断の軸を示す", ["「何を、どのくらい、どの水準で」できれば成果とみなすのかを、具体的に本人に示す", "本人から見ると、配慮を受けているのに成果が出ないことに、本人自身も焦っていることが多い。責めずに一緒に原因を考える"]]], "sources": ["厚生労働省「障害者差別禁止指針」"], "q": "合理的配慮をしても成果が上がらない場合、どう対応すればよいですか？", "cat": "定着面談と見直し", "st": 3, "kw": "合理的配慮を提供した結果、処遇に差が生じた場合は差別に当たりますか？", "body": "配慮と成果を分ける 配慮はスタートラインをそろえるもので、成果を保証するものではありません。 見直す順番 ①配慮が機能しているか → ②業務との相性 → ③指導・育成ができているか、の順に確認します。 成果は成果として評価する 期待する成果と基準を事前に伝えます。配慮のうえで適正に評価した結果の差は、差別にあたりません。 一方、配慮を受けていること自体を理由に評価を下げてはいけません。 成果の判断の軸を示す 「何を、どのくらい、どの水準で」できれば成果とみなすのかを、具体的に本人に示す 本人から見ると、配慮を受けているのに成果が出ないことに、本人自身も焦っていることが多い。責めずに一緒に原因を考える", "id": "G6-009"}, "G6-008": {"conclusion": "まず何が過剰かを整理し、配慮の目的（障害による業務上の支障を取り除くこと）に立ち返ります。いきなりやめず、本人の成長を軸に少しずつ減らし、本人と合意して見直します。", "general": [["何が過剰かを整理する", ["業務の本質を変えていないか、本人の成長を妨げていないか、誰かに負担が集中していないかを確認します。"]], ["目的に立ち返る", ["業務に必要で、障害による支障を取り除くものか。外れている部分が見直しの対象です。"]], ["少しずつ、合意して", ["「今年はここまで、次年度はここまで」と期間を区切ります。配慮を減らすのではなく過剰な部分を減らす考え方です。", "無理が出たら戻すことも含めて柔軟に対応します。"]], ["最初に見直し時期を決める", ["新しい配慮は「一定期間（たとえば3か月）試して見直す」と決めておくと、過剰になりにくくなります。"]], ["本人から見ると", ["配慮を減らすことは、「見放された」「評価が下がった」と受け取られやすい", "減らす理由を「できることが増えたから」という成長の結果として伝え、困ったらいつでも戻せることも伝える"]]], "sources": [], "q": "配慮が過剰になっていると感じる場合、適切な範囲にどう戻していけばよいですか？", "cat": "定着面談と見直し", "st": 3, "kw": "配慮の要求が次第にエスカレートしている場合、どこまで応じるべきか線引きの考え方は。 一度認めた配慮を後から「過重な負担」として見直すことは可能か、その進め方は。", "body": "何が過剰かを整理する 業務の本質を変えていないか、本人の成長を妨げていないか、誰かに負担が集中していないかを確認します。 目的に立ち返る 業務に必要で、障害による支障を取り除くものか。外れている部分が見直しの対象です。 少しずつ、合意して 「今年はここまで、次年度はここまで」と期間を区切ります。配慮を減らすのではなく過剰な部分を減らす考え方です。 無理が出たら戻すことも含めて柔軟に対応します。 最初に見直し時期を決める 新しい配慮は「一定期間（たとえば3か月）試して見直す」と決めておくと、過剰になりにくくなります。 本人から見ると 配慮を減らすことは、「見放された」「評価が下がった」と受け取られやすい 減らす理由を「できることが増えたから」という成長の結果として伝え、困ったらいつでも戻せることも伝える", "id": "G6-008"}, "G6-027": {"conclusion": "ポイントは2つです。1つ目は、見直し日を必ず設定し、定期面談の日に合わせるなど、自動的に見直さざるを得ないタイミングを組み込むことです。2つ目は、現場と本人だけに任せると忘れがちになるため、人事が実施状況をチェックし、リマインドする仕組みを持つことです。", "general": [["見直し日を決めて、定期面談と合わせる", ["配慮を合意するときに、次の見直し日を書面に書き込みます（G6-012）。", "定期面談の日に見直しを行うと決めておけば、別に予定を立てる必要がなくなります。"]], ["人事がチェックとリマインドを担う", ["見直し日の一覧を人事が管理し、近づいたら上司に知らせます。", "行われたか、記録が更新されたかも確認します。"]], ["頻度の目安（一例）", ["配慮を始めた直後や入社直後は、たとえば月1回程度。", "安定してきたら、たとえば3か月〜半年に1回程度。本人の状態や業務の変化に合わせて調整します。", "定着状況が良好に見える場合も、面談は続けます。問題が表に出ていないだけのこともあるためです。", "体調や状況が急に変わったときは、定期の日を待たずに臨時で面談します（G6-063）。"]], ["試した配慮が合わなかったとき", ["試行中に合わないことがわかったら、見直し日を待たずに話し合い、内容を変えます（G6-096）。"]], ["記録や社内マニュアルも更新する", ["見直しの結果は、配慮の書面と、社内で共有しているマニュアルの両方に反映します。"]]], "sources": [], "q": "配慮内容の見直しを定期的に行う仕組みを、どう社内に組み込めばよいですか？", "cat": "定着面談と見直し", "st": 3, "kw": "定期的に配慮の意思確認を行う頻度は、どの程度が適切か。 勤務形態の配慮を導入した後、定期的な見直しのタイミングはどう設定すべきか。 定着状況が良好に見える場合でも、定期面談は継続すべきか。 定着から一定期間が経過した社員への面談頻度は、初期と変えるべきか。 配慮内容を試験的に導入してみて、合わなかった場合の見直し手順はどうすればよいか。 配慮の共有をマニュアル化する場合、更新はどのタイミングで行うべきか。 合理的配慮の内容は、どのくらいの頻度で見直すべきですか？", "body": "見直し日を決めて、定期面談と合わせる 配慮を合意するときに、次の見直し日を書面に書き込みます（G6-012）。 定期面談の日に見直しを行うと決めておけば、別に予定を立てる必要がなくなります。 人事がチェックとリマインドを担う 見直し日の一覧を人事が管理し、近づいたら上司に知らせます。 行われたか、記録が更新されたかも確認します。 頻度の目安（一例） 配慮を始めた直後や入社直後は、たとえば月1回程度。 安定してきたら、たとえば3か月〜半年に1回程度。本人の状態や業務の変化に合わせて調整します。 定着状況が良好に見える場合も、面談は続けます。問題が表に出ていないだけのこともあるためです。 体調や状況が急に変わったときは、定期の日を待たずに臨時で面談します（G6-063）。 試した配慮が合わなかったとき 試行中に合わないことがわかったら、見直し日を待たずに話し合い、内容を変えます（G6-096）。 記録や社内マニュアルも更新する 見直しの結果は、配慮の書面と、社内で共有しているマニュアルの両方に反映します。", "id": "G6-027"}, "G6-063": {"conclusion": "勤怠の乱れ、業務上のミスの増加、本人からの訴えがあったときが、臨時面談の目安です。そうした目に見える変化がなくても、「少し気になる」と感じたら早めに声をかけます。早いほど、問題が大きくなるリスクは減ります。", "general": [["臨時面談の目安", ["勤怠の乱れ：遅刻・欠勤・早退が続く、または増えてきた。", "業務上のミスの増加：これまでできていた作業でミスが目立つ。", "本人からの訴え：体調がつらい、困っていることがある、などの相談があった。"]], ["「気になる」段階で声をかける", ["表情が暗い、口数が減った、休憩の取り方が変わったなど、小さな変化に気づいたら、面談の形にこだわらず短く声をかけます。", "早めに声をかけるほど、対応の選択肢が多く、本人の負担も小さくて済みます。"]], ["面談の進め方", ["責める形ではなく、「最近〇〇が続いているようですが、何か困っていることはありますか」と事実をもとに聞きます。", "必要に応じて、業務量や配慮の内容を一時的に調整します（G6-027）。"]], ["支援機関からの連絡も目安に", ["支援機関から「様子が気になる」と連絡があった場合も、臨時面談を考えます（G10-022）。"]]], "sources": [], "q": "本人の体調や状況が急に変化した場合、定例の面談を待たずに臨時面談を行う目安はありますか？", "cat": "定着面談と見直し", "st": 3, "kw": "", "body": "臨時面談の目安 勤怠の乱れ：遅刻・欠勤・早退が続く、または増えてきた。 業務上のミスの増加：これまでできていた作業でミスが目立つ。 本人からの訴え：体調がつらい、困っていることがある、などの相談があった。 「気になる」段階で声をかける 表情が暗い、口数が減った、休憩の取り方が変わったなど、小さな変化に気づいたら、面談の形にこだわらず短く声をかけます。 早めに声をかけるほど、対応の選択肢が多く、本人の負担も小さくて済みます。 面談の進め方 責める形ではなく、「最近〇〇が続いているようですが、何か困っていることはありますか」と事実をもとに聞きます。 必要に応じて、業務量や配慮の内容を一時的に調整します（G6-027）。 支援機関からの連絡も目安に 支援機関から「様子が気になる」と連絡があった場合も、臨時面談を考えます（G10-022）。", "id": "G6-063"}, "G6-065": {"conclusion": "配慮は困りごとから始まっているので、まず「困りごとが減ったか」を確認します。あわせて、勤怠が安定しているか、ミスが減っているかなど事実にもとづく指標と、本人と上司が配慮が機能していると感じているかを確認します。うまくいっていても配慮はやめず、基本は継続します。うまくいっていない場合は内容を調整します。", "general": [["3つの確認ポイント", ["困りごと：配慮を始めたときの困りごとが、減ったか、なくなったか。", "事実の指標：勤怠が安定しているか、ミスが減っているか、業務を期限内に終えられているか。", "当事者の実感：本人と上司が、それぞれ配慮が機能していると感じているか。"]], ["配慮を始める時点で基準を決めておく", ["「何がどうなれば効果があったと言えるか」を、配慮を始めるときに決めておくと、確認しやすくなります。", "環境面の配慮（席の位置、照明、休憩スペースなど）も、同じように困りごとと事実で確認します。"]], ["うまくいっていても、配慮は続けるのが基本", ["配慮は、成果を上げるための土台となる環境調整です。効果が出ているのは配慮が機能しているからで、やめると元に戻ることがあります。", "減らす場合は、本人と合意して少しずつ進めます（G6-008）。"]], ["うまくいっていない場合", ["困りごとが減っていない場合は、配慮の内容を調整します（G6-009）。"]], ["会社にとっての成果も確認する", ["本人の働きやすさだけでなく、任せた業務がどれだけできているか、職場にどう役立っているかもあわせて確認する。配慮が、本人の力を発揮することにつながっているかを見る"]]], "sources": [], "q": "配慮の効果を測る指標として、定着面談で何を確認すればよいですか？", "cat": "定着面談と見直し", "st": 3, "kw": "職場環境の配慮を行った後、実際に効果があったかどう確認すればよいか。", "body": "3つの確認ポイント 困りごと：配慮を始めたときの困りごとが、減ったか、なくなったか。 事実の指標：勤怠が安定しているか、ミスが減っているか、業務を期限内に終えられているか。 当事者の実感：本人と上司が、それぞれ配慮が機能していると感じているか。 配慮を始める時点で基準を決めておく 「何がどうなれば効果があったと言えるか」を、配慮を始めるときに決めておくと、確認しやすくなります。 環境面の配慮（席の位置、照明、休憩スペースなど）も、同じように困りごとと事実で確認します。 うまくいっていても、配慮は続けるのが基本 配慮は、成果を上げるための土台となる環境調整です。効果が出ているのは配慮が機能しているからで、やめると元に戻ることがあります。 減らす場合は、本人と合意して少しずつ進めます（G6-008）。 うまくいっていない場合 困りごとが減っていない場合は、配慮の内容を調整します（G6-009）。 会社にとっての成果も確認する 本人の働きやすさだけでなく、任せた業務がどれだけできているか、職場にどう役立っているかもあわせて確認する。配慮が、本人の力を発揮することにつながっているかを見る", "id": "G6-065"}, "G6-066": {"conclusion": "厳しい評価には、会社の対応が実際に不十分だった場合と、合理的配慮の考え方とずれた期待から来ている場合の両方があります。その場で否定せず、まず何を改善してほしいのかを具体的に確認します。そのうえで、本当に改善が必要なことと、そこまで行うと配慮ではなく特別扱いになってしまうことを分けて考えます。", "general": [["まず受け止めて、具体的に聞く", ["「話してくれてありがとう」と受け止め、その場で反論しません。", "どの場面で、何が、どう不十分だったのかを具体的に確認します。"]], ["改善が必要なことと、そうでないことを分ける", ["会社の対応が不十分だった点（合意した配慮が実行されていない、相談に応じていない等）は、すぐに改善します。", "業務上の支障を取り除く範囲を超える要望は、配慮ではなく特別扱いになりかねません。合理的配慮の考え方に照らして判断します（G6-001・G6-008）。"]], ["結果を本人に返す", ["改善することと、その時期を伝えます。", "対応できないことは、理由と代わりにできることをセットで伝えます（G6-007）。"]], ["評価を次に活かす", ["厳しい評価は、配慮や職場の運用を見直すきっかけになります。面談の記録に残し、次の面談で改善されたかを確認します。"]]], "sources": [], "q": "定着面談で本人からの評価が厳しかった場合、どう改善につなげればよいですか？", "cat": "定着面談と見直し", "st": 3, "kw": "", "body": "まず受け止めて、具体的に聞く 「話してくれてありがとう」と受け止め、その場で反論しません。 どの場面で、何が、どう不十分だったのかを具体的に確認します。 改善が必要なことと、そうでないことを分ける 会社の対応が不十分だった点（合意した配慮が実行されていない、相談に応じていない等）は、すぐに改善します。 業務上の支障を取り除く範囲を超える要望は、配慮ではなく特別扱い
