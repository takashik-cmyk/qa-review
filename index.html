es": ["障害者雇用促進法36条の2・36条の3", "合理的配慮指針（厚生労働省）"], "links": [["厚生労働省 障害者差別禁止・合理的配慮に関するQ&A（PDF）", "https://www.mhlw.go.jp/file/06-Seisakujouhou-11600000-Shokugyouanteikyoku/0000121387.pdf"]], "q": "合理的配慮とはどのような制度ですか？いつから義務化されましたか？", "cat": "制度の基本", "st": 0, "kw": "合理的配慮について知りたい 合理的配慮とは具体的にどのようなものですか？ 障害者の方には、どのような配慮が必要ですか？ 障害者に対する差別禁止・合理的配慮の規定はどのような背景で設けられたのですか？ 障害者に対する差別の禁止と合理的配慮の提供義務について教えてください。", "body": "配慮の原則 仕事に関わる配慮であること：職務を円滑に行うために必要な調整が対象。日常生活のために必要な物（眼鏡や車いすなど）の提供までは含まれない 本人と話し合って決めること：本人の困りごとと希望を聞き、一緒に内容を考える（G6-116） 複数の方法があるときは、会社が選べる：本人の意向を十分に聞いたうえで、会社にとって提供しやすい方法を選んでよい（G6-021） 過重な負担にならない範囲で行うこと（下記） 過重な負担とは 次の要素を総合的に見て、会社ごとに判断する：①事業活動への影響の程度、②実現の難しさ、③費用・負担の程度、④企業の規模、⑤企業の財務状況、⑥公的な支援（助成金など）を使えるかどうか 過重な負担にあたる場合も、本人にその理由を説明し、負担にならない範囲でほかにできる配慮を考える（G6-006） どんな配慮か（例） 募集・採用：面接での筆談、試験時間の延長、点字や拡大文字の問題用紙 採用後：業務量や勤務時間の調整、通院のための休暇、作業手順の図示、指示を文字で伝える、休憩場所の確保、机や通路の改修など 配慮の内容は、障害の種類だけでなく、一人ひとりの困りごとと希望によって異なる（G6-124） 対象 障害者手帳を持っていない人も対象になる（G6-004）", "id": "G1-001"}, "G1-002": {"conclusion": "二つの法律は、「だれに対して」の場面で使い分けます。会社で働く社員や、応募してきた人に対しては「障害者雇用促進法」、お店のお客様や取引先など、社員以外の人に対しては「障害者差別解消法」が使われます。どちらの法律も、障害を理由に不公平な扱いをしないこと（差別の禁止）と、困りごとに合わせて工夫すること（合理的配慮）を、会社に求めています。", "general": [["二つの法律のちがい", ["障害者雇用促進法：社員や、採用に応募してきた人が相手。働く場面でのルール。2016年4月から、差別の禁止と合理的配慮が会社の義務になった", "障害者差別解消法：お客様や取引先など、社員以外の人が相手。サービスを提供する場面でのルール。2024年4月から、会社にも合理的配慮が義務になった"]], ["たとえば", ["車いすの社員のために、机の高さを変える → 障害者雇用促進法（社員が相手）", "車いすのお客様のために、店の入口にスロープを用意する → 障害者差別解消法（お客様が相手）"]], ["あわせて知っておきたい法律", ["障害者雇用促進法には、会社が一定の割合で障害者を雇う「法定雇用率」のルールもある（G1-050）", "障害者虐待防止法：職場で障害のある人を傷つけたり、無視したりすることを防ぐ法律（G1-007）", "個人情報保護法：障害に関する情報は、特に大切に扱う必要がある情報とされている（G2-006）"]]], "sources": ["障害者雇用促進法", "障害者差別解消法13条"], "q": "障害者差別解消法と障害者雇用促進法は、職場での対応にそれぞれどう関係しますか？", "cat": "制度の基本", "st": 0, "kw": "障害者雇用について、企業が知っておくべき法令はありますか？ 障害者雇用を進めるために必要な法律や制度を理解したい", "body": "二つの法律のちがい 障害者雇用促進法：社員や、採用に応募してきた人が相手。働く場面でのルール。2016年4月から、差別の禁止と合理的配慮が会社の義務になった 障害者差別解消法：お客様や取引先など、社員以外の人が相手。サービスを提供する場面でのルール。2024年4月から、会社にも合理的配慮が義務になった たとえば 車いすの社員のために、机の高さを変える → 障害者雇用促進法（社員が相手） 車いすのお客様のために、店の入口にスロープを用意する → 障害者差別解消法（お客様が相手） あわせて知っておきたい法律 障害者雇用促進法には、会社が一定の割合で障害者を雇う「法定雇用率」のルールもある（G1-050） 障害者虐待防止法：職場で障害のある人を傷つけたり、無視したりすることを防ぐ法律（G1-007） 個人情報保護法：障害に関する情報は、特に大切に扱う必要がある情報とされている（G2-006）", "id": "G1-002"}, "G1-016": {"conclusion": "「障害者雇用」は、障害者手帳を持つ人を、障害があることを開示したうえで雇用することを指すのが一般的です。法定雇用率の算定対象になり、採用時から合理的配慮を前提に働き方を決めます。一般の雇用で、障害を開示せずに働いている人もいます。", "general": [["主な違い", ["障害者雇用：障害を開示して応募・採用。配慮の内容を事前に話し合える。手帳があれば法定雇用率に算入される", "一般の雇用：障害の有無を問わない募集。本人が障害を開示しなければ、会社は配慮の必要性を知ることができない"]], ["共通していること", ["賃金や評価など、処遇の基本的な考え方は同じ。障害を理由に不利に扱うことは禁止（G6-110）", "一般の雇用で働く社員でも、障害があり配慮を申し出れば、合理的配慮の対象になる"]], ["一般の雇用で働く社員を、法定雇用率に数えてよいか", ["数えられる。採用のルート（障害者雇用枠か一般枠か）に関係なく、障害者手帳を持っている社員は法定雇用率の算定対象になる", "ただし、本人の同意が必要。手帳の有無を確認するときは、雇用率の報告に使うことなど利用目的を伝え、本人の同意を得る（G6-107）", "手帳の取得や申告を、会社から無理に求めないようにする。本人が申告しない場合は数えられない"]]], "links": [["厚生労働省 プライバシーに配慮した障害者の把握・確認ガイドライン（PDF）", "https://www.mhlw.go.jp/content/000581119.pdf"]], "q": "障害者雇用と一般雇用は何が違いますか？", "cat": "制度の基本", "st": 0, "kw": "", "body": "主な違い 障害者雇用：障害を開示して応募・採用。配慮の内容を事前に話し合える。手帳があれば法定雇用率に算入される 一般の雇用：障害の有無を問わない募集。本人が障害を開示しなければ、会社は配慮の必要性を知ることができない 共通していること 賃金や評価など、処遇の基本的な考え方は同じ。障害を理由に不利に扱うことは禁止（G6-110） 一般の雇用で働く社員でも、障害があり配慮を申し出れば、合理的配慮の対象になる 一般の雇用で働く社員を、法定雇用率に数えてよいか 数えられる。採用のルート（障害者雇用枠か一般枠か）に関係なく、障害者手帳を持っている社員は法定雇用率の算定対象になる ただし、本人の同意が必要。手帳の有無を確認するときは、雇用率の報告に使うことなど利用目的を伝え、本人の同意を得る（G6-107） 手帳の取得や申告を、会社から無理に求めないようにする。本人が申告しない場合は数えられない", "id": "G1-016"}, "G1-011": {"conclusion": "障害者雇用を進める理由は、法律上の義務であることに加え、会社の成果を高める取組でもあることです。障害のある社員が力を発揮できる仕組みを整えることは、業務の見直しや、誰にとっても働きやすい組織づくりにつながります。社会的責任（CSR）として取り組むだけでなく、事業の成果と社会課題の解決を両立させる取組（CSV）として捉えるのがおすすめです。", "general": [["法律上の理由", ["一定規模以上の会社には、法定雇用率以上の障害者を雇う義務がある（G1-050）", "未達成の場合、納付金の支払いや行政指導の対象になる（G1-051）"]], ["会社にとってのメリット", ["業務の効率化と役割分担：障害のある社員に任せる業務を切り出す中で、業務の見直しや、強みを生かした役割分担が進む", "多様性のある組織づくり：一人ひとりに合わせた伝え方や教え方が身につき、配慮や気づかいができる職場の文化が育つ", "安定した人材の確保と活躍：業務と本人の適性が合えば、長く安定して働き、戦力として活躍してもらえる", "企業価値の向上：障害者が活躍する場をつくる企業として、社会や取引先、求職者からの信頼が高まる。法定雇用率を超えて雇用すると、調整金や報奨金も受け取れる"]], ["CSRとCSVの違い", ["CSR（企業の社会的責任）：法令を守り、社会に貢献する責任として取り組むという考え方", "CSV（共通価値の創造）：事業を通じて、社会課題の解決と会社の成果を同時に生み出すという考え方", "障害者雇用は、雇用率の達成（CSR）にとどまらず、障害のある社員が事業に貢献し会社の成果につながる（CSV）形をめざすと、現場の「やらされ感」も生まれにくい（G7-004）"]]], "q": "なぜ障害者雇用を進める必要があるのでしょうか？また、障害者雇用を行うことで、どのようなメリットがありますか？", "cat": "目的と進め方", "st": 0, "kw": "障害者雇用にはどのようなメリットがあるのですか？", "body": "法律上の理由 一定規模以上の会社には、法定雇用率以上の障害者を雇う義務がある（G1-050） 未達成の場合、納付金の支払いや行政指導の対象になる（G1-051） 会社にとってのメリット 業務の効率化と役割分担：障害のある社員に任せる業務を切り出す中で、業務の見直しや、強みを生かした役割分担が進む 多様性のある組織づくり：一人ひとりに合わせた伝え方や教え方が身につき、配慮や気づかいができる職場の文化が育つ 安定した人材の確保と活躍：業務と本人の適性が合えば、長く安定して働き、戦力として活躍してもらえる 企業価値の向上：障害者が活躍する場をつくる企業として、社会や取引先、求職者からの信頼が高まる。法定雇用率を超えて雇用すると、調整金や報奨金も受け取れる CSRとCSVの違い CSR（企業の社会的責任）：法令を守り、社会に貢献する責任として取り組むという考え方 CSV（共通価値の創造）：事業を通じて、社会課題の解決と会社の成果を同時に生み出すという考え方 障害者雇用は、雇用率の達成（CSR）にとどまらず、障害のある社員が事業に貢献し会社の成果につながる（CSV）形をめざすと、現場の「やらされ感」も生まれにくい（G7-004）", "id": "G1-011"}, "G1-019": {"conclusion": "ニューロダイバーシティ（神経多様性）は、脳や神経の働き方の違い（発達障害の特性など）を「欠けているもの」ではなく、人それぞれの多様性として捉え、その違いを生かそうという考え方です。経済産業省もこの考え方にもとづく人材活用を進めています。", "general": [["考え方のポイント", ["ASD（自閉スペクトラム症）、ADHD（注意欠如・多動症）、LD（学習障害）などの特性を、得意と苦手の偏りとして捉える", "苦手を補う配慮をしつつ、集中力や正確さ、独自の発想などの強みを仕事に生かす", "診断の有無にかかわらず、誰もが働き方の違いを持っているという見方にもつながる", "「特別な才能（天才性）がある人を生かす」という意味ではない。得意も苦手も含めた、一人ひとりの違い（多様性）を前提に働き方を考える、という考え方"]], ["職場での生かし方", ["仕事の内容を明確にし、得意な作業に集中できるように業務を設計する", "指示を具体的に伝え、文字でも残す", "音や光などの環境を調整する（G6-069）"]]], "sources": ["経済産業省 ニューロダイバーシティの推進について"], "q": "ニューロダイバーシティとはどのような考え方ですか？", "cat": "制度の基本", "st": 0, "kw": "", "body": "考え方のポイント ASD（自閉スペクトラム症）、ADHD（注意欠如・多動症）、LD（学習障害）などの特性を、得意と苦手の偏りとして捉える 苦手を補う配慮をしつつ、集中力や正確さ、独自の発想などの強みを仕事に生かす 診断の有無にかかわらず、誰もが働き方の違いを持っているという見方にもつながる 「特別な才能（天才性）がある人を生かす」という意味ではない。得意も苦手も含めた、一人ひとりの違い（多様性）を前提に働き方を考える、という考え方 職場での生かし方 仕事の内容を明確にし、得意な作業に集中できるように業務を設計する 指示を具体的に伝え、文字でも残す 音や光などの環境を調整する（G6-069）", "id": "G1-019"}, "G1-007": {"conclusion": "職場での障害者への虐待は、障害者虐待防止法で禁止されています。虐待には、暴力などの身体的虐待、暴言や無視などの心理的虐待、性的虐待、仕事を与えないなどの放棄・放置、賃金を支払わないなどの経済的虐待があります。本人に虐待のつもりがなくても、虐待にあたる関わり方をしてしまっていることがあります。研修や相談窓口の整備に加えて、一人ひとりが自分の関わり方を振り返ることが、防止の基本です。", "general": [["虐待の種類（例）", ["身体的虐待：たたく、無理に押さえつける", "心理的虐待：怒鳴る、ばかにする、無視する", "性的虐待：本人の同意のない性的な言動", "放棄・放置：仕事を与えない、必要な配慮をしない", "経済的虐待：最低賃金未満の賃金、賃金を支払わない"]], ["自分の関わり方を振り返る", ["「指導のつもり」「本人のため」でも、虐待にあたることがある（強い口調でくり返し叱る、本人の前でため息をつく、仕事を任せずに放っておく、など）", "自分の言動を客観的に見直す機会をつくる。研修でチェックリストを使って振り返る、管理職同士で関わり方を話し合う、など", "周囲から気になる言動を指摘されたら、否定せずに受け止める"]], ["防止のためにすること", ["管理職と社員に研修を行い、何が虐待にあたるかを伝える", "障害のある社員が相談できる窓口を設ける", "管理職が一人で抱え込まず、複数の目で職場を見る"]], ["虐待に気づいたら", ["使用者による虐待を受けたと思われる障害者を見つけた人は、市町村または都道府県に通報する義務がある", "通報したことを理由に、通報した社員を不利に扱ってはならない"]]], "sources": ["障害者虐待防止法2条・21条・22条"], "q": "職場での障害者虐待を防ぐために、管理職や担当者は何をすればよいですか？", "cat": "制度の基本", "st": 0, "kw": "", "body": "虐待の種類（例） 身体的虐待：たたく、無理に押さえつける 心理的虐待：怒鳴る、ばかにする、無視する 性的虐待：本人の同意のない性的な言動 放棄・放置：仕事を与えない、必要な配慮をしない 経済的虐待：最低賃金未満の賃金、賃金を支払わない 自分の関わり方を振り返る 「指導のつもり」「本人のため」でも、虐待にあたることがある（強い口調でくり返し叱る、本人の前でため息をつく、仕事を任せずに放っておく、など） 自分の言動を客観的に見直す機会をつくる。研修でチェックリストを使って振り返る、管理職同士で関わり方を話し合う、など 周囲から気になる言動を指摘されたら、否定せずに受け止める 防止のためにすること 管理職と社員に研修を行い、何が虐待にあたるかを伝える 障害のある社員が相談できる窓口を設ける 管理職が一人で抱え込まず、複数の目で職場を見る 虐待に気づいたら 使用者による虐待を受けたと思われる障害者を見つけた人は、市町村または都道府県に通報する義務がある 通報したことを理由に、通報した社員を不利に扱ってはならない", "id": "G1-007"}, "G1-003": {"conclusion": "障害者雇用で裁判になるのは、主に「体調や障害が原因かもしれない行動を、確かめずに処分した」「それまで続けていた配慮を、話し合わずにやめた」といった場面です。どちらも、会社が本人の事情を確かめないまま決めたことが問題になっています。", "general": [["裁判で争われた主な論点", ["体調不良による欠勤への処分：心の不調で休んでいた社員を、病院に行くことや休職を考えずに「無断欠勤」として処分した。処分は認められなかった（G10-033）", "配慮の打ち切り：長く続けていた勤務上の配慮を、本人と話し合わずにやめた。配慮を続ける必要があると判断された", "ほかにも、障害を理由にした解雇や雇止め（契約を更新しないこと）、配置の変更、ハラスメントなどが争われることがある"]], ["ここから学べること", ["行動の背景に、障害や体調の問題がないかを先に確かめる", "配慮を変えたりやめたりするときは、本人と話し合い、理由を説明する", "話し合った内容や対応の経緯を、記録に残しておく", "判断に迷ったら、早めに社労士や弁護士に相談する（G10-094）"]]], "sources": ["最高裁判所平成24年4月27日判決（欠勤への処分）", "神戸地方裁判所尼崎支部平成26年4月22日判決（配慮の打ち切り）"], "q": "障害者雇用では、どんなことが裁判で争われていますか？そこから何を学べますか？", "cat": "制度の基本", "st": 0, "kw": "", "body": "裁判で争われた主な論点 体調不良による欠勤への処分：心の不調で休んでいた社員を、病院に行くことや休職を考えずに「無断欠勤」として処分した。処分は認められなかった（G10-033） 配慮の打ち切り：長く続けていた勤務上の配慮を、本人と話し合わずにやめた。配慮を続ける必要があると判断された ほかにも、障害を理由にした解雇や雇止め（契約を更新しないこと）、配置の変更、ハラスメントなどが争われることがある ここから学べること 行動の背景に、障害や体調の問題がないかを先に確かめる 配慮を変えたりやめたりするときは、本人と話し合い、理由を説明する 話し合った内容や対応の経緯を、記録に残しておく 判断に迷ったら、早めに社労士や弁護士に相談する（G10-094）", "id": "G1-003"}, "G1-050": {"conclusion": "法定雇用率は、会社が雇わなければならない障害者の割合です。民間企業は2026年7月から2.7％になり、従業員37.5人以上の会社に雇用義務があります。法定雇用率は、労働者と失業者の総数に占める障害のある労働者・失業者の割合をもとに、おおむね5年ごとに見直されます。", "general": [["雇う人数の計算", ["常用労働者数 × 2.7％（小数点以下は切り捨て）が、雇う必要のある障害者の人数", "例：従業員150人の場合、150 × 2.7％ ＝ 4.05 → 4人", "週20時間以上30時間未満の短時間労働者は0.5人として数える（分母も分子も）"]], ["障害者の数え方", ["週30時間以上：1人（重度の身体・知的障害者は2人）", "週20時間以上30時間未満：0.5人（重度の身体・知的障害者と精神障害者は1人）", "週10時間以上20時間未満の精神障害者、重度の身体・知的障害者：0.5人"]], ["達成かどうかの判断", ["達成かどうかは、％の四捨五入ではなく、雇っている人数が必要な人数に届いているかで判断する"]], ["法定雇用率を達成できない場合", ["従業員100人を超える会社は、不足1人につき月額5万円の障害者雇用納付金を納める", "達成状況が特に低い会社は、ハローワークから雇入れ計画の作成命令や指導を受け、改善されない場合は企業名が公表されることがある", "詳しくはG1-051を参照"]]], "sources": ["障害者雇用促進法43条・同施行令"], "links": [["大分労働局 令和8年7月から法定雇用率2.7％", "https://jsite.mhlw.go.jp/oita-roudoukyoku/hourei_seido_tetsuzuki/kourei_shougai_gaikoku/shougaisha_houteikoyouritsu_202607.html"]], "q": "法定雇用率とは何ですか？現在の数値と今後の予定を教えてください。", "cat": "雇用率と納付金", "st": 0, "kw": "障害者の法定雇用率はどのように決定されるのでしょうか 社員が150名です。法定雇用率を達成するために障がい者を何人雇用する必要がありますか。 企業の実雇用率を%で示しているが、四捨五入して法定雇用率以上になれば達成企業となるのでしょうか。また、必要雇用数との関係はどうなっているのでしょうか 障害者雇用率制度について教えてください。", "body": "雇う人数の計算 常用労働者数 × 2.7％（小数点以下は切り捨て）が、雇う必要のある障害者の人数 例：従業員150人の場合、150 × 2.7％ ＝ 4.05 → 4人 週20時間以上30時間未満の短時間労働者は0.5人として数える（分母も分子も） 障害者の数え方 週30時間以上：1人（重度の身体・知的障害者は2人） 週20時間以上30時間未満：0.5人（重度の身体・知的障害者と精神障害者は1人） 週10時間以上20時間未満の精神障害者、重度の身体・知的障害者：0.5人 達成かどうかの判断 達成かどうかは、％の四捨五入ではなく、雇っている人数が必要な人数に届いているかで判断する 法定雇用率を達成できない場合 従業員100人を超える会社は、不足1人につき月額5万円の障害者雇用納付金を納める 達成状況が特に低い会社は、ハローワークから雇入れ計画の作成命令や指導を受け、改善されない場合は企業名が公表されることがある 詳しくはG1-051を参照", "id": "G1-050"}, "G1-051": {"conclusion": "法定雇用率を達成していない場合、従業員100人を超える会社は障害者雇用納付金（不足1人につき月額5万円）を納めます。納付金を納めても雇用義務がなくなるわけではありません。また、達成状況が特に低い会社には、ハローワークから雇入れ計画の作成命令や指導があり、改善されない場合は企業名が公表されることがあります。", "general": [["毎年の報告", ["雇用義務のある会社は、毎年6月1日時点の障害者の雇用状況をハローワークに報告する", "この報告をもとに、達成状況の確認や指導が行われる"]], ["未達成の場合の流れ", ["障害者雇用納付金の申告・納付（100人超の会社。JEEDに毎年申告）", "ハローワークによる雇入れ計画の作成命令、計画の適正実施勧告、特別指導", "それでも改善されない場合は、企業名の公表"]], ["よくある疑問", ["納付金は罰金ではなく、雇用義務を果たしている会社との経済的な負担を調整するもの。納めても雇用義務は残る", "納付金の税法上の扱い（損金算入など）は、JEEDの手引きや税理士に確認する", "申告書や様式はJEEDのホームページからダウンロードできる", "社員の定年などで人数が減る見込みがあるときは、早めに採用計画を立てる（G2-018）"]]], "sources": ["障害者雇用促進法46条・47条・53条〜"], "q": "法定雇用率を達成できない場合、企業にはどのような措置がありますか？", "cat": "雇用率と納付金", "st": 0, "kw": "障害者雇用納付金を納めている場合、障がい者雇用は免除されますか。 雇用義務と納付義務について知りたい 企業に対して雇用率調査はどのように行われるのでしょうか。また、その頻度はどのようになっているのでしょうか 納付金申告書及び調整金・報奨金様式をダウンロードしたいのですが。 納付金の税法上の取扱いを教えてください。 雇用障がい者が数年後定年を迎える予定であり、このままだと雇用率未達成となります。どのように対応したらよいでしょうか。 障害者雇用納付金制度について教えてください。", "body": "毎年の報告 雇用義務のある会社は、毎年6月1日時点の障害者の雇用状況をハローワークに報告する この報告をもとに、達成状況の確認や指導が行われる 未達成の場合の流れ 障害者雇用納付金の申告・納付（100人超の会社。JEEDに毎年申告） ハローワークによる雇入れ計画の作成命令、計画の適正実施勧告、特別指導 それでも改善されない場合は、企業名の公表 よくある疑問 納付金は罰金ではなく、雇用義務を果たしている会社との経済的な負担を調整するもの。納めても雇用義務は残る 納付金の税法上の扱い（損金算入など）は、JEEDの手引きや税理士に確認する 申告書や様式はJEEDのホームページからダウンロードできる 社員の定年などで人数が減る見込みがあるときは、早めに採用計画を立てる（G2-018）", "id": "G1-051"}, "G1-052": {"conclusion": "2024年4月から、週10時間以上20時間未満の短時間で働く精神障害者と、重度の身体障害者・重度の知的障害者を、1人あたり0.5人として法定雇用率に算入できるようになりました。それまでは、週20時間未満で働く人は算定の対象外でした。", "general": [["勤務時間ごとの数え方（現在）", ["週30時間以上：1人（重度の身体・知的障害者は2人）", "週20時間以上30時間未満：0.5人（重度の身体・知的障害者と精神障害者は1人）", "週10時間以上20時間未満：精神障害者、重度の身体・知的障害者は0.5人（2024年4月から新たに対象）。それ以外の障害者は対象外"]], ["変わったことで広がる働き方", ["体調などの理由で長い時間働くことが難しい人も、雇用率に数えられる形で雇用しやすくなった", "短い時間から働き始め、少しずつ時間を延ばしていく働き方もしやすくなった"]], ["あわせて知っておきたいこと", ["週20時間以上30時間未満で働く精神障害者を1人として数える特例は、引き続き適用されている", "法定雇用率の段階的な引き上げ：2024年4月に2.5％、2026年7月に2.7％（G1-050）"]]], "sources": ["障害者雇用促進法（2022年改正、2024年4月施行）"], "links": [["厚生労働省 障害者雇用促進法の改正（令和4年）", "https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000077386_00019.html"], ["大分労働局 令和8年7月から法定雇用率2.7％", "https://jsite.mhlw.go.jp/oita-roudoukyoku/hourei_seido_tetsuzuki/kourei_shougai_gaikoku/shougaisha_houteikoyouritsu_202607.html"]], "q": "雇用率の算定対象が、短時間で働く人にも広がったと聞きました。どう変わったのですか？", "cat": "雇用率と納付金", "st": 0, "kw": "", "body": "勤務時間ごとの数え方（現在） 週30時間以上：1人（重度の身体・知的障害者は2人） 週20時間以上30時間未満：0.5人（重度の身体・知的障害者と精神障害者は1人） 週10時間以上20時間未満：精神障害者、重度の身体・知的障害者は0.5人（2024年4月から新たに対象）。それ以外の障害者は対象外 変わったことで広がる働き方 体調などの理由で長い時間働くことが難しい人も、雇用率に数えられる形で雇用しやすくなった 短い時間から働き始め、少しずつ時間を延ばしていく働き方もしやすくなった あわせて知っておきたいこと 週20時間以上30時間未満で働く精神障害者を1人として数える特例は、引き続き適用されている 法定雇用率の段階的な引き上げ：2024年4月に2.5％、2026年7月に2.7％（G1-050）", "id": "G1-052"}, "G1-015": {"conclusion": "法定雇用率の対象になるのは、身体障害者手帳、療育手帳（知的障害）、精神障害者保健福祉手帳のいずれかを持つ人です。一方、差別禁止や合理的配慮の対象は、手帳の有無にかかわらず、障害のために仕事に長く制限がある人まで広く含みます。", "general": [["確認の方法", ["雇用率の対象かどうかは、手帳（知的障害は判定書も可）で確認する", "確認の方法と注意点はG6-107を参照"]], ["制度による違い", ["法定雇用率・納付金制度：手帳を持つ人が対象", "トライアル雇用、地域障害者職業センターの支援など：手帳がなくても使えるものがある（発達障害や難病の人など）", "差別禁止・合理的配慮：手帳の有無を問わない（G6-004）"]]], "sources": ["障害者雇用促進法2条・37条"], "q": "障害者雇用で雇用する障害者はどのような人を指しますか？", "cat": "対象となる障害者と手帳", "st": 0, "kw": "障害者の障害の範囲や該当程度、確認方法を教えてください。 雇用支援施策の利用にあたり、障害の種類や障害者手帳等の有無によって適用が異なるのか教えてください。", "body": "確認の方法 雇用率の対象かどうかは、手帳（知的障害は判定書も可）で確認する 確認の方法と注意点はG6-107を参照 制度による違い 法定雇用率・納付金制度：手帳を持つ人が対象 トライアル雇用、地域障害者職業センターの支援など：手帳がなくても使えるものがある（発達障害や難病の人など） 差別禁止・合理的配慮：手帳の有無を問わない（G6-004）", "id": "G1-015"}, "G1-041": {"conclusion": "会社としては、「手帳があると、職場で働きやすくなるための支援や制度を使いやすくなる」という視点で伝えます。たとえば、配慮を一緒に考えやすくなる、ジョブコーチや設備の助成など職場での支援を受けやすくなる、といった点です。そのうえで、手帳を取るかどうかは本人が決めることであり、取らなくても配慮の相談はできることも、あわせて伝えます。", "general": [["伝えるとよいこと", ["職場で配慮を一緒に考えやすくなる：本人の困りごとや必要な配慮を共有しやすくなり、会社として配慮を検討しやすくなる", "職場での支援を受けやすくなる：ジョブコーチの支援や、作業設備・機器の整備に使える助成金など、働きやすい環境を整えるための制度を使いやすくなる（G1-048、G1-033）", "仕事以外の面でも支援を受けられることがある：税金の控除や交通機関の割引など。内容は手帳の種類や地域によって違うので、市区町村の窓口で確かめてもらう"]], ["あわせて伝えること", ["手帳を取るかどうかは本人が決めること。会社から取得を勧めすぎたり、強要したりしない（G6-107）", "手帳がなくても、配慮の相談はできる（G6-004）", "取得を考えるときは、主治医や支援機関にも相談できる"]], ["伝え方で気をつけること", ["「雇用率に数えられるから」など、会社の都合が前に出る言い方は避ける", "本人が不安を感じていそうなら、何が心配かをまず聞く"]]], "phrases": ["「手帳があると、職場で働きやすくするための支援や制度を、会社としても使いやすくなります。ただ、取るかどうかは〇〇さんが決めることですし、手帳がなくても配慮の相談はいつでもできます」"], "q": "社員から「障害者手帳を持つと、何かメリットはありますか」と聞かれました。会社としてどう答えればよいですか？", "cat": "対象となる障害者と手帳", "st": 0, "kw": "", "body": "伝えるとよいこと 職場で配慮を一緒に考えやすくなる：本人の困りごとや必要な配慮を共有しやすくなり、会社として配慮を検討しやすくなる 職場での支援を受けやすくなる：ジョブコーチの支援や、作業設備・機器の整備に使える助成金など、働きやすい環境を整えるための制度を使いやすくなる（G1-048、G1-033） 仕事以外の面でも支援を受けられることがある：税金の控除や交通機関の割引など。内容は手帳の種類や地域によって違うので、市区町村の窓口で確かめてもらう あわせて伝えること 手帳を取るかどうかは本人が決めること。会社から取得を勧めすぎたり、強要したりしない（G6-107） 手帳がなくても、配慮の相談はできる（G6-004） 取得を考えるときは、主治医や支援機関にも相談できる 伝え方で気をつけること 「雇用率に数えられるから」など、会社の都合が前に出る言い方は避ける 本人が不安を感じていそうなら、何が心配かをまず聞く 「手帳があると、職場で働きやすくするための支援や制度を、会社としても使いやすくなります。ただ、取るかどうかは〇〇さんが決めることですし、手帳がなくても配慮の相談はいつでもできます」", "id": "G1-041"}, "G1-033": {"conclusion": "障害者の雇用では、雇い入れ、職場環境の整備、職場での支援などに使える助成金があります。主な窓口は、雇い入れに関する助成金がハローワーク・都道府県労働局、設備の整備や支援者の配置に関する助成金が、高齢・障害・求職者雇用支援機構（JEED）の各都道府県にある支部（高齢・障害者業務課）です。要件や金額は年度で変わるため、申請前に窓口で確認します。", "general": [["主な助成金", ["【ハローワーク・労働局】特定求職者雇用開発助成金：ハローワークなどの紹介で障害者を継続雇用した場合", "【ハローワーク・労働局】トライアル雇用助成金：試行的に雇用した場合（G2-033）", "【ハローワーク・労働局】キャリアアップ助成金（障害者正社員化コース）：有期雇用の障害者を正社員などに転換した場合", "【JEED支部】障害者雇用納付金関係助成金：作業施設や設備の整備、職場介助者や手話通訳者の配置、ジョブコーチによる支援、通勤の配慮、能力開発、外部の専門機関による雇用の相談援助など"]], ["手続きの流れ", ["多くの助成金は、雇い入れや設備の購入の「前」に計画の届出や申請が必要", "JEEDの窓口は、各都道府県支部の「高齢・障害者業務課」（東京・大阪は「高齢・障害者窓口サービス課」）。所在地はJEEDのホームページの支部一覧で確認できる", "すでに雇用している場合も、正社員化や設備の整備などで対象になるものがある"]], ["あわせて使える支援", ["就労支援機器の無料貸出し（G4-035）", "都道府県や市区町村が独自に設けている補助金（地域によって異なる）"]]], "sources": ["厚生労働省・JEED 各助成金の案内"], "links": [["厚生労働省 雇用関係助成金一覧", "https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/koyou/kyufukin/index_00057.html"], ["JEED 障害者雇用納付金制度に基づく助成金", "https://www.jeed.go.jp/disability/data/handbook/q2k4vk000003mbox.html"], ["JEED 都道府県支部一覧", "https://www.jeed.go.jp/location/shibu/index.html"]], "q": "障害のある方を雇用する際に、助成金や補助金が利用できると聞きました。どのようなものがありますか？", "cat": "助成金・支援制度", "st": 0, "kw": "過重な負担の判断にあたり、活用できる公的支援にはどのようなものがありますか？ 社屋がバリアフリー化されていません。どこから手を付ければよいですか？ どのような行政の支援が活用できますか 職場環境改善のための助成制度を知りたい 施設や設備を整えるための補助金制度はあるか 障害者を雇用する場合に利用できる支援制度はありますか？ 設備改善、安全対策はどのようにしたらよいでしょうか？ 障害者を採用するにあたり助成金を申請しようと思いますが、どのように手続きすればよいか教えてください。 障害者を雇用しています。助成金の対象になりますでしょうか？ 特定求職者雇用開発助成金について教えてください。 障害者雇用納付金制度に基づく助成金にはどのようなものがありますか？ 障害者雇用は各種助成金の対象になりますか？ 助成金はどのように活用すればよいですか？", "body": "主な助成金 【ハローワーク・労働局】特定求職者雇用開発助成金：ハローワークなどの紹介で障害者を継続雇用した場合 【ハローワーク・労働局】トライアル雇用助成金：試行的に雇用した場合（G2-033） 【ハローワーク・労働局】キャリアアップ助成金（障害者正社員化コース）：有期雇用の障害者を正社員などに転換した場合 【JEED支部】障害者雇用納付金関係助成金：作業施設や設備の整備、職場介助者や手話通訳者の配置、ジョブコーチによる支援、通勤の配慮、能力開発、外部の専門機関による雇用の相談援助など 手続きの流れ 多くの助成金は、雇い入れや設備の購入の「前」に計画の届出や申請が必要 JEEDの窓口は、各都道府県支部の「高齢・障害者業務課」（東京・大阪は「高齢・障害者窓口サービス課」）。所在地はJEEDのホームページの支部一覧で確認できる すでに雇用している場合も、正社員化や設備の整備などで対象になるものがある あわせて使える支援 就労支援機器の無料貸出し（G4-035） 都道府県や市区町村が独自に設けている補助金（地域によって異なる）", "id": "G1-033"}, "G1-048": {"conclusion": "ジョブコーチ（職場適応援助者）は、職場に出向いて、障害のある人が職場に適応できるよう支援する専門家です。本人への支援だけでなく、上司や同僚への助言も行います。利用したい場合は、地域障害者職業センターに相談します。", "general": [["ジョブコーチの種類", ["配置型：地域障害者職業センターに所属", "訪問型：就労支援を行う社会福祉法人などに所属", "企業在籍型：自社の社員がジョブコーチとなり、社内で支援する"]], ["支援の内容と流れ", ["本人へ：仕事の進め方、職場でのコミュニケーション、体調や生活リズムの管理", "会社へ：障害特性に配慮した雇用管理、配置や仕事の内容の設定、上司・同僚への関わり方の助言", "流れ：集中支援 → 移行支援 → その後の確認。期間は1〜8か月（標準2〜4か月）（G5-015）"]], ["ジョブコーチになるには", ["訪問型・企業在籍型のジョブコーチは、厚生労働大臣が定める養成研修を修了する必要がある", "養成研修は、高齢・障害・求職者雇用支援機構（JEED）が地域障害者職業センターと一体で行っているほか、厚生労働大臣が定める民間の研修機関（NPO法人ジョブコーチ・ネットワークなど）でも受講できる", "企業在籍型ジョブコーチの配置には、助成金が使える場合がある（G1-033）"]], ["あわせて知っておきたいこと：障害者職業生活相談員", ["ジョブコーチとは別に、障害者を5人以上雇用する事業所は「障害者職業生活相談員」を選任する義務がある（G1-053）", "相談員になるための資格認定講習はJEEDが行っており、受講料は無料。現在はオンデマンド講習（約2週間の受講期間内に視聴、講義の分量は2日程度）が中心（G1-053）"]]], "sources": ["厚生労働省「職場適応援助者（ジョブコーチ）支援事業について」"], "links": [["厚生労働省 ジョブコーチ支援の概要（PDF）", "https://www.mhlw.go.jp/content/11704000/000708359.pdf"], ["厚生労働省 職場適応援助者（ジョブコーチ）支援事業について", "https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/koyou/shougaishakoyou/06a.html"], ["JEED 訪問型職場適応援助者養成研修", "https://www.jeed.go.jp/disability/supporter/seminar/job_adapt01.html"], ["JEED 企業在籍型職場適応援助者養成研修", "https://www.jeed.go.jp/disability/supporter/seminar/job_adapt02.html"], ["厚生労働省 障害者就労支援人材の育成について（各種研修）", "https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/koyou/shougaishakoyou/syuuroushienjinzai.html"]], "q": "ジョブコーチとはどのような制度で、どう活用すればよいですか？", "cat": "助成金・支援制度", "st": 0, "kw": "ジョブコーチとは何ですか。どうすれば活用できますか ジョブコーチとはどのような役割で、どう活用すればよいですか？ ジョブコーチになる方法を教えてください。 ジョブコーチになる方法について教えてください。 ジョブコーチが提供する支援の範囲はどこまでか", "body": "ジョブコーチの種類 配置型：地域障害者職業センターに所属 訪問型：就労支援を行う社会福祉法人などに所属 企業在籍型：自社の社員がジョブコーチとなり、社内で支援する 支援の内容と流れ 本人へ：仕事の進め方、職場でのコミュニケーション、体調や生活リズムの管理 会社へ：障害特性に配慮した雇用管理、配置や仕事の内容の設定、上司・同僚への関わり方の助言 流れ：集中支援 → 移行支援 → その後の確認。期間は1〜8か月（標準2〜4か月）（G5-015） ジョブコーチになるには 訪問型・企業在籍型のジョブコーチは、厚生労働大臣が定める養成研修を修了する必要がある 養成研修は、高齢・障害・求職者雇用支援機構（JEED）が地域障害者職業センターと一体で行っているほか、厚生労働大臣が定める民間の研修機関（NPO法人ジョブコーチ・ネットワークなど）でも受講できる 企業在籍型ジョブコーチの配置には、助成金が使える場合がある（G1-033） あわせて知っておきたいこと：障害者職業生活相談員 ジョブコーチとは別に、障害者を5人以上雇用する事業所は「障害者職業生活相談員」を選任する義務がある（G1-053） 相談員になるための資格認定講習はJEEDが行っており、受講料は無料。現在はオンデマンド講習（約2週間の受講期間内に視聴、講義の分量は2日程度）が中心（G1-053）", "id": "G1-048"}, "G1-053": {"conclusion": "障害者を5人以上雇用する事業所は、障害者職業生活相談員を選任し、障害のある社員の職業生活の相談・指導を行わせる義務があります。選任したらハローワークに届け出ます。相談員になるには、JEEDが開く資格認定講習を修了するなどの要件があります。", "general": [["相談員の役割", ["仕事の内容や職場環境の調整、職場の人間関係、余暇や生活面の相談", "障害のある社員と職場の橋渡し"]], ["なるための方法", ["JEEDが行う「障害者職業生活相談員資格認定講習」を修了する。受講料は無料", "現在はオンデマンド講習（動画視聴）が中心で、約2週間の受講期間内に講義を視聴して修了する。講義の分量は2日程度。事業所見学や意見交換会などの任意科目（集合形式）もある", "申し込みは、事業所の担当者がJEEDの電子申請サービスから行う（個人では申し込めない）。各回の申込期間内に申し込む", "一定の学歴と実務経験がある場合など、講習なしで資格を認められる場合もある"]], ["選任した後", ["相談員を選任したら、管轄のハローワークに選任届を出す"]]], "sources": ["障害者雇用促進法79条・同施行規則"], "links": [["JEED 障害者職業生活相談員（資格認定講習）", "https://www.jeed.go.jp/disability/employer/employer04/koshu.html"]], "q": "障害者職業生活相談員は必ず選任しなければいけませんか？", "cat": "助成金・支援制度", "st": 0, "kw": "障害者職業生活相談員になる方法を教えてください。 障害者職業生活相談員資格認定講習を受講したいのですが、どのように申し込めばよろしいでしょうか？", "body": "相談員の役割 仕事の内容や職場環境の調整、職場の人間関係、余暇や生活面の相談 障害のある社員と職場の橋渡し なるための方法 JEEDが行う「障害者職業生活相談員資格認定講習」を修了する。受講料は無料 現在はオンデマンド講習（動画視聴）が中心で、約2週間の受講期間内に講義を視聴して修了する。講義の分量は2日程度。事業所見学や意見交換会などの任意科目（集合形式）もある 申し込みは、事業所の担当者がJEEDの電子申請サービスから行う（個人では申し込めない）。各回の申込期間内に申し込む 一定の学歴と実務経験がある場合など、講習なしで資格を認められる場合もある 選任した後 相談員を選任したら、管轄のハローワークに選任届を出す", "id": "G1-053"}, "G1-049": {"conclusion": "就労移行支援事業所は、障害者総合支援法にもとづく福祉サービスで、一般企業への就職をめざす障害のある人に、原則2年間、職業訓練や就職活動の支援を行う事業所です（全国に約3,000か所）。企業にとっては、採用のときは人材の紹介や実習の調整、採用後は職場定着の支援で、頼れる相手になります。目的に合わせて関わり方を変えるとよいでしょう。", "general": [["どんなところか", ["一般企業への就職をめざす障害のある人（原則18〜64歳）が、通所して訓練を受ける", "生活リズムや体調管理、ビジネスマナー、パソコンなどの訓練、企業での実習、応募書類の作成や面接の練習を行う", "利用期間は原則2年間。就職後は、事業所による定着支援（就職後6か月）と、就労定着支援（その後最長3年）がある（G5-038）"]], ["採用したいとき", ["事業所を見学し、訓練の内容や利用者の様子を知る", "求める人材と仕事の内容（どんな業務を、どのように）を具体的に伝える", "実習を受け入れ、本人と職場の相性を確かめてから採用を判断する（G2-040）", "訓練を通じて、本人の得意・不得意、必要な配慮、勤怠の安定度などが整理されているので、面接だけではわからない情報を支援員から聞ける（本人の同意の範囲で）"]], ["採用した後（定着を支えてほしいとき）", ["就職後6か月間は、事業所が職場訪問や面談で定着を支える。その後も、本人が希望すれば就労定着支援（最長3年）につながる", "連絡の窓口、訪問や面談の頻度、相談したいときの連絡方法を決めておく", "職場で困ったことは、事実をもとに早めに共有し、一緒に対応を考える（G5-043）", "支援が終わる時期をつかみ、その後の相談先（障害者就業・生活支援センターなど）につないでおく"]], ["関わるときの注意", ["支援機関に任せきりにせず、会社としての考えや、できること・できないことを伝える（G8-001）", "本人に関する情報のやり取りは、本人の同意の範囲で行う", "事業所によって、得意な障害の種類や訓練の内容、企業との関わり方が違うので、見学や面談で確かめる"]]], "sources": ["障害者総合支援法（就労移行支援・就労定着支援）"], "q": "就労移行支援事業所とはどのようなところですか？企業としてどう関わればよいですか？", "cat": "助成金・支援制度", "st": 0, "kw": "", "body": "どんなところか 一般企業への就職をめざす障害のある人（原則18〜64歳）が、通所して訓練を受ける 生活リズムや体調管理、ビジネスマナー、パソコンなどの訓練、企業での実習、応募書類の作成や面接の練習を行う 利用期間は原則2年間。就職後は、事業所による定着支援（就職後6か月）と、就労定着支援（その後最長3年）がある（G5-038） 採用したいとき 事業所を見学し、訓練の内容や利用者の様子を知る 求める人材と仕事の内容（どんな業務を、どのように）を具体的に伝える 実習を受け入れ、本人と職場の相性を確かめてから採用を判断する（G2-040） 訓練を通じて、本人の得意・不得意、必要な配慮、勤怠の安定度などが整理されているので、面接だけではわからない情報を支援員から聞ける（本人の同意の範囲で） 採用した後（定着を支えてほしいとき） 就職後6か月間は、事業所が職場訪問や面談で定着を支える。その後も、本人が希望すれば就労定着支援（最長3年）につながる 連絡の窓口、訪問や面談の頻度、相談したいときの連絡方法を決めておく 職場で困ったことは、事実をもとに早めに共有し、一緒に対応を考える（G5-043） 支援が終わる時期をつかみ、その後の相談先（障害者就業・生活支援センターなど）につないでおく 関わるときの注意 支援機関に任せきりにせず、会社としての考えや、できること・できないことを伝える（G8-001） 本人に関する情報のやり取りは、本人の同意の範囲で行う 事業所によって、得意な障害の種類や訓練の内容、企業との関わり方が違うので、見学や面談で確かめる", "id": "G1-049"}, "G1-030": {"conclusion": "特例子会社は、障害者の雇用に特別に配慮した子会社です。一定の要件を満たして厚生労働大臣の認定を受けると、子会社で雇用する障害者を親会社の雇用率に算入できます。障害者が働きやすい環境を集中的に整えやすいことが特長です。", "general": [["主な認定要件", ["親会社が子会社の意思決定を支配していること、役員の派遣など人的な関係があること", "雇用する障害者が5人以上で、全従業員に占める割合が20％以上", "雇用する障害者のうち、重度の身体・知的障害者と精神障害者の割合が30％以上", "障害者のための施設の改善や、専任の指導員の配置など、雇用管理を適正に行う能力があること"]], ["メリットと課題", ["メリット：障害特性に合わせた職場環境や支援体制を集中して整えやすい", "課題：親会社や本社の職場と分かれるため、障害者雇用への理解が広がりにくい。グループからの発注単価と賃金の水準の両立"]]], "sources": ["障害者雇用促進法44条"], "q": "特例子会社とは、どのような会社ですか？", "cat": "助成金・支援制度", "st": 0, "kw": "", "body": "主な認定要件 親会社が子会社の意思決定を支配していること、役員の派遣など人的な関係があること 雇用する障害者が5人以上で、全従業員に占める割合が20％以上 雇用する障害者のうち、重度の身体・知的障害者と精神障害者の割合が30％以上 障害者のための施設の改善や、専任の指導員の配置など、雇用管理を適正に行う能力があること メリットと課題 メリット：障害特性に合わせた職場環境や支援体制を集中して整えやすい 課題：親会社や本社の職場と分かれるため、障害者雇用への理解が広がりにくい。グループからの発注単価と賃金の水準の両立", "id": "G1-030"}, "G1-010": {"conclusion": "障害者雇用は、①職域開拓、②採用前の受け入れ準備、③募集・選考、④内定〜入社前、⑤入社直後、⑥定着期、という一連の流れで進めます。前の段階で決めたことが次の段階の前提になるので、各段階で確認すべきことを押さえ、担当者の経験や勘に頼らず「仕組み」にしていくことが大切です。初めての場合は、ハローワークや地域障害者職業センターに相談しながら進めると安心です。", "general": [["① 職域開拓：どんな仕事で採用するかを、関係者の合意をつくりながら決める", ["なぜ障害者雇用を行うのか（目的）を、経営層・人事・現場でそろえる。法定雇用率への対応だけにしない（G7-004）", "受け入れ部署と任せる業務を、「何を（What）」だけでなく「どのように（How）」まで具体化する（G3-008）", "現場の不安や懸念を聞き、解決策とあわせて進める"]], ["② 採用前：受け入れ準備は「採用を決める前」に行う", ["日常の相談窓口と、人事・上司・相談役（チューター）の役割分担を決める（G4-002）", "合理的配慮や過重な負担を、誰が・どの場で判断するかを決めておく（G1-001）", "現場の社員に、何を・どこまで・誰に伝えるかを設計する。相談できる支援機関も知っておく（G8-010）"]], ["③ 募集・選考：面接は「配慮を聞く場」であり「本人の自己理解を見極める場」", ["本人や支援機関からの情報を整理し、面接で確認することを一覧にしておく", "「スキル・経験」「必要な配慮とその背景」「自己理解の度合い」の3つの軸で質問する（G2-007、G2-006）", "配慮の要望はその場で即答せず、持ち帰って社内で考える"]], ["④ 内定〜入社前：「待ち時間」ではなく「調整準備の期間」", ["面接で聞いた配慮事項を書面にまとめ、誰に・どこまで引き継ぐかを決める（G6-012）", "座席、使う道具、マニュアルなど、入社前にできる調整を済ませる", "業務内容や入社直後の予定を、入社前に本人と確認する"]], ["⑤ 入社直後：安心して仕事を続けるための土台づくり", ["相談役が誰かを本人に伝え、まずは安心して質問できる関係づくりを優先する", "業務を分けて、難しさや量を少しずつ上げていく。最初の数週間は「評価」ではなく「観察と調整」の期間と考える", "週1回15分など、短い間隔で振り返る機会を最初から決めておく"]], ["⑥ 定着期：見守るだけでなく「定期的に確認する仕組み」で支える", ["月1回など定期的な振り返りの場を設け、本人と上司の双方から状況を確認する（G5-024）", "配慮の内容を定期的に見直す（減らせる配慮も含めて）（G6-027）", "将来どうなりたいかを話し、成長の機会を考える。困ったときの社内外の連絡ルートを決めておく（G5-015、G5-020）"]], ["段階ごとの実務のチェックポイント（下の表）", ["各段階で確認することを、チェック表の形でまとめています。詳しい項目は、G3-008（職域開拓）、G4-014（採用前）、G2-007（募集・選考）、G2-026（内定〜入社前）、G5-015（入社直後〜定着期）の表を参照"]]], "charts": [{"type": "table", "title": "段階ごとの実務のチェックポイント（一覧）", "head": ["段階", "主な確認ポイント", "詳しいチェック表"], "rows": [["① 職域開拓", "目的が経営層・人事・現場でそろっている。業務を「何を」「どのように」まで具体化している。現場の不安を聞き、解決策とあわせて進めている。", "G3-008"], ["② 採用前", "相談窓口と、人事・上司・相談役の役割分担が決まっている。合理的配慮と過重な負担を判断する場と考え方を共有している。現場に何をどこまで伝えるか考えている。", "G4-014"], ["③ 募集・選考", "確認済みのことと面接で聞くことを分けている。筆記試験などの受け方の配慮を事前に聞いている。配慮の背景や本人の自己理解まで掘り下げる。配慮の希望はその場で約束しない。", "G2-007"], ["④ 内定〜入社前", "配慮事項を書面にし、引き継ぐ範囲を決めている。座席・ツール・マニュアルの調整を済ませている。業務内容や最初のスケジュールを本人と確認している。", "G2-026"], ["⑤ 入社直後", "相談役を本人に伝え、質問しやすい関係づくりを優先している。業務を分けて少しずつ増やす計画がある。短い振り返りを仕組みにしている。", "G5-015"], ["⑥ 定着期", "定期的な振り返りを仕組みにし、本人と上司の両方から確認している。配慮を定期的に見直している。支える側の負担も知っている。", "G5-015"]], "note": "各段階の詳しいチェック表は、右の列の回答に載せています。", "xlsx": "tools/checklist-00-all.xlsx", "xlsx_name": "00_全段階まとめ版チェックリスト.xlsx"}], "q": "障害者雇用はどのような手順・ステップで進めればよいですか？", "cat": "目的と進め方", "st": 0, "kw": "障害者雇用を考える際に、まず知っておくべきことはありますか？ 障害者雇用は、どのように進めたらよいですか？ 障害者雇用を検討している場合、何から始めればよいですか？ 障がい者雇用は初めてのため、何から始めればよいか分からないです。 障がい特性、適性、配慮事項などの知識がなく、障がい者雇用に不安がある。過去に苦労した場合、どうしたらよいか。", "body": "① 職域開拓：どんな仕事で採用するかを、関係者の合意をつくりながら決める なぜ障害者雇用を行うのか（目的）を、経営層・人事・現場でそろえる。法定雇用率への対応だけにしない（G7-004） 受け入れ部署と任せる業務を、「何を（What）」だけでなく「どのように（How）」まで具体化する（G3-008） 現場の不安や懸念を聞き、解決策とあわせて進める ② 採用前：受け入れ準備は「採用を決める前」に行う 日常の相談窓口と、人事・上司・相談役（チューター）の役割分担を決める（G4-002） 合理的配慮や過重な負担を、誰が・どの場で判断するかを決めておく（G1-001） 現場の社員に、何を・どこまで・誰に伝えるかを設計する。相談できる支援機関も知っておく（G8-010） ③ 募集・選考：面接は「配慮を聞く場」であり「本人の自己理解を見極める場」 本人や支援機関からの情報を整理し、面接で確認することを一覧にしておく 「スキル・経験」「必要な配慮とその背景」「自己理解の度合い」の3つの軸で質問する（G2-007、G2-006） 配慮の要望はその場で即答せず、持ち帰って社内で考える ④ 内定〜入社前：「待ち時間」ではなく「調整準備の期間」 面接で聞いた配慮事項を書面にまとめ、誰に・どこまで引き継ぐかを決める（G6-012） 座席、使う道具、マニュアルなど、入社前にできる調整を済ませる 業務内容や入社直後の予定を、入社前に本人と確認する ⑤ 入社直後：安心して仕事を続けるための土台づくり 相談役が誰かを本人に伝え、まずは安心して質問できる関係づくりを優先する 業務を分けて、難しさや量を少しずつ上げていく。最初の数週間は「評価」ではなく「観察と調整」の期間と考える 週1回15分など、短い間隔で振り返る機会を最初から決めておく ⑥ 定着期：見守るだけでなく「定期的に確認する仕組み」で支える 月1回など定期的な振り返りの場を設け、本人と上司の双方から状況を確認する（G5-024） 配慮の内容を定期的に見直す（減らせる配慮も含めて）（G6-027） 将来どうなりたいかを話し、成長の機会を考える。困ったときの社内外の連絡ルートを決めておく（G5-015、G5-020） 段階ごとの実務のチェックポイント（下の表） 各段階で確認することを、チェック表の形でまとめています。詳しい項目は、G3-008（職域開拓）、G4-014（採用前）、G2-007（募集・選考）、G2-026（内定〜入社前）、G5-015（入社直後〜定着期）の表を参照 段階ごとの実務のチェックポイント（一覧） ① 職域開拓 目的が経営層・人事・現場でそろっている。業務を「何を」「どのように」まで具体化している。現場の不安を聞き、解決策とあわせて進めている。 G3-008 ② 採用前 相談窓口と、人事・上司・相談役の役割分担が決まっている。合理的配慮と過重な負担を判断する場と考え方を共有している。現場に何をどこまで伝えるか考えている。 G4-014 ③ 募集・選考 確認済みのことと面接で聞くことを分けている。筆記試験などの受け方の配慮を事前に聞いている。配慮の背景や本人の自己理解まで掘り下げる。配慮の希望はその場で約束しない。 G2-007 ④ 内定〜入社前 配慮事項を書面にし、引き継ぐ範囲を決めている。座席・ツール・マニュアルの調整を済ませている。業務内容や最初のスケジュールを本人と確認している。 G2-026 ⑤ 入社直後 相談役を本人に伝え、質問しやすい関係づくりを優先している。業務を分けて少しずつ増やす計画がある。短い振り返りを仕組みにしている。 G5-015 ⑥ 定着期 定期的な振り返りを仕組みにし、本人と上司の両方から確認している。配慮を定期的に見直している。支える側の負担も知っている。 G5-015", "id": "G1-010"}, "G1-054": {"conclusion": "2025年6月1日時点で、民間企業で働く障害者は約70万5千人（短時間労働者などを換算した数）で、過去最高を更新しました。実雇用率は2.41％、法定雇用率（当時2.5％）を達成している企業は46.0％です。", "general": [["最近の動向", ["雇用される障害者の数は毎年増え続けている", "特に精神障害者の雇用が大きく伸びている（2025年は前年比11.8％増）", "法定雇用率の引き上げ（2026年7月に2.7％）にともない、達成企業の割合をどう高めるかが課題"]], ["最新の数字を確かめるには", ["厚生労働省が毎年12月ごろに「障害者雇用状況の集計結果」を公表している"]]], "charts": [{"type": "bars", "title": "民間企業で働く障害者の数の推移（各年6月1日時点）", "unit": "人", "labels": ["2016", "2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025"], "values": [474374, 495795, 534769.5, 560608.5, 578292, 597786, 613958, 642178, 677461.5, 704610], "max": 800000, "ticks": [0, 200000, 400000, 600000, 800000], "note": "重度障害者を2人と数えるなど、法定雇用率の算定方法で数えた人数。出典：厚生労働省「障害者雇用状況の集計結果」"}, {"type": "share", "title": "障害の種類別の内訳（2025年6月1日時点）", "unit": "人", "items": [["身体障害者", 373914.5], ["知的障害者", 162153.5], ["精神障害者", 168542]], "note": "前年比：身体＋1.3％、知的＋2.8％、精神＋11.8％。精神障害者の伸びが最も大きい"}], "sources": ["厚生労働省「令和7年 障害者雇用状況の集計結果」"], "links": [["厚生労働省 令和7年 障害者雇用状況の集計結果", "https://www.mhlw.go.jp/stf/newpage_67490.html"], ["集計結果（PDF）", "https://www.mhlw.go.jp/content/11704000/001357856.pdf"]], "q": "日本全体では、どれくらいの障害者が企業で働いていますか？", "cat": "目的と進め方", "st": 0, "kw": "障害者雇用の実態や動向はどのようなものでしょうか", "body": "最近の動向 雇用される障害者の数は毎年増え続けている 特に精神障害者の雇用が大きく伸びている（2025年は前年比11.8％増） 法定雇用率の引き上げ（2026年7月に2.7％）にともない、達成企業の割合をどう高めるかが課題 最新の数字を確かめるには 厚生労働省が毎年12月ごろに「障害者雇用状況の集計結果」を公表している 民間企業で働く障害者の数の推移（各年6月1日時点） 障害の種類別の内訳（2025年6月1日時点）", "id": "G1-054"}, "G1-005": {"conclusion": "障害のある社員本人が学べるものは、大きく2つに分けて考えます。1つは、ビジネスマナーやパソコンなど、ほかの社員と同じ一般的なスキル。もう1つは、自分の障害との向き合い方や付き合い方、ストレスや体調のセルフケアです。後者は、国などが運営する無料の情報サイトで、本人が自分のペースで学べます。本人の課題や希望に合わせて選びます。", "general": [["① 一般的なスキル（ビジネスマナー、パソコンなど）", ["社内の研修：ほかの社員と同じ新人研修やマナー研修に、必要な配慮をして参加してもらう（G5-020）", "マナビDX（経済産業省・IPA）：パソコンの基礎からデジタルスキルまで学べる国のポータルサイト。無料の講座が多い"]], ["② 障害との向き合い方・セルフケア", ["こころの耳（厚生労働省）：働く人のためのメンタルヘルスのサイト。ストレスへの気づき方や対処法など、セルフケアを動画やeラーニングで学べる", "みんなのメンタルヘルス総合サイト（厚生労働省）：こころの病気の症状や治療、回復までの道のり、相談先が分かりやすくまとめられている", "こころの情報サイト（国立精神・神経医療研究センター）：こころの病気や、自分らしく暮らすためのヒントを、本人や家族向けに紹介している", "発達障害情報・支援センター（国立障害者リハビリテーションセンター）：発達障害の特性や、生活・仕事での工夫について、本人向けの情報がある"]], ["選び方", ["本人の課題（報告・相談、体調管理、ビジネスマナーなど）を本人と確認してから選ぶ", "学んだことを職場で試し、定着面談などで振り返る機会をつくる（G5-024）"]]], "links": [["マナビDX", "https://manabi-dx.ipa.go.jp/"], ["こころの耳", "https://kokoro.mhlw.go.jp/"], ["みんなのメンタルヘルス総合サイト", "https://www.mhlw.go.jp/kokoro/"], ["こころの情報サイト", "https://kokoro.ncnp.go.jp/"], ["発達障害情報・支援センター", "https://www.rehab.go.jp/ddis/"]], "q": "障害のある社員本人が見て学べる研修や動画教材はありますか？", "cat": "学びと情報源", "st": 0, "kw": "", "body": "① 一般的なスキル（ビジネスマナー、パソコンなど） 社内の研修：ほかの社員と同じ新人研修やマナー研修に、必要な配慮をして参加してもらう（G5-020） マナビDX（経済産業省・IPA）：パソコンの基礎からデジタルスキルまで学べる国のポータルサイト。無料の講座が多い ② 障害との向き合い方・セルフケア こころの耳（厚生労働省）：働く人のためのメンタルヘルスのサイト。ストレスへの気づき方や対処法など、セルフケアを動画やeラーニングで学べる みんなのメンタルヘルス総合サイト（厚生労働省）：こころの病気の症状や治療、回復までの道のり、相談先が分かりやすくまとめられている こころの情報サイト（国立精神・神経医療研究センター）：こころの病気や、自分らしく暮らすためのヒントを、本人や家族向けに紹介している 発達障害情報・支援センター（国立障害者リハビリテーションセンター）：発達障害の特性や、生活・仕事での工夫について、本人向けの情報がある 選び方 本人の課題（報告・相談、体調管理、ビジネスマナーなど）を本人と確認してから選ぶ 学んだことを職場で試し、定着面談などで振り返る機会をつくる（G5-024）", "id": "G1-005"}, "G1-004": {"conclusion": "障害のある当事者が職場に望むことでよく聞かれるのは、「困ったときに相談できる人がいること」「自分の特性を理解してもらえること」「特別扱いではなく、仕事で役に立ちたい」といった声です。いちばん確かな方法は、自社で働く本人に、定期的に直接聞くことです。", "general": [["よく聞かれる声", ["相談しやすい人や仕組みがあってほしい", "障害名ではなく、自分自身の特性を知ってほしい", "配慮はほしいが、特別扱いや過度な気遣いはしてほしくない", "仕事を任せてほしい、成長したい、評価してほしい", "体調の波に理解がほしい"]], ["会社が実際に行っている配慮（下の表）", ["厚生労働省の調査では、会社が行っている配慮として、休みの取りやすさ、勤務時間の調整、通院への配慮、分かりやすい指示、力を発揮できる仕事への配置などが上位にある", "「体調の波に理解がほしい」「自分の特性を知ってほしい」といった当事者の声と重なる内容になっている"]], ["当事者の声を知る方法", ["自社で働く本人に、定着面談などで定期的に聞く（G5-024）", "支援機関に、ほかの利用者の声や、よくある困りごとを聞く", "当事者が登壇するセミナーや、当事者の声をまとめた資料・動画を見る"]]], "charts": [{"type": "table", "title": "会社が行っている配慮の上位（障害種別）", "head": ["障害種別", "会社が行っている配慮の上位"], "rows": [["身体障害", "休暇の取りやすさなど休養への配慮 40.2％、通院・服薬管理への配慮 38.3％、短時間勤務など勤務時間の配慮 37.9％"], ["知的障害", "能力を発揮できる仕事への配置 51.1％、短時間勤務など勤務時間の配慮 50.9％、業務の進め方の分かりやすい指示 50.3％"], ["精神障害", "短時間勤務など勤務時間の配慮 54.3％、休養への配慮 50.9％、通院・服薬管理への配慮 49.2％"], ["発達障害", "休暇の取りやすさや休憩など休養への配慮 61.2％、短時間勤務など勤務時間の配慮 50.9％"]], "note": "出典：厚生労働省「令和5年度障害者雇用実態調査」（事業所調査、雇用している障害者への配慮事項、複数回答）。"}], "sources": ["厚生労働省「令和5年度障害者雇用実態調査結果報告書」（2024年3月）"], "links": [["令和5年度障害者雇用実態調査結果報告書（PDF）", "https://www.mhlw.go.jp/content/11601000/001233721.pdf"]], "q": "障害のある当事者は、職場にどのようなことを望んでいますか？当事者の声を知る方法はありますか？", "cat": "目的と進め方", "st": 0, "kw": "", "body": "よく聞かれる声 相談しやすい人や仕組みがあってほしい 障害名ではなく、自分自身の特性を知ってほしい 配慮はほしいが、特別扱いや過度な気遣いはしてほしくない 仕事を任せてほしい、成長したい、評価してほしい 体調の波に理解がほしい 会社が実際に行っている配慮（下の表） 厚生労働省の調査では、会社が行っている配慮として、休みの取りやすさ、勤務時間の調整、通院への配慮、分かりやすい指示、力を発揮できる仕事への配置などが上位にある 「体調の波に理解がほしい」「自分の特性を知ってほしい」といった当事者の声と重なる内容になっている 当事者の声を知る方法 自社で働く本人に、定着面談などで定期的に聞く（G5-024） 支援機関に、ほかの利用者の声や、よくある困りごとを聞く 当事者が登壇するセミナーや、当事者の声をまとめた資料・動画を見る 会社が行っている配慮の上位（障害種別） 身体障害 休暇の取りやすさなど休養への配慮 40.2％、通院・服薬管理への配慮 38.3％、短時間勤務など勤務時間の配慮 37.9％ 知的障害 能力を発揮できる仕事への配置 51.1％、短時間勤務など勤務時間の配慮 50.9％、業務の進め方の分かりやすい指示 50.3％ 精神障害 短時間勤務など勤務時間の配慮 54.3％、休養への配慮 50.9％、通院・服薬管理への配慮 49.2％ 発達障害 休暇の取りやすさや休憩など休養への配慮 61.2％、短時間勤務など勤務時間の配慮 50.9％", "id": "G1-004"}, "G1-009": {"conclusion": "うまくいかない原因は、大きく「業務が合わない」と「受け入れ体制が整っていない」の2つに分けられます。どちらも、事前の準備と、入社後に定期的に確認する仕組みで防ぐことができます。よくある例と防ぎ方を、下の表にまとめます。", "general": [["原因の2つの側面（下の表）", ["業務が合わない：仕事の内容や量、難しさが、本人の特性や力と合っていない", "受け入れ体制が整っていない：相談先、職場への説明、配慮の引き継ぎ、面談の仕組みなどが決まっていない", "2つが重なって起きることも多い。原因を決めつけず、両方の面から振り返る"]], ["防ぐために", ["職域開拓から定着までの各段階で、確認すべきことを仕組みにする（G1-010）", "退職の理由と防ぎ方は G5-014 も参照"]]], "charts": [{"type": "table", "title": "うまくいかない例と防ぎ方", "head": ["原因", "よくある例", "防ぐために"], "rows": [["業務が合わない", "仕事の内容が本人の特性に合っていない", "採用前に業務を「何を」「どのように」まで具体化し、実習で相性を確かめる（G3-008、G2-001）"], ["業務が合わない", "最初から業務量や難しさが大きすぎる", "業務を分けて、少しずつ量や難しさを上げる（G3-006）"], ["業務が合わない", "任せる仕事が足りず、手持ちぶさたになる", "複数の部署から業務を集め、継続して発生する量を確保する（G3-008）"], ["受け入れ体制", "目的が共有されず、現場に「やらされ感」がある", "雇用の目的を、経営層・人事・現場でそろえる（G7-004）"], ["受け入れ体制", "相談先や職場への説明が決まらないまま入社した", "相談役、指示を出す人を決め、職場に何をどこまで伝えるかを入社前に決める（G4-002、G2-026）"], ["受け入れ体制", "面接で聞いた配慮が、配属先に伝わっていない", "配慮事項を書面にまとめ、配属先に引き継ぐ（G5-023）"], ["受け入れ体制", "本人が相談を言い出せず、悩みを抱え込んだ", "定期的な面談を仕組みにし、会社から声をかける（G5-024）"]]}], "q": "障害者雇用がうまくいかなかったのは、どんな場合が多いですか？", "cat": "目的と進め方", "st": 0, "kw": "", "body": "原因の2つの側面（下の表） 業務が合わない：仕事の内容や量、難しさが、本人の特性や力と合っていない 受け入れ体制が整っていない：相談先、職場への説明、配慮の引き継ぎ、面談の仕組みなどが決まっていない 2つが重なって起きることも多い。原因を決めつけず、両方の面から振り返る 防ぐために 職域開拓から定着までの各段階で、確認すべきことを仕組みにする（G1-010） 退職の理由と防ぎ方は G5-014 も参照 うまくいかない例と防ぎ方 業務が合わない 仕事の内容が本人の特性に合っていない 採用前に業務を「何を」「どのように」まで具体化し、実習で相性を確かめる（G3-008、G2-001） 業務が合わない 最初から業務量や難しさが大きすぎる 業務を分けて、少しずつ量や難しさを上げる（G3-006） 業務が合わない 任せる仕事が足りず、手持ちぶさたになる 複数の部署から業務を集め、継続して発生する量を確保する（G3-008） 受け入れ体制 目的が共有されず、現場に「やらされ感」がある 雇用の目的を、経営層・人事・現場でそろえる（G7-004） 受け入れ体制 相談先や職場への説明が決まらないまま入社した 相談役、指示を出す人を決め、職場に何をどこまで伝えるかを入社前に決める（G4-002、G2-026） 受け入れ体制 面接で聞いた配慮が、配属先に伝わっていない 配慮事項を書面にまとめ、配属先に引き継ぐ（G5-023） 受け入れ体制 本人が相談を言い出せず、悩みを抱え込んだ 定期的な面談を仕組みにし、会社から声をかける（G5-024）", "id": "G1-009"}, "G8-010": {"conclusion": "支援機関は、「何に困っているか」「どの段階か」で使い分けます。採用のときはハローワークや就労移行支援事業所、受け入れや定着のときは地域障害者職業センターや障害者就業・生活支援センター、制度や助成金のことはJEEDの都道府県支部、が主な相談先です。", "general": [["これから障害者雇用を始めたい・進め方を相談したい", ["ハローワーク：雇用管理の相談、法定雇用率の考え方、求人の出し方", "地域障害者職業センター：仕事の切り出し、受け入れ体制づくりの助言（G8-017）"]], ["採用したい（人材を紹介してほしい）", ["ハローワーク、就労移行支援事業所、特別支援学校、障害者職業能力開発校など（G2-008）", "実習を受け入れたいときも、これらの機関に相談する（G2-040）"]], ["受け入れ・定着を支えてほしい", ["就労移行支援事業所（就職後6か月）、就労定着支援（その後最長3年）：本人が就職前に利用していた事業所が、職場訪問や面談で定着を支える（G5-038）", "地域障害者職業センター：ジョブコーチによる職場での支援（G1-048）", "障害者就業・生活支援センター：仕事と生活の両面の相談に、期間の区切りなく乗る"]], ["職場で困ったことが起きた", ["本人の体調や勤怠、職場での困りごと → 本人を支援している機関（就労移行支援事業所、障害者就業・生活支援センターなど）にまず連絡する（G10-101）", "職場での対応のしかたがわからない → 地域障害者職業センター", "合理的配慮や差別にあたるかの判断 → ハローワーク、都道府県労働局（G6-122）"]], ["制度・助成金・講習のこと", ["JEEDの都道府県支部：納付金制度、助成金、障害者職業生活相談員の講習（G1-033、G1-053）", "ハローワーク・労働局：雇い入れに関する助成金（特定求職者雇用開発助成金、トライアル雇用など）"]], ["あわせて知っておきたいこと", ["障害者就業・生活支援センターは、「就業・生活」の「・」から「なかぽつ」「就ぽつ」とも呼ばれる", "国の機関（ハローワーク、労働局、地域障害者職業センターなど）のほか、都道府県が独自の相談窓口や補助金を設けていることもある（京都障害者雇用企業サポートセンターなど）", "地域によっては、障害者就業・生活支援センターのほかに、自治体が独自に設けている就労支援の窓口もある。たとえば東京都では、区市町村ごとに「障害者就労支援センター」があり、身近な地域で就労と生活の相談に乗っている。所在地の自治体に確認するとよい"]]], "q": "障害者雇用で、どんなときに、どの支援機関を頼ればよいですか？", "cat": "支援機関の種類と使い方", "st": 4, "kw": "出勤すれば仕事はしっかりできるものの、勤怠が不安定な障害者の生活面を含めた相談ができる支援機関はありますか？（障害者就業・生活支援センター） 障害者雇用をサポートしてくれるような外部支援はありますか？ 受入れに不安がある場合に活用できる支援・制度はありますか？ 初めて障害者を雇用したい、または雇用管理に課題がある場合、どこに相談したら良いか分からないときはどうしたらよいでしょうか？（地域障害者職業センター） 障害者雇用納付金制度や障害者職業生活相談員資格認定講習については、どこに相談したらよいでしょうか？（JEED都道府県支部） どのような時に支援機関を利用するのがよいのでしょうか 国と京都府の支援サービスの違いがよくわかりません なかぽつセンター(就ぽつセンター)という言葉は何を指すのでしょうか ハローワークに求人を出しているが、さらに幅広く障害者に関する情報が欲しい時はどうしたらいいでしょうか？（就労移行支援事業所・特別支援学校） 視覚と聴覚の両方に障害があるなど、珍しいケースの配慮は、どこに相談すればよいですか？", "body": "これから障害者雇用を始めたい・進め方を相談したい ハローワーク：雇用管理の相談、法定雇用率の考え方、求人の出し方 地域障害者職業センター：仕事の切り出し、受け入れ体制づくりの助言（G8-017） 採用したい（人材を紹介してほしい） ハローワーク、就労移行支援事業所、特別支援学校、障害者職業能力開発校など（G2-008） 実習を受け入れたいときも、これらの機関に相談する（G2-040） 受け入れ・定着を支えてほしい 就労移行支援事業所（就職後6か月）、就労定着支援（その後最長3年）：本人が就職前に利用していた事業所が、職場訪問や面談で定着を支える（G5-038） 地域障害者職業センター：ジョブコーチによる職場での支援（G1-048） 障害者就業・生活支援センター：仕事と生活の両面の相談に、期間の区切りなく乗る 職場で困ったことが起きた 本人の体調や勤怠、職場での困りごと → 本人を支援している機関（就労移行支援事業所、障害者就業・生活支援センターなど）にまず連絡する（G10-101） 職場での対応のしかたがわからない → 地域障害者職業センター 合理的配慮や差別にあたるかの判断 → ハローワーク、都道府県労働局（G6-122） 制度・助成金・講習のこと JEEDの都道府県支部：納付金制度、助成金、障害者職業生活相談員の講習（G1-033、G1-053） ハローワーク・労働局：雇い入れに関する助成金（特定求職者雇用開発助成金、トライアル雇用など） あわせて知っておきたいこと 障害者就業・生活支援センターは、「就業・生活」の「・」から「なかぽつ」「就ぽつ」とも呼ばれる 国の機関（ハローワーク、労働局、地域障害者職業センターなど）のほか、都道府県が独自の相談窓口や補助金を設けていることもある（京都障害者雇用企業サポートセンターなど） 地域によっては、障害者就業・生活支援センターのほかに、自治体が独自に設けている就労支援の窓口もある。たとえば東京都では、区市町村ごとに「障害者就労支援センター」があり、身近な地域で就労と生活の相談に乗っている。所在地の自治体に確認するとよい", "id": "G8-010"}, "G8-017": {"conclusion": "地域障害者職業センターは、障害者の雇用を専門に支援する公的機関です。高齢・障害・求職者雇用支援機構（JEED）が各都道府県に設置しています。企業に対しては、障害者の受け入れ方や配慮の相談、ジョブコーチによる職場での支援、休職した社員の復職支援などを、無料で行っています。", "general": [["企業が受けられる支援", ["障害者雇用の進め方や、受け入れ体制づくりの相談・助言", "任せる仕事の切り出しや、作業の進め方の助言（G3-024）", "ジョブコーチが職場に出向き、本人への作業指導や、上司・同僚への関わり方の助言を行う（G1-048）", "休職した社員の職場復帰の支援（リワーク（復職に向けた支援）支援）（G11-004）", "障害者雇用に関する事業主向けの講習や研修"]], ["本人への支援（会社にとっても参考になる）", ["職業評価：本人の得意・不得意や、働くうえで必要な配慮を整理する", "職業準備支援：働くための生活リズムやコミュニケーションの練習"]], ["利用のしかた", ["まず電話で相談し、予約をとる", "利用は無料", "障害者手帳がなくても利用できる", "職業紹介（求人と求職者のあっせん）は行っていない。採用の紹介はハローワークと連携して行う（G2-008）", "センターの専門職員は「障害者職業カウンセラー」と呼ばれ、JEEDの職員として養成研修を受けている（国家資格ではない）"]]], "links": [["JEED 地域障害者職業センター一覧", "https://www.jeed.go.jp/location/chiiki/index.html"]], "q": "地域障害者職業センターは、企業に対して何をしてくれるのですか？どう利用すればよいですか？", "cat": "支援機関の種類と使い方", "st": 4, "kw": "地域障害者職業センターの利用には障害者手帳が必要でしょうか？ 地域障害者職業センターの利用に費用はかかりますか？ 地域障害者職業センターで職業紹介はしてもらえるのでしょうか？ 障害者職業カウンセラーはどのような資格ですか？", "body": "企業が受けられる支援 障害者雇用の進め方や、受け入れ体制づくりの相談・助言 任せる仕事の切り出しや、作業の進め方の助言（G3-024） ジョブコーチが職場に出向き、本人への作業指導や、上司・同僚への関わり方の助言を行う（G1-048） 休職した社員の職場復帰の支援（リワーク（復職に向けた支援）支援）（G11-004） 障害者雇用に関する事業主向けの講習や研修 本人への支援（会社にとっても参考になる） 職業評価：本人の得意・不得意や、働くうえで必要な配慮を整理する 職業準備支援：働くための生活リズムやコミュニケーションの練習 利用のしかた まず電話で相談し、予約をとる 利用は無料 障害者手帳がなくても利用できる 職業紹介（求人と求職者のあっせん）は行っていない。採用の紹介はハローワークと連携して行う（G2-008） センターの専門職員は「障害者職業カウンセラー」と呼ばれ、JEEDの職員として養成研修を受けている（国家資格ではない）", "id": "G8-017"}, "G8-001": {"conclusion": "支援機関は、会社の代わりに対応してくれる機関ではなく、会社と一緒に本人を支える相手です。会社から考えや困りごとを伝えるだけでなく、支援機関が持っている本人の情報や、本人が会社に直接言いにくい思いを聞かせてもらう、という双方向の姿勢が大切です。役割を分担しながら連携します。", "general": [["連携のポイント", ["会社としての考えや方針を伝える（何を大事にしたいか、どこまで配慮できるか）", "困りごとは事実で伝える（いつ、どんな場面で、何が起きたか）（G5-043）", "会社がすること、支援機関に頼むことを分けて決める", "連絡の窓口と頻度を決めておく"]], ["支援機関から情報を得る", ["支援機関は、本人の特性やこれまでの経過、うまくいった工夫、調子を崩すサインなど、会社が知らない情報を持っていることが多い", "本人が会社に直接言いにくい気持ちや希望を、支援機関から本人の意図として伝えてもらうこともできる", "会社から伝えるだけでなく、「本人の様子で気をつけておくことはありますか」「本人はどう感じていそうですか」と、支援機関に聞く姿勢を持つ", "本人の情報のやり取りは、本人の同意を得た範囲で行う"]], ["丸投げにならないために", ["支援機関の助言を聞いて終わりにせず、社内で実際に試し、結果を共有する", "職場のことは職場で決める。支援機関には、本人の状態の理解や関わり方の助言を求める", "定期的な面談に支援員が同席するなど、三者で話す場をつくる"]]], "q": "外部の支援機関に相談するとき、「丸投げ」にならないように連携するにはどうすればよいですか？", "cat": "支援機関の種類と使い方", "st": 4, "kw": "", "body": "連携のポイント 会社としての考えや方針を伝える（何を大事にしたいか、どこまで配慮できるか） 困りごとは事実で伝える（いつ、どんな場面で、何が起きたか）（G5-043） 会社がすること、支援機関に頼むことを分けて決める 連絡の窓口と頻度を決めておく 支援機関から情報を得る 支援機関は、本人の特性やこれまでの経過、うまくいった工夫、調子を崩すサインなど、会社が知らない情報を持っていることが多い 本人が会社に直接言いにくい気持ちや希望を、支援機関から本人の意図として伝えてもらうこともできる 会社から伝えるだけでなく、「本人の様子で気をつけておくことはありますか」「本人はどう感じていそうですか」と、支援機関に聞く姿勢を持つ 本人の情報のやり取りは、本人の同意を得た範囲で行う 丸投げにならないために 支援機関の助言を聞いて終わりにせず、社内で実際に試し、結果を共有する 職場のことは職場で決める。支援機関には、本人の状態の理解や関わり方の助言を求める 定期的な面談に支援員が同席するなど、三者で話す場をつくる", "id": "G8-001"}, "G8-028": {"conclusion": "かかる期間は、会社の状況や、すでに受け入れの体制があるかどうかによって大きく変わります。まずは、方針づくりから入社までの流れを押さえ、どこに時間がかかりやすいかを知っておくことが大切です。期間は下に一例として示します。", "general": [["採用までの流れと期間（一例）", ["① 方針の決定、社内の理解づくり（例：1〜2か月）", "② 仕事の切り出し、受け入れ体制づくり（例：2〜3か月）", "③ 求人、実習、面接（例：1〜3か月）", "④ 内定から入社までの準備（例：1か月程度）", "これはあくまで一例。すでに受け入れの体制や切り出した仕事がある場合は、③④から始められるため、より短い期間で進められる", "各段階で確認することは G1-010 を参照"]], ["期間が延びやすいこと", ["仕事の切り出しで、現場の合意がなかなか得られない", "求める条件に合う応募者が集まらない", "実習の日程調整"]], ["早めに進めるには", ["ハローワークや地域障害者職業センターに早めに相談する（G8-010）", "法定雇用率の引き上げや定年などに備え、余裕をもって計画する（G2-018）"]]], "q": "障害者を新しく採用するとき、どのくらいの期間がかかりますか？", "cat": "採用計画とルート", "st": 1, "kw": "", "body": "採用までの流れと期間（一例） ① 方針の決定、社内の理解づくり（例：1〜2か月） ② 仕事の切り出し、受け入れ体制づくり（例：2〜3か月） ③ 求人、実習、面接（例：1〜3か月） ④ 内定から入社までの準備（例：1か月程度） これはあくまで一例。すでに受け入れの体制や切り出した仕事がある場合は、③④から始められるため、より短い期間で進められる 各段階で確認することは G1-010 を参照 期間が延びやすいこと 仕事の切り出しで、現場の合意がなかなか得られない 求める条件に合う応募者が集まらない 実習の日程調整 早めに進めるには ハローワークや地域障害者職業センターに早めに相談する（G8-010） 法定雇用率の引き上げや定年などに備え、余裕をもって計画する（G2-018）", "id": "G8-028"}, "G8-026": {"conclusion": "社内の担当者に学ばせる研修は、役割によって選びます。一緒に働く社員が基本を知るなら「精神・発達障害者しごとサポーター養成講座」、社内で障害のある社員の相談役になるなら「障害者職業生活相談員資格認定講習」、社内で職場への適応を専門的に支えるなら「企業在籍型ジョブコーチ養成研修」が目安です。", "general": [["① 精神・発達障害者しごとサポーター養成講座", ["受けてほしい人：精神・発達障害のある社員と一緒に働く同僚や上司", "内容と期間：障害の特性と、職場での関わり方の基本。2時間程度", "実施：都道府県労働局・ハローワーク（無料。職場への出前講座もある）"]], ["② 障害者職業生活相談員資格認定講習", ["受けてほしい人：社内で、障害のある社員の仕事や職場生活の相談役になる人。障害者を5人以上雇用する事業所は、相談員の選任が義務（G1-053）", "内容と期間：障害者雇用の制度、障害特性、相談・指導の方法など。オンデマンド講習（約2週間の受講期間内に視聴、講義の分量は2日程度）。受講料は無料", "実施：JEED"]], ["③ 企業在籍型ジョブコーチ養成研修", ["企業在籍型ジョブコーチとは：自社の社員がジョブコーチ（職場適応援助者）の研修を受け、自社で働く障害のある社員の職場適応を、社内で専門的に支える役割。外部のジョブコーチに頼らず、日常的に支援できる", "受けてほしい人：障害のある社員が多い職場の担当者や、仕事の切り出し・教え方の工夫を社内で担う人", "内容と期間：集合研修4日間と、地域障害者職業センターでの実技研修4日間程度（JEEDで受講する場合、受講料は無料）", "実施：JEED（障害者職業総合センター等と地域障害者職業センター）、厚生労働大臣が定める民間の研修機関", "配置には助成金が使える場合がある（G1-033）"]], ["選び方のポイント", ["社内の担当者は、まず②の相談員講習から始め、より専門的な支援を担う人が③に進む、という順番が一般的", "周りの社員の理解を広げたいときは、①を職場単位で受けてもらう", "ジョブコーチには、支援機関に所属して企業を訪問する「訪問型」もある。企業の社員が受けるのは「企業在籍型」（G1-048）"]]], "links": [["厚生労働省 精神・発達障害者しごとサポーター", "https://www.mhlw.go.jp/seisakunitsuite/bunya/koyou_roudou/koyou/shougaishakoyou/shigotosupporter/index.html"], ["JEED 企業在籍型職場適応援助者養成研修", "https://www.jeed.go.jp/disability/supporter/seminar/job_adapt02.html"], ["JEED 訪問型職場適応援助者養成研修", "https://www.jeed.go.jp/disability/supporter/seminar/job_adapt01.html"], ["JEED 職業リハビリテーションに関する各種研修", "https://www.jeed.go.jp/disability/supporter/supporter04.html"]], "q": "社内で障害者雇用を担う社員に、就労支援について学ばせたい。どの研修を受けさせればよいですか？（相談員の講習とジョブコーチの研修の違いなど）", "cat": "理解促進", "st": 4, "kw": "", "body": "① 精神・発達障害者しごとサポーター養成講座 受けてほしい人：精神・発達障害のある社員と一緒に働く同僚や上司 内容と期間：障害の特性と、職場での関わり方の基本。2時間程度 実施：都道府県労働局・ハローワーク（無料。職場への出前講座もある） ② 障害者職業生活相談員資格認定講習 受けてほしい人：社内で、障害のある社員の仕事や職場生活の相談役になる人。障害者を5人以上雇用する事業所は、相談員の選任が義務（G1-053） 内容と期間：障害者雇用の制度、障害特性、相談・指導の方法など。オンデマンド講習（約2週間の受講期間内に視聴、講義の分量は2日程度）。受講料は無料 実施：JEED ③ 企業在籍型ジョブコーチ養成研修 企業在籍型ジョブコーチとは：自社の社員がジョブコーチ（職場適応援助者）の研修を受け、自社で働く障害のある社員の職場適応を、社内で専門的に支える役割。外部のジョブコーチに頼らず、日常的に支援できる 受けてほしい人：障害のある社員が多い職場の担当者や、仕事の切り出し・教え方の工夫を社内で担う人 内容と期間：集合研修4日間と、地域障害者職業センターでの実技研修4日間程度（JEEDで受講する場合、受講料は無料） 実施：JEED（障害者職業総合センター等と地域障害者職業センター）、厚生労働大臣が定める民間の研修機関 配置には助成金が使える場合がある（G1-033） 選び方のポイント 社内の担当者は、まず②の相談員講習から始め、より専門的な支援を担う人が③に進む、という順番が一般的 周りの社員の理解を広げたいときは、①を職場単位で受けてもらう ジョブコーチには、支援機関に所属して企業を訪問する「訪問型」もある。企業の社員が受けるのは「企業在籍型」（G1-048）", "id": "G8-026"}, "OV-TYPES": {"q": "障害の種類ごとの特性と配慮（全体像）", "conclusion": "障害の種類によって、特性や職場で困りやすいこと、必要な配慮は違います。まずこのページで全体像をつかみ、詳しくはそれぞれの障害のページを見てください。ただし、同じ障害でも特性や困りごとは一人ひとり違うので、最後は本人に確認しながら配慮を決めます。", "general": [["障害の種類ごとの詳しいページ", ["{{G6-099|視覚障害}}", "{{G6-028|聴覚障害}}", "{{G6-029|肢体不自由}}", "{{G6-030|内部障害}}", "{{G6-101|知的障害}}", "{{G6-100|精神障害}}（障害の程度と対応は{{G1-006|こちら}}）", "{{G1-073|発達障害}}", "{{G1-072|てんかん}}", "{{G1-074|高次脳機能障害}}", "{{G6-031|難病}}"]], ["考え方", ["障害の種類で一律に決めず、一人ひとりの特性と必要な配慮にもとづいて判断する（G6-124）", "障害の種類が違っても、困りごとが共通することも多い。「特性 → 業務で困りやすいこと → 配慮」の順に考えると、配慮を具体的に考えやすい"]]], "charts": [{"type": "table", "title": "障害の種類ごとの特性と、業務で困りやすいこと・配慮の例", "head": ["障害の種類", "主な特性", "業務で困りやすいこと", "配慮の例"], "rows": [["視覚障害", "見る力が弱い（弱視）、または見えない（全盲）", "移動、文字や画面など目で見る情報の処理", "声のかけ方や誘導の工夫、音声読み上げソフトの活用、混雑を避けた勤務時間"], ["聴覚障害", "聞こえない、または聞こえにくい", "口頭でのやり取り、会議", "手話・筆談・口話など伝え方を合わせる、音声を文字にするアプリ、議事録やメールでの指示"], ["音声・言語障害", "言葉で表現することが難しい", "話すことが中心の業務", "落ち着いて話を聞く姿勢、文字でのやり取り"], ["肢体不自由", "手足や体幹に障害がある", "移動、荷物の持ち上げや運搬", "移動や作業のしやすい場所への配置、バリアフリーな環境、時差出勤や車通勤"], ["内部障害", "心臓・腎臓などの臓器や、免疫の機能に障害がある", "体力面の不安、温度や湿度の変化、体調の悪化", "体力を考えた業務配分、温度・湿度の管理、通院や在宅勤務を考えた勤務体系"], ["知的障害", "知的な発達に遅れがある（できることには個人差が大きい）", "言葉の理解や表現、想定外のことへの対応", "作業の工程を細かく分ける、手順を写真や図で見える化する、指導や相談の担当者を決める"], ["精神障害", "うつ病、統合失調症、不安障害など。気分や体調に波がある", "疲れやすさによる勤務の不安定さ、新しいことへの不安", "定期的な面談で体調を確認、休憩の取り方や短時間勤務、通院の時間の確保、手順を決める"], ["発達障害", "ASD・ADHD・LDなど。得意と苦手の差が大きい", "やり取りのすれ違い、臨機応変な対応や同時進行、ミス", "具体的な指示、ルールや段取りの見える化、得意に合わせた業務、刺激の少ない環境"]], "note": "同じ障害でも特性や困りごとは一人ひとり違い、障害の種類が違っても困りごとが共通することも多くあります。本人に確認しながら配慮を決めます。"}], "open": true, "cat": "障害の種類ごとの特性と配慮", "st": 0, "kw": "障害種別 障害の種類 特性 一覧", "body": "視覚 聴覚 肢体不自由 内部障害 知的 精神 発達 てんかん 高次脳 難病", "id": "OV-TYPES"}}, "glossary": [{"t": "合理的配慮", "al": [], "ex": "障害のある人が、ほかの人と同じように力を発揮できるよう、職場の環境や仕事の進め方を一人ひとりに合わせて調整すること。障害者雇用促進法で会社の義務とされています。"}, {"t": "過重な負担", "al": [], "ex": "合理的配慮をするときに、会社にとって費用や手間などの負担が大きすぎること。その場合は無理に行わなくてよいとされていますが、代わりの方法を本人と一緒に考えます。"}, {"t": "法定雇用率", "al": [], "ex": "会社が雇う必要がある障害者の割合。民間企業は2026年7月から2.7％です。"}, {"t": "納付金", "al": ["障害者雇用納付金"], "ex": "従業員100人を超える会社が法定雇用率を達成できないとき、足りない1人につき月5万円を国（JEED）に納めるお金。納めても雇用の義務はなくなりません。"}, {"t": "調整金", "al": ["障害者雇用調整金"], "ex": "法定雇用率を超えて障害者を雇っている会社に、国から支給されるお金。"}, {"t": "職域開拓", "al": [], "ex": "障害のある人が担える仕事を、社内の業務の中から探したり、組み立てたりすること。"}, {"t": "切り出し", "al": ["業務の切り出し"], "ex": "今ある業務の中から、障害のある社員に任せられる作業を取り出して、1つの仕事にまとめること。"}, {"t": "定着", "al": ["職場定着"], "ex": "入社した人が職場になじみ、長く働き続けられること。"}, {"t": "ジョブコーチ", "al": ["職場適応援助者"], "ex": "職場に来て、本人には仕事の進め方を、会社には関わり方や教え方を助言してくれる専門の支援者。地域障害者職業センターなどに相談すると利用できます。"}, {"t": "地域障害者職業センター", "al": [], "ex": "各都道府県にある国（JEED）の機関。働く力の評価、ジョブコーチによる支援、会社への助言などを行います。"}, {"t": "障害者就業・生活支援センター", "al": ["なかぽつ"], "ex": "仕事と生活の両方の相談にのってくれる地域の機関。期間の区切りなく相談でき、「なかぽつ」とも呼ばれます。"}, {"t": "就労移行支援", "al": [], "ex": "障害のある人が、一般の会社で働くための訓練や就職活動の支援を受けられる福祉サービス。利用期間は原則2年までです。"}, {"t": "就労定着支援", "al": [], "ex": "就職した人が働き続けられるよう、本人との面談や会社との調整を行う福祉サービス。就職後6か月以降、最長3年利用できます。"}, {"t": "特例子会社", "al": [], "ex": "障害のある人が働きやすいよう特別に配慮した子会社。条件を満たすと、そこで雇う障害者を親会社の雇用率に含めることができます。"}, {"t": "トライアル雇用", "al": [], "ex": "ハローワークなどの紹介で、原則3か月、試しに雇ってみる制度。会社には助成金があります。"}, {"t": "産業医", "al": [], "ex": "会社で働く人の健康を、職場の立場から見る医師。働ける状態か、どんな配慮が必要かなどについて意見をもらえます。"}, {"t": "主治医", "al": [], "ex": "本人がふだん診てもらっている医師。病気や障害の状態について、いちばんよく知っています。"}, {"t": "雇止め", "al": [], "ex": "期間の決まった雇用契約を、更新せずに終えること。何度も更新している場合などは、納得できる理由が必要です。"}, {"t": "障害者手帳", "al": [], "ex": "障害があることを証明する手帳。身体障害者手帳、療育手帳（知的障害）、精神障害者保健福祉手帳の3種類があります。"}, {"t": "JEED", "al": [], "ex": "独立行政法人 高齢・障害・求職者雇用支援機構。障害者雇用の助成金や、地域障害者職業センターなどを運営しています。"}, {"t": "安全配慮義務", "al": [], "ex": "会社が、社員の命や健康を守るよう気を配る責任（労働契約法第5条）。"}, {"t": "要配慮個人情報", "al": [], "ex": "病歴や障害など、特に慎重に扱う必要がある個人情報。原則として、本人の同意なく集めたり、ほかの人に伝えたりできません。"}, {"t": "不利益な取扱い", "al": ["不利益な扱い"], "ex": "障害や、相談したことなどを理由に、解雇・降格・減給などで不利に扱うこと。法律で禁止されています。"}, {"t": "障害者職業生活相談員", "al": [], "ex": "障害者を5人以上雇う事業所で選ぶ必要がある、職場の相談役。決められた講習を受けて任命します。"}, {"t": "アビリンピック", "al": [], "ex": "障害のある人が、仕事の技能を競う大会。全国大会と地方大会があります。"}, {"t": "休職", "al": [], "ex": "病気などのため、雇用契約を続けたまま、一定の期間仕事を休むこと。期間や条件は会社の就業規則で決めます。"}, {"t": "就業規則", "al": [], "ex": "労働時間、休み、休職、懲戒など、会社で働くうえでのルールをまとめたもの。"}, {"t": "ハローワーク", "al": [], "ex": "国の職業紹介の窓口。障害のある人の採用についての専門の窓口や、会社向けの相談もあります。"}, {"t": "EAP", "al": [], "ex": "社外の専門家が、社員の悩みやメンタルヘルスの相談にのる仕組み（従業員支援プログラム）。"}, {"t": "キーパーソン", "al": [], "ex": "障害のある社員を受け入れるうえで、中心になって支える人。上司や相談役が担うことが多いです。"}, {"t": "職業評価", "al": [], "ex": "地域障害者職業センターなどで行う、働く力や向いている仕事、必要な支援を確かめる評価。"}, {"t": "ラインケア", "al": [], "ex": "上司が部下の様子の変化に気づき、話を聞いたり、必要な支援につないだりすること。"}]};

const short=t=>{t=t.replace(/[？?。]$/,'');return t.length>28?t.slice(0,28)+'…':t;};
const ref=h=>h.replace(/\{\{(G\d{1,2}-\d{3})\|([^}]+)\}\}/g,(m,id,lab)=>D.ans[id]?`<a href="#" class="rl" data-id="${id}">${lab}</a>`:lab).replace(/(G\d{1,2}-\d{3})/g,(m,id)=>D.ans[id]?`<a href="#" class="rl" data-id="${id}">関連：${esc(short(D.ans[id].q))}</a>`:'');
const hl=s=>{s=esc(s);if(!term)return s;return s.split(esc(term)).join(`<mark>${esc(term)}</mark>`);};
const plain=s=>String(s||'').replace(/（[^）]*G\d{1,2}-\d{3}[^）]*）/g,'').replace(/G\d{1,2}-\d{3}/g,'');
const fmt=n=>Number(n).toLocaleString('ja-JP');
function chartHTML(c,aid,ci){
  if(c.type==='table'&&c.check) return checkHTML(c,aid,ci);
  const tbl=rows=>`<details><summary>数値の表を見る</summary><table>${rows.map(r=>`<tr>${r.map((v,i)=>`<td>${esc(i?fmt(v):v)}</td>`).join('')}</tr>`).join('')}</table></details>`;
  if(c.type==='bars'){
    const W=640,H=200,L=44,B=24,T=18,n=c.values.length,max=c.max||Math.max(...c.values)*1.1,bw=(W-L)/n;let g='';
    for(const t of c.ticks||[]){const y=T+(H-T-B)*(1-t/max);g+=`<line class="grid" x1="${L}" x2="${W}" y1="${y}" y2="${y}"/><text class="axis" x="${L-6}" y="${y+4}" text-anchor="end">${fmt(t)}</text>`;}
    c.values.forEach((v,i)=>{const h=(H-T-B)*v/max,x=L+i*bw+bw*0.2,w=bw*0.6,y=H-B-h;
      g+=`<g><title>${esc(c.labels[i])}：${fmt(v)}${esc(c.unit||'')}</title><path class="bar" d="M${x},${H-B}V${y+4}a4,4 0 0 1 4,-4h${w-8}a4,4 0 0 1 4,4V${H-B}Z"/></g><text class="axis" x="${x+w/2}" y="${H-6}" text-anchor="middle">${esc(c.labels[i])}</text>`;
      if(i===0||i===n-1) g+=`<text class="val" x="${x+w/2}" y="${y-5}" text-anchor="middle">${fmt(v)}</text>`;});
    return `<div class="chart"><h5>${esc(c.title)}</h5><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title)}">${g}</svg>${c.note?`<div class="note">${esc(c.note)}</div>`:''}${tbl(c.labels.map((l,i)=>[l,c.values[i]]))}</div>`;}
  if(c.type==='share'){const tot=c.items.reduce((s,x)=>s+x[1],0);
    const seg=c.items.map(([l,v],i)=>`<span style="width:${v/tot*100}%;background:var(--c${i+1})" title="${esc(l)}：${Math.round(v/tot*100)}％"></span>`).join('');
    const lg=c.items.map(([l,v],i)=>`<span><i style="background:var(--c${i+1})"></i>${esc(l)} ${Math.round(v/tot*100)}％（${fmt(Math.round(v))}${esc(c.unit||'')}）</span>`).join('');
    return `<div class="chart"><h5>${esc(c.title)}</h5><div class="share">${seg}</div><div class="lg">${lg}</div>${c.note?`<div class="note">${esc(c.note)}</div>`:''}${tbl(c.items)}</div>`;}
  if(c.type==='table'){
    return `<div class="chart"><h5>${esc(c.title)}</h5>${c.xlsx?`<p class="ckhead"><a class="ckbtn xl" href="${esc(c.xlsx)}" download="${esc(c.xlsx_name||'')}">全段階まとめ版（Excel）をダウンロード</a></p>`:''}<div class="tw"><table class="full"><thead><tr>${c.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${c.rows.map(r=>`<tr>${r.map((v,i)=>i?`<td>${ref(esc(v))}</td>`:`<th scope="row">${esc(v)}</th>`).join('')}</tr>`).join('')}</tbody></table></div>${c.note?`<div class="note">${ref(esc(c.note))}</div>`:''}</div>`;}
  return '';
}
function detailHTML(a){
  const ul=l=>`<ul>${l.map(i=>`<li>${ref(esc(i))}</li>`).join('')}</ul>`;
  let h='';
  if(a.steps){
    h+=`<div class="steps"><b>${esc(a.steps_label||'今すぐやること')}</b><ol>${a.steps.map(i=>`<li>${ref(esc(i))}</li>`).join('')}</ol></div>`;
    if(a.cautions&&a.cautions.length) h+=`<h4>${esc(a.cautions_label||'注意すること')}</h4>${ul(a.cautions)}`;
    if(a.prepare&&a.prepare.length) h+=`<h4>${esc(a.prepare_label||'事前の備え')}</h4>${ul(a.prepare)}`;
  }else{
    h+=(a.general||[]).map(([t,items])=>`<h4>${esc(t)}</h4>${ul(items)}`).join('');
    if(a.phrases&&a.phrases.length) h+=`<h4>声かけの例</h4><ul class="phr">${a.phrases.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`;
  }
  h+=(a.charts||[]).map((c,ci)=>chartHTML(c,a.id,ci)).join('');
  if(a.sources&&a.sources.length) h+=`<div class="src">根拠・参考：${a.sources.map(esc).join('／')}</div>`;
  if(a.links&&a.links.length) h+=`<div class="src">リンク：${a.links.map(([n,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>`).join('／')}</div>`;
  return h;
}
function toolList(){
  const order=[];D.stages.forEach(st=>st.cats.forEach(([,ids])=>ids.forEach(i=>order.push(i))));
  const check=[],table=[];
  for(const id of order){(D.ans[id].charts||[]).forEach((c,ci)=>{if(c.type!=='table')return;(/チェック/.test(c.title)?check:table).push([id,ci,c.title.replace(/^実務の/,'')+(c.xlsx?'　［Excel付き］':'')]);});}
  const CO=['一覧','職域開拓','採用前','募集','実習','内定','入社直後'];
  const rank=s=>{const i=CO.findIndex(k=>s.includes(k));return i<0?99:i;};
  check.sort((x,y)=>rank(x[2])-rank(y[2]));
  const seen=new Set(),tb=[];
  for(const r of table.slice().sort((x,y)=>(y[0].startsWith('OV')?1:0)-(x[0].startsWith('OV')?1:0))){if(seen.has(r[2]))continue;seen.add(r[2]);tb.push(r);}
  const pos=new Map(table.map((r,i)=>[r[0]+r[1],i]));tb.sort((x,y)=>pos.get(x[0]+x[1])-pos.get(y[0]+y[1]));
  return {check,table:tb};
}

  }else if(s.v==='tools'){
    const tl=toolList();
    const li=l=>`<ul class="qlist">${l.map(([id,ci,title])=>`<li><button class="qitem" data-tool="${id}" data-ci="${ci}">${esc(title)}<small>${esc(D.ans[id].q)}</small></button></li>`).join('')}</ul>`;
    h+=`<div class="crumb"><button data-home>トップ</button><span>›</span><span>すぐ使えるツール</span></div><h2>すぐ使えるツール</h2><p class="lead">押すと、そのツールが載っている回答が開きます。</p>`;
    h+=`<div class="cat">チェックリスト（${tl.check.length}件）</div>${li(tl.check)}<div class="cat">一覧表・流れ（${tl.table.length}件）</div>${li(tl.table)}`;
  }else if(s.v==='search'){
    const t=term.toLowerCase(); const hits=[];
    for(const [id,a] of Object.entries(D.ans)){
      const inQ=(a.q).toLowerCase().includes(t), inC=(a.conclusion||'').toLowerCase().includes(t), inK=a.kw.toLowerCase().includes(t), inB=a.body.toLowerCase().includes(t);
      const sc=(inQ?4:0)+(inK?3:0)+(inC?2:0)+(inB?1:0); if(sc) hits.push([sc,id]);

    h+=`<article><p class="q">${esc(a.q)}</p>${a.conclusion?`<div class="concl"><b>結論</b>${ref(esc(a.conclusion))}</div>`:''}`;

    if(rel.length) h+=`<div class="related"><h4>同じテーマの質問</h4><ul class="qlist">${rel.map(id=>`<li><button class="qitem" data-id="${id}">${esc(D.ans[id].q)}</button></li>`).join('')}</ul></div>`;
    h+=`</article><button class="back" data-back>← 前の画面に戻る</button>`;
  }
  view.innerHTML=h; window.scrollTo(0,0); markGloss(); view.querySelectorAll('.ckbox').forEach(ckUpdate);
  if(s.v==='ans'&&s.ci!==undefined){const el=view.querySelectorAll('.detail .chart')[s.ci];if(el){el.scrollIntoView({block:'start'});el.classList.add('focus');}}

view.addEventListener('click',e=>{
  const t=e.target.closest('button,a'); if(!t) return;
  if(t.matches('.more')){const d=t.nextElementSibling;d.hidden=!d.hidden;t.setAttribute('aria-expanded',String(!d.hidden));t.textContent=d.hidden?'詳しく見る':'閉じる';return;}
  if(t.dataset.tool){go({v:'ans',id:t.dataset.tool,open:true,ci:+t.dataset.ci});return;}
  if(t.hasAttribute('data-tools')){go({v:'tools'});return;}
  if(t.dataset.id){e.preventDefault();go({v:'ans',id:t.dataset.id});return;}
  if(t.dataset.st!==undefined){go({v:'stage',i:+t.dataset.st});return;}
  if(t.hasAttribute('data-home')){qbox.value='';term='';go({v:'home'});return;}
  if(t.hasAttribute('data-back')){cur=hist.pop()||{v:'home'};render();return;}
});

const GL=(D.glossary||[]).flatMap(g=>[g.t,...g.al].map(w=>[w,g])).sort((a,b)=>b[0].length-a[0].length);
function markGloss(){
  const art=view.querySelector('article'); if(!art) return;
  const used=new Set();
  const walker=document.createTreeWalker(art,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('a,button,.g,th,h5,.q')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  for(const node of nodes){
    let txt=node.nodeValue, frag=null, last=0, out=[];
    const hits=[];
    for(const [w,g] of GL){ if(used.has(g.t)) continue; const i=txt.indexOf(w); if(i<0) continue;
      if(hits.some(h=>i<h.i+h.w.length&&h.i<i+w.length)) continue; hits.push({i,w,g}); used.add(g.t); }
    if(!hits.length) continue;
    hits.sort((a,b)=>a.i-b.i); frag=document.createDocumentFragment();
    for(const h of hits){ frag.append(txt.slice(last,h.i)); const b=document.createElement('button'); b.className='g'; b.type='button'; b.dataset.g=h.g.t; b.textContent=h.w; frag.append(b); last=h.i+h.w.length; }
    frag.append(txt.slice(last)); node.replaceWith(frag);
  }
}

}

const ckKey=(aid,ci)=>'qa-check-'+aid+'-'+ci;
function ckLoad(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}}
function ckSave(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function checkHTML(c,aid,ci){
  const k=ckKey(aid,ci), st=ckLoad(k); let h='',sec=null;
  const hs=c.head.length===3;
  if(!hs) h+=`<div class="cksec" style="display:none"><span class="ckn"></span></div><ul class="cklist">`;
  c.rows.forEach((r0,i)=>{
    const r=hs?r0:[null,r0[0],r0[1]];
    if(hs&&r[0]!==sec){ if(sec!==null) h+='</ul>'; sec=r[0]; h+=`<div class="cksec">${esc(sec)}<span class="ckn" data-sec="${esc(sec)}"></span></div><ul class="cklist">`; }
    h+=`<li><label class="ckrow${st[i]?' done':''}"><input type="checkbox" class="ck" data-k="${k}" data-i="${i}" ${st[i]?'checked':''}><span><b>${esc(r[1])}</b>${ref(esc(r[2]))}</span></label></li>`;
  });
  h+='</ul>';
  return `<div class="chart ckbox" data-k="${k}"><h5>${esc(c.title)}</h5><div class="ckhead"><div class="ckbar"><span></span></div><span class="cktot"></span>${c.xlsx?`<a class="ckbtn xl" href="${esc(c.xlsx)}" download="${esc(c.xlsx_name||'')}">Excel版をダウンロード</a>`:''}<button type="button" class="ckbtn" data-ckprint>印刷する</button><button type="button" class="ckbtn" data-ckreset>チェックを外す</button></div><p class="cknote">チェックした内容は、この端末のブラウザにだけ保存されます。会社の記録として残す場合は、Excel版（担当者・期日・メモ・記録欄つき）をお使いください。</p>${h}${c.note?`<div class="note">${ref(esc(c.note))}</div>`:''}</div>`;
}
function ckUpdate(box){
  const all=[...box.querySelectorAll('.ck')], n=all.filter(x=>x.checked).length;
  box.querySelector('.cktot').textContent=`${n} / ${all.length} 項目`;
  box.querySelector('.ckbar span').style.width=(all.length?n/all.length*100:0)+'%';
  box.querySelectorAll('.cklist').forEach(ul=>{const s=ul.previousElementSibling.querySelector('.ckn');const cs=[...ul.querySelectorAll('.ck')];s.textContent=`（${cs.filter(x=>x.checked).length}/${cs.length}）`;});
}
view.addEventListener('change',e=>{
  const x=e.target; if(!x.classList.contains('ck')) return;
  const st=ckLoad(x.dataset.k); if(x.checked) st[x.dataset.i]=1; else delete st[x.dataset.i]; ckSave(x.dataset.k,st);
  x.closest('.ckrow').classList.toggle('done',x.checked); ckUpdate(x.closest('.ckbox'));
});
view.addEventListener('click',e=>{
  const b=e.target.closest('[data-ckreset],[data-ckprint]'); if(!b) return;
  const box=b.closest('.ckbox');
  if(b.hasAttribute('data-ckprint')){ document.body.classList.add('printck'); box.classList.add('printme'); window.print(); setTimeout(()=>{document.body.classList.remove('printck');box.classList.remove('printme');},500); return; }
  ckSave(box.dataset.k,{}); box.querySelectorAll('.ck').forEach(x=>{x.checked=false;x.closest('.ckrow').classList.remove('done');}); ckUpdate(box);
});
render();
</script>
