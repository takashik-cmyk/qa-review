前提であることも伝える。"], "prepare": [], "sources": [], "q": "職場の内外でトラブルが起きた社員に、どう接すればよいですか？", "cat": "対人トラブル・ハラスメント", "st": 5, "kw": "仕事のスキルは高いですが、職場での言動やマナーで周囲を困惑させてしまうことがあります。どのように対応すればよいでしょうか？", "body": "何があったか、具体的な事実を確認して記録する 事実をもとに本人に伝える（「〇月〇日に△△があった」）。人柄や障害ではなく、行動について話す 期待される行動を具体的に示す（次に同じ場面になったら、何をどうしてほしいか） 誰から、どう伝えるかを組織で決める（上司、人事、さらに上位の人、支援機関） その後の様子を見て支え、できたことも伝える 「ちゃんとして」のような抽象的な注意は伝わりにくく、本人の納得も得にくい。 職場の外のトラブルは、業務に影響する範囲で関わる（G5-010）。 繰り返す場合は記録を重ね、就業規則に沿った対応も考える。 本人から見ると、トラブルのあとは「もう居場所がないのでは」と不安になっていることが多い。行動については具体的に伝えつつ、これからも一緒に働く前提であることも伝える。", "id": "G10-026"}, "G10-038": {"conclusion": "まず話を否定せずに聞き、相談してくれたことを受け止めます。そのうえで、いつ、どんな場面で、何を言われたかという事実を確認します。", "steps": ["話を否定せずに聞き、相談してくれたことを受け止める", "事実を確認する：いつ、どんな場面で、何を言われたか", "事実と、本人がどう受け止めたか（つらさ）を分けて整理する", "本人がどうしてほしいかを確認する（上司に伝えてほしいか、話を聞いてほしいだけか、など）", "必要に応じて、本人の同意を得て上司からも話を聞く", "上司に伝える場合は、責めるのではなく、本人の受け止め方の特性を理解したうえで伝え方を工夫してもらう"], "steps_label": "やること", "cautions": ["話をそのまま事実と決めつけず、かといって「気にしすぎ」と否定もしない。", "上司に話を聞く前に、誰から聞いたかが伝わってよいかを本人に確認する。", "相談したことで本人が不利にならないようにする。", "ハラスメントにあたる可能性がある場合は、社内のハラスメント対応の手順に沿って進める（G10-021）。"], "prepare": [], "sources": [], "q": "障害のある社員から「上司の言動がつらい」と相談を受けた場合、最初に何を確認すればよいですか？", "cat": "対人トラブル・ハラスメント", "st": 5, "kw": "", "body": "話を否定せずに聞き、相談してくれたことを受け止める 事実を確認する：いつ、どんな場面で、何を言われたか 事実と、本人がどう受け止めたか（つらさ）を分けて整理する 本人がどうしてほしいかを確認する（上司に伝えてほしいか、話を聞いてほしいだけか、など） 必要に応じて、本人の同意を得て上司からも話を聞く 上司に伝える場合は、責めるのではなく、本人の受け止め方の特性を理解したうえで伝え方を工夫してもらう 話をそのまま事実と決めつけず、かといって「気にしすぎ」と否定もしない。 上司に話を聞く前に、誰から聞いたかが伝わってよいかを本人に確認する。 相談したことで本人が不利にならないようにする。 ハラスメントにあたる可能性がある場合は、社内のハラスメント対応の手順に沿って進める（G10-021）。", "id": "G10-038"}, "G10-039": {"conclusion": "事実を確かめる前に決めつける、関係者の前で問い詰める、「気にしすぎ」と放置する、の3つは避けます。まず落ち着いて事実を確認します。", "steps": ["事実を確かめる前に、「からかった」「悪意があった」と決めつける", "本人や関係者の前で、「それはどういうことですか」と問い詰める", "「よくあることだから」「気にしすぎ」と放置する"], "steps_label": "初動でやってはいけないこと", "cautions": ["事実を確認する：誰が、いつ、どんな言葉を使ったか。報告した人、言われた人、言ったとされる人から別々に聞く（G10-021）。", "誤解や、悪意のないまま不適切な言葉を使ってしまったケースも多い。そうした場合は、言われた本人にも事実を丁寧に説明する。", "意図がなくても不適切な言動があった場合は、言葉の使い方を改めてもらう。", "障害を理由にした嫌がらせだった場合は、ハラスメントとして社内の手順に沿って対応する。", "報告した人や言われた本人が、報告したことで不利にならないよう守る。"], "cautions_label": "代わりにやること", "prepare": ["障害に関する不適切な言葉や、配慮のある言い方について、職場で学ぶ機会をつくっておく。"], "sources": [], "q": "障害を理由にしたからかいや陰口があったと報告を受けた場合、初動でやってはいけないことは何ですか？", "cat": "対人トラブル・ハラスメント", "st": 5, "kw": "", "body": "事実を確かめる前に、「からかった」「悪意があった」と決めつける 本人や関係者の前で、「それはどういうことですか」と問い詰める 「よくあることだから」「気にしすぎ」と放置する 事実を確認する：誰が、いつ、どんな言葉を使ったか。報告した人、言われた人、言ったとされる人から別々に聞く（G10-021）。 誤解や、悪意のないまま不適切な言葉を使ってしまったケースも多い。そうした場合は、言われた本人にも事実を丁寧に説明する。 意図がなくても不適切な言動があった場合は、言葉の使い方を改めてもらう。 障害を理由にした嫌がらせだった場合は、ハラスメントとして社内の手順に沿って対応する。 報告した人や言われた本人が、報告したことで不利にならないよう守る。 障害に関する不適切な言葉や、配慮のある言い方について、職場で学ぶ機会をつくっておく。", "id": "G10-039"}, "G10-041": {"conclusion": "本人の気持ちは受け止めて尊重します。ただし、安全に関わる場合やハラスメントの可能性がある場合は、会社として対応が必要になるため、その理由を本人に説明します。", "steps": ["本人の「大ごとにしないでほしい」という意向は、まず受け止めて尊重する", "安全に関わる場合や、法令違反（ハラスメントなど）の可能性がある場合は、会社として対応が必要になる", "その場合は、本人の意向は理解したうえで、会社には社員の安全を守る責任や、法律で決められた対応があることを説明し、対応を進める", "安全や法令に関わらない場合は、本人の意向を尊重しつつ、記録を残して様子を見守り、いつでも相談できることを伝える"], "steps_label": "判断の目安", "cautions": ["本人は「嫌われるのでは」「後で嫌がらせを受けるのでは」と心配していることが多い。誰から相談があったかがわからないよう配慮して進める。", "誰かを悪者にする進め方を避け、事実の確認と職場の改善に焦点を当てる。", "相談したことを理由に、本人を不利に扱わないようにする（法律でも禁止されている）。"], "prepare": [], "sources": ["労働施策総合推進法（パワハラ防止）", "労働契約法 第5条（安全配慮義務）"], "q": "相談してきた本人が「大ごとにしないでほしい」と言っている場合、会社は動かなくてよいですか？", "cat": "対人トラブル・ハラスメント", "st": 5, "kw": "", "body": "本人の「大ごとにしないでほしい」という意向は、まず受け止めて尊重する 安全に関わる場合や、法令違反（ハラスメントなど）の可能性がある場合は、会社として対応が必要になる その場合は、本人の意向は理解したうえで、会社には社員の安全を守る責任や、法律で決められた対応があることを説明し、対応を進める 安全や法令に関わらない場合は、本人の意向を尊重しつつ、記録を残して様子を見守り、いつでも相談できることを伝える 本人は「嫌われるのでは」「後で嫌がらせを受けるのでは」と心配していることが多い。誰から相談があったかがわからないよう配慮して進める。 誰かを悪者にする進め方を避け、事実の確認と職場の改善に焦点を当てる。 相談したことを理由に、本人を不利に扱わないようにする（法律でも禁止されている）。", "id": "G10-041"}, "G10-042": {"conclusion": "基本は、被害を訴えた社員から先に話を聞き、目撃者の話も集めたうえで、加害が疑われる社員から話を聞く順番にします。", "steps": ["被害を訴えた社員から先に聞く（いつ・どこで・誰に・何をされたか）", "目撃者がいれば、その人からも話を聞き、客観的な事実を集める", "そのうえで、加害が疑われる社員から話を聞く", "双方の話と事実を照らし合わせて判断する"], "steps_label": "聞き取りの順番", "cautions": ["被害を訴えた社員の話も、すべてが正しいとは限らない。事実と本人の受け止めを分けて整理する（G10-038）。", "加害が疑われる社員に対しても、最初から決めつけず、公平に話を聞く。", "聞き取りは別々に、ほかの人に内容が漏れない場所で行い、記録を残す。", "加害が疑われる社員に話を聞く前に、被害を訴えた社員から聞いたことがどこまで伝わるかを、本人と確認しておく。"], "prepare": [], "sources": ["厚生労働省「職場におけるパワーハラスメントに関して雇用管理上講ずべき措置等に関する指針」"], "q": "加害が疑われる社員への聞き取りは、被害を訴えた社員より先に行ってよいですか？", "cat": "対人トラブル・ハラスメント", "st": 5, "kw": "", "body": "被害を訴えた社員から先に聞く（いつ・どこで・誰に・何をされたか） 目撃者がいれば、その人からも話を聞き、客観的な事実を集める そのうえで、加害が疑われる社員から話を聞く 双方の話と事実を照らし合わせて判断する 被害を訴えた社員の話も、すべてが正しいとは限らない。事実と本人の受け止めを分けて整理する（G10-038）。 加害が疑われる社員に対しても、最初から決めつけず、公平に話を聞く。 聞き取りは別々に、ほかの人に内容が漏れない場所で行い、記録を残す。 加害が疑われる社員に話を聞く前に、被害を訴えた社員から聞いたことがどこまで伝わるかを、本人と確認しておく。", "id": "G10-042"}, "G10-043": {"conclusion": "日時、場所、対応した人、当事者や目撃者が話した事実をそのまま記録します。記録を見られる人は、対応に必要な人に限ります。", "steps": ["日時と場所", "誰が対応したか（記録者・聞き取りをした人）", "事実：誰が、何を言った・したか（当事者や目撃者の話をそのまま）", "経緯：トラブルに至るまでの流れと、その後の対応", "合意したこと・今後の対応（誰が、いつまでに、何をするか）"], "steps_label": "記録に残すこと", "cautions": ["記録するのは、対応した上司や人事など、初動に関わった人。聞き取りをした人が、その日のうちに残す。", "事実と、記録者の意見や推測は分けて書く。", "閲覧できる人は、対応に関わる管理職と人事などに限る。管理職全体に広げず、必要な人だけに絞る。", "障害や健康に関する情報が含まれる場合は、特に慎重に扱う（G6-045）。"], "prepare": ["記録の様式と保管場所、閲覧できる人を事前に決めておく。"], "sources": [], "q": "対人トラブルの初動対応の記録は、誰が、どの範囲まで残せばよいですか？", "cat": "対人トラブル・ハラスメント", "st": 5, "kw": "", "body": "日時と場所 誰が対応したか（記録者・聞き取りをした人） 事実：誰が、何を言った・したか（当事者や目撃者の話をそのまま） 経緯：トラブルに至るまでの流れと、その後の対応 合意したこと・今後の対応（誰が、いつまでに、何をするか） 記録するのは、対応した上司や人事など、初動に関わった人。聞き取りをした人が、その日のうちに残す。 事実と、記録者の意見や推測は分けて書く。 閲覧できる人は、対応に関わる管理職と人事などに限る。管理職全体に広げず、必要な人だけに絞る。 障害や健康に関する情報が含まれる場合は、特に慎重に扱う（G6-045）。 記録の様式と保管場所、閲覧できる人を事前に決めておく。", "id": "G10-043"}, "G10-044": {"conclusion": "本人の同意がない限り、上司にも共有しません。同意を得るときは、誰に、どこまで伝えるかを本人と一緒に決めます。", "steps": ["相談窓口に来た内容は、本人の同意がない限り、上司にも共有しない", "本人の同意が得られたら、伝える範囲を決めて上司と相談する", "相談の内容が上司に関することの場合は、特に慎重に扱う（上司への共有自体を避ける、人事など別のルートで対応する）", "本人や周囲の安全に関わる場合は例外として、本人の同意がなくても必要な範囲で共有する（G10-015）"], "steps_label": "判断の目安", "cautions": ["同意を取るときは、「誰に」「何を」「何のために」伝えるかを具体的に説明する。「上司に伝えてもいいですか」だけでは不十分。", "伝えない選択をしても、相談に乗り続けることを伝える。", "同意の内容と、共有した相手・内容は記録しておく。", "安全に関わる理由で同意なく共有した場合は、落ち着いた段階で本人に説明する。"], "prepare": ["相談窓口で相談した内容がどう扱われるか（原則として本人の同意なく共有しないこと、安全に関わる場合の例外）を、前もって社員に知らせておく。"], "sources": ["個人情報保護法 第27条第1項第2号"], "q": "相談窓口に来た内容を上司にどこまで共有してよいか、本人の同意の取り方に注意点はありますか？", "cat": "対人トラブル・ハラスメント", "st": 5, "kw": "", "body": "相談窓口に来た内容は、本人の同意がない限り、上司にも共有しない 本人の同意が得られたら、伝える範囲を決めて上司と相談する 相談の内容が上司に関することの場合は、特に慎重に扱う（上司への共有自体を避ける、人事など別のルートで対応する） 本人や周囲の安全に関わる場合は例外として、本人の同意がなくても必要な範囲で共有する（G10-015） 同意を取るときは、「誰に」「何を」「何のために」伝えるかを具体的に説明する。「上司に伝えてもいいですか」だけでは不十分。 伝えない選択をしても、相談に乗り続けることを伝える。 同意の内容と、共有した相手・内容は記録しておく。 安全に関わる理由で同意なく共有した場合は、落ち着いた段階で本人に説明する。 相談窓口で相談した内容がどう扱われるか（原則として本人の同意なく共有しないこと、安全に関わる場合の例外）を、前もって社員に知らせておく。", "id": "G10-044"}, "G10-046": {"conclusion": "社内だけでは対応しきれないとき、本人が社内では話しにくそうなとき、相談の内容が社内の相談相手に関わるときが、つなぐ目安です。", "steps": ["社内だけでは対応しきれない（専門的な知識が必要、社内に適切な相談相手がいない）", "本人が社内の人を信頼できず、社内では話しにくい様子がある", "相談の内容が上司や人事など、社内の相談相手そのものに関わっている", "本人のメンタルの不調が続いていて、専門家のサポートが必要と思われる"], "steps_label": "つなぐ目安", "cautions": ["時期で決めるのではなく、上のような状況になったときにつなぐ。", "外部の窓口を紹介するときは、「社内で対応しない」という意味ではなく、選択肢を増やすためだと伝える。", "外部の窓口を使うかどうかは本人が決める。", "命や安全に関わる場合は、外部の窓口を待たずに社内で対応する（G10-011）。"], "prepare": ["社外の相談窓口（EAP、産業医以外の相談先、公的な相談窓口など）を、前もって社員に知らせておく。", "外部の窓口で相談した内容が会社に伝わるかどうか（原則として伝わらないなど）も、あわせて伝えておく。"], "sources": [], "q": "社外の第三者相談窓口（EAPなど）につなぐタイミングの目安はありますか？", "cat": "対人トラブル・ハラスメント", "st": 5, "kw": "", "body": "社内だけでは対応しきれない（専門的な知識が必要、社内に適切な相談相手がいない） 本人が社内の人を信頼できず、社内では話しにくい様子がある 相談の内容が上司や人事など、社内の相談相手そのものに関わっている 本人のメンタルの不調が続いていて、専門家のサポートが必要と思われる 時期で決めるのではなく、上のような状況になったときにつなぐ。 外部の窓口を紹介するときは、「社内で対応しない」という意味ではなく、選択肢を増やすためだと伝える。 外部の窓口を使うかどうかは本人が決める。 命や安全に関わる場合は、外部の窓口を待たずに社内で対応する（G10-011）。 社外の相談窓口（EAP、産業医以外の相談先、公的な相談窓口など）を、前もって社員に知らせておく。 外部の窓口で相談した内容が会社に伝わるかどうか（原則として伝わらないなど）も、あわせて伝えておく。", "id": "G10-046"}, "G10-023": {"conclusion": "不満を否定せず、まず個別に話を聞きます。不満の中身を整理したうえで、配慮の意味を説明し、負担が偏っていれば業務の分担を見直します。", "steps": ["不満を否定せず、まず話を聞く（できれば個別に）", "不満の中身を整理する：配慮の理由がわからないのか、自分たちの負担が増えているのか、評価が不公平と感じているのか", "配慮の意味を説明する：配慮は特別扱いではなく、本人が成果を出すための土台をそろえるもの（G6-009）", "負担が実際に増えているなら受け止め、業務の分担や体制を見直す", "配慮が過剰になっていないかも確認する（G6-008）"], "cautions": ["本人の障害や配慮の詳しい内容は、本人の同意なく周囲に説明しない。説明するのは配慮の考え方か、本人が同意した範囲まで。", "周囲の不満を本人にそのまま伝えたり、本人を責める形にしたりしない。", "特定の人に負担が集中している場合は、その人へのケアも必要（G12）。"], "prepare": ["配慮を始めるときに、本人の同意を得て、周囲に何をどこまで伝えるかを決めておく。", "合理的配慮の考え方を、職場全体で学ぶ機会をつくっておく。"], "sources": [], "q": "「配慮ばかりで不公平だ」という周囲の社員からの不満が噴出した場合、初動でどう対応すればよいですか？", "cat": "周囲からの不満・苦情", "st": 5, "kw": "他の社員も同様の負担を抱えている中で、障害のある社員だけに配慮するのは不公平にならないか。 周囲の社員が「もう一緒に働きたくない」と訴えてきた場合、どう初動対応すべきか。 「配慮の説明が足りない」という周囲からの声が上がった場合、緊急に補うべき説明は何か。 周囲の社員への説明と本人のプライバシー保護が両立しない場合、どちらを優先すべきか。", "body": "不満を否定せず、まず話を聞く（できれば個別に） 不満の中身を整理する：配慮の理由がわからないのか、自分たちの負担が増えているのか、評価が不公平と感じているのか 配慮の意味を説明する：配慮は特別扱いではなく、本人が成果を出すための土台をそろえるもの（G6-009） 負担が実際に増えているなら受け止め、業務の分担や体制を見直す 配慮が過剰になっていないかも確認する（G6-008） 本人の障害や配慮の詳しい内容は、本人の同意なく周囲に説明しない。説明するのは配慮の考え方か、本人が同意した範囲まで。 周囲の不満を本人にそのまま伝えたり、本人を責める形にしたりしない。 特定の人に負担が集中している場合は、その人へのケアも必要（G12）。 配慮を始めるときに、本人の同意を得て、周囲に何をどこまで伝えるかを決めておく。 合理的配慮の考え方を、職場全体で学ぶ機会をつくっておく。", "id": "G10-023"}, "G10-083": {"conclusion": "できるだけ中立の立場で客観的に見られる人（上司の上の上司や人事など）が、メンバーから個別に話を聞きます。", "steps": ["ヒアリングは、できるだけ中立の立場で客観的に見られる人が行う（上長の上の上司、人事など）", "チームの直属の上司が当事者に近い場合は、上司以外の人が担当する", "報告してきた人を含め、チームのメンバーから個別に話を聞く", "何が起きているのか、事実と受け止めを分けて整理する", "特定の人に原因を押しつけず、業務の進め方や配慮の内容など、チーム全体の課題として改善策を考える"], "steps_label": "やること", "cautions": ["ヒアリングの担当者が一方の立場に近いと、話を聞いてもらえていないと感じる人が出て、空気がさらに悪化することがある。", "障害のある社員への配慮が原因として挙がる場合は、本人の情報を同意なく共有しないよう注意する（G10-023）。"], "prepare": [], "sources": [], "q": "チーム内の空気が悪化していると複数人から報告があった場合、誰がヒアリングを行えばよいですか？", "cat": "周囲からの不満・苦情", "st": 5, "kw": "", "body": "ヒアリングは、できるだけ中立の立場で客観的に見られる人が行う（上長の上の上司、人事など） チームの直属の上司が当事者に近い場合は、上司以外の人が担当する 報告してきた人を含め、チームのメンバーから個別に話を聞く 何が起きているのか、事実と受け止めを分けて整理する 特定の人に原因を押しつけず、業務の進め方や配慮の内容など、チーム全体の課題として改善策を考える ヒアリングの担当者が一方の立場に近いと、話を聞いてもらえていないと感じる人が出て、空気がさらに悪化することがある。 障害のある社員への配慮が原因として挙がる場合は、本人の情報を同意なく共有しないよう注意する（G10-023）。", "id": "G10-083"}, "G10-084": {"conclusion": "本人への支えを先に行います。話を聞いて会社として支えることを伝え、そのあとで周囲の不満に対応します。", "steps": ["本人への支えを先に行う：話を聞き、どう受け止めているかを確認し、会社として本人を支える姿勢を伝える", "本人の体調や気持ちの変化に注意し、必要なら業務の調整や支援機関との連携をする", "そのあとで周囲への対応を行う：不満の中身を聞き、配慮の考え方を説明する、業務の分担を見直すなど（G10-023）", "不満の伝わり方に問題があった場合（本人に聞こえる場所での発言など）は、言動を改めてもらう"], "steps_label": "フォローの順番", "cautions": ["本人に「誰が言ったか」を詮索させたり、周囲を責める形にしたりしない。", "周囲の不満そのものを否定せず、負担が実際にある場合は職場の課題として改善する（G6-037）。", "本人への支えは一度で終わらせず、しばらくは様子を見て声をかける。"], "prepare": [], "sources": [], "q": "周囲の社員の不満が本人の耳に入ってしまった場合、支えはどちらを先に行えばよいですか？", "cat": "周囲からの不満・苦情", "st": 5, "kw": "", "body": "本人への支えを先に行う：話を聞き、どう受け止めているかを確認し、会社として本人を支える姿勢を伝える 本人の体調や気持ちの変化に注意し、必要なら業務の調整や支援機関との連携をする そのあとで周囲への対応を行う：不満の中身を聞き、配慮の考え方を説明する、業務の分担を見直すなど（G10-023） 不満の伝わり方に問題があった場合（本人に聞こえる場所での発言など）は、言動を改めてもらう 本人に「誰が言ったか」を詮索させたり、周囲を責める形にしたりしない。 周囲の不満そのものを否定せず、負担が実際にある場合は職場の課題として改善する（G6-037）。 本人への支えは一度で終わらせず、しばらくは様子を見て声をかける。", "id": "G10-084"}, "G10-085": {"conclusion": "内容から訴えた人が特定されそうかどうかで進め方を変えます。特定されそうなときは、進める前に本人と相談します。", "steps": ["【内容から訴えた人が特定されにくい場合】誰からの訴えかは伏せたまま、周囲も含めて通常どおり事実確認を進める", "【内容から訴えた人が特定されそうな場合】進める前に本人と相談する。特定される可能性を正直に伝え、進め方を一緒に選ぶ（下の選択肢を参照）", "【安全や法令違反に関わる場合】特定される可能性を本人に説明したうえで、会社として事実確認を進める（G10-041）"], "steps_label": "パターン別の進め方", "cautions": ["特定される前提で、本人の了解を得て進める。", "聞き取りの範囲をチーム全体に広げ、全員に同じ質問をする形にして、誰の訴えかをわかりにくくする。", "定期面談や職場アンケートなど、別の機会を使って状況を確認する。", "本人が望む場合は、当面は様子を見て記録を残し、状況が変われば改めて相談する。"], "cautions_label": "特定されそうな場合の進め方の選択肢", "prepare": ["どのパターンでも、訴えた人が不利にならないよう守ることを本人に約束し、実際に守る（訴えたことを理由にした不利益な取扱いは禁止）。"], "prepare_label": "どのパターンでも", "sources": [], "q": "苦情を訴えた社員の匿名性をどこまで守りながら事実確認を進めればよいですか？", "cat": "周囲からの不満・苦情", "st": 5, "kw": "", "body": "【内容から訴えた人が特定されにくい場合】誰からの訴えかは伏せたまま、周囲も含めて通常どおり事実確認を進める 【内容から訴えた人が特定されそうな場合】進める前に本人と相談する。特定される可能性を正直に伝え、進め方を一緒に選ぶ（下の選択肢を参照） 【安全や法令違反に関わる場合】特定される可能性を本人に説明したうえで、会社として事実確認を進める（G10-041） 特定される前提で、本人の了解を得て進める。 聞き取りの範囲をチーム全体に広げ、全員に同じ質問をする形にして、誰の訴えかをわかりにくくする。 定期面談や職場アンケートなど、別の機会を使って状況を確認する。 本人が望む場合は、当面は様子を見て記録を残し、状況が変われば改めて相談する。 どのパターンでも、訴えた人が不利にならないよう守ることを本人に約束し、実際に守る（訴えたことを理由にした不利益な取扱いは禁止）。", "id": "G10-085"}, "G10-087": {"conclusion": "「長引きそうだ」と感じた段階で、解決を待たずに早めに報告します。経緯、分かっている事実、今後の方針をまとめて伝えます。", "steps": ["「長引きそうだ」と感じた段階で、できるだけ早く報告する（解決してからではなく、途中の段階で）", "報告の目安：一度の話し合いでは収まらない、当事者が複数部署にまたがる、体調を崩す人が出ている、ハラスメントや法令違反の可能性がある、など", "報告する内容：これまでの経緯、事実として確認できていること、今後の対応方針と、判断や支援を仰ぎたい点", "その後も、節目ごとに経過を報告する"], "steps_label": "報告のタイミング", "cautions": ["早めに報告すると、担当者が一人で抱え込まずに済み、組織として判断できる。", "報告する内容は、対応に必要な範囲にとどめ、障害や健康に関する情報は慎重に扱う（G10-043）。"], "prepare": ["どんな場合に、誰に、どう報告するか（上の立場の人への報告・相談のルート）を事前に決めておく（G12-003）。"], "sources": [], "q": "苦情対応が長引きそうな場合、上位管理職への報告はどのタイミングで行えばよいですか？", "cat": "周囲からの不満・苦情", "st": 5, "kw": "", "body": "「長引きそうだ」と感じた段階で、できるだけ早く報告する（解決してからではなく、途中の段階で） 報告の目安：一度の話し合いでは収まらない、当事者が複数部署にまたがる、体調を崩す人が出ている、ハラスメントや法令違反の可能性がある、など 報告する内容：これまでの経緯、事実として確認できていること、今後の対応方針と、判断や支援を仰ぎたい点 その後も、節目ごとに経過を報告する 早めに報告すると、担当者が一人で抱え込まずに済み、組織として判断できる。 報告する内容は、対応に必要な範囲にとどめ、障害や健康に関する情報は慎重に扱う（G10-043）。 どんな場合に、誰に、どう報告するか（上の立場の人への報告・相談のルート）を事前に決めておく（G12-003）。", "id": "G10-087"}, "G10-089": {"conclusion": "確認できた事実と、苦情の内容のどこが違っていたかを整理し、双方に丁寧に説明します。誤解が解けたあとも、関係が戻るまで様子を見守ります。", "steps": ["確認できた事実と、苦情の内容のどこが食い違っていたかを、客観的に整理する", "苦情を訴えた人に、事実を丁寧に説明する。人によって見える視点や受け止め方が違うことを前提に、責めずに伝える", "苦情の対象になった人にも、事実確認の結果を伝え、誤解だったことをはっきりさせる", "必要に応じて、双方が話す場を設けるなど、関係修復の機会をつくる", "誤解が生まれた背景（情報共有の不足、配慮の説明不足など）があれば、職場の仕組みとして改善する"], "steps_label": "やること", "cautions": ["苦情を訴えた人を「間違っていた」と責めると、次から相談しにくくなる。訴えたこと自体は受け止める。", "苦情の対象になった人は、疑われたことで傷ついていることがある。その気持ちにも配慮する。", "関係修復は一度の話し合いで終わらせず、しばらく様子を見る。"], "prepare": [], "sources": [], "q": "苦情の内容が事実誤認に基づいていた場合、どう訂正し関係修復を図ればよいですか？", "cat": "周囲からの不満・苦情", "st": 5, "kw": "", "body": "確認できた事実と、苦情の内容のどこが食い違っていたかを、客観的に整理する 苦情を訴えた人に、事実を丁寧に説明する。人によって見える視点や受け止め方が違うことを前提に、責めずに伝える 苦情の対象になった人にも、事実確認の結果を伝え、誤解だったことをはっきりさせる 必要に応じて、双方が話す場を設けるなど、関係修復の機会をつくる 誤解が生まれた背景（情報共有の不足、配慮の説明不足など）があれば、職場の仕組みとして改善する 苦情を訴えた人を「間違っていた」と責めると、次から相談しにくくなる。訴えたこと自体は受け止める。 苦情の対象になった人は、疑われたことで傷ついていることがある。その気持ちにも配慮する。 関係修復は一度の話し合いで終わらせず、しばらく様子を見る。", "id": "G10-089"}, "G10-022": {"conclusion": "まず何がどうおかしいのかを具体的に聞きます。命や安全に関わる内容なら、すぐに本人の所在と安全を確認し、支援機関と協力して対応します。", "steps": ["焦らず、何がどうおかしいのかを具体的に聞く（いつから、どんな様子か、本人は何と言っているか）", "命や安全に関わる内容なら、すぐに本人の所在と安全を確認する（G10-011）", "職場での本人の様子を確認する（勤怠、表情、業務の状況）", "会社と支援機関のどちらが、どんな役割で本人に連絡するかを決める", "必要に応じて面談を設け、本人の状況を聞き取る"], "cautions": ["支援機関が知っている情報と、職場での様子が一致するとは限らない。両方を突き合わせて判断する。", "支援機関とのやり取りの範囲は、本人の同意を得た範囲が原則。命に関わる場合は例外（G10-015）。", "本人に連絡するときは、「支援機関から聞いた」と伝えてよいかを支援機関と確認しておく。"], "prepare": ["平常時に支援機関と、連絡の窓口、連絡してよい内容、緊急時の役割分担を決めておく。"], "sources": [], "q": "就労支援機関の担当者から「本人の様子がおかしい」と連絡があった場合、初動はどう動けばよいですか？", "cat": "支援機関・家族との連携", "st": 5, "kw": "", "body": "焦らず、何がどうおかしいのかを具体的に聞く（いつから、どんな様子か、本人は何と言っているか） 命や安全に関わる内容なら、すぐに本人の所在と安全を確認する（G10-011） 職場での本人の様子を確認する（勤怠、表情、業務の状況） 会社と支援機関のどちらが、どんな役割で本人に連絡するかを決める 必要に応じて面談を設け、本人の状況を聞き取る 支援機関が知っている情報と、職場での様子が一致するとは限らない。両方を突き合わせて判断する。 支援機関とのやり取りの範囲は、本人の同意を得た範囲が原則。命に関わる場合は例外（G10-015）。 本人に連絡するときは、「支援機関から聞いた」と伝えてよいかを支援機関と確認しておく。 平常時に支援機関と、連絡の窓口、連絡してよい内容、緊急時の役割分担を決めておく。", "id": "G10-022"}, "G10-056": {"conclusion": "受け付けてかまいません。本人が話せない状態のこともあります。休む見込みなどを簡単に確認し、落ち着いてから本人とも連絡を取ります。", "steps": ["家族からの連絡を受理してよい。本人が話せない状態のこともある", "受けるときは、本人の状態（体調不良か、通院か、話せる状態か）と、休む見込みの期間を簡単に確認する", "落ち着いてから、本人とも連絡を取って状況を確認する（本人が対応できる場合）", "休みが続く、本人と連絡が取れないなどの場合は、上司・人事で対応を相談する（G10-028）"], "steps_label": "やること", "cautions": ["家族から状態を聞くときは、必要な範囲にとどめ、病状などを細かく聞き出さない。", "家族からの連絡が頻繁に続く場合は、本人の状態を確認し、支援機関とも連携する。"], "prepare": ["本人の同意を得て、本人が連絡できないときに家族が代わりに連絡してよいか、どの家族が連絡するかを事前に決めておく（G10-008）。", "欠勤連絡のルール（誰に、何時までに、どの手段で）に、家族からの連絡の扱いも含めておく。"], "sources": [], "q": "家族から「今日は休ませてほしい」と急な連絡があった場合、本人からの連絡でなくても受理してよいですか？", "cat": "支援機関・家族との連携", "st": 5, "kw": "", "body": "家族からの連絡を受理してよい。本人が話せない状態のこともある 受けるときは、本人の状態（体調不良か、通院か、話せる状態か）と、休む見込みの期間を簡単に確認する 落ち着いてから、本人とも連絡を取って状況を確認する（本人が対応できる場合） 休みが続く、本人と連絡が取れないなどの場合は、上司・人事で対応を相談する（G10-028） 家族から状態を聞くときは、必要な範囲にとどめ、病状などを細かく聞き出さない。 家族からの連絡が頻繁に続く場合は、本人の状態を確認し、支援機関とも連携する。 本人の同意を得て、本人が連絡できないときに家族が代わりに連絡してよいか、どの家族が連絡するかを事前に決めておく（G10-008）。 欠勤連絡のルール（誰に、何時までに、どの手段で）に、家族からの連絡の扱いも含めておく。", "id": "G10-056"}, "G10-058": {"conclusion": "客観的に話を聞ける上司や人事が窓口になり、別室で、できれば2人で対応します。まず話を聞いて受け止め、その場では約束をしないようにします。", "steps": ["対応の窓口は、客観的に話を聞ける上司や人事が担う", "別室に案内し、できれば2人で対応する", "最初からシャットアウトせず、まず話を聞く（「お話は承りました」と受け止める）", "その場で結論を出そうとせず、「社内で確認して改めてご連絡します」と一呼吸おく", "聞いた内容を記録し、後日、本人の意思を確認したうえで対応を決める"], "cautions": ["「家族は連絡してこないでください」と最初から突き放すと、話がこじれやすい。", "本人の同意なく、本人の勤務状況や障害・健康に関する情報を家族に話さない。", "家族と本人の意向が違うこともある。最終的には本人と話し合って決める（G6-019）。", "大声や威圧、長時間の居座りなど、業務に支障が出る言動が続く場合は、社内のカスタマーハラスメント対策の手順も参考に、対応を打ち切る判断や警察への相談も考える。"], "prepare": ["家族から抗議や相談があったときの窓口と対応手順を、事前に決めておく。"], "sources": [], "q": "保護者が職場に直接乗り込んで抗議してきた場合、対応窓口は誰にすればよいですか？", "cat": "支援機関・家族との連携", "st": 5, "kw": "", "body": "対応の窓口は、客観的に話を聞ける上司や人事が担う 別室に案内し、できれば2人で対応する 最初からシャットアウトせず、まず話を聞く（「お話は承りました」と受け止める） その場で結論を出そうとせず、「社内で確認して改めてご連絡します」と一呼吸おく 聞いた内容を記録し、後日、本人の意思を確認したうえで対応を決める 「家族は連絡してこないでください」と最初から突き放すと、話がこじれやすい。 本人の同意なく、本人の勤務状況や障害・健康に関する情報を家族に話さない。 家族と本人の意向が違うこともある。最終的には本人と話し合って決める（G6-019）。 大声や威圧、長時間の居座りなど、業務に支障が出る言動が続く場合は、社内のカスタマーハラスメント対策の手順も参考に、対応を打ち切る判断や警察への相談も考える。 家族から抗議や相談があったときの窓口と対応手順を、事前に決めておく。", "id": "G10-058"}, "G10-059": {"conclusion": "家族からの情報はまず受け止めますが、それだけで配慮を変えたり共有したりはしません。本人と改めて話し、本人の考えを確認してから決めます。", "steps": ["家族からの情報（障害特性や、配慮してほしいこと）は、まず受け止めて聞く", "その情報だけを材料に、配慮の内容を変えたり現場に共有したりしない", "本人と改めて話し、家族からの情報について本人の考えや希望を確認する", "本人の同意を得て、業務上必要な範囲だけを現場に共有する（G6-044・G6-045）", "配慮の内容を変える場合は、本人と合意し、記録を更新する（G6-012）"], "steps_label": "やること", "cautions": ["合理的配慮は、本人の申し出と意向の確認が基本。厚生労働省の指針では、本人の意向の確認が難しい場合に、就労支援機関の職員などに補佐を求めてもよいとされている。", "家族からの情報は、本人の意向を確認するための大切な参考情報として扱い、最終的には本人と確認して決める。", "障害や健康に関する情報は特に慎重な扱いが必要なため、本人の同意なく現場に伝えない。"], "prepare": ["家族とどこまで関わるか、家族から情報があったときの扱いを、会社の方針として決めておく（G6-019）。"], "sources": ["厚生労働省「合理的配慮指針」"], "q": "家族から本人の障害特性について新たな情報提供があった場合、現場にどう共有すればよいですか？", "cat": "支援機関・家族との連携", "st": 5, "kw": "", "body": "家族からの情報（障害特性や、配慮してほしいこと）は、まず受け止めて聞く その情報だけを材料に、配慮の内容を変えたり現場に共有したりしない 本人と改めて話し、家族からの情報について本人の考えや希望を確認する 本人の同意を得て、業務上必要な範囲だけを現場に共有する（G6-044・G6-045） 配慮の内容を変える場合は、本人と合意し、記録を更新する（G6-012） 合理的配慮は、本人の申し出と意向の確認が基本。厚生労働省の指針では、本人の意向の確認が難しい場合に、就労支援機関の職員などに補佐を求めてもよいとされている。 家族からの情報は、本人の意向を確認するための大切な参考情報として扱い、最終的には本人と確認して決める。 障害や健康に関する情報は特に慎重な扱いが必要なため、本人の同意なく現場に伝えない。 家族とどこまで関わるか、家族から情報があったときの扱いを、会社の方針として決めておく（G6-019）。", "id": "G10-059"}, "G10-060": {"conclusion": "本人の同意を得て、今も相談できる機関を確認します。連絡が途絶えていれば、新しい相談先を探し、配慮の内容をまとめた書面も引き継ぎます。", "steps": ["今の連絡先を確認する：本人の同意を得て、もともと支援を受けていた機関に連絡し、今も相談に乗ってもらえるか、担当者は誰かを確認する", "連絡が途絶えている場合は、新しい相談先を探す：障害者就業・生活支援センター（働くことから生活面まで相談できる）や地域障害者職業センターなどは、新たに相談に乗ってくれることがある", "担当者が交代したら、配慮の内容を引き継ぐ：本人の同意を得て、配慮の内容をまとめた書面などを新しい担当者と共有する", "緊急連絡ルートを更新する：連絡先の一覧（支援機関、担当者名、電話番号、連絡できる時間帯）を新しくし、社内の関係者に伝える"], "steps_label": "やること", "cautions": ["緊急時に初めて連絡先を探すのでは遅い。前もって確認しておく。", "支援機関との連絡や情報共有は、本人の同意を得て行う。", "連絡先の一覧は、年に1回など時期を決めて見直す。本人の状況や支援機関の担当者が変わったときも見直す。", "支援機関に頼れない場合でも、緊急時は救急や警察、緊急連絡先（家族など）に連絡する（G10-029）。"], "prepare": [], "q": "支援機関との連絡が途絶えている場合や、担当者が交代した場合、緊急時の連絡先をどう確認・更新しておけばよいですか？", "cat": "支援機関・家族との連携", "st": 5, "kw": "支援機関の担当者交代時に、配慮内容の情報共有はどう行うべきか。 支援機関担当者の異動・交代があった際、緊急連絡ルートの更新をどう管理すべきか。 過去に支援機関を利用している障がい者を雇用しました。始めは定期的に支援機関の方が来て相談することができましたが、いつの間にか来なくなってしまいました。何故でしょうか。", "body": "今の連絡先を確認する：本人の同意を得て、もともと支援を受けていた機関に連絡し、今も相談に乗ってもらえるか、担当者は誰かを確認する 連絡が途絶えている場合は、新しい相談先を探す：障害者就業・生活支援センター（働くことから生活面まで相談できる）や地域障害者職業センターなどは、新たに相談に乗ってくれることがある 担当者が交代したら、配慮の内容を引き継ぐ：本人の同意を得て、配慮の内容をまとめた書面などを新しい担当者と共有する 緊急連絡ルートを更新する：連絡先の一覧（支援機関、担当者名、電話番号、連絡できる時間帯）を新しくし、社内の関係者に伝える 緊急時に初めて連絡先を探すのでは遅い。前もって確認しておく。 支援機関との連絡や情報共有は、本人の同意を得て行う。 連絡先の一覧は、年に1回など時期を決めて見直す。本人の状況や支援機関の担当者が変わったときも見直す。 支援機関に頼れない場合でも、緊急時は救急や警察、緊急連絡先（家族など）に連絡する（G10-029）。", "id": "G10-060"}, "G10-063": {"conclusion": "まず途中で反論せずに話を聞き、何が不十分だと感じているかを具体的に確認します。その場では回答せず、社内で確認してから改めて連絡します。", "steps": ["まず話を聞く。途中で反論したり、言い訳をしたりしない", "何が不十分だと感じているのか、具体的な出来事を確認する", "その場では回答せず、聞いた内容を記録して「社内で確認して改めてご連絡します」と伝える", "社内で事実を確認し、本人の意向も確かめたうえで、後日回答する"], "cautions": ["本人の同意なく、本人の勤務状況や障害・健康に関する情報を家族に話さない。", "家族と本人の意向が違うこともあるため、対応は本人と話し合って決める（G6-019）。", "家族が合理的配慮を「本人の希望をすべてかなえること」と捉えているなど、考え方にずれがあることもある。その場では感情が高ぶっていて難しいため、後日回答するときに、合理的配慮の考え方（業務上の支障を取り除くための調整で、本人と話し合って決めるもの）もあわせて伝える（G6-001・G6-058）。", "威圧的な言動や長時間の要求が続く場合の対応は、G10-058と同じ考え方で進める。"], "prepare": [], "sources": [], "q": "家族から「会社の対応が不十分だ」とクレームが入った場合、初動の窓口対応で気をつけることは何ですか？", "cat": "支援機関・家族との連携", "st": 5, "kw": "", "body": "まず話を聞く。途中で反論したり、言い訳をしたりしない 何が不十分だと感じているのか、具体的な出来事を確認する その場では回答せず、聞いた内容を記録して「社内で確認して改めてご連絡します」と伝える 社内で事実を確認し、本人の意向も確かめたうえで、後日回答する 本人の同意なく、本人の勤務状況や障害・健康に関する情報を家族に話さない。 家族と本人の意向が違うこともあるため、対応は本人と話し合って決める（G6-019）。 家族が合理的配慮を「本人の希望をすべてかなえること」と捉えているなど、考え方にずれがあることもある。その場では感情が高ぶっていて難しいため、後日回答するときに、合理的配慮の考え方（業務上の支障を取り除くための調整で、本人と話し合って決めるもの）もあわせて伝える（G6-001・G6-058）。 威圧的な言動や長時間の要求が続く場合の対応は、G10-058と同じ考え方で進める。", "id": "G10-063"}, "G10-028": {"conclusion": "欠勤に気づいたら、その日のうちに会社から電話で連絡します。安否が心配な場合は、すぐに安否確認を優先します。", "steps": ["欠勤に気づいたら、その日のうちに会社から連絡する", "連絡の方法は電話を基本にする。声のトーンや話し方から状態がわかり、詳しい事情も聞きやすい", "一人暮らしなどで安否が心配な場合は、安否確認を目的に、すぐに電話する", "つながらなければ、チャットやメールでも「心配しています。連絡をください」と送り、時間をおいて再度電話する", "欠勤が続く場合は、毎日何度も連絡するのではなく、決めたルールに沿って間隔をあけて連絡する"], "cautions": ["連絡の頻度の目安（一例）：1日目は午前と夕方に1回ずつ、2日目以降は1日1回。状況に応じて調整する。", "責める口調ではなく、心配していることを伝える。", "応答がない状態が続く場合は、G10-029（自宅訪問や緊急連絡先への連絡）へ。"], "prepare": ["欠勤時に会社から連絡する方法（電話・チャット・メール）と頻度、誰が連絡するかを、事前にルールとして決めておく。", "本人の同意を得て、緊急連絡先を知っておく（G10-008）。"], "sources": [], "q": "連絡なく欠勤が続いている社員に、会社からどのタイミング・頻度で連絡すればよいですか？", "cat": "無断欠勤・連絡途絶", "st": 5, "kw": "", "body": "欠勤に気づいたら、その日のうちに会社から連絡する 連絡の方法は電話を基本にする。声のトーンや話し方から状態がわかり、詳しい事情も聞きやすい 一人暮らしなどで安否が心配な場合は、安否確認を目的に、すぐに電話する つながらなければ、チャットやメールでも「心配しています。連絡をください」と送り、時間をおいて再度電話する 欠勤が続く場合は、毎日何度も連絡するのではなく、決めたルールに沿って間隔をあけて連絡する 連絡の頻度の目安（一例）：1日目は午前と夕方に1回ずつ、2日目以降は1日1回。状況に応じて調整する。 責める口調ではなく、心配していることを伝える。 応答がない状態が続く場合は、G10-029（自宅訪問や緊急連絡先への連絡）へ。 欠勤時に会社から連絡する方法（電話・チャット・メール）と頻度、誰が連絡するかを、事前にルールとして決めておく。 本人の同意を得て、緊急連絡先を知っておく（G10-008）。", "id": "G10-028"}, "G10-029": {"conclusion": "まず支援機関や緊急連絡先（家族など）に連絡します。それでも安否が分からなければ、複数人で自宅を訪問し、必要なら警察にも相談します。", "steps": ["支援機関がついていれば、まず支援機関に連絡する（本人の様子を知っていることがある）", "緊急連絡先（家族など）がわかっていれば連絡する", "それでも安否がわからない場合は、自宅を訪問する。一人ではなく複数人で、できれば支援機関の担当者と一緒に行く", "訪問しても応答がなく、命に関わる心配がある場合は、警察に相談する（安否確認の依頼）"], "steps_label": "連絡する順番", "cautions": ["タイミングの目安：一人暮らし、体調不良やメンタル不調の情報がある、自傷をほのめかしていたなど、安否が心配な場合は当日中に動く。そうでない場合も、応答のない状態が続いたら（一例として1〜2日）、次の段階に進む。", "緊急連絡先の家族とも連絡がつかない場合は、支援機関への相談、複数人での自宅訪問、警察への相談の順に進める。", "自宅を訪問しても、無理に室内に入らない。異変がありそうな場合は警察に任せる。", "対応の経過（いつ、誰に、どう連絡したか）を記録しておく。"], "prepare": ["本人の同意を得て、緊急連絡先と支援機関の連絡先をつかみ、連絡がつかないときの対応手順を決めておく（G10-008）。"], "sources": [], "q": "電話にもメールにも応答がない場合、自宅訪問や緊急連絡先への連絡はどの段階で行えばよいですか？", "cat": "無断欠勤・連絡途絶", "st": 5, "kw": "本人の携帯が不通で、緊急連絡先の家族とも連絡がつかない場合、次にとるべき手段は何か。", "body": "支援機関がついていれば、まず支援機関に連絡する（本人の様子を知っていることがある） 緊急連絡先（家族など）がわかっていれば連絡する それでも安否がわからない場合は、自宅を訪問する。一人ではなく複数人で、できれば支援機関の担当者と一緒に行く 訪問しても応答がなく、命に関わる心配がある場合は、警察に相談する（安否確認の依頼） タイミングの目安：一人暮らし、体調不良やメンタル不調の情報がある、自傷をほのめかしていたなど、安否が心配な場合は当日中に動く。そうでない場合も、応答のない状態が続いたら（一例として1〜2日）、次の段階に進む。 緊急連絡先の家族とも連絡がつかない場合は、支援機関への相談、複数人での自宅訪問、警察への相談の順に進める。 自宅を訪問しても、無理に室内に入らない。異変がありそうな場合は警察に任せる。 対応の経過（いつ、誰に、どう連絡したか）を記録しておく。 本人の同意を得て、緊急連絡先と支援機関の連絡先をつかみ、連絡がつかないときの対応手順を決めておく（G10-008）。", "id": "G10-029"}, "G10-030": {"conclusion": "初動は分けません。理由を判断する前に、まず体調と安否を確認し、安全を優先します。理由は、安全が確認できて落ち着いてから聞きます。", "steps": ["初動は分けない。理由がどちらかを判断する前に、まず体調と安否を確認し、安全を優先する（G10-028・G10-029）", "本人と連絡が取れて安全が確認できたら、落ち着いたタイミングで欠勤の理由を聞く", "体調の悪化が背景にあれば、受診や業務の調整、休職の検討などにつなげる（G11-001）", "体調以外の理由（生活リズムの乱れ、職場の人間関係、仕事への不安など）があれば、その背景に応じて対応する", "連絡のルールを守れなかったことについては、理由を聞いたうえで、ルールを改めて確認する"], "steps_label": "やること", "cautions": ["「サボりだろう」と最初から決めつけない。サボりに見えても、背景に体調の悪化や職場の悩みがあることが多い。", "無断欠勤が繰り返される場合は、記録を重ね、就業規則に沿った対応も考える（G10-033）。"], "prepare": [], "sources": [], "q": "無断欠勤の背景に体調悪化がある場合とサボりがある場合、初動の対応を分けたほうがよいですか？", "cat": "無断欠勤・連絡途絶", "st": 5, "kw": "", "body": "初動は分けない。理由がどちらかを判断する前に、まず体調と安否を確認し、安全を優先する（G10-028・G10-029） 本人と連絡が取れて安全が確認できたら、落ち着いたタイミングで欠勤の理由を聞く 体調の悪化が背景にあれば、受診や業務の調整、休職の検討などにつなげる（G11-001） 体調以外の理由（生活リズムの乱れ、職場の人間関係、仕事への不安など）があれば、その背景に応じて対応する 連絡のルールを守れなかったことについては、理由を聞いたうえで、ルールを改めて確認する 「サボりだろう」と最初から決めつけない。サボりに見えても、背景に体調の悪化や職場の悩みがあることが多い。 無断欠勤が繰り返される場合は、記録を重ね、就業規則に沿った対応も考える（G10-033）。", "id": "G10-030"}, "G10-031": {"conclusion": "本人への連絡を基本にしながら、支援機関にも同時に状況を伝えておきます。支援機関が本人の事情を知っていることもあります。", "steps": ["本人への連絡を基本にしつつ、支援機関にも同時に状況を伝えておく", "支援機関が本人の様子や事情を知っていることもあるので、情報を共有してもらう", "本人と連絡が取れたら、支援機関にもその旨を伝える", "本人と連絡が取れない場合は、支援機関と役割を分けて対応する（どちらが本人や家族に連絡するか、訪問するか）（G10-029）"], "steps_label": "やること", "cautions": ["支援機関に伝える内容は、事前に本人の同意を得た範囲にとどめる。", "会社と支援機関の両方から同時に何度も連絡すると、本人の負担になることがある。どちらが連絡するかを決めて調整する。"], "prepare": ["本人の同意を得て、無断欠勤や連絡が取れないときに、会社と支援機関のどちらが、どう連絡するかを事前に決めておく。"], "sources": [], "q": "支援機関（就労支援員など）が付いている場合、無断欠勤のときは、本人と支援機関のどちらに先に連絡すればよいですか？", "cat": "無断欠勤・連絡途絶", "st": 5, "kw": "", "body": "本人への連絡を基本にしつつ、支援機関にも同時に状況を伝えておく 支援機関が本人の様子や事情を知っていることもあるので、情報を共有してもらう 本人と連絡が取れたら、支援機関にもその旨を伝える 本人と連絡が取れない場合は、支援機関と役割を分けて対応する（どちらが本人や家族に連絡するか、訪問するか）（G10-029） 支援機関に伝える内容は、事前に本人の同意を得た範囲にとどめる。 会社と支援機関の両方から同時に何度も連絡すると、本人の負担になることがある。どちらが連絡するかを決めて調整する。 本人の同意を得て、無断欠勤や連絡が取れないときに、会社と支援機関のどちらが、どう連絡するかを事前に決めておく。", "id": "G10-031"}, "G10-032": {"conclusion": "今の体調と欠勤の理由、次に休むときの連絡ルールを確認します。無断欠勤が困る理由は、責めるのではなく「心配した」という安全の面から伝えます。", "steps": ["体調と欠勤の理由：今の体調、なぜ連絡ができなかったのか、受診の必要はないか", "無断欠勤がなぜ困るのかの説明：まず本人の安全の面から（「何かあったのではと心配した」）、次に職場への影響（業務が止まる、周りが心配する）を伝える", "次に欠勤するときの連絡ルール：誰に、何時までに、どの手段で連絡するか。本人が連絡できないときは誰が代わりに連絡するか", "復帰の仕方：すぐに通常どおり働けるか、業務量の調整や短時間勤務が必要か"], "steps_label": "復帰前に確認すること", "cautions": ["説明は責める口調ではなく、本人を心配していたことが伝わるようにする。", "連絡できなかった背景（体調、職場の悩み、生活の問題など）があれば、その対応もあわせて考える（G10-030）。", "支援機関がついていれば、本人の同意を得て、確認した内容と今後のルールを共有する（G10-031）。", "決めたルールは書面に残し、本人にも渡す。", "本人から見ると、連絡できなかったことを責められるのが怖くて、さらに連絡しづらくなっていることがある。まず「連絡が取れてよかった」と伝える。"], "prepare": [], "sources": [], "q": "無断欠勤が数日続いた後、本人と連絡が取れた。復帰前に確認しておくことは何ですか？", "cat": "無断欠勤・連絡途絶", "st": 5, "kw": "", "body": "体調と欠勤の理由：今の体調、なぜ連絡ができなかったのか、受診の必要はないか 無断欠勤がなぜ困るのかの説明：まず本人の安全の面から（「何かあったのではと心配した」）、次に職場への影響（業務が止まる、周りが心配する）を伝える 次に欠勤するときの連絡ルール：誰に、何時までに、どの手段で連絡するか。本人が連絡できないときは誰が代わりに連絡するか 復帰の仕方：すぐに通常どおり働けるか、業務量の調整や短時間勤務が必要か 説明は責める口調ではなく、本人を心配していたことが伝わるようにする。 連絡できなかった背景（体調、職場の悩み、生活の問題など）があれば、その対応もあわせて考える（G10-030）。 支援機関がついていれば、本人の同意を得て、確認した内容と今後のルールを共有する（G10-031）。 決めたルールは書面に残し、本人にも渡す。 本人から見ると、連絡できなかったことを責められるのが怖くて、さらに連絡しづらくなっていることがある。まず「連絡が取れてよかった」と伝える。", "id": "G10-032"}, "G10-033": {"conclusion": "欠勤の理由が体調や障害と関係していたか、会社側の配慮や連絡ルールが伝わっていたか、就業規則に当てはまるかを、順に確認します。", "steps": ["欠勤の理由：体調や障害と関係があったか。「連絡できない状態だった」のか「連絡しなかった」のかを分けて確認する（必要なら主治医・産業医の意見も聞く）", "会社側の対応：合理的配慮や欠勤時の連絡ルールが決まっていたか、本人に伝わっていたか", "就業規則：懲戒の理由と種類が書かれているか、今回の行為が当てはまるか", "処分の重さ：ほかの社員の同じようなケースと比べて重すぎないか", "本人の言い分：処分を決める前に、本人から事情を聞く機会をつくる"], "steps_label": "懲戒を考える前に確認すること", "cautions": ["無断欠勤がよくないことは、障害の有無に関係なく同じ。理由があっても、連絡がなかったことは本人に伝える。", "ただし、体調や障害のために連絡できなかった部分は分けて考える。そこを無断欠勤として処分すると、無効と判断されたり、障害を理由とした差別とみなされたりするおそれがある。", "いきなり処分ではなく、まず受診、休職、連絡ルールの見直しなど、改善のための対応を考える（G10-032）。", "経緯（連絡の記録、話し合った内容、本人の説明）は、日付つきで残す。"], "cautions_label": "考え方", "prepare": [], "sources": ["労働契約法15条（懲戒権の濫用）", "障害者雇用促進法35条・36条の2（差別禁止・合理的配慮）", "最高裁判所平成24年4月27日判決：精神的な不調による欠勤を、受診や休職の検討をせずに無断欠勤として処分したことを無効とした"], "q": "無断欠勤を理由に懲戒的な扱いを考える前に、確認しておく手続きは何ですか？", "cat": "無断欠勤・連絡途絶", "st": 5, "kw": "", "body": "欠勤の理由：体調や障害と関係があったか。「連絡できない状態だった」のか「連絡しなかった」のかを分けて確認する（必要なら主治医・産業医の意見も聞く） 会社側の対応：合理的配慮や欠勤時の連絡ルールが決まっていたか、本人に伝わっていたか 就業規則：懲戒の理由と種類が書かれているか、今回の行為が当てはまるか 処分の重さ：ほかの社員の同じようなケースと比べて重すぎないか 本人の言い分：処分を決める前に、本人から事情を聞く機会をつくる 無断欠勤がよくないことは、障害の有無に関係なく同じ。理由があっても、連絡がなかったことは本人に伝える。 ただし、体調や障害のために連絡できなかった部分は分けて考える。そこを無断欠勤として処分すると、無効と判断されたり、障害を理由とした差別とみなされたりするおそれがある。 いきなり処分ではなく、まず受診、休職、連絡ルールの見直しなど、改善のための対応を考える（G10-032）。 経緯（連絡の記録、話し合った内容、本人の説明）は、日付つきで残す。", "id": "G10-033"}, "G10-034": {"conclusion": "まず家族からの連絡に感謝し、出社を急がせずに状況を聞きます。本人への連絡のしかたも家族と相談し、支援機関とも連携します。", "steps": ["家族からの連絡を受け止める：「連絡してくださってありがとうございます」と伝え、出社を急がせる話はしない", "家族から状況を聞く：いつ頃から、何が怖いと言っているか（仕事、人間関係、通勤、体調など）、今の体調や生活の様子", "本人への連絡方法を家族と相談する：会社からの連絡自体が負担になっている可能性があるため、連絡するか、誰が、どの手段で連絡するかを決める", "関係者と連携する：支援機関や主治医がいれば、本人の同意を得て状況を共有し、今後の進め方を一緒に考える", "当面の扱いを決める：休む場合の連絡方法、欠勤や休暇の扱い、次にいつ様子を確認するか"], "cautions": ["「怖い」という申し出はとても重要なサイン。職場で何かあった可能性もあるため、原因がわかるまで決めつけない（G10-038）。", "家族の話だけで判断せず、最終的には本人の意思を確認する（G10-059）。", "職場に原因がありそうなら、事実確認と環境の調整を先に行う。", "出社を急がせず、段階的な復帰（短時間勤務、在宅勤務、面談のみの出社など）も選択肢に入れる。"], "prepare": [], "q": "家族から「本人が出社を怖がっている」と連絡があった場合、会社はどう動けばよいですか？", "cat": "無断欠勤・連絡途絶", "st": 5, "kw": "", "body": "家族からの連絡を受け止める：「連絡してくださってありがとうございます」と伝え、出社を急がせる話はしない 家族から状況を聞く：いつ頃から、何が怖いと言っているか（仕事、人間関係、通勤、体調など）、今の体調や生活の様子 本人への連絡方法を家族と相談する：会社からの連絡自体が負担になっている可能性があるため、連絡するか、誰が、どの手段で連絡するかを決める 関係者と連携する：支援機関や主治医がいれば、本人の同意を得て状況を共有し、今後の進め方を一緒に考える 当面の扱いを決める：休む場合の連絡方法、欠勤や休暇の扱い、次にいつ様子を確認するか 「怖い」という申し出はとても重要なサイン。職場で何かあった可能性もあるため、原因がわかるまで決めつけない（G10-038）。 家族の話だけで判断せず、最終的には本人の意思を確認する（G10-059）。 職場に原因がありそうなら、事実確認と環境の調整を先に行う。 出社を急がせず、段階的な復帰（短時間勤務、在宅勤務、面談のみの出社など）も選択肢に入れる。", "id": "G10-034"}, "G10-035": {"conclusion": "まずは安否確認を優先し、連絡の経緯を記録します。そのうえで、就業規則の定めと手続きに沿って、慎重に考えます。", "steps": ["まず安否確認を優先する：支援機関、緊急連絡先、必要なら警察へ（G10-029）", "連絡と安否確認の経緯を記録する：いつ、誰が、どの手段で連絡し、どんな結果だったか", "就業規則を確認する：無断欠勤が何日続いたら退職や解雇とするか、どんな手続きを踏むか", "就業規則の定めに沿って手続きを進める：書面で出社や連絡を求め、それでも応じない場合に退職・解雇の手続きに入る"], "steps_label": "やること", "cautions": ["何日たったら退職にしてよい、という一律の基準はない。就業規則の定めと、それまでの経緯で判断する。", "体調や障害が原因で連絡できない状態の可能性があるうちは、手続きを進めない（G10-033）。", "本人に書面が届かない場合の扱いなど、手続きの細かい部分は社労士や弁護士に確認する。"], "prepare": ["就業規則に、無断欠勤が続いた場合の扱い（日数、退職か解雇か）を定めておく（G10-036）。", "入社時に、緊急連絡先と支援機関の連絡先を本人の同意を得て確認しておく。"], "prepare_label": "事前の備え", "sources": ["就業規則（退職・解雇・懲戒の定め）", "労働基準法20条・行政通達（昭和23年11月11日基発1637号）：原則2週間以上、正当な理由なく無断欠勤し、出勤の督促にも応じない場合は、解雇予告の除外が認められうる目安とされている"], "q": "連絡が取れない状態が長く続いた場合、いつの時点で退職の手続きを考えてよいですか？", "cat": "無断欠勤・連絡途絶", "st": 5, "kw": "", "body": "まず安否確認を優先する：支援機関、緊急連絡先、必要なら警察へ（G10-029） 連絡と安否確認の経緯を記録する：いつ、誰が、どの手段で連絡し、どんな結果だったか 就業規則を確認する：無断欠勤が何日続いたら退職や解雇とするか、どんな手続きを踏むか 就業規則の定めに沿って手続きを進める：書面で出社や連絡を求め、それでも応じない場合に退職・解雇の手続きに入る 何日たったら退職にしてよい、という一律の基準はない。就業規則の定めと、それまでの経緯で判断する。 体調や障害が原因で連絡できない状態の可能性があるうちは、手続きを進めない（G10-033）。 本人に書面が届かない場合の扱いなど、手続きの細かい部分は社労士や弁護士に確認する。 就業規則に、無断欠勤が続いた場合の扱い（日数、退職か解雇か）を定めておく（G10-036）。 入社時に、緊急連絡先と支援機関の連絡先を本人の同意を得て確認しておく。", "id": "G10-035"}, "G10-036": {"conclusion": "意味はあります。誰に、何時までに、どの手段で連絡するかを前もって決めて書面にしておくと、本人も迷わず、会社も対応しやすくなります。", "steps": ["連絡先：誰に連絡するか（上司、人事など。不在時の代わりも）", "連絡の期限：始業の何分前までか", "連絡手段：電話、メール、チャットのどれを使うか。電話が苦手な人には、ほかの手段も認めるかどうか", "連絡がないときに会社がすること：いつ、誰が、どの順番で連絡するか（本人 → 支援機関 → 緊急連絡先、G10-029）", "本人が連絡できないときの代わり：家族や支援機関が代わりに連絡してよいか"], "steps_label": "決めて書いておくこと", "cautions": ["意味はある。むしろ書いておくほうがよい。", "無断欠勤を戒めるためだけでなく、本人の安全を守るためのルールでもある。連絡がないときは「何かあったかもしれない」と考えて動けるようにしておく。", "本人にとっても「どうすればよいか」がはっきりし、連絡のハードルが下がる。", "全社員に共通のルールは就業規則に、本人に合わせた連絡手段などは配慮の内容をまとめた書面に書き分ける。", "決めたら本人に説明して渡し、本人の状態に合わせて見直す。"], "cautions_label": "書いておく意味", "prepare": [], "q": "無断欠勤したときの連絡ルールを、就業規則や配慮の書面に前もって書いておく意味はありますか？", "cat": "無断欠勤・連絡途絶", "st": 5, "kw": "", "body": "連絡先：誰に連絡するか（上司、人事など。不在時の代わりも） 連絡の期限：始業の何分前までか 連絡手段：電話、メール、チャットのどれを使うか。電話が苦手な人には、ほかの手段も認めるかどうか 連絡がないときに会社がすること：いつ、誰が、どの順番で連絡するか（本人 → 支援機関 → 緊急連絡先、G10-029） 本人が連絡できないときの代わり：家族や支援機関が代わりに連絡してよいか 意味はある。むしろ書いておくほうがよい。 無断欠勤を戒めるためだけでなく、本人の安全を守るためのルールでもある。連絡がないときは「何かあったかもしれない」と考えて動けるようにしておく。 本人にとっても「どうすればよいか」がはっきりし、連絡のハードルが下がる。 全社員に共通のルールは就業規則に、本人に合わせた連絡手段などは配慮の内容をまとめた書面に書き分ける。 決めたら本人に説明して渡し、本人の状態に合わせて見直す。", "id": "G10-036"}, "G10-047": {"conclusion": "まず上司にすぐ報告し、顧客への対応を上司が決めます。そのうえで事実を確認し、本人を責めるのではなく、仕組みの面から再発防止を考えます。", "steps": ["上司に報告する：クレームの内容、顧客名、いつ、何が起きたかを、わかっている範囲ですぐに伝える", "顧客への対応を決める：誰が、いつ、どう対応するかを上司が判断する（お詫び、訂正、再発防止の説明など）", "事実を確認する：何が起きたか、どの作業で、なぜ起きたかを、本人や関係者から聞いて整理する", "本人を支える：何が起きたかを伝え、改善点を一緒に考える"], "cautions": ["報告や対応の流れは、障害の有無で変わらない。ほかの社員と同じ手順で進める。", "本人と話すときは、伝え方を工夫する。障害が背景にある場合、指摘が強い否定として受け取られやすいことがある。責めるのではなく「何が起きたか」「次にどうするか」に絞って伝える。", "改善してほしい内容（目指す姿）は変えない。工夫するのは伝え方。", "ミスの原因が、業務の手順や指示の出し方、配慮の不足にないかも確認する（G10-048）。", "障害のことを顧客に伝える必要はない。"], "prepare": [], "q": "社員の業務ミスで顧客からクレームが入った。まず誰にどう報告すればよいですか？", "cat": "ミス・クレーム", "st": 5, "kw": "業務でミスをしてしまった社員へ、どのように指摘すればよいでしょうか？言ってはいけない言葉や、効果的な伝え方のポイントがあれば教えてください。", "body": "上司に報告する：クレームの内容、顧客名、いつ、何が起きたかを、わかっている範囲ですぐに伝える 顧客への対応を決める：誰が、いつ、どう対応するかを上司が判断する（お詫び、訂正、再発防止の説明など） 事実を確認する：何が起きたか、どの作業で、なぜ起きたかを、本人や関係者から聞いて整理する 本人を支える：何が起きたかを伝え、改善点を一緒に考える 報告や対応の流れは、障害の有無で変わらない。ほかの社員と同じ手順で進める。 本人と話すときは、伝え方を工夫する。障害が背景にある場合、指摘が強い否定として受け取られやすいことがある。責めるのではなく「何が起きたか」「次にどうするか」に絞って伝える。 改善してほしい内容（目指す姿）は変えない。工夫するのは伝え方。 ミスの原因が、業務の手順や指示の出し方、配慮の不足にないかも確認する（G10-048）。 障害のことを顧客に伝える必要はない。", "id": "G10-047"}, "G10-048": {"conclusion": "指示の出し方、手順書、チェックの体制、業務量や締め切りなど、ミスが起きやすい仕組みになっていなかったかを先に確認します。", "steps": ["指示の出し方：口頭だけだったか、あいまいな表現はなかったか、本人が理解できたことを確認したか", "手順：手順書やマニュアルがあったか、本人に合った形（文字、図、チェックリストなど）だったか、途中で手順が変わっていなかったか", "チェック体制：入力後の確認（ダブルチェック、自動チェックなど）があったか、ミスに気づける仕組みだったか", "業務量と時間：本人の状態に対して量が多すぎなかったか、急がされていなかったか", "作業環境：騒がしさや割り込みなど、集中しにくい状況はなかったか", "体調：その日やその時期の体調に変化はなかったか"], "steps_label": "確認すること", "cautions": ["障害のある社員への配慮では「環境を整える」ことが大きなポイントになる。本人を責める前に、仕組みややり方に目を向ける。", "見つかった要因は、手順の見直しやチェックの追加など、仕組みの改善につなげる。合理的配慮の見直しが必要なら、本人と話し合う。", "本人に改善してほしい点があれば、仕組みの見直しとあわせて伝える（G10-047）。", "同じ要因でほかの社員もミスをしやすくなっていないか、あわせて確認する。"], "prepare": [], "q": "重大な入力ミスが見つかった場合、本人を責める前に確認したい、業務の進め方の要因は何ですか？", "cat": "ミス・クレーム", "st": 5, "kw": "ミスの原因が指示の伝え方にあった可能性がある場合、上司側の対応も含めてどう振り返るべきか。", "body": "指示の出し方：口頭だけだったか、あいまいな表現はなかったか、本人が理解できたことを確認したか 手順：手順書やマニュアルがあったか、本人に合った形（文字、図、チェックリストなど）だったか、途中で手順が変わっていなかったか チェック体制：入力後の確認（ダブルチェック、自動チェックなど）があったか、ミスに気づける仕組みだったか 業務量と時間：本人の状態に対して量が多すぎなかったか、急がされていなかったか 作業環境：騒がしさや割り込みなど、集中しにくい状況はなかったか 体調：その日やその時期の体調に変化はなかったか 障害のある社員への配慮では「環境を整える」ことが大きなポイントになる。本人を責める前に、仕組みややり方に目を向ける。 見つかった要因は、手順の見直しやチェックの追加など、仕組みの改善につなげる。合理的配慮の見直しが必要なら、本人と話し合う。 本人に改善してほしい点があれば、仕組みの見直しとあわせて伝える（G10-047）。 同じ要因でほかの社員もミスをしやすくなっていないか、あわせて確認する。", "id": "G10-048"}, "G10-049": {"conclusion": "まずミスの事実を、どの業務で、いつ、何件かという数で整理します。そのうえで、教え方や配慮で改善できる部分と、指導が必要な部分を分けて考えます。", "steps": ["事実を確認する：どの業務の、どんな場面でミスが起きているかを整理する", "数で見る：いつ、何件、どの作業でミスがあったかを記録し、数でつかむ", "基準をはっきりさせる：その業務で許容できるミスの水準（例：月に何件以下ならよいか）を決める", "本人と周囲の受け止めをそろえる：本人と上司・周囲で「多い／少ない」の受け止めが違っていないかを確認し、事実と基準をもとに見え方を合わせる", "原因を分ける：環境（業務量、作業環境、チェック体制）、指示（伝え方、手順）、本人の特性や体調のどこにあるかを見る（G10-048）", "原因に合わせて対応する：環境や指示に原因があれば配慮ややり方を見直し、本人に改善してほしい点があれば指導する。両方が必要なことも多い"], "steps_label": "進め方", "cautions": ["「ミスが多い」という印象だけで話を進めない。数と基準がないと、指導なのか配慮の見直しなのか判断できない。", "原因の整理は本人と一緒に行う。本人が自分で気づいている工夫や困りごとが手がかりになる。", "見直した後も記録を続け、ミスが減ったかを確認する。", "支援機関がついていれば、本人の同意を得て一緒に考えてもらう。", "本人から見ると、ミスが続くこと自体に本人も落ち込み、自信をなくしていることが多い。指導するときも、できている点をあわせて伝える。"], "prepare": [], "q": "ミスが続く社員への指導と、配慮不足の見直しをどう切り分けて初動対応すればよいですか？", "cat": "ミス・クレーム", "st": 5, "kw": "繰り返し指導やフィードバックを行っても、なかなか業務改善が見られません。どのように対応すれば良いでしょうか？", "body": "事実を確認する：どの業務の、どんな場面でミスが起きているかを整理する 数で見る：いつ、何件、どの作業でミスがあったかを記録し、数でつかむ 基準をはっきりさせる：その業務で許容できるミスの水準（例：月に何件以下ならよいか）を決める 本人と周囲の受け止めをそろえる：本人と上司・周囲で「多い／少ない」の受け止めが違っていないかを確認し、事実と基準をもとに見え方を合わせる 原因を分ける：環境（業務量、作業環境、チェック体制）、指示（伝え方、手順）、本人の特性や体調のどこにあるかを見る（G10-048） 原因に合わせて対応する：環境や指示に原因があれば配慮ややり方を見直し、本人に改善してほしい点があれば指導する。両方が必要なことも多い 「ミスが多い」という印象だけで話を進めない。数と基準がないと、指導なのか配慮の見直しなのか判断できない。 原因の整理は本人と一緒に行う。本人が自分で気づいている工夫や困りごとが手がかりになる。 見直した後も記録を続け、ミスが減ったかを確認する。 支援機関がついていれば、本人の同意を得て一緒に考えてもらう。 本人から見ると、ミスが続くこと自体に本人も落ち込み、自信をなくしていることが多い。指導するときも、できている点をあわせて伝える。", "id": "G10-049"}, "G10-050": {"conclusion": "基本はほかの社員と同じルールで考え、本人の意向も聞いて決めます。障害を理由に会社が一方的に外すことはせず、負担が大きい場合はやり方を工夫します。", "steps": ["基本はほかの社員と同じルールで考える：同じ立場の社員なら同席させる場面かどうか", "本人の意向を聞く：謝罪に同席したいか、自分の口で伝えたいか。障害を理由に会社が勝手に外さない", "やり方を変えるかを考える：同席が本人にとって大きな負担になる場合や、本人の受け答えでかえってトラブルが大きくなるおそれがある場合", "変える場合は組織として対応する：上司が謝罪し、本人は同席しない、同席しても話すのは上司、本人は事前にお詫びの手紙を書く、など"], "steps_label": "判断の目安", "cautions": ["障害があるから謝罪しなくてよい、ということではない。会社が勝手に決めると、本人の「きちんと責任を取りたい」という気持ちを損なうことがある。", "同席する場合は、事前に何を話すか、誰が主に説明するか、本人は何を言うかを打ち合わせておく。", "やり方を変えた理由は本人に説明し、納得してもらう。", "謝罪の後は本人の様子を確認し、支える（G10-047）。", "障害のことを取引先に伝える必要はない。", "同席するかどうかを決めるときは、「障害があるから外す」のではなく、「同じ立場の社員ならどうするか」という会社の基準で考え、その理由を本人にも伝える。"], "prepare": [], "q": "取引先に直接謝罪が必要な事案が起きた場合、本人を同席させるかどうかの判断基準はありますか？", "cat": "ミス・クレーム", "st": 5, "kw": "", "body": "基本はほかの社員と同じルールで考える：同じ立場の社員なら同席させる場面かどうか 本人の意向を聞く：謝罪に同席したいか、自分の口で伝えたいか。障害を理由に会社が勝手に外さない やり方を変えるかを考える：同席が本人にとって大きな負担になる場合や、本人の受け答えでかえってトラブルが大きくなるおそれがある場合 変える場合は組織として対応する：上司が謝罪し、本人は同席しない、同席しても話すのは上司、本人は事前にお詫びの手紙を書く、など 障害があるから謝罪しなくてよい、ということではない。会社が勝手に決めると、本人の「きちんと責任を取りたい」という気持ちを損なうことがある。 同席する場合は、事前に何を話すか、誰が主に説明するか、本人は何を言うかを打ち合わせておく。 やり方を変えた理由は本人に説明し、納得してもらう。 謝罪の後は本人の様子を確認し、支える（G10-047）。 障害のことを取引先に伝える必要はない。 同席するかどうかを決めるときは、「障害があるから外す」のではなく、「同じ立場の社員ならどうするか」という会社の基準で考え、その理由を本人にも伝える。", "id": "G10-050"}, "G10-051": {"conclusion": "まず安全を確保して、同じことが起きないよう機械を止めます。上司に報告し、事実を記録したうえで、本人を責めず仕組みの面から再発防止を考えます。", "steps": ["安全を確保する：けが人がいないか確認し、機械を止めるなど、同じことがすぐに起きないようにする", "上司に報告する：重大な事故につながりかねない場合は、その日のうちに上司と安全管理の担当者へ。けががあれば、会社のルールに沿って人事や経営層にも", "事実を確認し記録する：いつ、どこで、どの機械で、どんな操作をして、何が起きたか（起こりかけたか）", "原因を確認する：手順、操作の表示や機械の仕組み、教え方、本人の理解度、体調や作業環境のどこに問題があったか（G10-048）", "対策を決めて実行する：手順や表示の見直し、教え直し、安全装置の追加など。重大事故につながるおそれがあれば、すぐに対応する"], "cautions": ["考え方は障害の有無で変わらない。ほかの社員と同じ手順で進める。", "原因が、手順や教え方が本人の特性に合っていなかったことにある場合は、本人に合わせて手順や教え方を見直す（図や写真を使う、手順を短く区切る、など）。", "本人を責めるより、仕組みの見直しを優先する。本人が報告しやすい雰囲気をつくることも再発防止になる。", "ヒヤリハットの記録は職場全体で共有し、ほかの社員の再発防止にも使う。", "実際にけがをした場合は労働災害として扱い、休業をともなうときは労働基準監督署への報告が必要になる。"], "prepare": [], "sources": ["労働安全衛生規則97条（労働者死傷病報告）"], "q": "機械や設備の誤操作でヒヤリハットや事故が起きた。最初に何をし、誰に報告すればよいですか？", "cat": "ミス・クレーム", "st": 5, "kw": "重大事故につながりかねないミスがあった場合、当日中に報告すべき相手の範囲はどこまでか。", "body": "安全を確保する：けが人がいないか確認し、機械を止めるなど、同じことがすぐに起きないようにする 上司に報告する：重大な事故につながりかねない場合は、その日のうちに上司と安全管理の担当者へ。けががあれば、会社のルールに沿って人事や経営層にも 事実を確認し記録する：いつ、どこで、どの機械で、どんな操作をして、何が起きたか（起こりかけたか） 原因を確認する：手順、操作の表示や機械の仕組み、教え方、本人の理解度、体調や作業環境のどこに問題があったか（G10-048） 対策を決めて実行する：手順や表示の見直し、教え直し、安全装置の追加など。重大事故につながるおそれがあれば、すぐに対応する 考え方は障害の有無で変わらない。ほかの社員と同じ手順で進める。 原因が、手順や教え方が本人の特性に合っていなかったことにある場合は、本人に合わせて手順や教え方を見直す（図や写真を使う、手順を短く区切る、など）。 本人を責めるより、仕組みの見直しを優先する。本人が報告しやすい雰囲気をつくることも再発防止になる。 ヒヤリハットの記録は職場全体で共有し、ほかの社員の再発防止にも使う。 実際にけがをした場合は労働災害として扱い、休業をともなうときは労働基準監督署への報告が必要になる。", "id": "G10-051"}, "G10-055": {"conclusion": "その業務の責任者（現場の上司）が中心になり、実際に使う人の意見を聞きながら、誰が見ても分かる形に直します。", "steps": ["その業務の責任者（現場の上司）が中心になって進める", "実際に使う人の意見を聞く：ミスをした本人と、同じ業務をするほかの社員の両方から、わかりにくい点を聞く", "マニュアル本体は、誰が見てもわかりやすい形に直す：手順を短く区切る、図や写真を入れる、あいまいな言葉を使わない、など", "それでも足りない部分は、本人向けに上乗せする：本人用のチェックリスト、伝え方の工夫、最初は一緒に確認する、など", "見直した後、ミスが減ったかを確認する（G10-049）"], "steps_label": "進め方", "cautions": ["本人だけに最適化したマニュアルにすると、ほかの社員にはかえってわかりにくくなることがある。マニュアルは誰もが使いやすい形（ユニバーサルデザインの考え方）を土台にする。", "本人に合わせた調整は、マニュアル本体ではなく「上乗せ」で行う。こうすると組織全体の仕組みを保ちながら、本人にも合わせられる。", "本人に合わせた上乗せの内容は、合理的配慮として記録しておく。"], "prepare": [], "q": "ミスの再発を防ぐためのマニュアル見直しは、誰が主導すればよいですか？", "cat": "ミス・クレーム", "st": 5, "kw": "", "body": "その業務の責任者（現場の上司）が中心になって進める 実際に使う人の意見を聞く：ミスをした本人と、同じ業務をするほかの社員の両方から、わかりにくい点を聞く マニュアル本体は、誰が見てもわかりやすい形に直す：手順を短く区切る、図や写真を入れる、あいまいな言葉を使わない、など それでも足りない部分は、本人向けに上乗せする：本人用のチェックリスト、伝え方の工夫、最初は一緒に確認する、など 見直した後、ミスが減ったかを確認する（G10-049） 本人だけに最適化したマニュアルにすると、ほかの社員にはかえってわかりにくくなることがある。マニュアルは誰もが使いやすい形（ユニバーサルデザインの考え方）を土台にする。 本人に合わせた調整は、マニュアル本体ではなく「上乗せ」で行う。こうすると組織全体の仕組みを保ちながら、本人にも合わせられる。 本人に合わせた上乗せの内容は、合理的配慮として記録しておく。", "id": "G10-055"}, "G10-065": {"conclusion": "まず共有を止めて回収し、受け取った人にこれ以上広げないようお願いします。広がった範囲を確認し、本人にも事実を伝えて謝罪します。", "steps": ["共有を止めて回収する：メールやファイルの削除、共有設定の解除、紙なら回収", "受け取った人に口止めをお願いする：内容をこれ以上ほかの人に伝えない、保存しないよう依頼する", "広がった範囲を確認する：誰が受け取り、誰が見たか、さらに転送や共有をしていないか", "本人に説明して謝罪する：何が、誰に伝わったか、会社がどう対応したかを正直に伝える", "再発防止策を決める：なぜ誤って共有されたか（宛先の確認、アクセス権限、情報の管理方法など）を確認し、仕組みを直す"], "steps_label": "今すぐやること（この順番で）", "cautions": ["流れは「状況の確認 → 範囲の特定 → 本人への説明 → 改善」。範囲がわからないまま本人に説明すると、後で説明が変わり、信頼をさらに損なう。ただし、本人への説明とお詫びは、範囲がおおよそわかった段階でできるだけ早く行う。改善策が決まるまで待たない。", "障害に関する情報は、個人情報保護法の「要配慮個人情報」にあたる。特に慎重に扱う。", "社外に漏れた場合は、1件でも個人情報保護委員会への報告と本人への通知が必要になる。社内の誤共有をどう扱うかも含め、社内の個人情報の担当者に相談する。", "経緯と対応は記録に残す（G10-043）。", "本人がその後、職場で居づらくなっていないか、継続して様子を確認する。"], "prepare": [], "sources": ["個人情報保護法2条3項（要配慮個人情報）・26条（漏えい等の報告・本人への通知）", "個人情報保護法施行規則7条"], "q": "障害に関する個人情報が誤って他部署に共有されてしまった場合、初動で何をすればよいですか？", "cat": "情報漏えい・個人情報", "st": 5, "kw": "情報漏えいが発覚した場合、本人への説明とお詫びはどのタイミングで行うべきか。 本人の同意なく配慮内容が第三者に伝わってしまった場合の再発防止策は何か。 配慮内容の共有範囲を誤って広げてしまった場合の是正手順は何か。", "body": "共有を止めて回収する：メールやファイルの削除、共有設定の解除、紙なら回収 受け取った人に口止めをお願いする：内容をこれ以上ほかの人に伝えない、保存しないよう依頼する 広がった範囲を確認する：誰が受け取り、誰が見たか、さらに転送や共有をしていないか 本人に説明して謝罪する：何が、誰に伝わったか、会社がどう対応したかを正直に伝える 再発防止策を決める：なぜ誤って共有されたか（宛先の確認、アクセス権限、情報の管理方法など）を確認し、仕組みを直す 流れは「状況の確認 → 範囲の特定 → 本人への説明 → 改善」。範囲がわからないまま本人に説明すると、後で説明が変わり、信頼をさらに損なう。ただし、本人への説明とお詫びは、範囲がおおよそわかった段階でできるだけ早く行う。改善策が決まるまで待たない。 障害に関する情報は、個人情報保護法の「要配慮個人情報」にあたる。特に慎重に扱う。 社外に漏れた場合は、1件でも個人情報保護委員会への報告と本人への通知が必要になる。社内の誤共有をどう扱うかも含め、社内の個人情報の担当者に相談する。 経緯と対応は記録に残す（G10-043）。 本人がその後、職場で居づらくなっていないか、継続して様子を確認する。", "id": "G10-065"}, "G10-066": {"conclusion": "その場でうわさを止め、情報の出どころを確認します。あわせて、健康や障害の情報の扱い方を、職場にあらためて伝えます。", "steps": ["その場でうわさを止める：「本人のいないところで、健康や障害のことを話すのはやめましょう」と伝える", "情報の出どころを確認する：どこから聞いたのか。管理している情報が漏れていた場合は、情報漏えいとして対応する（G10-065）", "個人情報の扱いをあらためて伝える：話していた社員に、本人の同意なく健康や障害の情報を話したり広めたりしないよう伝える", "職場全体で共有する：部署や全社に、うわさや憶測で人の健康・障害の話をしないことを伝える。研修で扱うのもよい"], "cautions": ["話していた社員を問い詰めすぎない。目的は、うわさを止めて広がらないようにすること。", "本人の了解なく健康や障害の情報を広めることは、パワハラの「個の侵害」にあたることがある。", "本人に伝えるかどうかは慎重に判断する。会社の管理する情報が漏れていた場合は、本人に説明する（G10-065）。", "その後、本人が職場で孤立していないか、様子を見る。"], "prepare": [], "sources": ["パワハラ指針（令和2年厚生労働省告示第5号）：「個の侵害」の例として、病歴などの機微な個人情報を本人の了解なく他の労働者に暴露すること"], "q": "本人の障害情報を知らない社員が、うわさ話として話しているのを耳にした場合、どう対応すればよいですか？", "cat": "情報漏えい・個人情報", "st": 5, "kw": "", "body": "その場でうわさを止める：「本人のいないところで、健康や障害のことを話すのはやめましょう」と伝える 情報の出どころを確認する：どこから聞いたのか。管理している情報が漏れていた場合は、情報漏えいとして対応する（G10-065） 個人情報の扱いをあらためて伝える：話していた社員に、本人の同意なく健康や障害の情報を話したり広めたりしないよう伝える 職場全体で共有する：部署や全社に、うわさや憶測で人の健康・障害の話をしないことを伝える。研修で扱うのもよい 話していた社員を問い詰めすぎない。目的は、うわさを止めて広がらないようにすること。 本人の了解なく健康や障害の情報を広めることは、パワハラの「個の侵害」にあたることがある。 本人に伝えるかどうかは慎重に判断する。会社の管理する情報が漏れていた場合は、本人に説明する（G10-065）。 その後、本人が職場で孤立していないか、様子を見る。", "id": "G10-066"}, "G10-067": {"conclusion": "何を、いつ、どこでなくしたか、誰の手に渡った可能性があるかを確認します。漏れた可能性があれば、情報漏えいとして対応します。", "steps": ["何をなくしたか：どの書類か、書かれていた内容（障害名、配慮の内容、連絡先など）、紙かデータか", "いつ、どこでなくしたか：最後に確認できたのはいつ、どこか。社内か社外か", "誰の手に渡った可能性があるか：社内に置き忘れたのか、社外に持ち出して紛失したのか"], "steps_label": "確認すること", "cautions": ["探しても見つからなければ、本人に何がなくなったかを説明して謝罪する。", "なくした原因（持ち出しのルール、保管場所、管理方法）を確認し、再発防止策を決める。", "対応の流れは、ほかの社員の個人情報をなくした場合と同じ。", "障害に関する情報は「要配慮個人情報（病歴や障害など、特に慎重に扱う必要がある個人情報）」。社外で紛失し、第三者に渡ったおそれがある場合は、個人情報保護委員会への報告と本人への通知が必要になることがあるため、社内の個人情報の担当者に相談する（G10-065）。"], "cautions_label": "その後の対応", "prepare": [], "q": "配慮内容を記載した書類を紛失した可能性がある場合、まず確認する範囲はどこまでですか？", "cat": "情報漏えい・個人情報", "st": 5, "kw": "", "body": "何をなくしたか：どの書類か、書かれていた内容（障害名、配慮の内容、連絡先など）、紙かデータか いつ、どこでなくしたか：最後に確認できたのはいつ、どこか。社内か社外か 誰の手に渡った可能性があるか：社内に置き忘れたのか、社外に持ち出して紛失したのか 探しても見つからなければ、本人に何がなくなったかを説明して謝罪する。 なくした原因（持ち出しのルール、保管場所、管理方法）を確認し、再発防止策を決める。 対応の流れは、ほかの社員の個人情報をなくした場合と同じ。 障害に関する情報は「要配慮個人情報（病歴や障害など、特に慎重に扱う必要がある個人情報）」。社外で紛失し、第三者に渡ったおそれがある場合は、個人情報保護委員会への報告と本人への通知が必要になることがあるため、社内の個人情報の担当者に相談する（G10-065）。", "id": "G10-067"}, "G10-068": {"conclusion": "不安を受け止め、実際に誰が、どの情報を知っているかを確認して、正直に説明します。必要なら共有の範囲を本人と決め直します。", "steps": ["不安を受け止める：「確認してくれてありがとう」と伝え、話してくれたことを否定しない", "今の共有範囲を確認する：実際に誰が、どの情報（障害名、配慮の内容、体調など）を知っているかを社内で確認する", "本人に説明する：共有範囲のルールを決めていた場合は、そのルールと実際の共有範囲を説明する", "ルールがなかった場合は、その場で一緒に決める：誰に、どこまで伝えるか、伝えたくない人や情報はあるか", "決めた内容を書面に残し、本人にも渡す"], "steps_label": "やること", "cautions": ["本来は、配慮の内容を決めるときに共有範囲も本人と決めておくのが基本（予防の対応）。決めていれば、説明するだけで済む。", "ルールより広く共有されていたことがわかった場合は、正直に伝えて謝罪し、情報漏えいとして対応する（G10-065）。", "本人が不安を感じたきっかけ（周囲の言動など）があれば聞き取り、必要に応じて対応する（G10-066）。", "共有範囲は一度決めて終わりではない。異動や上司の交代のときには本人と見直す。"], "prepare": [], "q": "本人が「誰にどこまで話しているか分からず不安」と訴えてきた場合、どう説明すればよいですか？", "cat": "情報漏えい・個人情報", "st": 5, "kw": "", "body": "不安を受け止める：「確認してくれてありがとう」と伝え、話してくれたことを否定しない 今の共有範囲を確認する：実際に誰が、どの情報（障害名、配慮の内容、体調など）を知っているかを社内で確認する 本人に説明する：共有範囲のルールを決めていた場合は、そのルールと実際の共有範囲を説明する ルールがなかった場合は、その場で一緒に決める：誰に、どこまで伝えるか、伝えたくない人や情報はあるか 決めた内容を書面に残し、本人にも渡す 本来は、配慮の内容を決めるときに共有範囲も本人と決めておくのが基本（予防の対応）。決めていれば、説明するだけで済む。 ルールより広く共有されていたことがわかった場合は、正直に伝えて謝罪し、情報漏えいとして対応する（G10-065）。 本人が不安を感じたきっかけ（周囲の言動など）があれば聞き取り、必要に応じて対応する（G10-066）。 共有範囲は一度決めて終わりではない。異動や上司の交代のときには本人と見直す。", "id": "G10-068"}, "G10-069": {"conclusion": "まず投稿の画面を保存して証拠を残し、削除を依頼します。本人には事実と会社の対応を伝え、必要に応じて専門家にも相談します。", "steps": ["事実を確認し、証拠を残す：投稿の画面を保存する（スクリーンショット、URL、投稿日時、投稿者のアカウント名）", "削除を依頼する：投稿者が社員なら、すぐに削除を指示する。そうでなければ、SNSの運営会社に削除を申し立てる", "本人に説明する：何が、どこに出ていたか、会社がどう対応しているかを伝え、本人の意向も聞く", "専門家に相談する：社内の個人情報の担当者や弁護士に相談する。削除の進め方は、違法・有害情報相談センターや法務局の人権相談でも相談できる"], "cautions": ["削除を依頼する前に、必ず証拠を残す。削除された後では、事実確認や再発防止に使えなくなる。", "会社が管理していた情報が漏れた可能性があれば、情報漏えいとして対応する（G10-065）。社外に漏れた要配慮個人情報（病歴や障害など、特に慎重に扱う必要がある個人情報）は、個人情報保護委員会への報告と本人への通知が必要になる。", "投稿者が社員の場合は、事実確認のうえ就業規則に沿って対応する。", "本人の心身の負担が大きい出来事なので、仕事の調整や支援機関との連携も考える。"], "prepare": [], "sources": ["個人情報保護法26条（漏えい等の報告・本人への通知）"], "links": [["違法・有害情報相談センター（総務省支援事業）", "https://ihaho.jp/"]], "q": "SNS等で本人の障害に関する情報が外部に漏れた可能性がある場合、緊急の初動対応は何ですか？", "cat": "情報漏えい・個人情報", "st": 5, "kw": "", "body": "事実を確認し、証拠を残す：投稿の画面を保存する（スクリーンショット、URL、投稿日時、投稿者のアカウント名） 削除を依頼する：投稿者が社員なら、すぐに削除を指示する。そうでなければ、SNSの運営会社に削除を申し立てる 本人に説明する：何が、どこに出ていたか、会社がどう対応しているかを伝え、本人の意向も聞く 専門家に相談する：社内の個人情報の担当者や弁護士に相談する。削除の進め方は、違法・有害情報相談センターや法務局の人権相談でも相談できる 削除を依頼する前に、必ず証拠を残す。削除された後では、事実確認や再発防止に使えなくなる。 会社が管理していた情報が漏れた可能性があれば、情報漏えいとして対応する（G10-065）。社外に漏れた要配慮個人情報（病歴や障害など、特に慎重に扱う必要がある個人情報）は、個人情報保護委員会への報告と本人への通知が必要になる。 投稿者が社員の場合は、事実確認のうえ就業規則に沿って対応する。 本人の心身の負担が大きい出来事なので、仕事の調整や支援機関との連携も考える。", "id": "G10-069"}, "G10-072": {"conclusion": "会社の情報管理のルールに沿って、障害や配慮に関する情報を見られる人が、必要な人だけになっているかを見直します。", "steps": ["会社の情報管理のルール（アクセス権限、持ち出し、保管など）に沿って見直す", "障害や配慮に関する情報を見られる人が、必要な人だけになっているかを確認する"], "steps_label": "やること", "cautions": ["障害者雇用だから特別な対応が必要、ということではない。ほかの個人情報のトラブルと同じ考え方で進める。", "本人と決めた共有範囲（G10-068）と、実際のアクセス権限がずれていないかもあわせて確認する。"], "prepare": [], "q": "情報管理トラブルの再発防止として、当面の間アクセス権限をどう制限すればよいですか？", "cat": "情報漏えい・個人情報", "st": 5, "kw": "人事システム上の障害者情報の閲覧権限に誤りが見つかった場合、緊急の是正手順はどうあるべきか。", "body": "会社の情報管理のルール（アクセス権限、持ち出し、保管など）に沿って見直す 障害や配慮に関する情報を見られる人が、必要な人だけになっているかを確認する 障害者雇用だから特別な対応が必要、ということではない。ほかの個人情報のトラブルと同じ考え方で進める。 本人と決めた共有範囲（G10-068）と、実際のアクセス権限がずれていないかもあわせて確認する。", "id": "G10-072"}, "G10-075": {"conclusion": "体調不良そのものではなく、契約で決めた更新の基準に沿って判断します。事実を整理し、本人の体調や今後の見通しも聞いたうえで考えます。", "steps": ["事実を整理する：いつから、どのくらい休んでいるか（欠勤・遅刻・早退の日数）、業務にどんな影響が出ているか", "契約の内容を確認する：契約書や就業規則で、更新の判断基準がどう書かれているか、これまで何回更新しているか", "本人と話す：体調の状態、今後の見通し、働き続けたいかを聞く。必要なら主治医や産業医の意見も聞く", "配慮や制度を考える：業務量や勤務時間の調整、休職制度などで働き続けられないかを考える", "更新しない可能性があるなら、専門家に確認する：社内の法務担当者、顧問の社労士や弁護士に相談してから判断する"], "steps_label": "判断の前にやること", "cautions": ["体調不良が続いていることは、今後働き続けられるかに関わる大きな課題。慎重に対応する。", "契約更新は「働き続けられること」が前提。評価や判断は、印象ではなく「この期間にこれだけ休んだ」などの事実をもとに行う。", "障害を理由に更新しないことは差別にあたる。判断の前に、合理的配慮や業務の調整を考えたかが問われる。", "更新を何度も重ねている場合や、本人が更新を期待するのがもっともな場合は、更新しないことが認められにくい（雇止め（契約を更新しないこと）法理）。", "更新しない場合は、決められた時期までに予告し、本人が求めれば理由を書面で示す必要がある。"], "prepare": [], "sources": ["労働契約法19条（雇止め法理）", "有期労働契約の締結、更新、雇止め等に関する基準（厚生労働省告示）：一定の場合、30日前までの予告と理由の明示", "障害者雇用促進法35条・36条の2（差別禁止・合理的配慮）"], "q": "契約更新を控えたタイミングで体調不良が続いている社員がいます。評価にどう反映すればよいか悩んでいます。", "cat": "処遇・契約", "st": 5, "kw": "", "body": "事実を整理する：いつから、どのくらい休んでいるか（欠勤・遅刻・早退の日数）、業務にどんな影響が出ているか 契約の内容を確認する：契約書や就業規則で、更新の判断基準がどう書かれているか、これまで何回更新しているか 本人と話す：体調の状態、今後の見通し、働き続けたいかを聞く。必要なら主治医や産業医の意見も聞く 配慮や制度を考える：業務量や勤務時間の調整、休職制度などで働き続けられないかを考える 更新しない可能性があるなら、専門家に確認する：社内の法務担当者、顧問の社労士や弁護士に相談してから判断する 体調不良が続いていることは、今後働き続けられるかに関わる大きな課題。慎重に対応する。 契約更新は「働き続けられること」が前提。評価や判断は、印象ではなく「この期間にこれだけ休んだ」などの事実をもとに行う。 障害を理由に更新しないことは差別にあたる。判断の前に、合理的配慮や業務の調整を考えたかが問われる。 更新を何度も重ねている場合や、本人が更新を期待するのがもっともな場合は、更新しないことが認められにくい（雇止め（契約を更新しないこと）法理）。 更新しない場合は、決められた時期までに予告し、本人が求めれば理由を書面で示す必要がある。", "id": "G10-075"}, "G10-076": {"conclusion": "「障害があるから」ではなく、「この業務の、この部分」と具体的な理由を伝えます。会社が一方的に決めず、先に本人の意見を聞いてから決めます。", "steps": ["調整の理由を、本人の特性と仕事の環境に結びつけて説明する：「障害があるから」ではなく「この業務のこの部分が、今は負担になっているから」", "先に本人の意見を聞く：会社が一方的に決めず、本人がどう感じているか、どうしたいかを聞いてから決める", "調整の中身を具体的に伝える：何を、どのくらい減らすか（変えるか）", "期間と見直しの時期を伝える：ずっとこのままではなく、いつ様子を見て見直すか", "評価や処遇との関係を伝える：調整したことで評価がどうなるのかを、あいまいにしない"], "steps_label": "伝えるときのポイント", "cautions": ["基本は、障害の有無にかかわらず「仕事は仕事としてやってもらう」。業務量の調整は、合理的配慮として行うもの。", "合理的配慮は、本人の特性と仕事の環境を照らし合わせて、今の業務量や内容が難しいときに行う調整。本人の意見を聞いて決める。", "特性や配慮に関係のないところでは、特別扱いしない。業務を減らすことも、逆に勤務の乱れなどを大目に見ることも、周囲と差をつけない。", "合意した内容は書面に残す。", "業務量の調整は、「障害があるから」ではなく、会社として全員に同じ考え方（業務と力が合うように調整する）で行っていることとして伝えると、受け止めやすい。"], "prepare": [], "sources": ["障害者差別禁止指針・合理的配慮指針（厚生労働省）"], "q": "障害を理由にした不当な扱いだと受け取られないよう、業務量を調整するときに気をつけたい伝え方はありますか？", "cat": "処遇・契約", "st": 5, "kw": "", "body": "調整の理由を、本人の特性と仕事の環境に結びつけて説明する：「障害があるから」ではなく「この業務のこの部分が、今は負担になっているから」 先に本人の意見を聞く：会社が一方的に決めず、本人がどう感じているか、どうしたいかを聞いてから決める 調整の中身を具体的に伝える：何を、どのくらい減らすか（変えるか） 期間と見直しの時期を伝える：ずっとこのままではなく、いつ様子を見て見直すか 評価や処遇との関係を伝える：調整したことで評価がどうなるのかを、あいまいにしない 基本は、障害の有無にかかわらず「仕事は仕事としてやってもらう」。業務量の調整は、合理的配慮として行うもの。 合理的配慮は、本人の特性と仕事の環境を照らし合わせて、今の業務量や内容が難しいときに行う調整。本人の意見を聞いて決める。 特性や配慮に関係のないところでは、特別扱いしない。業務を減らすことも、逆に勤務の乱れなどを大目に見ることも、周囲と差をつけない。 合意した内容は書面に残す。 業務量の調整は、「障害があるから」ではなく、会社として全員に同じ考え方（業務と力が合うように調整する）で行っていることとして伝えると、受け止めやすい。", "id": "G10-076"}, "G10-077": {"conclusion": "会社が一方的に労働条件を下げることはできません。まずは今の契約のまま就業規則に沿って対応し、休職制度の利用や、本人と話し合っての見直しを考えます。", "steps": ["会社が一方的に労働条件を変えることはできない：給料を下げる、勤務日数を減らすなどの変更は、本人の合意が必要", "まずは今の契約のまま、就業規則に沿って対応する：働けなかった日は欠勤として扱い、欠勤控除のルールに沿って給与を計算する。これは労働条件の変更ではない", "休職制度があれば、使えるかを考える", "状態が長く続き、契約の内容を見直す必要がある場合は、本人と話し合う：業務内容がこう変わるので、それに合わせて雇用条件もこう変える、という合理的な理由を説明し、合意を得る"], "steps_label": "考え方", "cautions": ["急いで条件を変えようとせず、まずは本人の状態と今後の見通しを確認する。必要なら主治医や産業医の意見も聞く。", "配置転換や降格などの処遇の変更も同じ考え方。急ぐ場合でも、まず本人に理由を説明して意見を聞き、そのうえで決める。", "合理的配慮（業務量や勤務時間の調整など）で働き続けられないかも、あわせて考える（G10-076）。", "合意した内容は書面に残す。", "給料を下げるなど、本人に不利な変更をする場合は、事前に社労士や弁護士に確認する。"], "prepare": [], "sources": ["労働契約法8条（合意による労働条件の変更）・9条（就業規則による不利益変更の禁止）"], "q": "契約期間の途中で障害の状態が大きく変わった場合、労働条件や処遇（配置転換・降格など）を見直してよいですか？", "cat": "処遇・契約", "st": 5, "kw": "処遇変更（配置転換・降格等）を急いで行う必要がある場合、本人への説明順序はどうあるべきか。", "body": "会社が一方的に労働条件を変えることはできない：給料を下げる、勤務日数を減らすなどの変更は、本人の合意が必要 まずは今の契約のまま、就業規則に沿って対応する：働けなかった日は欠勤として扱い、欠勤控除のルールに沿って給与を計算する。これは労働条件の変更ではない 休職制度があれば、使えるかを考える 状態が長く続き、契約の内容を見直す必要がある場合は、本人と話し合う：業務内容がこう変わるので、それに合わせて雇用条件もこう変える、という合理的な理由を説明し、合意を得る 急いで条件を変えようとせず、まずは本人の状態と今後の見通しを確認する。必要なら主治医や産業医の意見も聞く。 配置転換や降格などの処遇の変更も同じ考え方。急ぐ場合でも、まず本人に理由を説明して意見を聞き、そのうえで決める。 合理的配慮（業務量や勤務時間の調整など）で働き続けられないかも、あわせて考える（G10-076）。 合意した内容は書面に残す。 給料を下げるなど、本人に不利な変更をする場合は、事前に社労士や弁護士に確認する。", "id": "G10-077"}, "G10-078": {"conclusion": "直後には決めず、まず安全と落ち着きを優先します。事実を確認して本人の言い分を聞き、障害特性や配慮の状況も含めて、慎重に判断します。", "steps": ["直後には決めない：まず安全の確保と、本人や周囲が落ち着くことを優先する", "事実を確認する：何が起きたか、誰が関わったか、経緯を記録とともに整理する", "弁明の機会（本人の言い分を聞く機会）をつくる：本人の言い分を聞く。ここまでは障害の有無に関係なく同じ手順", "障害特性との関係を確認する：トラブルが障害特性と明らかに結びついているか。必要なら主治医や産業医、支援機関の意見も聞く", "処分の内容を決める：就業規則に沿い、ほかの社員の同じようなケースと比べて判断する（G10-033）"], "steps_label": "進め方", "cautions": ["障害があるから処分が軽くなる、ということではない。基本はほかの社員と同じ基準で判断する。", "ただし、トラブルが障害特性によるものだと明らかに結びつく場合は、配慮を考える余地がある。会社側の配慮や環境に不足がなかったかも確認する。", "弁明の場では、本人が説明しやすいように工夫する（時間を十分にとる、書面での説明も認める、支援者の同席を認める、など）。", "処分とあわせて、再発を防ぐための配慮や環境の見直しも考える。", "処分を決める前に、社労士や弁護士に確認する。"], "prepare": [], "sources": ["労働契約法15条（懲戒権の濫用）", "障害者雇用促進法35条・36条の2（差別禁止・合理的配慮）"], "q": "重大なトラブルの直後に懲戒処分を考える場合、障害特性への配慮をどう両立させればよいですか？", "cat": "処遇・契約", "st": 5, "kw": "", "body": "直後には決めない：まず安全の確保と、本人や周囲が落ち着くことを優先する 事実を確認する：何が起きたか、誰が関わったか、経緯を記録とともに整理する 弁明の機会（本人の言い分を聞く機会）をつくる：本人の言い分を聞く。ここまでは障害の有無に関係なく同じ手順 障害特性との関係を確認する：トラブルが障害特性と明らかに結びついているか。必要なら主治医や産業医、支援機関の意見も聞く 処分の内容を決める：就業規則に沿い、ほかの社員の同じようなケースと比べて判断する（G10-033） 障害があるから処分が軽くなる、ということではない。基本はほかの社員と同じ基準で判断する。 ただし、トラブルが障害特性によるものだと明らかに結びつく場合は、配慮を考える余地がある。会社側の配慮や環境に不足がなかったかも確認する。 弁明の場では、本人が説明しやすいように工夫する（時間を十分にとる、書面での説明も認める、支援者の同席を認める、など）。 処分とあわせて、再発を防ぐための配慮や環境の見直しも考える。 処分を決める前に、社労士や弁護士に確認する。", "id": "G10-078"}, "G10-080": {"conclusion": "トラブルがあったこと自体で取りやめず、選考は通常どおり進めます。判断は、正社員登用の要件を満たすかどうかだけで行います。", "steps": ["選考は止めずに、通常どおり進める：トラブルが起きたこと自体で、登用を取りやめるわけではない", "判断は「正社員登用の要件を満たすかどうか」だけで行う：トラブルの内容が要件（勤務態度、業務遂行など）に関わるなら、選考の中で評価に含める", "要件を満たせば通常どおり登用し、満たさなければ選考の結果として見送る"], "steps_label": "考え方", "cautions": ["障害の有無で基準を変えない。ほかの社員と同じ登用要件で判断する。", "トラブルが障害特性と結びついていて、会社側の配慮が足りなかった可能性がある場合は、その点も確認する（G10-078）。", "トラブルの事実確認が終わる前に結論を出さない。", "見送る場合は、どの要件を満たさなかったのかを本人に説明できるようにしておく。"], "prepare": [], "q": "契約社員から正社員登用の話が進んでいる最中にトラブルが起きた場合、選考プロセスをどう扱えばよいですか？", "cat": "処遇・契約", "st": 5, "kw": "", "body": "選考は止めずに、通常どおり進める：トラブルが起きたこと自体で、登用を取りやめるわけではない 判断は「正社員登用の要件を満たすかどうか」だけで行う：トラブルの内容が要件（勤務態度、業務遂行など）に関わるなら、選考の中で評価に含める 要件を満たせば通常どおり登用し、満たさなければ選考の結果として見送る 障害の有無で基準を変えない。ほかの社員と同じ登用要件で判断する。 トラブルが障害特性と結びついていて、会社側の配慮が足りなかった可能性がある場合は、その点も確認する（G10-078）。 トラブルの事実確認が終わる前に結論を出さない。 見送る場合は、どの要件を満たさなかったのかを本人に説明できるようにしておく。", "id": "G10-080"}, "G10-081": {"conclusion": "本人の訴えの内容、労働条件通知書などの書面の内容、配慮が実際に行われているかを確認し、事実を整理します。", "steps": ["本人の訴えの内容：何が、思っていたのとどう違うのか", "書面の内容：労働条件通知書、雇用契約書、就業規則、給与明細などで、実際にどう決まっているか", "配慮の内容：配慮の内容をまとめた書面で決めた配慮が、実際に行われているか", "食い違いの原因：会社側の誤り、説明不足、本人の思い違いのどれか"], "steps_label": "確認すること", "cautions": ["賃金や労働条件のトラブルへの対応は、障害の有無で変わらない。ほかの社員と同じ手順で確認する。", "障害のある社員の場合、「約束した配慮が実際には行われていない」という訴えがよくある。ここは丁寧に確認する。", "会社側に誤りがあれば、すぐに正して本人に説明する。賃金の未払いがあれば精算する。", "本人の思い違いの場合も、書面を一緒に見ながら、わかりやすく説明し直す。"], "prepare": [], "q": "賃金や労働条件に関するトラブルが起きたとき、最初の対応として人事が確認しておく点は何ですか？", "cat": "処遇・契約", "st": 5, "kw": "", "body": "本人の訴えの内容：何が、思っていたのとどう違うのか 書面の内容：労働条件通知書、雇用契約書、就業規則、給与明細などで、実際にどう決まっているか 配慮の内容：配慮の内容をまとめた書面で決めた配慮が、実際に行われているか 食い違いの原因：会社側の誤り、説明不足、本人の思い違いのどれか 賃金や労働条件のトラブルへの対応は、障害の有無で変わらない。ほかの社員と同じ手順で確認する。 障害のある社員の場合、「約束した配慮が実際には行われていない」という訴えがよくある。ここは丁寧に確認する。 会社側に誤りがあれば、すぐに正して本人に説明する。賃金の未払いがあれば精算する。 本人の思い違いの場合も、書面を一緒に見ながら、わかりやすく説明し直す。", "id": "G10-081"}, "G10-100": {"conclusion": "まず辞めたい理由をよく聞き、職場に原因がないか確認します。少し時間をおいて本人の意思を確かめ、気持ちが変わらなければ受理します。", "steps": ["話を聞く：なぜ辞めたいと思ったのか、いつ頃からか、何かきっかけがあったか", "職場に原因がないか確認する：人間関係、業務量、配慮の不足、ハラスメントなど。原因があれば、まずそこに対応する", "本人の意思を確認する：少し時間をおいて、気持ちが変わらないかを確認する。支援機関がついていれば、本人の同意を得て相談する", "意思が固ければ受け入れる：ほかの社員と同じ手続きで退職を進める"], "steps_label": "やること", "cautions": ["引き止めるか受け入れるかの考え方は、障害の有無で変わらない。", "衝動的に退職を口にする特性のある人の場合、一度話を聞くだけで気持ちが落ち着くこともある。本人の特性を理解したうえで、その場ですぐに受理するかどうかを判断する。", "無理な引き止めはしない。最終的には本人の意思を尊重する。", "体調の悪化が背景にありそうなら、退職の前に休職などの選択肢も伝える。"], "prepare": [], "q": "本人から突然の退職の申し出があった場合、引き止めるか受理するかの判断基準はありますか？", "cat": "処遇・契約", "st": 5, "kw": "", "body": "話を聞く：なぜ辞めたいと思ったのか、いつ頃からか、何かきっかけがあったか 職場に原因がないか確認する：人間関係、業務量、配慮の不足、ハラスメントなど。原因があれば、まずそこに対応する 本人の意思を確認する：少し時間をおいて、気持ちが変わらないかを確認する。支援機関がついていれば、本人の同意を得て相談する 意思が固ければ受け入れる：ほかの社員と同じ手続きで退職を進める 引き止めるか受け入れるかの考え方は、障害の有無で変わらない。 衝動的に退職を口にする特性のある人の場合、一度話を聞くだけで気持ちが落ち着くこともある。本人の特性を理解したうえで、その場ですぐに受理するかどうかを判断する。 無理な引き止めはしない。最終的には本人の意思を尊重する。 体調の悪化が背景にありそうなら、退職の前に休職などの選択肢も伝える。", "id": "G10-100"}, "G10-093": {"conclusion": "窓口は人事・総務に一本化します。現場の上司は事実を報告し、監督署とのやり取りは人事・総務に任せます。", "steps": ["窓口は人事・総務の担当者に一本化する", "現場の上司は、事実や経緯を人事・総務に報告し、監督署とのやり取りは人事・総務に任せる", "重要な判断が必要な場合は、経営層に報告し、社労士や弁護士にも相談する"], "steps_label": "やること", "cautions": ["窓口を一本化すると、説明の食い違いを防ぎ、記録も残しやすい。", "監督署とのやり取り（日時、担当者、内容）は記録に残す。", "障害のある社員本人が監督署に相談した場合でも、それを理由に不利な扱いをしないようにする（法律でも禁止されている）。"], "prepare": [], "sources": ["労働基準法104条2項（監督機関への申告を理由とする不利益取扱いの禁止）"], "q": "労働基準監督署への相談が必要になりそうな事案が起きた場合、誰が窓口になればよいですか？", "cat": "外部機関の活用", "st": 5, "kw": "", "body": "窓口は人事・総務の担当者に一本化する 現場の上司は、事実や経緯を人事・総務に報告し、監督署とのやり取りは人事・総務に任せる 重要な判断が必要な場合は、経営層に報告し、社労士や弁護士にも相談する 窓口を一本化すると、説明の食い違いを防ぎ、記録も残しやすい。 監督署とのやり取り（日時、担当者、内容）は記録に残す。 障害のある社員本人が監督署に相談した場合でも、それを理由に不利な扱いをしないようにする（法律でも禁止されている）。", "id": "G10-093"}, "G10-094": {"conclusion": "迷った段階で気軽に相談してかまいません。少なくとも、法的な争いになりそうだと感じたときは、必ず相談します。", "steps": ["気軽に相談できる関係なら、迷った段階で相談してよい", "少なくとも、法的な争いになりそうだと思った段階では、必ず相談する：本人や家族が「訴える」「弁護士に相談する」と言っている、懲戒・雇止め（契約を更新しないこと）・解雇を考えている、ハラスメントや差別の訴えがある、行政機関から連絡があった、など", "相談するかどうかは、現場の担当者ひとりで決めず、上司（または人事）が判断する"], "steps_label": "判断の目安", "cautions": ["相談の目安は、顧問弁護士との関係（どこまで気軽に相談できる契約か）によって変わる。社内で「こういうときは相談する」という目安を決めておくとよい。", "相談するときは、事実と経緯の記録、関係する書面（契約書、就業規則、配慮の内容をまとめた書面など）をそろえておく。", "相談が早いほど、取れる選択肢が多い。手遅れになってから相談するより、早めの確認が安全。"], "prepare": [], "q": "顧問弁護士に相談するレベルのトラブルかどうか、社内でどう判断すればよいですか？", "cat": "外部機関の活用", "st": 5, "kw": "", "body": "気軽に相談できる関係なら、迷った段階で相談してよい 少なくとも、法的な争いになりそうだと思った段階では、必ず相談する：本人や家族が「訴える」「弁護士に相談する」と言っている、懲戒・雇止め（契約を更新しないこと）・解雇を考えている、ハラスメントや差別の訴えがある、行政機関から連絡があった、など 相談するかどうかは、現場の担当者ひとりで決めず、上司（または人事）が判断する 相談の目安は、顧問弁護士との関係（どこまで気軽に相談できる契約か）によって変わる。社内で「こういうときは相談する」という目安を決めておくとよい。 相談するときは、事実と経緯の記録、関係する書面（契約書、就業規則、配慮の内容をまとめた書面など）をそろえておく。 相談が早いほど、取れる選択肢が多い。手遅れになってから相談するより、早めの確認が安全。", "id": "G10-094"}, "G10-097": {"conclusion": "人事が中心になってまとめます。それぞれの意見の一致点と違いを整理し、本人の意向も聞いたうえで、最終的には会社として判断します。", "steps": ["まとめ役を決める：人事が中心になり、上司や産業医など、客観的に判断できる人が加わってまとめる", "それぞれの意見を整理する：どこが一致していて、どこが食い違っているか。それぞれ何を根拠にしているか（主治医は治療の立場、産業医は職場で働けるかの立場、支援機関は日常の様子など）", "本人の意向を聞く", "会社として決める：意見を参考にしたうえで、上司や人事が判断し、その理由を本人に説明する"], "steps_label": "進め方", "cautions": ["外部の意見は、あくまで参考にする意見。会社が必ずそのとおりにしなければならないわけではない。最終的に決めるのは会社で、決めた責任も会社が持つ。", "食い違いの理由がわからないときは、本人の同意を得て、主治医や支援機関に会社の業務内容を説明し、あらためて意見を聞く。", "判断の経緯と理由を記録に残す。"], "prepare": [], "q": "複数の外部機関（産業医・支援機関・主治医）の意見が食い違う場合、誰がとりまとめればよいですか？", "cat": "外部機関の活用", "st": 5, "kw": "", "body": "まとめ役を決める：人事が中心になり、上司や産業医など、客観的に判断できる人が加わってまとめる それぞれの意見を整理する：どこが一致していて、どこが食い違っているか。それぞれ何を根拠にしているか（主治医は治療の立場、産業医は職場で働けるかの立場、支援機関は日常の様子など） 本人の意向を聞く 会社として決める：意見を参考にしたうえで、上司や人事が判断し、その理由を本人に説明する 外部の意見は、あくまで参考にする意見。会社が必ずそのとおりにしなければならないわけではない。最終的に決めるのは会社で、決めた責任も会社が持つ。 食い違いの理由がわからないときは、本人の同意を得て、主治医や支援機関に会社の業務内容を説明し、あらためて意見を聞く。 判断の経緯と理由を記録に残す。", "id": "G10-097"}, "G10-098": {"conclusion": "外部機関への報告は、それぞれのルールや様式に従います。支援機関への共有は義務ではないので、本人の同意を得て必要な範囲で伝えます。", "steps": ["外部機関への報告は、それぞれの機関のルールや様式に従う", "法律で報告が必要になる主な場面：休業をともなう労働災害（労働基準監督署への労働者死傷病報告）、要配慮個人情報（病歴や障害など、特に慎重に扱う必要がある個人情報）の社外への漏えい（個人情報保護委員会への報告）", "支援機関への共有は義務ではない。本人の同意を得て、必要な範囲で伝える", "社内の記録は、外部への報告の有無にかかわらず残す：いつ、誰が、何を、どう対応したか（G10-043）"], "steps_label": "考え方", "cautions": ["どの機関に報告が必要かわからないときは、社労士や弁護士に確認する。", "障害に関する情報を含む記録は、見られる人を限定して保管する。"], "prepare": [], "sources": ["労働安全衛生規則97条（労働者死傷病報告）", "個人情報保護法26条（漏えい等の報告）"], "q": "緊急対応後、外部機関への報告書や記録はどの範囲まで作成・保管すればよいですか？", "cat": "外部機関の活用", "st": 5, "kw": "", "body": "外部機関への報告は、それぞれの機関のルールや様式に従う 法律で報告が必要になる主な場面：休業をともなう労働災害（労働基準監督署への労働者死傷病報告）、要配慮個人情報（病歴や障害など、特に慎重に扱う必要がある個人情報）の社外への漏えい（個人情報保護委員会への報告） 支援機関への共有は義務ではない。本人の同意を得て、必要な範囲で伝える 社内の記録は、外部への報告の有無にかかわらず残す：いつ、誰が、何を、どう対応したか（G10-043） どの機関に報告が必要かわからないときは、社労士や弁護士に確認する。 障害に関する情報を含む記録は、見られる人を限定して保管する。", "id": "G10-098"}, "G10-101": {"conclusion": "本人の状態が急に悪くなったとき、職場だけでは対応が難しいとき、本人と連絡が取れないときが、すぐに連絡する目安です。", "steps": ["本人の状態が急に変わり、緊急の対応が必要なとき：体調や精神状態の急な悪化、強い混乱やパニックが続く、など", "職場だけでは対応が難しいとき：本人との話し合いが進まない、どう対応すればよいかわからない、など", "本人と連絡が取れないとき（G10-029・G10-031）"], "steps_label": "連絡する目安", "cautions": ["命に関わる場合や、けがの危険がある場合は、支援機関より先に救急や警察に連絡する。", "支援機関への連絡は、原則として本人の同意を得て行う。命や身体を守るために必要で、同意を得るのが難しい場合は、同意なしでも連絡できる。", "どんなときに連絡するかは、事前に本人や支援機関と決めておく（G10-031）。", "地域障害者職業センター、障害者就業・生活支援センター、就労移行支援事業所など、本人がどこの支援を受けているかを知っておく。"], "prepare": [], "sources": ["個人情報保護法27条1項2号（人の生命・身体・財産の保護に必要な場合の第三者提供）"], "q": "地域障害者職業センターなどの支援機関に、緊急で連絡したほうがよいケースの目安はありますか？", "cat": "支援機関・家族との連携", "st": 5, "kw": "", "body": "本人の状態が急に変わり、緊急の対応が必要なとき：体調や精神状態の急な悪化、強い混乱やパニックが続く、など 職場だけでは対応が難しいとき：本人との話し合いが進まない、どう対応すればよいかわからない、など 本人と連絡が取れないとき（G10-029・G10-031） 命に関わる場合や、けがの危険がある場合は、支援機関より先に救急や警察に連絡する。 支援機関への連絡は、原則として本人の同意を得て行う。命や身体を守るために必要で、同意を得るのが難しい場合は、同意なしでも連絡できる。 どんなときに連絡するかは、事前に本人や支援機関と決めておく（G10-031）。 地域障害者職業センター、障害者就業・生活支援センター、就労移行支援事業所など、本人がどこの支援を受けているかを知っておく。", "id": "G10-101"}, "G11-001": {"conclusion": "勤怠が不安定になる理由は、体調の波、生活リズム、職場の要因などさまざまです。まず、いつ・何が起きたかを事実として記録してパターンをつかみ、理由に応じて対応します。連絡の方法を決めておき、生活面は支援機関と連携します。すぐの改善が難しい場合は、勤務時間の調整も選択肢です。", "general": [["理由を見極める", ["体調の波なのか、生活リズムの乱れなのか、職場の人間関係や業務量なのかで、打つ手が変わります。"]], ["事実を記録してパターンをつかむ", ["日付・曜日・時間帯、連絡の有無、本人の説明を記録します。特定の曜日や業務の前後に集中していないかが見えてきます。"]], ["連絡のルールを決める", ["誰に、何時までに、どの手段（チャット・メール・電話）で連絡するかを明確にします。", "チャットだけでなく、電話で声を聞くことも、様子をつかむ手がかりになります。"]], ["理由に応じて対応する", ["体調：本人の同意を得て、主治医や産業医の意見を聞き、配慮を考えます。", "生活リズム：会社だけでできることには限りがあるため、障害者就業・生活支援センターなどの支援機関と連携します。", "職場の要因：業務量や人間関係を見直します。"]], ["すぐの改善が難しい場合", ["勤務時間の短縮や始業時刻の変更などで、まず安定して出勤できる形にし、少しずつ戻します。", "配慮と同時に、守ってほしい勤怠の基準も本人に伝えておきます。"]], ["本人から見ると", ["休むことへの罪悪感や、電話で連絡することへの負担から、連絡が遅れることがある", "電話が苦手な人には、メールやチャットでの連絡も認めるなど、連絡しやすい方法を一緒に決める"]]], "sources": [], "q": "欠勤や遅刻が続くなど、勤怠が不安定な社員にどう対応すればよいですか？（精神障害のある社員の場合など）", "cat": "勤怠や様子の変化", "st": 5, "kw": "突発的な休みや遅刻が続く社員がいます。どのように指摘し、改善を促せばよいでしょうか？ 体調不良で急に休みがちになった社員への対応はどうすればよいですか？", "body": "理由を見極める 体調の波なのか、生活リズムの乱れなのか、職場の人間関係や業務量なのかで、打つ手が変わります。 事実を記録してパターンをつかむ 日付・曜日・時間帯、連絡の有無、本人の説明を記録します。特定の曜日や業務の前後に集中していないかが見えてきます。 連絡のルールを決める 誰に、何時までに、どの手段（チャット・メール・電話）で連絡するかを明確にします。 チャットだけでなく、電話で声を聞くことも、様子をつかむ手がかりになります。 理由に応じて対応する 体調：本人の同意を得て、主治医や産業医の意見を聞き、配慮を考えます。 生活リズム：会社だけでできることには限りがあるため、障害者就業・生活支援センターなどの支援機関と連携します。 職場の要因：業務量や人間関係を見直します。 すぐの改善が難しい場合 勤務時間の短縮や始業時刻の変更などで、まず安定して出勤できる形にし、少しずつ戻します。 配慮と同時に、守ってほしい勤怠の基準も本人に伝えておきます。 本人から見ると 休むことへの罪悪感や、電話で連絡することへの負担から、連絡が遅れることがある 電話が苦手な人には、メールやチャットでの連絡も認めるなど、連絡しやすい方法を一緒に決める", "id": "G11-001"}, "G11-012": {"conclusion": "休みがちになる背景は人によってさまざまで、障害の種類で決まるものではありません。まずは休みが増えている背景を本人と一緒に確認し、その背景に合わせて、業務量や働き方、体調管理の方法を見直します。", "general": [["休みが増える背景の例", ["体調の波や疲れやすさ、睡眠の乱れ", "季節や環境の変化、新しい環境や人間関係への緊張", "業務量が多すぎる、仕事の内容が合っていない", "困ったときに相談しにくい職場の雰囲気", "通院や家庭の事情など、仕事以外の理由"]], ["背景に合わせた対応の例", ["体調の波があるとき：調子を崩すサインと、そのときの対応を本人と決めておく", "業務量や内容が合わないとき：業務量を少しずつ調整し、内容を見直す", "相談しにくいとき：定期的な面談で、会社から声をかける（G5-024）", "通院などの事情があるとき：通院のための休みを取りやすくする（G6-100）", "会社だけで背景が分からないとき：本人の同意を得て、支援機関や主治医の意見も聞く"]], ["対応のポイント", ["障害名で決めつけず、一人ひとりの状況を確認する", "休んだことを責めるのではなく、どうすれば安定して働けるかを一緒に考える", "勤怠の記録をつけ、変化に早めに気づけるようにする（G6-063）", "配慮をしても欠勤が続き、業務に大きな支障が出る場合は、就業規則に沿った対応を考える"]]], "q": "休みがちな社員がいるとき、どのように考え、対応すればよいですか？", "cat": "勤怠や様子の変化", "st": 5, "kw": "", "body": "休みが増える背景の例 体調の波や疲れやすさ、睡眠の乱れ 季節や環境の変化、新しい環境や人間関係への緊張 業務量が多すぎる、仕事の内容が合っていない 困ったときに相談しにくい職場の雰囲気 通院や家庭の事情など、仕事以外の理由 背景に合わせた対応の例 体調の波があるとき：調子を崩すサインと、そのときの対応を本人と決めておく 業務量や内容が合わないとき：業務量を少しずつ調整し、内容を見直す 相談しにくいとき：定期的な面談で、会社から声をかける（G5-024） 通院などの事情があるとき：通院のための休みを取りやすくする（G6-100） 会社だけで背景が分からないとき：本人の同意を得て、支援機関や主治医の意見も聞く 対応のポイント 障害名で決めつけず、一人ひとりの状況を確認する 休んだことを責めるのではなく、どうすれば安定して働けるかを一緒に考える 勤怠の記録をつけ、変化に早めに気づけるようにする（G6-063） 配慮をしても欠勤が続き、業務に大きな支障が出る場合は、就業規則に沿った対応を考える", "id": "G11-012"}, "G11-002": {"conclusion": "まず、休職中の連絡窓口・方法・頻度を本人と決めます。本人の療養を最優先にしたうえで、本人の同意を得て業務の引き継ぎや周囲への説明を行い、休職期間・給与・傷病手当金などの制度を説明します。制度面の扱いは、障害のない社員と変わりません。", "general": [["連絡のルールを決める", ["誰が窓口になるか、どの手段で、どのくらいの頻度で連絡するかを決めます（例：人事から月1回メール）。", "療養の妨げにならないよう、連絡は必要最小限にします。"]], ["療養を最優先にする", ["休職中に業務の連絡をしない、復職を急がせないことを、上司や周囲にも共有しておきます。"]], ["引き継ぎと周囲への説明は本人の同意を得て", ["周囲に伝えるのは「しばらく休む」など、本人が同意した範囲までにします。病名や理由は伝えません。"]], ["制度を説明する", ["休職期間、休職中の給与、傷病手当金（健康保険から支給）、社会保険料の扱いなどを説明します。", "休職期間が満了したときの扱い（就業規則の規定）も、この段階で伝えておきます。"]], ["支援機関との連携", ["本人に支援機関がついている場合は、本人の同意を得て、休職に入ったことと連絡窓口を共有します。"]], ["本人から見ると", ["休職中は、「職場に迷惑をかけた」「戻る場所があるのか」と不安になりやすい", "会社として回復を待っていること、戻る場所があることを、最初に伝えておく"]]], "sources": ["全国健康保険協会「傷病手当金」"], "q": "障害のある社員が休職に入った時、職場はまず何から対応すればよいですか？", "cat": "休職・復職", "st": 5, "kw": "", "body": "連絡のルールを決める 誰が窓口になるか、どの手段で、どのくらいの頻度で連絡するかを決めます（例：人事から月1回メール）。 療養の妨げにならないよう、連絡は必要最小限にします。 療養を最優先にする 休職中に業務の連絡をしない、復職を急がせないことを、上司や周囲にも共有しておきます。 引き継ぎと周囲への説明は本人の同意を得て 周囲に伝えるのは「しばらく休む」など、本人が同意した範囲までにします。病名や理由は伝えません。 制度を説明する 休職期間、休職中の給与、傷病手当金（健康保険から支給）、社会保険料の扱いなどを説明します。 休職期間が満了したときの扱い（就業規則の規定）も、この段階で伝えておきます。 支援機関との連携 本人に支援機関がついている場合は、本人の同意を得て、休職に入ったことと連絡窓口を共有します。 本人から見ると 休職中は、「職場に迷惑をかけた」「戻る場所があるのか」と不安になりやすい 会社として回復を待っていること、戻る場所があることを、最初に伝えておく", "id": "G11-002"}, "G11-003": {"conclusion": "休職を繰り返す場合は、まず前回の復職の判断が適切だったかを振り返ります。次の復職では、試し出勤や段階的な復帰でステップを細かくし、再発のサインを本人と共有します。主治医・産業医・リワーク（復職に向けた支援）など専門家の意見を丁寧に聞き、業務との相性も見直します。", "general": [["復職の判断を見直す", ["「日常生活が送れる」ことと「働ける」ことは別です。前回、業務に耐えられる回復の状態を確認できていたかを振り返ります。", "復職の判断基準（通勤できるか、決まった時間働けるか、業務をこなせるか）を明確にしておきます。"]], ["復帰のステップを細かくする", ["試し出勤や、短時間勤務から始める段階的な復帰で、無理なく戻れる形にします。"]], ["再発のサインを共有する", ["睡眠の乱れ、遅刻の増加、表情の変化など、本人に出やすいサインと、そのときの対応を本人と決めておきます。"]], ["専門家の意見を聞く", ["本人の同意を得て、主治医・産業医の意見を聞きます。", "復職前のリハビリとして、リワーク（医療機関や地域障害者職業センターの職場復帰支援）の利用も選択肢です。"]], ["業務との相性を見直す", ["業務内容や負荷が不調の原因になっていないかを確認し、必要なら業務や配置を見直します。"]], ["就業規則も確認する", ["同じ病気での再休職の際に休職期間を通算するかどうかなど、就業規則の規定を確認しておきます（G11-007）。"]]], "sources": ["厚生労働省「心の健康問題により休業した労働者の職場復帰支援の手引き」"], "q": "メンタル不調で休職を繰り返す社員に、どう対応すればよいですか？", "cat": "休職・復職", "st": 5, "kw": "", "body": "復職の判断を見直す 「日常生活が送れる」ことと「働ける」ことは別です。前回、業務に耐えられる回復の状態を確認できていたかを振り返ります。 復職の判断基準（通勤できるか、決まった時間働けるか、業務をこなせるか）を明確にしておきます。 復帰のステップを細かくする 試し出勤や、短時間勤務から始める段階的な復帰で、無理なく戻れる形にします。 再発のサインを共有する 睡眠の乱れ、遅刻の増加、表情の変化など、本人に出やすいサインと、そのときの対応を本人と決めておきます。 専門家の意見を聞く 本人の同意を得て、主治医・産業医の意見を聞きます。 復職前のリハビリとして、リワーク（医療機関や地域障害者職業センターの職場復帰支援）の利用も選択肢です。 業務との相性を見直す 業務内容や負荷が不調の原因になっていないかを確認し、必要なら業務や配置を見直します。 就業規則も確認する 同じ病気での再休職の際に休職期間を通算するかどうかなど、就業規則の規定を確認しておきます（G11-007）。", "id": "G11-003"}, "G11-004": {"conclusion": "復職はステップを踏んで進めます。主治医の診断書 → 産業医との面談 → 会社としての復職判定 → 短時間勤務などの段階的な復帰、が基本の流れです。職場は、本人を腫れ物のように扱わないよう、受け入れ方と業務の進め方を事前に確認しておきます。", "general": [["復職までの流れ", ["① 主治医の診断書：復職可能という主治医の判断を確認します。", "② 産業医との面談：主治医の判断は日常生活の回復が中心のことがあるため、職場で働ける状態かを産業医が確認します。", "③ 復職の判定と復職プランの作成：勤務時間、業務内容、配慮、フォローの予定を決めます。", "④ 段階的な復帰：短時間勤務や軽い業務から始め、様子を見ながら戻します。"]], ["試し出勤を使う場合", ["休職中に通勤や短時間の勤務を試す制度です。賃金や労災の扱いを、事前に就業規則などで決めておきます。"]], ["職場の受け入れ準備", ["上司や周囲と、本人への接し方を確認しておきます。腫れ物に触るような対応は、かえって本人の居づらさにつながります。", "「無理に仕事を頼まず、徐々に戻していく」ことを職場で共有します。", "周囲への説明は、本人が同意した範囲にとどめます。"]], ["復職後のフォロー", ["復職後しばらくは、定期的に面談して体調と業務の状況を確認し、段階を進めるか判断します。", "必要に応じて、合理的配慮の内容も見直します。"]]], "charts": [{"type": "table", "title": "復職までの流れ（一例）", "head": ["段階", "やること", "職場の準備"], "rows": [["① 主治医の診断書", "主治医が「復職できる」と判断したかを確認する", "本人と連絡のルールを決めておく"], ["② 産業医との面談", "職場で働ける状態かを産業医が確認する", "復職後の業務内容の候補を考えておく"], ["③ 復職の判定とプラン", "勤務時間、業務内容、配慮、面談の予定を決める", "上司や周囲と、接し方と業務の進め方を確認する"], ["④ 段階的な復帰", "短時間勤務や軽い業務から始め、様子を見て戻す", "定期的に面談し、段階を進めるか判断する"]], "note": "進め方や期間は、本人の状態や会社の制度によって変わります。"}], "sources": ["厚生労働省「心の健康問題により休業した労働者の職場復帰支援の手引き」"], "q": "休職から復職するまでの流れと、職場で準備しておくことは何ですか？", "cat": "休職・復職", "st": 5, "kw": "休職から復職するタイミングの判断は、主治医と産業医のどちらの意見を優先すべきか。", "body": "復職までの流れ ① 主治医の診断書：復職可能という主治医の判断を確認します。 ② 産業医との面談：主治医の判断は日常生活の回復が中心のことがあるため、職場で働ける状態かを産業医が確認します。 ③ 復職の判定と復職プランの作成：勤務時間、業務内容、配慮、フォローの予定を決めます。 ④ 段階的な復帰：短時間勤務や軽い業務から始め、様子を見ながら戻します。 試し出勤を使う場合 休職中に通勤や短時間の勤務を試す制度です。賃金や労災の扱いを、事前に就業規則などで決めておきます。 職場の受け入れ準備 上司や周囲と、本人への接し方を確認しておきます。腫れ物に触るような対応は、かえって本人の居づらさにつながります。 「無理に仕事を頼まず、徐々に戻していく」ことを職場で共有します。 周囲への説明は、本人が同意した範囲にとどめます。 復職後のフォロー 復職後しばらくは、定期的に面談して体調と業務の状況を確認し、段階を進めるか判断します。 必要に応じて、合理的配慮の内容も見直します。 復職までの流れ（一例） ① 主治医の診断書 主治医が「復職できる」と判断したかを確認する 本人と連絡のルールを決めておく ② 産業医との面談 職場で働ける状態かを産業医が確認する 復職後の業務内容の候補を考えておく ③ 復職の判定とプラン 勤務時間、業務内容、配慮、面談の予定を決める 上司や周囲と、接し方と業務の進め方を確認する ④ 段階的な復帰 短時間勤務や軽い業務から始め、様子を見て戻す 定期的に面談し、段階を進めるか判断する", "id": "G11-004"}, "G11-005": {"conclusion": "手帳の情報は、本人が自分の意思で打ち明けたものです。まず療養と休職の手続きを優先したうえで、本人がどう扱ってほしいのか（障害者雇用として扱ってほしいのか、配慮を求めているのか）を確認します。復職に向けては合理的配慮を考えます。手帳を持っていることを理由に、雇用形態や労働条件を変えてはいけません。", "general": [["まず療養と休職の手続き", ["打ち明けられた内容への対応より、本人の療養と休職の手続きを先に進めます。"]], ["本人の意図を確認する", ["障害者雇用として扱ってほしいのか、復職時の配慮を求めているのか、単に知っておいてほしいのかを確認します。", "障害者雇用率の算定（雇用状況報告）に含める場合は、その目的を伝えて本人の同意を得ます。"]], ["合理的配慮を考える", ["障害があることを把握した以上、復職に向けて、職場での支障と必要な配慮を本人と話し合います（G11-004）。"]], ["労働条件を変えない", ["手帳を持っていることを理由に、総合職からパート社員へ変えるなど、雇用形態や労働条件を変えるのは、障害を理由とした不利益な取扱いにあたるおそれがあります。"]], ["情報の扱いに注意する", ["手帳の情報を誰に共有するかは、本人の同意を得て決めます。"]]], "sources": ["厚生労働省「プライバシーに配慮した障害者の把握・確認ガイドライン」", "厚生労働省「障害者差別禁止指針」"], "q": "休職に入るタイミングで、実は障害者手帳を持っていると打ち明けられました。どこから手をつければよいですか？", "cat": "休職・復職", "st": 5, "kw": "", "body": "まず療養と休職の手続き 打ち明けられた内容への対応より、本人の療養と休職の手続きを先に進めます。 本人の意図を確認する 障害者雇用として扱ってほしいのか、復職時の配慮を求めているのか、単に知っておいてほしいのかを確認します。 障害者雇用率の算定（雇用状況報告）に含める場合は、その目的を伝えて本人の同意を得ます。 合理的配慮を考える 障害があることを把握した以上、復職に向けて、職場での支障と必要な配慮を本人と話し合います（G11-004）。 労働条件を変えない 手帳を持っていることを理由に、総合職からパート社員へ変えるなど、雇用形態や労働条件を変えるのは、障害を理由とした不利益な取扱いにあたるおそれがあります。 情報の扱いに注意する 手帳の情報を誰に共有するかは、本人の同意を得て決めます。", "id": "G11-005"}, "G11-007": {"conclusion": "病状を判断するのは医師の領域なので、会社が診断書の内容そのものを否定することはしません。会社が判断の材料にするのは、業務を遂行できるかと、勤怠の事実です。医療的な判断に疑問がある場合は、現場だけで判断せず、産業医など専門家の意見を踏まえます。休職の扱いは、就業規則の規定と照らし合わせて判断します。", "general": [["診断の内容は否定しない", ["「本当は病気ではないのでは」と現場が判断するのは、トラブルの大きなリスクになります。"]], ["会社は事実で判断する", ["業務を遂行できているか、勤怠がどうなっているかを、日付や内容とともに記録します。"]], ["疑問があれば専門家に", ["産業医との面談を設定し、意見を聞きます。", "本人の同意を得て、主治医に就業上の配慮や見通しを問い合わせることもできます。", "就業規則に定めがあれば、会社が指定する医師の受診を求めることも考えられます（扱いは社労士などに確認）。"]], ["就業規則の休職規定と照らし合わせる", ["病名が変わっても休職期間を通算するのか、病名が異なれば新たに休職期間が始まるのかは、会社によって異なります。", "まず自社の規定を確認し、それに沿って判断します。規定があいまいな場合は、今後に向けて見直しを考えます。"]]], "sources": [], "q": "病状の異なる診断書を次々に出して休職を繰り返すなど、対応に疑問を感じるケースはどう考えればよいですか？", "cat": "休職・復職", "st": 5, "kw": "", "body": "診断の内容は否定しない 「本当は病気ではないのでは」と現場が判断するのは、トラブルの大きなリスクになります。 会社は事実で判断する 業務を遂行できているか、勤怠がどうなっているかを、日付や内容とともに記録します。 疑問があれば専門家に 産業医との面談を設定し、意見を聞きます。 本人の同意を得て、主治医に就業上の配慮や見通しを問い合わせることもできます。 就業規則に定めがあれば、会社が指定する医師の受診を求めることも考えられます（扱いは社労士などに確認）。 就業規則の休職規定と照らし合わせる 病名が変わっても休職期間を通算するのか、病名が異なれば新たに休職期間が始まるのかは、会社によって異なります。 まず自社の規定を確認し、それに沿って判断します。規定があいまいな場合は、今後に向けて見直しを考えます。", "id": "G11-007"}, "G11-008": {"conclusion": "産業医との面談や医療機関の受診を通じて、医学的な根拠をもとに判断することが大前提です。会社には社員の健康を守る責任があるため、健康上のリスクを見過ごすことはできません。就業規則に休職を命じられる規定があれば、それを確認したうえで、会社として休職を命じることもできます。ただし、本人は休職を拒んでいるので、理由を丁寧に説明することもあわせて必要です。", "general": [["医学的な根拠をもとに判断する", ["産業医との面談を設定し、必要に応じて受診を勧めて、主治医の意見も確認します（G10-010）。", "上司の印象だけで休職を判断しないようにします。"]], ["拒む理由を聞く", ["収入が減る不安、評価や居場所を失う不安、「休むと負けだ」という気持ちなど、拒む背景を確認します。", "休職中の給与や傷病手当金、休職期間、復職の流れを説明すると、不安が和らぐことがあります（G11-002・G11-004）。"]], ["段階的な方法も考える", ["いきなり休職ではなく、業務量を減らす、短時間勤務にするなどで様子を見る方法もあります。ただし、健康上のリスクが高い場合は休職を優先します。"]], ["就業規則にもとづいて命じる", ["就業規則に「会社が休職を命じることができる」規定があるかを確認します。", "規定があり、医師の意見など根拠がそろっている場合は、会社として休職を命じることができます。命じる前に、社労士などの専門家に確認します。"]], ["丁寧に伝える", ["休職は本人を守るためのものであることを、医師の意見とともに丁寧に説明します。", "説明した内容と本人の反応は、記録に残します。"]]], "sources": ["労働契約法 第5条（安全配慮義務）"], "q": "休職を考えたほうがよい状態の社員が、休職を拒んでいる場合、どう判断すればよいですか？", "cat": "休職・復職", "st": 5, "kw": "", "body": "医学的な根拠をもとに判断する 産業医との面談を設定し、必要に応じて受診を勧めて、主治医の意見も確認します（G10-010）。 上司の印象だけで休職を判断しないようにします。 拒む理由を聞く 収入が減る不安、評価や居場所を失う不安、「休むと負けだ」という気持ちなど、拒む背景を確認します。 休職中の給与や傷病手当金、休職期間、復職の流れを説明すると、不安が和らぐことがあります（G11-002・G11-004）。 段階的な方法も考える いきなり休職ではなく、業務量を減らす、短時間勤務にするなどで様子を見る方法もあります。ただし、健康上のリスクが高い場合は休職を優先します。 就業規則にもとづいて命じる 就業規則に「会社が休職を命じることができる」規定があるかを確認します。 規定があり、医師の意見など根拠がそろっている場合は、会社として休職を命じることができます。命じる前に、社労士などの専門家に確認します。 丁寧に伝える 休職は本人を守るためのものであることを、医師の意見とともに丁寧に説明します。 説明した内容と本人の反応は、記録に残します。", "id": "G11-008"}, "G11-006": {"conclusion": "在職中にうつ病などの病気やけがで障害を負うことは、どの職場でも起こりえます。まず本人の意向と回復の状況を確認し、合理的配慮を考えます。それまでの仕事が障害の影響で難しい場合は、職務の見直しも含めて考えます。あわせて、外部の支援機関や制度ともつながっていきます。", "general": [["本人の意向と回復状況を確認する", ["どの程度回復しているか、どんな働き方を望んでいるかを、本人と、本人の同意を得て主治医にも確認します。"]], ["合理的配慮を考える", ["それまで配慮がなかった社員でも、障害によって支障が出ていれば、合理的配慮の対象になります。手帳の有無は問いません（G6-004）。"]], ["職務を見直す", ["元の仕事を続けられるよう配慮できないかを、まず考えます。", "障害の影響でどうしても難しい場合は、本人と話し合い、業務内容や配置を見直します。"]], ["外部の支援機関や制度とつながる", ["地域障害者職業センター（職場復帰支援、ジョブコーチ）や障害者就業・生活支援センターなど、職場だけでは担えない支援を受けられます。", "中途障害者の職場復帰に使える助成金もあります。最新の制度は都道府県労働局などで確認します。"]], ["手帳の取得は本人が決める", ["手帳を取るかどうかは本人の判断です。職場から取得を強く求めることは避けます。"]], ["本人から見ると", ["障害を負う前の自分と比べて、落ち込んだり、障害を受け入れるまでに時間がかかったりすることがある", "できなくなったことより、今できること、これからできることに目を向けて、一緒に仕事を組み立てる"]]], "sources": ["厚生労働省「合理的配慮指針」"], "q": "在職中に病気やけがで障害を負った社員（精神疾患を含む）に、どう対応すればよいですか？", "cat": "在職中の障害", "st": 5, "kw": "在職中に新たに障害が判明した社員への配慮は、既存の配慮制度とどう整合させるべきか。 採用後に社員の障害が判明した場合、合理的配慮の提供義務は生じますか？", "body": "本人の意向と回復状況を確認する どの程度回復しているか、どんな働き方を望んでいるかを、本人と、本人の同意を得て主治医にも確認します。 合理的配慮を考える それまで配慮がなかった社員でも、障害によって支障が出ていれば、合理的配慮の対象になります。手帳の有無は問いません（G6-004）。 職務を見直す 元の仕事を続けられるよう配慮できないかを、まず考えます。 障害の影響でどうしても難しい場合は、本人と話し合い、業務内容や配置を見直します。 外部の支援機関や制度とつながる 地域障害者職業センター（職場復帰支援、ジョブコーチ）や障害者就業・生活支援センターなど、職場だけでは担えない支援を受けられます。 中途障害者の職場復帰に使える助成金もあります。最新の制度は都道府県労働局などで確認します。 手帳の取得は本人が決める 手帳を取るかどうかは本人の判断です。職場から取得を強く求めることは避けます。 本人から見ると 障害を負う前の自分と比べて、落ち込んだり、障害を受け入れるまでに時間がかかったりすることがある できなくなったことより、今できること、これからできることに目を向けて、一緒に仕事を組み立てる", "id": "G11-006"}, "G12-001": {"conclusion": "本人への合理的配慮と、周囲の社員のメンタルケアは、分けて考えます。周囲が負担やストレスを抱えたままの配慮は長続きしません。周囲の負担感を確認し、業務量の調整や相談できる場を用意します。あわせて、本人が周囲に頼りきりにならず、自分でセルフケアできる関係をつくることで、周囲の負担を減らします。", "general": [["配慮と周囲のケアは別に考える", ["本人に配慮しているから周囲は我慢しなければならない、ということにはなりません。周囲のケアも職場の責任です。"]], ["周囲の負担感を確認する", ["定期的に周囲の社員と話し、負担やストレスを把握します。特定の人に負担が集中していないかも見ます。"]], ["業務量の調整と相談の場", ["負担が大きい場合は、業務の分担や量を調整します。", "上司・人事・産業医など、周囲の社員が相談できる場を用意します。"]], ["本人のセルフケアを育てる", ["本人が体調管理や困りごとの伝え方を身につけ、自分で対処できる範囲を広げていくと、周囲の負担も減ります（G5-011）。", "本人の自立を土台に、それを上司が支える（ラインケア）という関係が目指す形です。"]], ["職場全体の仕組みとして", ["厚労省の指針にある4つのケア（セルフケア、上司によるラインケア、産業医など社内の専門職によるケア、社外の機関によるケア）を、周囲の社員にも同じように適用します。"]], ["会社の考え方として伝える", ["合理的配慮は会社の義務であり、特別扱いではないことを、職場全体で共有する（G7-003）", "同時に、周囲の社員の負担も会社として受け止め、業務の分担を見直すことを伝える"]]], "sources": ["厚生労働省「労働者の心の健康の保持増進のための指針」"], "q": "障害のある社員と一緒に働く周りの社員のメンタルケアは、どう考えればよいですか？", "cat": "周囲の社員のケア", "st": 4, "kw": "特定の社員に業務のしわ寄せが集中しているという訴えがあった場合、緊急に確認すべきことは何か。 特定の社員に障害者雇用対応の負担が集中しています。どう改善すればよいですか？", "body": "配慮と周囲のケアは別に考える 本人に配慮しているから周囲は我慢しなければならない、ということにはなりません。周囲のケアも職場の責任です。 周囲の負担感を確認する 定期的に周囲の社員と話し、負担やストレスを把握します。特定の人に負担が集中していないかも見ます。 業務量の調整と相談の場 負担が大きい場合は、業務の分担や量を調整します。 上司・人事・産業医など、周囲の社員が相談できる場を用意します。 本人のセルフケアを育てる 本人が体調管理や困りごとの伝え方を身につけ、自分で対処できる範囲を広げていくと、周囲の負担も減ります（G5-011）。 本人の自立を土台に、それを上司が支える（ラインケア）という関係が目指す形です。 職場全体の仕組みとして 厚労省の指針にある4つのケア（セルフケア、上司によるラインケア、産業医など社内の専門職によるケア、社外の機関によるケア）を、周囲の社員にも同じように適用します。 会社の考え方として伝える 合理的配慮は会社の義務であり、特別扱いではないことを、職場全体で共有する（G7-003） 同時に、周囲の社員の負担も会社として受け止め、業務の分担を見直すことを伝える", "id": "G12-001"}, "G12-005": {"conclusion": "同僚は指揮命令の立場にはありませんが、協力によって障害者雇用が前に進むことは多くあります。何を期待し、どこから先はやらなくてよいかを線引きして伝えます。負担がかかりすぎていないか声をかけて確認し、協力していることをきちんと評価します。", "general": [["期待する役割を明確にする", ["例：業務の手順でわからないときの相談相手、日々の様子の変化に気づいたら上司に伝える、など。", "「何となく面倒を見て」では、同僚が何をどこまでしてよいかわからず、負担が膨らみます。"]], ["やらなくてよいことも伝える", ["指導や評価、体調の判断、私生活の相談などは上司や人事の役割で、同僚が担う必要はないと伝えます。"]], ["負担を確認し、相談先を示す", ["定期的に声をかけ、負担がかかりすぎていないかを確認します。", "困ったときは一人で対応せず、上司に相談するよう伝えておきます（G12-001）。"]], ["協力を評価する", ["同僚としての協力を当たり前と扱わず、感謝を伝え、人事評価にも反映します。"]], ["本人の情報の扱い", ["同僚に伝える本人の情報は、本人が同意した範囲までにします（G6-003）。"]]], "sources": [], "q": "本人と上司の間にいる同僚に、どのような役割を期待し、どう支えればよいですか？", "cat": "周囲の社員のケア", "st": 4, "kw": "", "body": "期待する役割を明確にする 例：業務の手順でわからないときの相談相手、日々の様子の変化に気づいたら上司に伝える、など。 「何となく面倒を見て」では、同僚が何をどこまでしてよいかわからず、負担が膨らみます。 やらなくてよいことも伝える 指導や評価、体調の判断、私生活の相談などは上司や人事の役割で、同僚が担う必要はないと伝えます。 負担を確認し、相談先を示す 定期的に声をかけ、負担がかかりすぎていないかを確認します。 困ったときは一人で対応せず、上司に相談するよう伝えておきます（G12-001）。 協力を評価する 同僚としての協力を当たり前と扱わず、感謝を伝え、人事評価にも反映します。 本人の情報の扱い 同僚に伝える本人の情報は、本人が同意した範囲までにします（G6-003）。", "id": "G12-005"}, "G12-006": {"conclusion": "本人への配慮（ダブルチェック、業務量の調整、体調不良時の代わりの対応など）は、指導する社員や周囲の負担を大きくすることがあります。指導を「本来の業務」として位置づけ、業務量を見直し、相談先を用意し、その働きをきちんと評価して感謝を伝えることが大切です。", "general": [["指導を業務として位置づける", ["指導や支えを、善意や「ついで」ではなく、正式な業務として本人と周囲に伝える", "指導にかかる時間を見込んで、指導する社員自身の業務量を見直す", "指導の役割を一人に集中させず、複数の人で分担できるようにする"]], ["相談先を用意する", ["指導する社員が困ったときに相談できる先（人事、上司、産業医、支援機関など）を決めておく", "定期的に、指導する社員とも面談し、困りごとや負担を聞く", "支援機関やジョブコーチから、教え方や関わり方の助言を受けられるようにする（G5-015）"]], ["必要な知識を伝える", ["本人の同意を得た範囲で、特性や配慮の内容を共有する", "障害の理解や教え方についての研修や情報提供の機会をつくる"]], ["評価と感謝を伝える", ["指導やフォローの働きを、人事評価にきちんと反映する", "日ごろから、上司や会社として感謝を言葉で伝える"]]], "phrases": ["「指導をお願いしている分、ほかの業務はこう調整しますね」", "「困ったことがあれば、一人で抱えずに相談してください」", "「いつも支えてくれてありがとう。とても助かっています」"], "sources": ["障害者雇用促進法79条（障害者を5人以上雇用する事業所は、障害者職業生活相談員を選任して相談・指導を行う）"], "q": "障害のある社員を指導する立場の社員に対しての支えをどのようにすればよいか教えてほしい", "cat": "周囲の社員のケア", "st": 4, "kw": "", "body": "指導を業務として位置づける 指導や支えを、善意や「ついで」ではなく、正式な業務として本人と周囲に伝える 指導にかかる時間を見込んで、指導する社員自身の業務量を見直す 指導の役割を一人に集中させず、複数の人で分担できるようにする 相談先を用意する 指導する社員が困ったときに相談できる先（人事、上司、産業医、支援機関など）を決めておく 定期的に、指導する社員とも面談し、困りごとや負担を聞く 支援機関やジョブコーチから、教え方や関わり方の助言を受けられるようにする（G5-015） 必要な知識を伝える 本人の同意を得た範囲で、特性や配慮の内容を共有する 障害の理解や教え方についての研修や情報提供の機会をつくる 評価と感謝を伝える 指導やフォローの働きを、人事評価にきちんと反映する 日ごろから、上司や会社として感謝を言葉で伝える 「指導をお願いしている分、ほかの業務はこう調整しますね」 「困ったことがあれば、一人で抱えずに相談してください」 「いつも支えてくれてありがとう。とても助かっています」", "id": "G12-006"}, "G12-002": {"conclusion": "障害のある社員への対応は、すぐに大きく前に進むとは限りません。「時間がかかるもの」という共通認識を持ち、小さな前進を確認し合うことが大切です。そのうえで、キーパーソン一人に役割を担わせすぎず、複数の人で問題を見る体制をつくります。", "general": [["時間がかかることを前提にする", ["どれだけ時間がかかるかはケースによります。「すぐ解決しないのは対応が悪いから」ではないことを、上司や人事も含めて共有しておきます。"]], ["小さな前進を言葉にする", ["「先月より遅刻が減った」「自分から相談できるようになった」など、小さな変化を記録し、キーパーソンと一緒に確認します。"]], ["一人に担わせすぎない", ["キーパーソン一人が抱え込むと、負担が重くなり、もやもやも晴れません。", "上司・人事・支援機関など複数の人で問題を見る体制にし、役割を分担します。"]], ["キーパーソン自身のケア", ["定期的にキーパーソンの話を聞く場を設け、負担や迷いを吐き出せるようにします（G12-001）。", "社外の支援機関や、他社の担当者とのつながりも支えになります（G12-003）。"]]], "sources": [], "q": "解決に時間がかかるケースで、キーパーソンのモチベーションをどう保てばよいですか？", "cat": "担当者・キーパーソンのケア", "st": 4, "kw": "支援担当者自身のメンタルケアが手薄になりがちです。どうすればよいですか？", "body": "時間がかかることを前提にする どれだけ時間がかかるかはケースによります。「すぐ解決しないのは対応が悪いから」ではないことを、上司や人事も含めて共有しておきます。 小さな前進を言葉にする 「先月より遅刻が減った」「自分から相談できるようになった」など、小さな変化を記録し、キーパーソンと一緒に確認します。 一人に担わせすぎない キーパーソン一人が抱え込むと、負担が重くなり、もやもやも晴れません。 上司・人事・支援機関など複数の人で問題を見る体制にし、役割を分担します。 キーパーソン自身のケア 定期的にキーパーソンの話を聞く場を設け、負担や迷いを吐き出せるようにします（G12-001）。 社外の支援機関や、他社の担当者とのつながりも支えになります（G12-003）。", "id": "G12-002"}, "G12-003": {"conclusion": "担当者を孤立させないためには、周囲が支える仕組みをつくります。相談や報告のルートを決め、外部の支援機関とつながり、社内の他部署の担当者とのネットワークをつくり、定期的に一緒に振り返る場を設けます。", "general": [["相談・上の立場の人への報告・相談のルートを決める", ["担当者が判断に迷ったときに、誰に、どの順で相談するかを決めておきます（上司、人事、産業医など）。"]], ["外部の支援機関とつながる", ["本人の支援機関や、地域障害者職業センター、障害者就業・生活支援センターなど、相談できる社外の窓口を持っておきます。"]], ["担当者同士のネットワークをつくる", ["社内の他部署で障害者雇用を担当している人同士で、情報や悩みを共有できる場をつくります。", "社外でも、企業の担当者が集まる勉強会や交流会に参加すると、視野が広がります。"]], ["定期的に振り返る", ["担当者を交えて、月1回など定期的にケースを振り返る場を設けます。一人で判断を抱え込まない仕組みになります。"]], ["担当を組織の役割として位置づける", ["担当業務を個人の善意に頼らず、職務として明確にし、評価にも反映します。"]]], "sources": [], "q": "障害者雇用の担当者が孤立しないために、どのような工夫ができますか？", "cat": "担当者・キーパーソンのケア", "st": 4, "kw": "現場の運営担当者が、業務指導と障害への配慮対応の両方を一人で抱えて疲弊しています。どう改善すればよいですか？ 人事だけが孤軍奮闘していて、現場を巻き込めません。どうすればよいですか？", "body": "相談・上の立場の人への報告・相談のルートを決める 担当者が判断に迷ったときに、誰に、どの順で相談するかを決めておきます（上司、人事、産業医など）。 外部の支援機関とつながる 本人の支援機関や、地域障害者職業センター、障害者就業・生活支援センターなど、相談できる社外の窓口を持っておきます。 担当者同士のネットワークをつくる 社内の他部署で障害者雇用を担当している人同士で、情報や悩みを共有できる場をつくります。 社外でも、企業の担当者が集まる勉強会や交流会に参加すると、視野が広がります。 定期的に振り返る 担当者を交えて、月1回など定期的にケースを振り返る場を設けます。一人で判断を抱え込まない仕組みになります。 担当を組織の役割として位置づける 担当業務を個人の善意に頼らず、職務として明確にし、評価にも反映します。", "id": "G12-003"}, "G12-004": {"conclusion": "キーパーソンは、本人と会社の橋渡し役です。会社側に寄りすぎると本人の信頼を得られず、本人側に寄りすぎると会社として求めることとずれてしまうため、中立の立場が基本です。ただし前提として、会社は本人に戦力として働いてもらうことを目指しています。本人の立場を理解しつつ、雇用をどう成果につなげるかという姿勢を持つことが大切です。", "general": [["橋渡し役", ["本人の困りごとや希望を職場に伝え、職場が求めることや期待を本人に伝える、双方向の役割です。"]], ["どちらにも寄りすぎない", ["会社側に寄りすぎる：本人が本音を話さなくなり、困りごとに早く気づけなくなります。", "本人側に寄りすぎる：配慮が過剰になったり、会社として求める業務や基準とずれたりします（G6-008）。"]], ["前提は「戦力として働いてもらう」こと", ["中立とは、どちらの言い分も聞くという意味で、ゴールがないという意味ではありません。", "本人が力を発揮し、成果につながるように支えることが、本人にとっても会社にとっても目指す姿です（G6-009）。"]], ["一人で抱えない", ["板挟みになりやすい立場なので、上司や人事、支援機関と役割を分担し、判断を一人で背負わないようにします（G12-003）。"]]], "sources": [], "q": "キーパーソンとして、本人と職場の間でどのような立ち位置でいればよいですか？", "cat": "担当者・キーパーソンのケア", "st": 4, "kw": "現場リーダーはどのようなことをすればよいか知りたい", "body": "橋渡し役 本人の困りごとや希望を職場に伝え、職場が求めることや期待を本人に伝える、双方向の役割です。 どちらにも寄りすぎない 会社側に寄りすぎる：本人が本音を話さなくなり、困りごとに早く気づけなくなります。 本人側に寄りすぎる：配慮が過剰になったり、会社として求める業務や基準とずれたりします（G6-008）。 前提は「戦力として働いてもらう」こと 中立とは、どちらの言い分も聞くという意味で、ゴールがないという意味ではありません。 本人が力を発揮し、成果につながるように支えることが、本人にとっても会社にとっても目指す姿です（G6-009）。 一人で抱えない 板挟みになりやすい立場なので、上司や人事、支援機関と役割を分担し、判断を一人で背負わないようにします（G12-003）。", "id": "G12-004"}, "G3-008": {"conclusion": "「障害のある人に任せられる仕事」を探すと、候補は限られてしまいます。まずは障害を前提にせず、困っている仕事、手が回っていない仕事、やりたくてもできていない仕事を出し、業務を細かい作業（タスク）に分けて考えます。1つ1つは小さな作業でも、集めて組み立てれば1人分の仕事になります。定型的な作業に限らず、総合職や専門職レベルの業務も対象に含めて考えることが大切です。", "general": [["仕事探しの3つの考え方", ["障害者を前提にせず、「業務」から考える。誰が担えるかは、業務を出しきった後に考える", "外部委託や派遣社員が担っている業務も、社内の仕事に戻す候補にする", "雇用区分は総合職も含めて広く捉える。品質データの分析、作業標準書の作成、設備の保全、検査・分析など、専門性のある業務も対象にする"]], ["仕事の組み立て方", ["足し算：業務を作業に分け、切り出せる作業を集めて1つの仕事に組み立てる", "引き算：今の職種を作業に分け、本人が苦手なことを除いて、得意な作業に集中してもらう", "作業に分けるときは、準備・作業・確認や記録・片付けといった工程に分けると見つけやすい", "やり方を変えることも仕事づくりの一部。たとえば、週末にまとめて行っていた作業を毎日の作業に変えると、継続した仕事になる"]], ["探す範囲を広げる視点", ["日々の業務の流れの中で、若手社員が担っている準備や、結果の整理・集計などを代わりに担う", "今は手が回っていないが、時間があれば取り組みたかった業務", "業務のデジタル化にともなって、これから発生する業務（G3-015）", "経験や専門性を活かせる業務。たとえば、病気で現場を離れた社員が、設備の保全や社内研修の講師を担っている例もある"]], ["配置の形も合わせて考える", ["1つの部署で1人分の仕事が集まらなくても、同じ部署の中で小さな業務を足し算すると、1人分に近づくことがある", "各部署に1人ずつ配置するだけでなく、複数の部署から業務を集め、それを担う人を1か所（チーム）に採用・配置する方法もある（個別配置と集約型の比較はG3-009）"]], ["具体化と優先順位", ["「何を（What）」だけでなく「どのように（How）」まで書き出す。判断の多さ、やり取りの多さ、納期の厳しさを確認する", "判断が必要な業務でも、判断の軸（基準）を決めておけば任せられることが多い。たとえば「測定値が基準値以下かを確認する」「在庫が決めた数を下回ったら発注リストに入れる」「この条件なら上司に確認する」など、基準と迷ったときの相談先をセットで示す", "発生頻度（量が確保できるか）、現場の負担感、必要なスキル、会社としての成果を見て、取り組みやすく効果の大きい仕事から始める", "いきなり求人票から始めず、研修 → 各部署でのワークシート記入 → ヒアリングの順で、現場の不安を聞きながら合意をつくる（G1-010）"]], ["新しい仕事を作るときの注意", ["一時的な寄せ集めにならないよう、継続して発生する量があるかを確認する", "担当する上司や、指示を出す人を決めておく"]]], "charts": [{"type": "table", "title": "実務のチェックポイント（職域開拓）", "head": ["項目", "確認すること"], "rows": [["目的の共有", "障害者雇用の目的（なぜ行うか）が、経営層・人事・現場でそろっているか。法定雇用率への対応だけになっていないか"], ["業務の具体化", "受け入れ部署と業務を、採用活動の前に「何を（What）」「どのように（How）」まで具体化しているか"], ["求人候補の整理", "求人の候補を、雇用形態や採用ルートまで含めて一覧にしているか"], ["現場の不安", "現場の不安や心配を聞き取り、解決策とあわせて進めているか"]], "note": "ほかの段階のチェックポイントは G1-010 に一覧があります。", "xlsx": "tools/checklist-01-shokuiki.xlsx", "xlsx_name": "01_職域開拓チェックリスト.xlsx", "check": true}], "sources": ["JEED 障害者雇用事例リファレンスサービス"], "links": [["JEED 障害者雇用事例リファレンスサービス", "https://www.ref.jeed.go.jp/"]], "q": "「任せられる仕事がない」「1人分の仕事量がない」と言われます。どう進めればよいですか？", "cat": "仕事の切り出し", "st": 0, "kw": "やってもらえる仕事がないのではないか 自職場の業務分析が必要と感じたが、留意点を教えてほしい 障害のある社員に新しい仕事を任せたいのですが、どのように業務を切り出し、依頼すればスムーズに進むでしょうか？ 新しい役割（ジョブ）を障害者雇用のために新設する場合、注意点はありますか？ 障害者が従事する職務内容は、どのようにして選定したらよいでしょうか？ 少人数で、個人完結型の業務が多い部署では、ど
